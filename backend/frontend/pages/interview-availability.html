<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Interview Availability - ScoutLink</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/phone-base.css">
<link rel="stylesheet" href="/css/phone-shell.css">
<link rel="stylesheet" href="/css/phone-pages.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f6f8fb;color:#111827;font-family:Inter,sans-serif;min-height:100vh}.public-nav{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,5vw,64px);background:#fff;border-bottom:1px solid #e5e7eb}.brand{font-weight:950;font-size:22px;color:#111827;text-decoration:none}.brand span{color:#0f9f75}.page{max-width:860px;margin:0 auto;padding:36px 16px 72px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 20px 54px rgba(15,23,42,.08);overflow:hidden}.hero{padding:28px;border-bottom:1px solid #edf1f5}.kicker{display:inline-flex;border-radius:999px;background:#ecfdf5;border:1px solid rgba(15,159,117,.22);color:#047857;padding:7px 10px;font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.06em}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.04;margin:16px 0 10px}.hero p{margin:0;color:#64748b;font-size:15px;line-height:1.65}.slots{padding:24px;display:grid;gap:18px}.date-group{display:grid;gap:10px}.date-title{font-weight:950;color:#0f172a}.slot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.slot-btn{min-height:42px;border:1px solid #dbe4ee;background:#fff;color:#334155;border-radius:14px;font-weight:900;cursor:pointer}.slot-btn.selected{border-color:#0f9f75;background:#ecfdf5;color:#047857;box-shadow:0 10px 24px rgba(15,159,117,.12)}.actions{display:grid;gap:10px;padding:0 24px 24px}.submit{min-height:46px;border:0;border-radius:14px;background:#0f9f75;color:#fff;font-weight:950;cursor:pointer;box-shadow:0 14px 30px rgba(15,159,117,.22)}.submit:disabled{opacity:.65;cursor:not-allowed}.msg{display:none;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}.msg.show{display:block}.ok{background:#ecfdf5;color:#047857;border:1px solid rgba(15,159,117,.28)}.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.empty{padding:28px;color:#64748b}.loading{padding:28px;color:#64748b}@media(max-width:560px){.page{padding:18px 12px 44px}.hero,.slots,.actions{padding-left:18px;padding-right:18px}.slot-grid{grid-template-columns:1fr 1fr}.public-nav{padding:14px 16px}.hero h1{font-size:30px}}
</style>
</head><body>
<nav class="public-nav"><a class="brand" href="/">Scout<span>Link</span></a><a class="btn btn-sm btn-outline" href="/careers">All roles</a></nav>
<main class="page">
  <section class="card" id="root"><div class="loading">Loading your availability form...</div></section>
</main>
<script src="/js/main.js"></script>
<script>
function apiBase(){try{if(typeof API!=='undefined'&&API)return API;}catch(_){}return window.location.origin.indexOf('localhost')>-1?'http://localhost:3000':'https://scoutlink-api.vercel.app';}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function dateKey(iso){return new Date(iso).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}
function timeLabel(iso){return new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function showMessage(id,msg){var el=document.getElementById(id);if(!el)return;el.textContent=msg;el.classList.add('show');}
function token(){return new URLSearchParams(window.location.search).get('token')||'';}
var selected=new Set(),current=null;
function render(data){current=data;document.title='Interview availability - '+(data.jobTitle||'ScoutLink');var groups={};(data.slots||[]).forEach(function(slot){var key=dateKey(slot.start);if(!groups[key])groups[key]=[];groups[key].push(slot);});var existing=(data.selectedSlots||[]).map(function(s){return s.start;});selected=new Set(existing);var html='<div class="hero"><span class="kicker">First stage interview</span><h1>Choose your availability</h1><p>Hi '+esc(data.firstName||data.candidateName||'there')+', please select as many suitable times as possible for your '+esc(data.jobTitle||'ScoutLink')+' interview over the next two weeks.</p></div><div class="slots">'+(data.alreadySubmitted?'<div class="msg ok show">Availability already submitted. You can update it by selecting new times and submitting again.</div>':'')+'<div class="msg ok" id="ok"></div><div class="msg err" id="err"></div>';
Object.keys(groups).forEach(function(day){html+='<div class="date-group"><div class="date-title">'+esc(day)+'</div><div class="slot-grid">'+groups[day].map(function(slot){var isSelected=selected.has(slot.start);return '<button type="button" class="slot-btn '+(isSelected?'selected':'')+'" data-slot="'+esc(slot.start)+'">'+esc(timeLabel(slot.start))+'</button>';}).join('')+'</div></div>';});
if(!Object.keys(groups).length)html+='<div class="empty">No interview slots are currently available in this two-week window. Please contact ScoutLink support.</div>';
html+='</div><div class="actions"><button class="submit" id="submitBtn" type="button">Submit availability</button></div>';document.getElementById('root').innerHTML=html;document.querySelectorAll('[data-slot]').forEach(function(btn){btn.onclick=function(){var value=btn.dataset.slot;if(selected.has(value)){selected.delete(value);btn.classList.remove('selected');}else{selected.add(value);btn.classList.add('selected');}};});document.getElementById('submitBtn').onclick=submitAvailability;}
function load(){var t=token();if(!t){document.getElementById('root').innerHTML='<div class="empty">This availability link is missing a token.</div>';return;}fetch(apiBase()+'/api/careers/interview-availability?token='+encodeURIComponent(t)).then(function(r){return r.json().catch(function(){return{};}).then(function(d){if(!r.ok)throw new Error(d.error||'Could not load availability.');return d;});}).then(function(d){render(d.data||{});}).catch(function(err){document.getElementById('root').innerHTML='<div class="empty">'+esc(err.message||'This availability link is invalid or expired.')+'</div>';});}
function submitAvailability(){var btn=document.getElementById('submitBtn');var ok=document.getElementById('ok'),err=document.getElementById('err');if(ok)ok.classList.remove('show');if(err)err.classList.remove('show');if(!selected.size){showMessage('err','Please select at least one suitable time.');return;}btn.disabled=true;btn.textContent='Submitting...';fetch(apiBase()+'/api/careers/interview-availability',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token(),slots:Array.from(selected)})}).then(function(r){return r.json().catch(function(){return{};}).then(function(d){if(!r.ok)throw new Error(d.error||'Could not submit availability.');return d;});}).then(function(d){showMessage('ok',d.message||'Availability submitted successfully.');}).catch(function(e){showMessage('err',e.message||'Could not submit availability.');}).finally(function(){btn.disabled=false;btn.textContent='Submit availability';});}
load();
</script>
</body></html>
