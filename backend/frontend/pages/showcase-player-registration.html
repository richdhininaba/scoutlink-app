<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Player Registration | Stratex Analytics Showcase Event</title>
  <meta name="description" content="Register a player for the free ScoutLink Showcase Event operated by Stratex Analytics.">
  <link rel="canonical" href="https://www.stratexanalytics.co.uk/showcase-event/player-registration">
  <link rel="icon" type="image/png" href="/scoutlink-favicon.png">
  <link rel="apple-touch-icon" href="/scoutlink-favicon.png">
  <meta name="theme-color" content="#075f48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/stratex-showcase-v2.css?v=20260729">
  <script>
    (function () {
      var path = window.location.pathname.replace(/\/+$/, "");
      var complete = path.endsWith("/complete");
      var canonical = "https://www.stratexanalytics.co.uk" + (path || "/showcase-event/player-registration");
      document.title = complete
        ? "Player Registration Complete | Stratex Analytics Showcase Event"
        : "Player Registration | Stratex Analytics Showcase Event";
      document.addEventListener("DOMContentLoaded", function () {
        var link = document.querySelector('link[rel="canonical"]');
        if (link) link.href = canonical;
      });
    }());
  </script>
</head>
<body class="showcase-public-body" data-showcase-page="player">
  <div id="showcaseApp" class="showcase-page-root" aria-live="polite"></div>
  <noscript>This registration requires JavaScript. Please enable it and reload the page.</noscript>
  <script src="/frontend/js/config.js"></script>
  <script src="/js/showcase-player-registration-v1.js?v=20260729"></script>
  <script src="/js/heap-analytics.js"></script>
</body>
</html>
