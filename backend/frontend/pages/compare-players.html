.score-line-track{height:6px;background:#21262d;border-radius:999px;overflow:hidden}
.score-line-fill{height:100%;border-radius:999px}
@media(max-width:767px){.compare-grid{grid-template-columns:1fr}.attr-compare-row{grid-template-columns:1fr}}

<script>
var _allPlayers=[], _pipelineIds=[], _scoutTeam=null,_scoutPrefs={};
var _filter1='all', _filter2='all';

function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Scout'){navigateClean('login.html');return;}
  if(typeof buildScoutNav==='function') buildScoutNav('sidebarNav','Scout');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u) uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#1d9e75;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Scout</div></div></div>';
  updateNotifBadge();
}
function logout(){logoutToLogin();}
function toggleNotifPanel(){}

function dOv(v){var n=parseFloat(v);return isNaN(n)?0:(n>10?n:n*10);}
function dDisp(v){var n=dOv(v);return n.toFixed(1);}
function cColor(s){return s>=80?'#1d9e75':s>=65?'#FFC107':s>=50?'#FF9800':'#f44336';}
function pColor(g){return{Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#00BCD4',Forward:'#FF5722'}[g]||'#1d9e75';}
function fmtVal(v){var n=Number(v)||0;if(!n)return 'N/A';if(n>=1000000)return '\u00a3'+(n/1000000).toFixed(2)+'m';if(n>=1000)return '\u00a3'+(n/1000).toFixed(0)+'k';return '\u00a3'+n;}
function ageGroupLabel(p){return (p&&p.age_group)||'Age group TBC';}
function score(v){var n=Number(v);return isNaN(n)?0:Math.max(0,Math.min(100,Math.round(n)));}
function metric(label,val,color){return '<div class="mini-metric"><span>'+label+'</span><b style="color:'+(color||'#fff')+'">'+val+'</b></div>';}
function scoreLine(label,val,color){var v=score(val),c=color||cColor(v);return '<div class="score-line"><div class="score-line-head"><span style="color:#8b949e">'+label+'</span><b style="color:'+c+'">'+v+'</b></div><div class="score-line-track"><div class="score-line-fill" style="width:'+v+'%;background:'+c+'"></div></div></div>';}

function populateSelect(selId, players){
  var sel=document.getElementById(selId);
  var curVal=sel.value;
  sel.innerHTML='<option value="">Select player...</option>';
  players.forEach(function(p){
    var opt=document.createElement('option');
    opt.value=p.id;
    opt.textContent=(p.first_name||'')+' '+(p.last_name||'')+' \u2013 '+ageGroupLabel(p)+(p.specific_position?' ('+p.specific_position+')':'')+' '+(p.team_name?'| '+p.team_name:'');
    if(p.id===curVal) opt.selected=true;
    sel.appendChild(opt);
  });
}

function getFilteredPlayers(filter){
  if(filter==='pipeline') return _allPlayers.filter(function(p){return _pipelineIds.indexOf(p.id)>=0;});
  return _allPlayers;
}

function searchPlayers(searchId, selId, filter){
  var q=document.getElementById(searchId).value.toLowerCase();
  var base=getFilteredPlayers(filter);
  var filtered=q?base.filter(function(p){return((p.first_name||'')+' '+(p.last_name||'')).toLowerCase().includes(q);}):base;
  populateSelect(selId,filtered.slice(0,100));
}

var ATTRS=['pace','agility','strength','stamina','jumping','composure','shooting','passing','dribbling','defending','crossing','vision','positioning','heading','tackling'];
var ATTR_LABELS={pace:'Pace',agility:'Agility',strength:'Strength',stamina:'Stamina',jumping:'Jumping',composure:'Composure',shooting:'Shooting',passing:'Passing',dribbling:'Dribbling',defending:'Defending',crossing:'Crossing',vision:'Vision',positioning:'Positioning',heading:'Heading',tackling:'Tackling'};

function calcCompatScore(player){
  if(player&&player.compatibilityScore!==undefined&&player.compatibilityScore!==null)return Math.round(Number(player.compatibilityScore)||0);
  if(!_scoutTeam||((_scoutTeam.team_weaknesses||[]).length===0)) return null;
  var weaknessAttrs={
    'Insufficient Game Pace and Speed':['pace','agility','stamina'],
    'Physical Fragility and Injury Risk':['stamina','strength'],
    'Lack of Physical Presence':['strength','jumping','heading'],
    'Weak Defensive Base':['defending','positioning','tackling'],
    'Poor Defensive Output':['tackling','defending','positioning'],
    'Low Team Chemistry and Leadership':['vision','passing','composure'],
    'Technical Deficiencies Under Pressure':['composure','dribbling','passing'],
    'Tactical Awareness Gaps':['positioning','composure','vision'],
    'Poor Goal Output':['shooting','positioning'],
  };
  var total=0, count=0;
  (_scoutTeam.team_weaknesses||[]).forEach(function(w){
    var attrs=weaknessAttrs[w]||[];
    attrs.forEach(function(a){
      total+=dOv(player[a]);count++;
    });
  });
  return count>0?Math.min(100,Math.round(total/count)):50;
}

function renderAnalysisSummary(p){
  var o=p.overallBreakdown||{};
  var c=p.compatibility||((p.compatibilityBreakdown||{}).compatibility)||p.compatibilityBreakdown||{};
  var pos=p.positionRatings||{};
  var roles=(pos.sorted||[]).slice(0,3);
  var html='';
  if(Object.keys(o).length){
    html+='<div style="margin:14px 0"><div style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Overall breakdown</div>'+
    '<div class="mini-grid">'+
    metric('Readiness',score(o.currentReadiness),cColor(o.currentReadiness))+
    metric('Potential',score(o.potentialRating),cColor(o.potentialRating))+
    metric('Confidence',o.dataConfidenceLabel||score(o.dataConfidenceScore),cColor(o.dataConfidenceScore))+
    '</div>'+
    scoreLine('Technical',o.technicalScore,'#1d9e75')+scoreLine('Tactical IQ',o.tacticalIQScore,'#00BCD4')+scoreLine('Physical',o.physicalProfileScore,'#58a6ff')+scoreLine('Match output',o.matchOutputScore,'#FFC107')+
    '</div>';
  }
  if(roles.length){
    html+='<div style="margin:14px 0"><div style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Position ratings</div><div class="mini-grid">'+roles.map(function(r){return metric(r.role,score(r.score),cColor(r.score));}).join('')+'</div></div>';
  }
  if(Object.keys(c).length){
    html+='<div style="margin:14px 0"><div style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Compatibility breakdown</div>'+
    scoreLine('Need fit',c.needFit,'#1d9e75')+scoreLine('Role fit',c.roleFit,'#00BCD4')+scoreLine('Formation fit',c.formationPositionFit,'#8B5CF6')+scoreLine('Evidence fit',c.matchEvidenceFit,'#FFC107')+
    '</div>';
  }
  return html;
}

function renderSinglePanel(p, side, otherP){
  var ov=dOv(p.overall_rating);
  var ovColor=cColor(ov);
  var compat=calcCompatScore(p);
  var tv=fmtVal(p.transfer_value);
  var apps=parseInt(p.appearances)||0;
  var goals=parseInt(p.goals)||0;
  var assts=parseInt(p.assists)||0;
  var cs=parseInt(p.clean_sheets)||0;
  var yc=parseInt(p.yellow_cards)||0;
  var rc=parseInt(p.red_cards)||0;
  var gpg=apps>0?(goals/apps).toFixed(2):'0.00';
  var apg=apps>0?(assts/apps).toFixed(2):'0.00';
  var cspg=apps>0?(cs/apps).toFixed(2):'0.00';
  var ag=ageGroupLabel(p);
  var pos=p.specific_position||p.primary_position||'--';
  var name=(p.first_name||'')+' '+(p.last_name||'');
  var teamName=p.team_name||'Free agent';

  var attrRows='';
  ATTRS.forEach(function(a){
    var v1=dOv(p[a]);
    var v2=otherP?dOv(otherP[a]):null;
    var barColor='#1d9e75';
    if(v2!==null){barColor=v1>=v2?'#1d9e75':'#FF9800';}
    var w=Math.round(v1);
    attrRows+='<div style="margin-bottom:8px">';
    attrRows+='<div style="display:flex;justify-content:space-between;margin-bottom:3px">';
    attrRows+='<span style="font-size:11px;color:#8b949e;font-weight:600;text-transform:uppercase">'+ATTR_LABELS[a]+'</span>';
    attrRows+='<span style="font-size:12px;font-weight:700;color:'+barColor+'">'+v1.toFixed(1)+'</span>';
    attrRows+='</div>';
    attrRows+='<div style="height:6px;background:#21262d;border-radius:3px">';
    attrRows+='<div style="height:100%;width:'+w+'%;background:'+barColor+';border-radius:3px"></div>';
    attrRows+='</div></div>';
  });

  var compatHtml='';
  if(compat!==null){
    compatHtml='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21262d"><span style="font-size:12px;color:#8b949e">Compatibility</span><span style="font-size:14px;font-weight:800;color:'+cColor(compat)+'">'+compat+'</span></div>';
  } else {
    compatHtml='<div style="padding:8px 0;border-bottom:1px solid #21262d;font-size:11px;color:#8b949e">Complete team setup to see compatibility</div>';
  }

  return '<div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;height:100%">'+
    '<div style="text-align:center;margin-bottom:16px">'+
    '<div style="font-size:32px;font-weight:900;color:'+ovColor+'">'+ov.toFixed(1)+'</div>'+
    '<div style="font-size:11px;color:#8b949e;margin-bottom:8px">Overall rating</div>'+
    '<div style="font-size:18px;font-weight:800;color:#ffffff">'+name+'</div>'+
    '<div style="font-size:12px;color:#8b949e;margin-top:4px">'+ag+' &bull; '+pos+'</div>'+
    '<div style="font-size:12px;color:#8b949e">'+teamName+'</div>'+
    '<a href="player-profile.html?id='+p.id+'" class="btn btn-sm btn-outline" style="margin-top:10px;text-decoration:none">View profile</a>'+
    '</div>'+
    '<div style="margin-bottom:16px">'+
    '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21262d"><span style="font-size:12px;color:#8b949e">Transfer value</span><span style="font-size:14px;font-weight:700;color:#1d9e75">'+tv+'</span></div>'+
    compatHtml+
    '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21262d"><span style="font-size:12px;color:#8b949e">Appearances</span><span style="font-size:14px;font-weight:700;color:#fff">'+apps+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21262d"><span style="font-size:12px;color:#8b949e">Goals per game</span><span style="font-size:14px;font-weight:700;color:#1d9e75">'+gpg+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21262d"><span style="font-size:12px;color:#8b949e">Assists per game</span><span style="font-size:14px;font-weight:700;color:#58a6ff">'+apg+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21262d"><span style="font-size:12px;color:#8b949e">Clean sheets per game</span><span style="font-size:14px;font-weight:700;color:#FFC107">'+cspg+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21262d"><span style="font-size:12px;color:#8b949e">Yellow cards</span><span style="font-size:14px;font-weight:700;color:#FFC107">'+yc+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;padding:8px 0"><span style="font-size:12px;color:#8b949e">Red cards</span><span style="font-size:14px;font-weight:700;color:#f44336">'+rc+'</span></div>'+
    '</div>'+
    renderAnalysisSummary(p)+
    '<div><div style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px">Attributes</div>'+
    attrRows+
    '</div>'+
    '</div>';
}

function renderRecommendations(p1,p2){
  if(!_scoutTeam||!(_scoutTeam.team_weaknesses||[]).length){
    return '<div style="padding:16px;color:#8b949e;text-align:center">Please complete your team setup to see recommendations based on your team weaknesses.</div>';
  }
  if(!p1||!p2){
    return '<div style="padding:16px;color:#8b949e;text-align:center">Select both players to see recommendations.</div>';
  }
  var weaknessAttrs={
    'Insufficient Game Pace and Speed':['pace','agility','stamina'],
    'Physical Fragility and Injury Risk':['stamina','strength'],
    'Lack of Physical Presence':['strength','jumping','heading'],
    'Weak Defensive Base':['defending','positioning','tackling'],
    'Poor Defensive Output':['tackling','defending','positioning'],
    'Low Team Chemistry and Leadership':['vision','passing','composure'],
    'Technical Deficiencies Under Pressure':['composure','dribbling','passing'],
    'Tactical Awareness Gaps':['positioning','composure','vision'],
    'Poor Goal Output':['shooting','positioning'],
  };
  var html='';
  var setupBits=[];
  if((_scoutTeam.team_weaknesses||[]).length)setupBits.push('weaknesses: '+(_scoutTeam.team_weaknesses||[]).join(', '));
  if((_scoutPrefs.roleExpectations||[]).length)setupBits.push('role expectations: '+_scoutPrefs.roleExpectations.join(', '));
  if((_scoutPrefs.longTermGoals||[]).length)setupBits.push('long-term goals: '+_scoutPrefs.longTermGoals.join(', '));
  if(_scoutPrefs.playingStyle)setupBits.push('playing style: '+_scoutPrefs.playingStyle);
  (_scoutTeam.team_weaknesses||[]).forEach(function(w){
    var attrs=weaknessAttrs[w]||['overall_rating'];
    var key=attrs[0];
    var v1=dOv(p1[key]);var v2=dOv(p2[key]);
    var n1=(p1.first_name||'')+' '+(p1.last_name||'');
    var n2=(p2.first_name||'')+' '+(p2.last_name||'');
    var sentence='';
    if(Math.abs(v1-v2)<0.5){
      sentence='Both players are equally matched in this area.';
    } else {
      var winner=v1>v2?n1:n2;var score=Math.max(v1,v2);
      sentence='<strong>'+winner+'</strong> is the stronger fit with a '+ATTR_LABELS[key]+' score of '+score.toFixed(1)+'.';
    }
    html+='<div class="rec-row"><span style="color:#8b949e;font-size:12px">For <strong style="color:#fff">'+w+'</strong>: </span>'+sentence+'</div>';
  });
  var n1=(p1.first_name||'')+' '+(p1.last_name||'');
  var n2=(p2.first_name||'')+' '+(p2.last_name||'');
  var c1=calcCompatScore(p1)||dOv(p1.overall_rating);
  var c2=calcCompatScore(p2)||dOv(p2.overall_rating);
  var preferred=c1>=c2?n1:n2;
  var subLabels=[['Need fit','needFit'],['Role fit','roleFit'],['Formation fit','formationPositionFit'],['Evidence fit','matchEvidenceFit']];
  var bc1=(p1.compatibility||((p1.compatibilityBreakdown||{}).compatibility)||p1.compatibilityBreakdown||{});
  var bc2=(p2.compatibility||((p2.compatibilityBreakdown||{}).compatibility)||p2.compatibilityBreakdown||{});
  html+='<p style="font-size:12px;color:#B0BEC5;line-height:1.7;margin-top:12px">Based on '+(setupBits.join('; ')||'your current scout setup')+', ScoutLink would currently lean towards <strong style="color:#fff">'+preferred+'</strong> with compatibility scores of <strong style="color:#1d9e75">'+Math.round(c1)+'</strong> versus <strong style="color:#FFC107">'+Math.round(c2)+'</strong>. The recommendation weighs need fit, role fit, tactical/formation fit, evidence strength and value risk alongside the headline overall rating.</p>';
  html+='<div style="margin-top:10px">'+subLabels.map(function(pair){var v1=Number(bc1[pair[1]]||0),v2=Number(bc2[pair[1]]||0);var win=v1>=v2?n1:n2;return '<div class="rec-row"><strong>'+pair[0]+':</strong> '+win+' leads '+Math.round(v1)+' to '+Math.round(v2)+'.</div>';}).join('')+'</div>';
  html+='<p style="font-size:12px;color:#B0BEC5;line-height:1.7;margin-top:8px">For an immediate recruitment decision, favour the player who wins the need and role-fit lines. For a longer-term pathway, use the profile prediction tools to test position fit, value risk and development upside before moving the player to a later pipeline stage.</p>';
  return html;
}

function text(v){return String(v===undefined||v===null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function playerName(p){return text(((p.first_name||'')+' '+(p.last_name||'')).trim()||'Player');}
function compatValue(p){var c=calcCompatScore(p);return c===null?Math.round(dOv(p.overall_rating)):Math.round(Number(c)||0);}
function confidenceLabel(p){var apps=parseInt(p.appearances)||0;if(apps>=10)return 'High';if(apps>=5)return 'Medium';if(apps>0)return 'Low';return 'Very low';}
function metricWinner(a,b){if(a===b)return 'level';return a>b?'p1':'p2';}
function phoneMetric(label,p1Val,p2Val,p1Score,p2Score){
  var win=metricWinner(Number(p1Score)||0,Number(p2Score)||0);
  return '<div class="phone-compare-metric">'+
    '<span>'+text(label)+'</span>'+
    '<b class="'+(win==='p1'?'is-winner':'')+'">'+text(p1Val)+'</b>'+
    '<b class="'+(win==='p2'?'is-winner':'')+'">'+text(p2Val)+'</b>'+
  '</div>';
}
function renderPhonePlayerCard(p,compat){
  var ov=Math.round(dOv(p.overall_rating));
  return '<article class="phone-compare-player-card">'+
    '<div><h4>'+playerName(p)+'</h4><p>'+text(ageGroupLabel(p))+' - '+text(p.specific_position||p.primary_position||'--')+'</p><p>'+text(p.team_name||'Free agent')+'</p></div>'+
    '<div class="phone-compare-score" style="color:'+cColor(ov)+'">'+ov+'<span>/100</span></div>'+
    '<div class="phone-compare-card-row"><span>Compatibility</span><b style="color:'+cColor(compat)+'">'+compat+'%</b></div>'+
    '<div class="phone-compare-card-row"><span>Estimated value</span><b>'+text(fmtVal(p.transfer_value))+'</b></div>'+
    '<a class="phone-compare-link" href="player-profile.html?id='+encodeURIComponent(p.id)+'">View profile</a>'+
  '</article>';
}
function renderMobileRecommendation(p1,p2){
  var c1=compatValue(p1),c2=compatValue(p2);
  var best=c1>=c2?p1:p2;
  var other=c1>=c2?p2:p1;
  var bestName=playerName(best);
  var otherName=playerName(other);
  var bestCompat=Math.max(c1,c2);
  var otherCompat=Math.min(c1,c2);
  var weaknesses=(_scoutTeam&&(_scoutTeam.team_weaknesses||[]).length)?(_scoutTeam.team_weaknesses||[]).slice(0,3).join(', '):'your saved scout setup';
  return '<div class="phone-compare-recommendation">'+
    '<span class="phone-eyebrow">ScoutLink recommendation</span>'+
    '<h3>'+bestName+' is the stronger current fit</h3>'+
    '<p>'+bestName+' leads the comparison on the ScoutLink fit model at '+bestCompat+'% versus '+otherCompat+'% for '+otherName+'. The score weighs your setup, including '+text(weaknesses)+', alongside role fit, evidence strength, match output, profile confidence and estimated value risk.</p>'+
    '<p>Use this as a recruitment shortlisting signal rather than a final decision. If the players are close, run a prediction on both profiles before moving either player into a later pipeline stage.</p>'+
    '<div class="phone-compare-actions">'+
      '<a class="phone-primary-action" href="player-profile.html?id='+encodeURIComponent(best.id)+'">View recommended profile</a>'+
      '<button type="button" onclick="addRecommendedToPipeline(\''+String(best.id).replace(/'/g,'\\\'')+'\')">Add recommended to pipeline</button>'+
    '</div>'+
  '</div>';
}
function renderMobileComparison(p1,p2){
  var c1=compatValue(p1),c2=compatValue(p2);
  var apps1=parseInt(p1.appearances)||0,apps2=parseInt(p2.appearances)||0;
  var goals1=parseInt(p1.goals)||0,goals2=parseInt(p2.goals)||0;
  var assists1=parseInt(p1.assists)||0,assists2=parseInt(p2.assists)||0;
  var value1=Number(p1.transfer_value)||0,value2=Number(p2.transfer_value)||0;
  var ov1=Math.round(dOv(p1.overall_rating)),ov2=Math.round(dOv(p2.overall_rating));
  var best=c1>=c2?p1:p2;
  return '<div class="phone-compare-results">'+
    '<section class="phone-compare-hero">'+
      '<span class="phone-eyebrow">Player comparison</span>'+
      '<h2>'+playerName(p1)+' vs '+playerName(p2)+'</h2>'+
      '<p>Best current fit: <strong>'+playerName(best)+'</strong></p>'+
    '</section>'+
    '<section class="phone-compare-player-grid">'+renderPhonePlayerCard(p1,c1)+renderPhonePlayerCard(p2,c2)+'</section>'+
    '<section class="phone-compare-table-card"><div class="phone-compare-table-head"><span>Metric</span><b>'+playerName(p1)+'</b><b>'+playerName(p2)+'</b></div>'+
      phoneMetric('Overall',ov1+'/100',ov2+'/100',ov1,ov2)+
      phoneMetric('Compatibility',c1+'%',c2+'%',c1,c2)+
      phoneMetric('Transfer value',fmtVal(value1),fmtVal(value2),value1,value2)+
      phoneMetric('Appearances',apps1,apps2,apps1,apps2)+
      phoneMetric('Goals',goals1,goals2,goals1,goals2)+
      phoneMetric('Assists',assists1,assists2,assists1,assists2)+
      phoneMetric('Data confidence',confidenceLabel(p1),confidenceLabel(p2),apps1,apps2)+
    '</section>'+
    renderMobileRecommendation(p1,p2)+
  '</div>';
}
function addRecommendedToPipeline(playerId){
  api('POST','/api/players/'+encodeURIComponent(playerId)+'/scout-interest',{interestLevel:8,notes:'Added from mobile compare recommendation'}).then(function(){
    alert('Added to your pipeline.');
  }).catch(function(e){
    alert((e&&e.message)||'Could not add this player to your pipeline.');
  });
}

function updateComparison(){
  var p1id=document.getElementById('player1').value;
  var p2id=document.getElementById('player2').value;
  var p1=p1id?_allPlayers.find(function(p){return p.id===p1id;}):null;
  var p2=p2id?_allPlayers.find(function(p){return p.id===p2id;}):null;

  if(!p1&&!p2){document.getElementById('compareResult').innerHTML='';return;}
  if(window.isScoutLinkPhone&&window.isScoutLinkPhone()&&p1&&p2){
    document.getElementById('compareResult').innerHTML=renderMobileComparison(p1,p2);
    return;
  }

  var html='';

  if(p1||p2){
    var phone=window.isScoutLinkPhone&&window.isScoutLinkPhone();
    html+='<div class="table-card" style="margin-bottom:20px"><div class="table-header"><h3>Player comparison</h3><div style="font-size:12px;color:#8b949e">'+(phone?'Stacked mobile comparison':'Select both players to compare side by side')+'</div></div><div style="padding:16px">'+
      '<div class="'+(phone?'phone-compare-stack':'')+'" style="display:grid;grid-template-columns:'+(phone?'1fr':'1fr 1fr')+';gap:16px;max-width:100%">';
    html+=p1?renderSinglePanel(p1,'left',p2):'<div style="background:#161b22;border:1px dashed #30363d;border-radius:12px;padding:40px;text-align:center;color:#8b949e;height:100%">Select a player from the left dropdown</div>';
    html+=p2?renderSinglePanel(p2,'right',p1):'<div style="background:#161b22;border:1px dashed #30363d;border-radius:12px;padding:40px;text-align:center;color:#8b949e;height:100%">Select a player from the right dropdown</div>';
    html+='</div></div></div>';
  }

  html+='<div class="table-card"><div class="table-header"><h3>Scout recommendation</h3><span style="font-size:12px;color:#8b949e">Based on your team weaknesses</span></div><div style="padding:16px">'+renderRecommendations(p1,p2)+'</div></div>';

  document.getElementById('compareResult').innerHTML=html;
}

document.addEventListener('DOMContentLoaded',function(){
  initNav();

  api('GET','/api/scouts/setup').then(function(d){
    _scoutTeam=d.scoutTeam||null;
    // Merge team weaknesses from preferences into scoutTeam
    var prefs = d.preferences||{};
    _scoutPrefs=prefs;
    var weakSlugs = prefs.teamWeaknesses||[];
    var WMAP = {'insufficient_game_pace_and_speed':'Insufficient Game Pace and Speed','physical_fragility_and_injury_risk':'Physical Fragility and Injury Risk','lack_of_physical_presence':'Lack of Physical Presence','weak_defensive_base':'Weak Defensive Base','poor_defensive_output':'Poor Defensive Output','low_team_chemistry_and_leadership':'Low Team Chemistry and Leadership','technical_deficiencies_under_pressure':'Technical Deficiencies Under Pressure','tactical_awareness_gaps':'Tactical Awareness Gaps','poor_goal_output':'Poor Goal Output','poor_set_pieces':'Insufficient Game Pace and Speed','high_defensive_line':'Weak Defensive Base','slow_build_up':'Tactical Awareness Gaps','weak_left_flank':'Lack of Physical Presence','pace_exploitable':'Insufficient Game Pace and Speed','poor_second_ball':'Tactical Awareness Gaps'};
    if(_scoutTeam) _scoutTeam.team_weaknesses = weakSlugs.map(function(s){return WMAP[s]||s;});
  }).catch(function(){});

  api('GET','/api/scouts/pipeline?limit=200').then(function(d){
    _pipelineIds=(d.data||[]).map(function(r){return r.player_id||((r.players||{}).id);}).filter(Boolean);
  }).catch(function(){});

  api('GET','/api/players?limit=200').then(function(d){
    _allPlayers=d.data||[];
    if(!_allPlayers.length){
      document.getElementById('compareResult').innerHTML='<div style="text-align:center;padding:48px;color:#8b949e">Could not load players. Please try again.</div>';
      return;
    }
    populateSelect('player1',_allPlayers.slice(0,200));
    populateSelect('player2',_allPlayers.slice(0,200));
  }).catch(function(e){
    console.error('load players failed',e.message);
    document.getElementById('compareResult').innerHTML='<div style="text-align:center;padding:48px;color:#8b949e">Could not load players: '+e.message+'</div>';
  });

  document.getElementById('search1').addEventListener('input',function(){searchPlayers('search1','player1',_filter1);});
  document.getElementById('search2').addEventListener('input',function(){searchPlayers('search2','player2',_filter2);});

  document.getElementById('f1All').addEventListener('click',function(){
    _filter1='all';this.classList.add('active');document.getElementById('f1Pipeline').classList.remove('active');
    searchPlayers('search1','player1','all');
  });
  document.getElementById('f1Pipeline').addEventListener('click',function(){
    _filter1='pipeline';this.classList.add('active');document.getElementById('f1All').classList.remove('active');
    searchPlayers('search1','player1','pipeline');
  });
  document.getElementById('f2All').addEventListener('click',function(){
    _filter2='all';this.classList.add('active');document.getElementById('f2Pipeline').classList.remove('active');
    searchPlayers('search2','player2','all');
  });
  document.getElementById('f2Pipeline').addEventListener('click',function(){
    _filter2='pipeline';this.classList.add('active');document.getElementById('f2All').classList.remove('active');
    searchPlayers('search2','player2','pipeline');
  });

  document.getElementById('player1').addEventListener('change',updateComparison);
  document.getElementById('player2').addEventListener('change',updateComparison);
});
</script>
