<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Players</span><div class="topbar-right"><button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button><button class="btn btn-sm btn-ghost" onclick="logout()">Sign out</button></div></div>
<div class="page-content">

<!-- Edit Ratings Modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;overflow-y:auto">
<div style="background:#162032;border-radius:14px;max-width:520px;margin:40px auto;padding:28px;border:1px solid #2d3f55">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
<h3 style="margin:0;color:#E0E0E0" id="editModalTitle">Edit Player Ratings</h3>
<button onclick="closeEditModal()" style="background:none;border:none;color:#546E7A;font-size:22px;cursor:pointer;line-height:1">&times;</button>
</div>
<div id="editForm" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label style="display:block;font-size:12px;color:#90A4AE;margin-bottom:4px">Pace (0-10)</label><input type="number" id="e_pace" min="0" max="10" step="0.1" style="width:100%;padding:8px 10px;background:#1e2a3a;border:1.5px solid #2d3f55;border-radius:7px;color:#E0E0E0;font-size:13px;box-sizing:border-box"></div>
<div><label style="display:block;font-size:12px;color:#90A4AE;margin-bottom:4px">Shooting (0-10)</label><input type="number" id="e_shooting" min="0" max="10" step="0.1" style="width:100%;padding:8px 10px;background:#1e2a3a;border:1.5px solid #2d3f55;border-radius:7px;color:#E0E0E0;font-size:13px;box-sizing:border-box"></div>
<div><label style="display:block;font-size:12px;color:#90A4AE;margin-bottom:4px">Passing (0-10)</label><input type="number" id="e_passing" min="0" max="10" step="0.1" style="width:100%;padding:8px 10px;background:#1e2a3a;border:1.5px solid #2d3f55;border-radius:7px;color:#E0E0E0;font-size:13px;box-sizing:border-box"></div>
<div><label style="display:block;font-size:12px;color:#90A4AE;margin-bottom:4px">Dribbling (0-10)</label><input type="number" id="e_dribbling" min="0" max="10" step="0.1" style="width:100%;padding:8px 10px;background:#1e2a3a;border:1.5px solid #2d3f55;border-radius:7px;color:#E0E0E0;font-size:13px;box-sizing:border-box"></div>
<div><label style="display:block;font-size:12px;color:#90A4AE;margin-bottom:4px">Defending (0-10)</label><input type="number" id="e_defending" min="0" max="10" step="0.1" style="width:100%;padding:8px 10px;background:#1e2a3a;border:1.5px solid #2d3f55;border-radius:7px;color:#E0E0E0;font-size:13px;box-sizing:border-box"></div>
<div><label style="display:block;font-size:12px;color:#90A4AE;margin-bottom:4px">Physical (0-10)</label><input type="number" id="e_physical" min="0" max="10" step="0.1" style="width:100%;padding:8px 10px;background:#1e2a3a;border:1.5px solid #2d3f55;border-radius:7px;color:#E0E0E0;font-size:13px;box-sizing:border-box"></div>
<div><label style="display:block;font-size:12px;color:#90A4AE;margin-bottom:4px">Vision (0-10)</label><input type="number" id="e_vision" min="0" max="10" step="0.1" style="width:100%;padding:8px 10px;background:#1e2a3a;border:1.5px solid #2d3f55;border-radius:7px;color:#E0E0E0;font-size:13px;box-sizing:border-box"></div>
<div><label style="display:block;font-size:12px;color:#90A4AE;margin-bottom:4px">Leadership (0-10)</label><input type="number" id="e_leadership" min="0" max="10" step="0.1" style="width:100%;padding:8px 10px;background:#1e2a3a;border:1.5px solid #2d3f55;border-radius:7px;color:#E0E0E0;font-size:13px;box-sizing:border-box"></div>
</div>
<input type="hidden" id="editPlayerId">
<div style="display:flex;gap:10px;margin-top:20px">
<button class="btn btn-primary" onclick="saveRatings()" style="flex:1">Save Ratings</button>
<button class="btn btn-ghost" onclick="closeEditModal()" style="flex:1">Cancel</button>
</div>
<div id="editMsg" style="margin-top:10px;font-size:13px;text-align:center"></div>
</div></div>

<!-- Delete Confirm Modal -->
<div id="deleteModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1001">
<div style="background:#162032;border-radius:14px;max-width:400px;margin:120px auto;padding:28px;border:1px solid rgba(220,38,38,.3);text-align:center">
<div style="font-size:40px;margin-bottom:12px;color:#EF5350">!</div>
<h3 style="color:#EF5350;margin-bottom:8px">Delete Player?</h3>
<p style="color:#90A4AE;margin-bottom:6px" id="deletePlayerName"></p>
<p style="color:#546E7A;font-size:13px;margin-bottom:24px">This will permanently remove the player and all associated stats, match facts, and pipeline data. This cannot be undone.</p>
<div style="display:flex;gap:10px">
<button class="btn" style="flex:1;background:rgba(220,38,38,.2);color:#EF5350;border:1px solid rgba(220,38,38,.4)" onclick="confirmDelete()">Yes, Delete</button>
<button class="btn btn-ghost" style="flex:1" onclick="document.getElementById('deleteModal').style.display='none'">Cancel</button>
</div>
<div id="deleteMsg" style="margin-top:10px;font-size:13px"></div>
</div></div>

<div id="toast" style="display:none;position:fixed;top:20px;right:24px;z-index:9999;padding:12px 20px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.18)"></div>

<div class="table-card">
<div class="table-header">
<h3>All Players</h3>
<div style="display:flex;gap:10px;align-items:center">
<span id="playerCount" style="color:#546E7A;font-size:13px"></span>
<input id="searchInput" type="text" placeholder="Search players..." oninput="filterPlayers()" style="padding:7px 12px;background:#1e2a3a;border:1.5px solid #2d3f55;border-radius:8px;color:#E0E0E0;font-size:13px;width:200px">
</div>
</div>
<div id="playersTable"><div class="loading-state"><div class="spinner"></div></div></div>
</div>

<script>
var allPlayers = [];
async function loadPage() {
try {
var d = await api('GET', '/api/players?limit=500');
document.getElementById('playerCount').textContent = (d.total || 0) + ' players';
allPlayers = d.data || [];
renderTable(allPlayers);
} catch(e) { document.getElementById('playersTable').innerHTML = '<div style="padding:16px;color:#EF5350">Error: ' + e.message + '</div>'; }
}
function filterPlayers(){var q=document.getElementById('searchInput').value.toLowerCase();renderTable(allPlayers.filter(function(p){return (p.first_name+' '+p.last_name+' '+(p.team_name||'')).toLowerCase().includes(q);}));}
function renderTable(players){
if(!players.length){document.getElementById('playersTable').innerHTML='<div style="text-align:center;padding:48px;color:#546E7A">No players found</div>';return;}
document.getElementById('playersTable').innerHTML='<table class="sl-table"><thead><tr><th>Player</th><th>Age</th><th>Position</th><th>Team</th><th>Overall</th><th>Est. Value</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+
players.map(function(p){return '<tr><td><b>'+p.first_name+' '+p.last_name+'</b></td><td>'+p.age+'</td><td>'+(p.specific_position||p.primary_position||'--')+'</td><td>'+(p.team_name||'--')+'</td><td style="color:'+ratingColor(p.overall_rating)+';font-weight:700">'+ratingDisplay(p.overall_rating)+'/100</td><td>'+(p.transfer_value&&p.transfer_value>0?'<span style="color:#1d9e75;font-weight:700">&pound;'+Number(p.transfer_value).toLocaleString('en-GB',{maximumFractionDigits:0})+'</span>':'<span style="color:#546E7A">Calculating...</span>')+'</td><td style="text-align:right"><div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn btn-sm btn-outline" onclick="openEditModal(\''+p.id+'\')">Edit Ratings</button><button class="btn btn-sm" style="background:rgba(220,38,38,.15);color:#EF5350;border:1px solid rgba(220,38,38,.3)" onclick="openDeleteModal(\''+p.id+'\',\''+p.first_name+' '+p.last_name+'\')">Delete</button></div></td></tr>';}).join('')+'</tbody></table>';
}
function openEditModal(id){var p=allPlayers.find(function(x){return x.id===id;});if(!p)return;document.getElementById('editPlayerId').value=id;document.getElementById('editModalTitle').textContent='Edit Ratings - '+p.first_name+' '+p.last_name;document.getElementById('e_pace').value=p.pace||0;document.getElementById('e_shooting').value=p.shooting||0;document.getElementById('e_passing').value=p.passing||0;document.getElementById('e_dribbling').value=p.dribbling||0;document.getElementById('e_defending').value=p.defending||0;document.getElementById('e_physical').value=p.physical||0;document.getElementById('e_vision').value=p.vision||0;document.getElementById('e_leadership').value=p.leadership||0;document.getElementById('editMsg').textContent='';document.getElementById('editModal').style.display='block';}
function closeEditModal(){document.getElementById('editModal').style.display='none';}
async function saveRatings(){var id=document.getElementById('editPlayerId').value;var body={pace:parseFloat(document.getElementById('e_pace').value)||0,shooting:parseFloat(document.getElementById('e_shooting').value)||0,passing:parseFloat(document.getElementById('e_passing').value)||0,dribbling:parseFloat(document.getElementById('e_dribbling').value)||0,defending:parseFloat(document.getElementById('e_defending').value)||0,physical:parseFloat(document.getElementById('e_physical').value)||0,vision:parseFloat(document.getElementById('e_vision').value)||0,leadership:parseFloat(document.getElementById('e_leadership').value)||0};document.getElementById('editMsg').textContent='Saving...';document.getElementById('editMsg').style.color='#90A4AE';try{var res=await api('PATCH','/api/players/'+id+'/ratings',body);document.getElementById('editMsg').textContent='Saved!';document.getElementById('editMsg').style.color='#66BB6A';var p=allPlayers.find(function(x){return x.id===id;});if(p){Object.assign(p,res.player||body);}setTimeout(function(){closeEditModal();renderTable(allPlayers);showToast('Ratings updated!','success');},800);}catch(e){document.getElementById('editMsg').textContent='Error: '+e.message;document.getElementById('editMsg').style.color='#EF5350';}}
var deleteTargetId=null;
function openDeleteModal(id,name){deleteTargetId=id;document.getElementById('deletePlayerName').textContent=name;document.getElementById('deleteMsg').textContent='';document.getElementById('deleteModal').style.display='block';}
async function confirmDelete(){if(!deleteTargetId)return;document.getElementById('deleteMsg').textContent='Deleting...';document.getElementById('deleteMsg').style.color='#90A4AE';try{await api('DELETE','/api/players/'+deleteTargetId);allPlayers=allPlayers.filter(function(p){return p.id!==deleteTargetId;});document.getElementById('deleteModal').style.display='none';deleteTargetId=null;renderTable(allPlayers);document.getElementById('playerCount').textContent=allPlayers.length+' players';showToast('Player deleted.','success');}catch(e){document.getElementById('deleteMsg').textContent='Error: '+e.message;document.getElementById('deleteMsg').style.color='#EF5350';}}
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.style.background=type==='success'?'#1B5E20':'#B71C1C';t.style.color='#fff';t.style.display='block';setTimeout(function(){t.style.display='none';},3500);}
</script>
</div></div></div>
