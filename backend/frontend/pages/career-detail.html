<script>
var job=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function apiBase(){try{if(typeof API!=='undefined'&&API)return API;}catch(_){}return window.location.origin.indexOf('localhost')>-1?'http://localhost:3000':'https://scoutlink-api.vercel.app';}
function getSlug(){var params=new URLSearchParams(window.location.search);var qs=params.get('slug');if(qs)return qs;var parts=window.location.pathname.split('/').filter(Boolean);var last=parts[parts.length-1]||'';if(!last||last==='careers'||last==='career-detail.html')return'';try{return decodeURIComponent(last);}catch(_){return last;}}
function resolveJob(payload){if(!payload)return null;var raw=payload.data||payload.job||payload;if(!(raw.id||raw.slug||raw.jobTitle||raw.job_title))return null;return Object.assign({},raw,{jobTitle:raw.jobTitle||raw.job_title,workingType:raw.workingType||raw.working_type,employmentType:raw.employmentType||raw.employment_type,contractType:raw.contractType||raw.contract_type,compensationType:raw.compensationType||raw.compensation_type,compensationNotes:raw.compensationNotes||raw.compensation_notes,salaryMin:raw.salaryMin||raw.salary_min,salaryMax:raw.salaryMax||raw.salary_max,salaryUnit:raw.salaryUnit||raw.salary_unit,positionsAvailable:raw.positionsAvailable||raw.positions_available,aboutCompany:raw.aboutCompany||raw.about_company,roleOverview:raw.roleOverview||raw.role_overview,mustHaves:raw.mustHaves||raw.must_haves,niceToHaves:raw.niceToHaves||raw.nice_to_haves,applicationInstructions:raw.applicationInstructions||raw.application_instructions,interviewStageCount:raw.interviewStageCount||raw.interview_stage_count,interviewProcess:raw.interviewProcess||raw.interview_process,releaseAt:raw.releaseAt||raw.release_at,closingAt:raw.closingAt||raw.closing_at});}
function jobStatusPublic(j){var closing=j&&j.closingAt;if(closing){var c=new Date(closing);if(!Number.isNaN(c.getTime())&&c<new Date())return false;}var status=String(j&&j.status||'').toLowerCase();if(status==='live')return true;if(status!=='scheduled')return false;var release=j.releaseAt||j.release_at;if(!release)return true;var d=new Date(release);return Number.isNaN(d.getTime())||d<=new Date();}
function money(n){return n?('GBP '+Number(n).toLocaleString('en-GB',{maximumFractionDigits:0})):'';}
function compensationLabel(j){var map={paid_role:'Paid role',unpaid_internship:'Unpaid internship',paid_internship:'Paid internship',commission_based:'Commission-based pay'};return map[j.compensationType]||'';}
function salary(j){if(j.salaryUnit==='commission'||j.compensationType==='commission_based')return j.compensationNotes?'Competitive commission-based pay':'Commission-based pay';if(j.compensationType==='unpaid_internship')return 'Unpaid internship';if(!j.salaryMin&&!j.salaryMax)return '';var v=j.salaryMin&&j.salaryMax?money(j.salaryMin)+'-'+money(j.salaryMax):money(j.salaryMin||j.salaryMax);return v+' '+(j.salaryUnit||'annually');}
function positionsText(j,prefix){var n=parseInt(j.positionsAvailable,10);if(!n||n<1)return'';return (prefix?'Positions: ':'')+n+' '+(n===1?'position':'positions');}
function inlineFormat(s){return s.replace(/\+\+(.+?)\+\+/g,'<u>$1</u>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');}
function richText(text){if(!text)return'';var html='',list=null;function close(){if(list){html+='</'+list+'>';list=null;}}String(text).replace(/\r\n/g,'\n').split('\n').forEach(function(raw){var line=esc(raw).trim();if(!line){close();return;}var bullet=line.match(/^[-*]\s+(.+)/);var ordered=line.match(/^\d+\.\s+(.+)/);if(bullet){if(list!=='ul'){close();html+='<ul>';list='ul';}html+='<li>'+inlineFormat(bullet[1])+'</li>';return;}if(ordered){if(list!=='ol'){close();html+='<ol>';list='ol';}html+='<li>'+inlineFormat(ordered[1])+'</li>';return;}close();html+='<p>'+inlineFormat(line)+'</p>';});close();return html;}
function section(title,text){return String(text||'').trim()?'<section class="section"><h2>'+esc(title)+'</h2><div class="formatted">'+richText(text)+'</div></section>':'';}
function meta(label,value){return value?'<div class="meta-item"><span class="meta-label">'+esc(label)+'</span><span class="meta-value">'+esc(value)+'</span></div>':'';}
function summaryText(j){return String(j.roleOverview||j.responsibilities||'').replace(/\r\n/g,'\n').split('\n').map(function(x){return x.replace(/^[-*]\s+/,'').replace(/^\d+\.\s+/,'').trim();}).filter(Boolean)[0]||'Review the role details below and apply with your CV.';}
function snapshot(j){return [j.department,j.location,j.workingType,j.employmentType,salary(j),positionsText(j,true)].filter(Boolean).map(function(x){return '<span>'+esc(x)+'</span>';}).join('');}
function scrollToApply(){var el=document.getElementById('applySection');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
function viewAllRoles(){window.location.href='/careers';}
function render(j){
  document.title=j.jobTitle+' - Stratex Careers';
  var metaHtml=meta('Department',j.department)+meta('Location',j.location)+meta('Working type',j.workingType)+meta('Employment', [j.employmentType,j.contractType].filter(Boolean).join(' - '))+meta('Pay type',salary(j)||compensationLabel(j))+meta('Positions available',positionsText(j,false));
  document.getElementById('jobRoot').innerHTML=
    '<div class="job-layout"><div><section class="hero-card"><span class="eyebrow">'+esc([j.department||'Commercial','Live role'].join(' - '))+'</span><h1>'+esc(j.jobTitle)+'</h1><p class="summary">'+esc(summaryText(j))+'</p><div class="hero-actions"><button class="btn btn-primary" type="button" onclick="scrollToApply()">Apply now</button><button class="btn btn-outline" type="button" onclick="viewAllRoles()">View all roles</button></div></section>'+
    (metaHtml?'<section class="meta-card"><div class="meta-grid">'+metaHtml+'</div></section>':'')+
    '<section class="content-card">'+section('About Stratex Analytics',j.aboutCompany)+section('Role overview',j.roleOverview)+section('What you will be doing',j.responsibilities)+section('Must-haves',j.mustHaves)+section('Nice-to-haves',j.niceToHaves)+section('Benefits of working here',j.benefits)+section('Compensation notes',j.compensationNotes)+section('Interview process',(j.interviewStageCount?j.interviewStageCount+' interview '+(parseInt(j.interviewStageCount,10)===1?'stage':'stages')+'\n':'')+(j.interviewProcess||''))+section('Application instructions',j.applicationInstructions)+'</section></div>'+
    '<aside class="apply-card" id="applySection"><div class="apply-inner"><span class="apply-kicker">Application</span><h2>Start your application</h2><p>Send your details and CV. The Stratex team will confirm receipt by email.</p><div class="apply-trust"><div><span>Review time</span><strong>Around 2 weeks</strong></div><div><span>CV format</span><strong>PDF, DOC or DOCX</strong></div></div><div class="snapshot">'+snapshot(j)+'</div><div class="msg ok" id="ok"></div><div class="msg err" id="err"></div><form class="form-grid" id="applyForm" novalidate><div class="form-row"><input id="firstName" name="firstName" placeholder="First name" autocomplete="given-name" required><input id="lastName" name="lastName" placeholder="Last name" autocomplete="family-name" required></div><input id="email" name="email" type="email" placeholder="Email address" autocomplete="email" required><input id="phone" name="phone" placeholder="Phone number" autocomplete="tel" required><input class="file-input" id="cv" name="cv" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required><label class="file-upload" id="cvUploadLabel" for="cv"><strong id="cvFileText">Choose your CV</strong><span>PDF, DOC or DOCX only. Maximum 5MB.</span></label><button class="btn btn-primary" id="submitBtn" type="submit">Submit application</button></form></div></aside></div>';
  bindApply();
}
function renderNotice(title,body){document.getElementById('jobRoot').innerHTML='<div class="notice-card"><span class="eyebrow">Role unavailable</span><h1>'+esc(title)+'</h1><p>'+esc(body||'Please return to the careers page to view current roles.')+'</p><button class="btn btn-primary" type="button" onclick="viewAllRoles()">View current roles</button></div>';}
function show(id,msg){var el=document.getElementById(id);if(!el)return;el.textContent=msg;el.classList.add('show');}
function clearMsgs(){['ok','err'].forEach(function(id){var el=document.getElementById(id);if(el)el.classList.remove('show');});}
function markInvalid(el, invalid){if(!el)return;if(invalid)el.setAttribute('aria-invalid','true');else el.removeAttribute('aria-invalid');}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim());}
function fileAllowed(file){if(!file)return false;var name=String(file.name||'').toLowerCase();var okExt=/\.(pdf|doc|docx)$/.test(name);var okMime=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document'].indexOf(file.type)>-1||!file.type;return okExt&&okMime;}
function trackingParams(){var params=new URLSearchParams(window.location.search);var out={};['source','utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(function(k){var v=params.get(k);if(v)out[k]=v;});return out;}
function validateForm(form){var first=document.getElementById('firstName'),last=document.getElementById('lastName'),emailEl=document.getElementById('email'),phone=document.getElementById('phone'),cv=document.getElementById('cv');[first,last,emailEl,phone].forEach(function(el){markInvalid(el,false);});var missing=[];if(!first.value.trim()){missing.push('first name');markInvalid(first,true);}if(!last.value.trim()){missing.push('last name');markInvalid(last,true);}if(!validEmail(emailEl.value)){missing.push('valid email');markInvalid(emailEl,true);}if(!phone.value.trim()){missing.push('phone number');markInvalid(phone,true);}var file=cv.files[0];if(!file){missing.push('CV');}else if(!fileAllowed(file)){show('err','Please upload a PDF, DOC or DOCX file.');return false;}else if(file.size>5*1024*1024){show('err','Please upload a CV under 5MB.');return false;}if(missing.length){show('err','Please enter your '+missing.join(', ')+'.');return false;}return true;}
function bindApply(){var form=document.getElementById('applyForm');if(!form)return;var cv=document.getElementById('cv'),fileText=document.getElementById('cvFileText'),fileLabel=document.getElementById('cvUploadLabel');if(cv){cv.addEventListener('change',function(){var file=cv.files[0];if(file){fileText.textContent=file.name;fileLabel.classList.add('has-file');}else{fileText.textContent='Choose your CV';fileLabel.classList.remove('has-file');}});}form.addEventListener('submit',function(e){e.preventDefault();clearMsgs();if(!job||!job.id||!job.slug){show('err','This role is not available.');return;}if(!validateForm(form))return;var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Submitting application...';var fd=new FormData(form);var tracking=trackingParams();Object.keys(tracking).forEach(function(k){fd.set(k,tracking[k]);});fetch(apiBase()+'/api/careers/'+encodeURIComponent(job.slug)+'/apply'+window.location.search,{method:'POST',body:fd}).then(function(r){return r.json().catch(function(){return{};}).then(function(d){if(!r.ok)throw new Error(d.error||'Could not submit application');return d;});}).then(function(d){show('ok',(d.message||'Application submitted successfully.')+(d.applicationId?' Reference: '+d.applicationId:''));form.reset();if(fileText)fileText.textContent='Choose your CV';if(fileLabel)fileLabel.classList.remove('has-file');}).catch(function(err){show('err',err.message||'Could not submit application.');}).finally(function(){btn.disabled=false;btn.textContent='Submit application';});});}
var slug=getSlug();
if(!slug){renderNotice('Role not found','The role link is missing a job slug.');}
else{fetch(apiBase()+'/api/careers/'+encodeURIComponent(slug)).then(function(r){return r.json().catch(function(){return{};}).then(function(d){if(!r.ok){var apiMsg=d.error||'';var err=new Error(apiMsg.toLowerCase().indexOf('no longer')>-1?'This role is no longer available.':(r.status===404?'Role not found':(apiMsg||'We could not load this role right now. Please try again later.')));err.status=r.status;throw err;}return d;});}).then(function(d){job=resolveJob(d);if(!job)throw new Error('Role not found');if(!jobStatusPublic(job)){renderNotice('This role is no longer available.','Please return to careers to view current live roles.');return;}try{render(job);}catch(renderErr){console.error('[Careers render]',renderErr);renderNotice('We could not load this role right now.','Please try again later.');}}).catch(function(e){console.error('[Careers detail]',e);var title=e.message==='Role not found'?'Role not found':(e.message.indexOf('no longer')>-1?'This role is no longer available.':'We could not load this role right now.');var body=e.message==='Role not found'?'The role may have moved, closed or been archived.':(e.message.indexOf('no longer')>-1?'Please return to careers to view current live roles.':'Please try again later.');renderNotice(title,body);});}
