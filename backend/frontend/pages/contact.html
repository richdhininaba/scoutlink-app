<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact - ScoutLink</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="../css/main.css">
<style>
body{background:#f6f8fb;color:#111827;font-family:Inter,Arial,sans-serif}.shell{max-width:820px;margin:0 auto;padding:28px 16px 58px}.brand{font-size:24px;font-weight:950;color:#111827;text-decoration:none}.brand span{color:#0f9f75}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:clamp(22px,4vw,40px);box-shadow:0 20px 54px rgba(15,23,42,.08);margin-top:22px}.eyebrow{display:inline-flex;border:1px solid rgba(15,159,117,.3);background:#ecfdf5;color:#047857;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}h1{font-size:clamp(34px,5vw,54px);line-height:1.03;margin:18px 0 12px}p{color:#475569;line-height:1.7;font-size:15px}.contact-row{display:grid;gap:12px;margin-top:20px}.contact-row a{display:flex;justify-content:space-between;gap:16px;align-items:center;background:#f8fafc;border:1px solid #e5e7eb;border-radius:18px;padding:16px;color:#047857;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<main class="shell">
  <a class="brand" href="/">Scout<span>Link</span></a>
  <section class="card">
    <span class="eyebrow">Contact</span>
    <h1>Talk to ScoutLink</h1>
    <p>For platform support, privacy requests, safeguarding concerns, careers or general enquiries, use the most suitable route below.</p>
    <div class="contact-row">
      <a href="mailto:info@scoutlink.app"><span>Email support</span><strong>info@scoutlink.app</strong></a>
      <a href="/report-a-concern"><span>Safeguarding or misuse</span><strong>Report a Concern</strong></a>
      <a href="/privacy-request"><span>Data access or deletion</span><strong>Privacy Request</strong></a>
      <a href="/careers"><span>Careers</span><strong>Open roles</strong></a>
    </div>
  </section>
</main>
</body>
</html>
