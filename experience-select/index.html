<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#08785c">
  <title>Choose Your Workspace</title>
  <meta name="description" content="Choose an approved ScoutLink or Stratex Analytics workspace.">
  <link id="experienceFavicon" rel="icon" type="image/png" href="/scoutlink-favicon.png">
  <link id="experienceAppleIcon" rel="apple-touch-icon" href="/scoutlink-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/scoutlink-public-v4.css?v=4.1.1">
  <style>
    .experience-loader-v5{min-height:100vh;padding:24px;background:#f3f6f5;display:grid;place-items:center;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .experience-loader-card-v5{width:min(470px,100%);padding:32px;border:1px solid #d9e4df;border-radius:16px;background:#fff;text-align:center;box-shadow:0 18px 55px rgba(7,27,43,.09)}
    .experience-loader-logo-v5{display:inline-flex;align-items:center;justify-content:center;min-height:48px;color:#071b2b;font-size:24px;font-weight:950;letter-spacing:-.7px}
    .experience-loader-logo-v5 span{color:#08775e}
    .experience-loader-mark-v5{display:none;width:54px;height:54px;margin:0 auto;border-radius:13px;background:linear-gradient(135deg,#08745b,#1fbbb2);color:#fff;place-items:center;font-size:13px;font-weight:950}
    .experience-loader-card-v5 h1{margin:16px 0 0;color:#071b2b;font-size:24px;line-height:1.18}
    .experience-loader-card-v5 p{margin:9px 0 0;color:#587067;font-size:12px;line-height:1.55}
    .experience-loader-progress-v5{height:5px;margin-top:20px;border-radius:99px;background:#e7f4ef;overflow:hidden}
    .experience-loader-progress-v5::after{content:"";display:block;width:40%;height:100%;border-radius:99px;background:#08775e;animation:experienceLoad 1.1s ease-in-out infinite alternate}
    html.is-stratex-experience .experience-loader-logo-v5{display:none}
    html.is-stratex-experience .experience-loader-mark-v5{display:grid}
    @keyframes experienceLoad{from{transform:translateX(-10%)}to{transform:translateX(160%)}}
  </style>
  <script>
    (function () {
      var stratex = /(^|\.)stratexanalytics\.co\.uk$/i.test(location.hostname);
      if (!stratex) return;
      document.documentElement.classList.add('is-stratex-experience');
      document.title = 'Choose Your Stratex Workspace | Stratex Analytics';
      var favicon = document.getElementById('experienceFavicon');
      var apple = document.getElementById('experienceAppleIcon');
      if (favicon) favicon.href = '/stratex-favicon.png?v=20260730-selector';
      if (apple) apple.href = '/stratex-apple-touch-icon.png?v=20260730-selector';
    }());
  </script>
</head>
<body class="public-site experience-page-v4">
  <a class="public-skip" href="#experienceRoot">Skip to workspaces</a>
  <div id="publicCoreRoot" class="public-root" aria-live="polite">
    <main class="experience-loader-v5" role="status" aria-live="polite">
      <section class="experience-loader-card-v5">
        <span class="experience-loader-logo-v5">Scout<span>Link</span></span>
        <span class="experience-loader-mark-v5">SA</span>
        <h1 id="experienceLoaderHeading">Loading approved workspaces</h1>
        <p id="experienceLoaderCopy">Checking the access connected to this account.</p>
        <div class="experience-loader-progress-v5" aria-hidden="true"></div>
      </section>
    </main>
  </div>
  <script>
    (function () {
      if (!document.documentElement.classList.contains('is-stratex-experience')) return;
      document.getElementById('experienceLoaderHeading').textContent =
        'Loading Stratex Analytics workspaces';
      document.getElementById('experienceLoaderCopy').textContent =
        'Checking your approved internal and product access.';
    }());
  </script>
  <script src="/frontend/js/main.js?v=20260730-2"></script>
  <script src="/frontend/js/experience-selector-v3.js?v=4.1.1"></script>
  <script src="/frontend/js/heap-analytics.js?v=20260730-2"></script>
</body>
</html>
