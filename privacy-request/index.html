<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Privacy Request | ScoutLink</title>
<meta name="robots" content="noindex,follow">
<meta name="description" content="Submit a ScoutLink privacy, data access, correction or deletion request.">
<link rel="canonical" href="https://www.scoutlink.app/privacy-request">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/frontend/css/main.css">
<script>if(location.pathname==='/frontend/pages/privacy-request.html')location.replace('/privacy-request'+location.search+location.hash);</script>
<style>
body{background:#f6f8fb;color:#111827;font-family:Inter,Arial,sans-serif}.shell{max-width:820px;margin:0 auto;padding:28px 16px 58px}.brand{font-size:24px;font-weight:950;color:#111827;text-decoration:none}.brand span{color:#0f9f75}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:clamp(22px,4vw,38px);box-shadow:0 20px 54px rgba(15,23,42,.08);margin-top:22px}.eyebrow{display:inline-flex;border:1px solid rgba(15,159,117,.3);background:#ecfdf5;color:#047857;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}h1{font-size:clamp(34px,5vw,54px);line-height:1.03;margin:18px 0 12px}p,label{color:#475569;line-height:1.65;font-size:14px}form{display:grid;gap:14px;margin-top:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:7px;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.06em}input,select,textarea{width:100%;min-height:44px;border:1px solid #dbe4ee;border-radius:14px;padding:10px 12px;font:600 14px Inter,Arial,sans-serif;color:#111827;background:#fff}textarea{min-height:150px;resize:vertical}.btn{min-height:44px;border-radius:14px;border:0;background:#0f9f75;color:#fff;font-weight:950;cursor:pointer}.msg{display:none;border-radius:14px;padding:12px 14px;font-size:14px}.msg.show{display:block}.ok{background:#ecfdf5;color:#047857;border:1px solid rgba(15,159,117,.35)}.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.links a{color:#047857;font-weight:850}@media(max-width:720px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
  <a class="brand" href="/">Scout<span>Link</span></a>
  <section class="card">
    <span class="eyebrow">Privacy request</span>
    <h1>Ask us about your data</h1>
    <p>Use this form to ask for access, correction, deletion, objection, restriction or another privacy-related request. Parents and guardians can also raise requests about youth player data.</p>
    <div class="msg ok" id="ok"></div>
    <div class="msg err" id="err"></div>
    <form id="privacyForm" novalidate>
      <label>Request type
        <select name="requestType" required>
          <option value="">Select request type</option>
          <option>Access request</option>
          <option>Correction request</option>
          <option>Deletion request</option>
          <option>Objection or restriction request</option>
          <option>Safeguarding concern</option>
          <option>Other</option>
        </select>
      </label>
      <div class="row">
        <label>First name <input name="firstName" autocomplete="given-name"></label>
        <label>Last name <input name="lastName" autocomplete="family-name"></label>
      </div>
      <label>Email address <input name="email" type="email" autocomplete="email" required></label>
      <label>Relationship to the data
        <select name="relationshipToData">
          <option>My own account/data</option>
          <option>Parent or guardian</option>
          <option>Coach or club representative</option>
          <option>School or academy representative</option>
          <option>Other</option>
        </select>
      </label>
      <label>Request details <textarea name="details" required placeholder="Tell us what data or account this request relates to and what you would like us to do."></textarea></label>
      <button class="btn" id="submitBtn" type="submit">Submit privacy request</button>
    </form>
    <div class="links">
      <a href="/privacy-policy">Privacy Policy</a>
      <a href="/safeguarding">Safeguarding</a>
      <a href="/report-a-concern">Report a Concern</a>
    </div>
  </section>
</main>
<script>
const API = localStorage.getItem('sl_api_url') || 'https://scoutlink-api.vercel.app';
function show(id,msg){var el=document.getElementById(id);el.textContent=msg;el.classList.add('show');}
function clearMsgs(){['ok','err'].forEach(function(id){document.getElementById(id).classList.remove('show');});}
document.getElementById('privacyForm').addEventListener('submit',function(e){
  e.preventDefault();clearMsgs();
  var fd=new FormData(e.target), body={sourcePage:'/privacy-request'}; fd.forEach(function(v,k){body[k]=v;});
  if(!body.requestType||!body.details||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.email||'')){show('err','Please choose a request type, add details and enter a valid email.');return;}
  var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Submitting...';
  fetch(API+'/api/trust/privacy-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Could not submit request');return d;});})
    .then(function(d){show('ok',d.message||'Privacy request submitted.');e.target.reset();})
    .catch(function(err){show('err',err.message||'Could not submit request.');})
    .finally(function(){btn.disabled=false;btn.textContent='Submit privacy request';});
});
</script>
<script src="/frontend/js/public-footer.js"></script>
</body>
</html>
