<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="description" content="Use this page to report a safeguarding, conduct, privacy or platform safety concern relating to ScoutLink.">
<link rel="canonical" href="https://www.scoutlink.app/report-a-concern">
<meta property="og:type" content="website">
<meta property="og:title" content="Report a Concern | ScoutLink">
<meta property="og:description" content="Report a safeguarding, conduct, privacy or platform safety concern relating to ScoutLink.">
<meta property="og:url" content="https://www.scoutlink.app/report-a-concern">
<meta property="og:image" content="https://www.scoutlink.app/social_share_image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Report a Concern | ScoutLink">
<meta name="twitter:description" content="Report a safeguarding, conduct, privacy or platform safety concern relating to ScoutLink.">
<meta name="twitter:image" content="https://www.scoutlink.app/social_share_image.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/frontend/css/main.css">
<script>if(location.pathname==='/frontend/pages/report-concern.html')location.replace('/report-a-concern'+location.search+location.hash);</script>
<style>
body{background:#f6f8fb;color:#111827;font-family:Inter,Arial,sans-serif}.form-shell{max-width:820px;margin:0 auto;padding:28px 16px 58px}.brand{font-size:24px;font-weight:950;color:#111827;text-decoration:none}.brand span{color:#0f9f75}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:clamp(22px,4vw,38px);box-shadow:0 20px 54px rgba(15,23,42,.08);margin-top:22px}.eyebrow{display:inline-flex;border:1px solid rgba(15,159,117,.3);background:#ecfdf5;color:#047857;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}h1{font-size:clamp(34px,5vw,54px);line-height:1.03;margin:18px 0 12px}p,label{color:#475569;line-height:1.65;font-size:14px}form{display:grid;gap:14px;margin-top:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:7px;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.06em}input,select,textarea{width:100%;min-height:44px;border:1px solid #dbe4ee;border-radius:14px;padding:10px 12px;font:600 14px Inter,Arial,sans-serif;color:#111827;background:#fff}textarea{min-height:150px;resize:vertical}.btn{min-height:44px;border-radius:14px;border:0;background:#0f9f75;color:#fff;font-weight:950;cursor:pointer}.msg{display:none;border-radius:14px;padding:12px 14px;font-size:14px}.msg.show{display:block}.ok{background:#ecfdf5;color:#047857;border:1px solid rgba(15,159,117,.35)}.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}@media(max-width:720px){.row{grid-template-columns:1fr}}
</style>

<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"Report a Concern | ScoutLink","url":"https://www.scoutlink.app/report-a-concern","description":"How to report ScoutLink safeguarding, data or platform concerns.","publisher":{"@type":"Organization","name":"Stratex Analytics","url":"https://www.stratexanalytics.co.uk"},"breadcrumb":{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://www.scoutlink.app/"},{"@type":"ListItem","position":2,"name":"Report a Concern","item":"https://www.scoutlink.app/report-a-concern"}]}}</script>
</head>
<body>
<main class="form-shell">
  <a class="brand" href="/">Scout<span>Link</span></a>
  <section class="card">
    <span class="eyebrow">Report a Concern</span>
    <h1>Tell us about a safeguarding or platform concern</h1>
    <p>If someone may be at immediate risk, contact emergency services first. This form is reviewed by restricted Stratex safeguarding/admin users.</p>
    <div class="msg ok" id="ok"></div>
    <div class="msg err" id="err"></div>
    <form id="concernForm" novalidate>
      <div class="row">
        <label>Concern type
          <select name="concernType" required>
            <option value="">Select type</option>
            <option>Safeguarding concern</option>
            <option>Data misuse</option>
            <option>False identity</option>
            <option>Inappropriate contact</option>
            <option>Platform safety</option>
            <option>Other</option>
          </select>
        </label>
        <label>Urgency
          <select name="urgency" required>
            <option>Standard</option>
            <option>Urgent</option>
          </select>
        </label>
      </div>
      <label>Person or account involved <input name="personOrAccount" placeholder="Name, email or account if known"></label>
      <label>Player/team if relevant <input name="playerOrTeam" placeholder="Player, team, club or school if relevant"></label>
      <label>Description <textarea name="description" required placeholder="Describe what happened, when it happened and why you are concerned."></textarea></label>
      <div class="row">
        <label>Your name <input name="contactName" autocomplete="name"></label>
        <label>Your email <input name="contactEmail" type="email" autocomplete="email" required></label>
      </div>
      <label>Phone number <input name="contactPhone" autocomplete="tel"></label>
      <button class="btn" id="submitBtn" type="submit">Submit concern</button>
    </form>
  </section>
</main>
<script>
const API = localStorage.getItem('sl_api_url') || 'https://scoutlink-api.vercel.app';
function show(id,msg){var el=document.getElementById(id);el.textContent=msg;el.classList.add('show');}
function clearMsgs(){['ok','err'].forEach(function(id){document.getElementById(id).classList.remove('show');});}
document.getElementById('concernForm').addEventListener('submit',function(e){
  e.preventDefault();clearMsgs();
  var fd=new FormData(e.target), body={sourcePage:'/report-a-concern'}; fd.forEach(function(v,k){body[k]=v;});
  if(!body.concernType||!body.description||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.contactEmail||'')){show('err','Please complete concern type, description and a valid email.');return;}
  var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Submitting...';
  fetch(API+'/api/trust/safeguarding-concerns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Could not submit concern');return d;});})
    .then(function(d){show('ok',d.message||'Concern submitted.');e.target.reset();})
    .catch(function(err){show('err',err.message||'Could not submit concern.');})
    .finally(function(){btn.disabled=false;btn.textContent='Submit concern';});
});
</script>
<script src="/frontend/js/public-footer.js"></script>
</body>
</html>
