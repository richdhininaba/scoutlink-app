<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Scout Teams - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Scout Teams</span><div class="topbar-right"><button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button><button class="btn btn-sm btn-ghost" onclick="logout()">Sign out</button></div></div>
<div class="page-content">
<div class="table-card">
  <div class="table-header"><h3>All Scout Teams</h3><button class="btn btn-sm btn-primary" onclick="openAddTeamModal()">+ Add Team</button></div>
  <div id="teamsTable"><div class="loading-state"><div class="spinner"></div></div></div>
</div>
<div id="detailPanel" style="display:none;margin-top:20px">
  <div class="table-card">
    <div class="table-header"><h3 id="panelTeamName">Team details</h3><span id="panelBadge" class="badge badge-blue">Scout Team</span></div>
    <div style="padding:0 20px 20px">
      <div id="teamInfoGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px"></div>
    </div>
  </div>
  <div class="table-card" style="margin-top:16px">
    <div class="table-header"><h3>Playing Style And Weaknesses</h3></div>
    <div id="teamStyleInfo" style="padding:0 20px 20px"></div>
  </div>
  <div class="table-card" style="margin-top:16px">
    <div class="table-header"><h3>Associated Scouts</h3><button class="btn btn-sm btn-primary" onclick="openAddScoutModal()">+ Add Scout</button></div>
    <div id="teamScoutsTable" style="padding:0 20px 20px"></div>
  </div>
  <div class="table-card" style="margin-top:16px;border-color:rgba(220,38,38,.35)">
    <div class="table-header"><h3 style="color:#EF5350">Danger Zone</h3></div>
    <div style="padding:0 20px 20px">
      <p style="color:#546E7A;font-size:13px;margin-bottom:14px">Removing a Scout Team permanently deletes the team, assigned scout accounts, and their linked scout records.</p>
      <button class="btn" style="background:rgba(220,38,38,.15);color:#EF5350;border:1px solid rgba(220,38,38,.3)" onclick="deleteCurrentTeam()">Remove Team</button>
  </div>
</div>
</div>
</div></div></div>

<div id="addTeamModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;overflow:auto">
<div style="background:#162032;border-radius:12px;max-width:520px;margin:60px auto;padding:24px;border:1px solid #2d3f55">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3 style="margin:0;color:#E0E0E0">Add Scout Team</h3><button onclick="document.getElementById('addTeamModal').style.display='none'" style="background:none;border:none;color:#90A4AE;font-size:24px;cursor:pointer">&times;</button></div>
<div style="display:grid;gap:12px">
<input id="nt_name" placeholder="Team name" class="form-input">
<div style="display:grid;grid-template-columns:1fr auto;gap:8px"><input id="nt_league" placeholder="Type or select league" class="form-input"><button type="button" class="btn btn-sm btn-outline" id="addLeagueBtn">+ Add</button></div>
<input id="nt_tier" type="number" min="1" max="10" placeholder="Tier" class="form-input">
<select id="nt_country" class="form-input"></select>
<input id="nt_formation" placeholder="Formation" class="form-input">
<textarea id="nt_style" rows="3" placeholder="Playing style and weaknesses" class="form-input"></textarea>
</div>
<div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-primary" onclick="createTeam()" style="flex:1">Create</button><button class="btn btn-ghost" onclick="document.getElementById('addTeamModal').style.display='none'" style="flex:1">Cancel</button></div>
<div id="addTeamMsg" style="margin-top:10px;font-size:13px;text-align:center"></div>
</div></div>

<div id="addScoutModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;overflow:auto">
<div style="background:#162032;border-radius:12px;max-width:460px;margin:90px auto;padding:24px;border:1px solid #2d3f55">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3 style="margin:0;color:#E0E0E0">Add Scout to Team</h3><button onclick="document.getElementById('addScoutModal').style.display='none'" style="background:none;border:none;color:#90A4AE;font-size:24px;cursor:pointer">&times;</button></div>
<select id="scoutSelect" class="form-input"></select>
<div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-primary" onclick="addScoutToTeam()" style="flex:1">Add Scout</button><button class="btn btn-ghost" onclick="document.getElementById('addScoutModal').style.display='none'" style="flex:1">Cancel</button></div>
<div id="addScoutMsg" style="margin-top:10px;font-size:13px;text-align:center"></div>
</div></div>

<script src="../js/stratex-nav.js"></script>
<script src="../js/main.js"></script>
<script src="../js/leagues.js"></script>
<script>
var allTeams=[], allScouts=[], currentTeamId=null, teamScouts=[];
function logout(){Auth.clear();navigateClean('login.html?logout=1');}
function safe(v,f){return (v===null||v===undefined||v==='')?(f||'--'):String(v);}
function infoRow(label,value){return '<div style="background:#0d1117;border:1px solid #243447;border-radius:8px;padding:12px"><div style="color:#90A4AE;font-size:12px;margin-bottom:4px">'+label+'</div><div style="color:#E0E0E0;font-weight:800">'+safe(value)+'</div></div>';}
function scoutCountForTeam(id){return allScouts.filter(function(s){return s.scout_team_id===id;}).length;}

async function loadPage(){
  var results=await Promise.all([api('GET','/api/stratex/scout-teams'),api('GET','/api/stratex/scouts')]);
  allTeams=results[0].data||[];
  allScouts=results[1].data||[];
  renderTeams();
}
function renderTeams(){
  if(!allTeams.length){document.getElementById('teamsTable').innerHTML='<div style="text-align:center;padding:48px;color:#546E7A">No scout teams yet</div>';return;}
  document.getElementById('teamsTable').innerHTML='<table class="sl-table"><thead><tr><th>Team</th><th>League</th><th>Tier</th><th>Country</th><th>Formation</th><th>Scouts</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+allTeams.map(function(t){return '<tr style="cursor:pointer" onclick="openTeam(\''+t.id+'\')"><td><b>'+safe(t.team_name)+'</b></td><td>'+safe(t.league)+'</td><td>'+safe(t.tier)+'</td><td>'+safe(t.country)+'</td><td>'+safe(t.formation)+'</td><td><b>'+scoutCountForTeam(t.id)+'</b></td><td style="text-align:right"><button class="btn btn-sm btn-outline" onclick="event.stopPropagation();openTeam(\''+t.id+'\')">View details</button></td></tr>';}).join('')+'</tbody></table>';
}
async function openTeam(id){
  currentTeamId=id;
  var t=allTeams.find(function(x){return x.id===id;});
  if(!t)return;
  document.getElementById('detailPanel').style.display='block';
  document.getElementById('panelTeamName').textContent=t.team_name;
  document.getElementById('teamInfoGrid').innerHTML=infoRow('Team Name',t.team_name)+infoRow('League',t.league)+infoRow('Tier','Tier '+safe(t.tier))+infoRow('Country',t.country)+infoRow('Formation',t.formation);
  var style=safe(t.playing_style,'No playing style recorded.');
  var weaknesses=['poor_set_pieces','weak_left_flank','weak_right_flank','high_defensive_line','pace_exploitable','poor_second_ball','poor_aerial','weak_pressing','slow_build_up'].filter(function(w){return style.toLowerCase().indexOf(w)>=0;}).map(function(w){return w.replace(/_/g,' ');});
  document.getElementById('teamStyleInfo').innerHTML='<div style="color:#E0E0E0;margin-bottom:12px">'+style+'</div>'+(weaknesses.length?'<div style="display:flex;flex-wrap:wrap;gap:6px">'+weaknesses.map(function(w){return '<span class="badge badge-red">'+w+'</span>';}).join('')+'</div>':'<div style="font-size:12px;color:#546E7A">No structured weaknesses found</div>');
  await loadTeamScouts(id);
  document.getElementById('detailPanel').scrollIntoView({behavior:'smooth',block:'start'});
}
async function loadTeamScouts(id){
  var d=await api('GET','/api/stratex/scout-teams/'+id+'/scouts');
  teamScouts=d.data||[];
  if(!teamScouts.length){document.getElementById('teamScoutsTable').innerHTML='<div style="padding:24px;text-align:center;color:#546E7A">No scouts assigned</div>';return;}
  document.getElementById('teamScoutsTable').innerHTML='<table class="sl-table"><thead><tr><th>Name</th><th>Email</th><th>Club</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+teamScouts.map(function(s){return '<tr><td><b>'+safe(s.first_name)+' '+safe(s.last_name,'')+'</b></td><td>'+safe(s.email)+'</td><td>'+safe(s.club_name)+'</td><td style="text-align:right"><button class="btn btn-sm btn-ghost" onclick="removeScoutFromTeam(\''+s.id+'\')">Remove</button></td></tr>';}).join('')+'</tbody></table>';
}
function openAddTeamModal(){document.getElementById('addTeamMsg').textContent='';document.getElementById('addTeamModal').style.display='block';}
async function createTeam(){
  var body={team_name:document.getElementById('nt_name').value.trim(),league:document.getElementById('nt_league').value.trim(),tier:parseInt(document.getElementById('nt_tier').value)||null,country:document.getElementById('nt_country').value.trim()||'England',formation:document.getElementById('nt_formation').value.trim(),playing_style:document.getElementById('nt_style').value.trim()};
  if(!body.team_name){document.getElementById('addTeamMsg').textContent='Team name is required';return;}
  var d=await api('POST','/api/stratex/scout-teams',body);
  allTeams.push(d.data||d);
  document.getElementById('addTeamModal').style.display='none';
  renderTeams();
}
async function openAddScoutModal(){
  if(!currentTeamId)return;
  var assigned=teamScouts.map(function(s){return s.id;});
  var options=allScouts.filter(function(s){return assigned.indexOf(s.id)<0;}).map(function(s){return '<option value="'+s.id+'">'+safe(s.first_name)+' '+safe(s.last_name,'')+' - '+safe(s.email)+'</option>';}).join('');
  document.getElementById('scoutSelect').innerHTML=options||'<option value="">No available scouts</option>';
  document.getElementById('addScoutModal').style.display='block';
}
async function addScoutToTeam(){
  var sid=document.getElementById('scoutSelect').value;
  if(!sid)return;
  await api('POST','/api/stratex/scout-teams/'+currentTeamId+'/scouts',{scout_id:sid});
  allScouts.forEach(function(s){if(s.id===sid)s.scout_team_id=currentTeamId;});
  document.getElementById('addScoutModal').style.display='none';
  renderTeams();
  await loadTeamScouts(currentTeamId);
}
async function removeScoutFromTeam(id){
  if(!confirm('Remove this scout from the team?'))return;
  await api('DELETE','/api/stratex/scout-teams/'+currentTeamId+'/scouts/'+id);
  allScouts.forEach(function(s){if(s.id===id)s.scout_team_id=null;});
  renderTeams();
  await loadTeamScouts(currentTeamId);
}
async function deleteCurrentTeam(){
  var t=allTeams.find(function(x){return x.id===currentTeamId;});
  if(!t||!confirm('Delete '+t.team_name+' and all assigned scout accounts?'))return;
  await api('DELETE','/api/stratex/scout-teams/'+currentTeamId);
  allTeams=allTeams.filter(function(x){return x.id!==currentTeamId;});
  allScouts=allScouts.filter(function(s){return s.scout_team_id!==currentTeamId;});
  currentTeamId=null;
  document.getElementById('detailPanel').style.display='none';
  renderTeams();
}
document.addEventListener('DOMContentLoaded',function(){initStratexPage();fillCountrySelect('nt_country','England');if(window.bindLeagueInput)bindLeagueInput('nt_league','addLeagueBtn');loadPage().catch(function(e){document.getElementById('teamsTable').innerHTML='<div style="padding:16px;color:#EF5350">Error: '+e.message+'</div>';});});
</script>
<script src="../js/mobile.js"></script>
</body></html>
