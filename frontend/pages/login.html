<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - ScoutLink</title>
<link rel="stylesheet" href="../css/main.css">
<style>
:root{--sl-green:#00c853;--sl-dark:#0a0f1e;--sl-card:#111827;--sl-border:#1e2a3a;--sl-text:#e2e8f0;--sl-muted:#94a3b8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--sl-dark);color:var(--sl-text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.login-wrap{width:100%;max-width:420px;}
.brand{text-align:center;margin-bottom:2rem;}
.brand h1{font-size:2.5rem;font-weight:900;color:var(--sl-green);letter-spacing:-1px;}
.brand h1 span{color:var(--sl-text);}
.brand p{color:var(--sl-muted);margin-top:0.5rem;}
.card{background:var(--sl-card);border:1px solid var(--sl-border);border-radius:16px;padding:2rem;}
.form-group{margin-bottom:1.25rem;}
label{display:block;font-size:0.875rem;font-weight:600;color:var(--sl-muted);margin-bottom:0.5rem;}
input{width:100%;padding:0.75rem 1rem;background:#0a0f1e;border:1px solid var(--sl-border);border-radius:8px;color:var(--sl-text);font-size:0.95rem;transition:border-color 0.2s;}
input:focus{outline:none;border-color:var(--sl-green);}
.btn{width:100%;padding:0.875rem;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:1rem;transition:all 0.2s;}
.btn-primary{background:var(--sl-green);color:#000;}
.btn-primary:hover{background:#00b548;}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;}
.links{margin-top:1.5rem;text-align:center;font-size:0.875rem;color:var(--sl-muted);}
.links a{color:var(--sl-green);text-decoration:none;}
.links a:hover{text-decoration:underline;}
.divider{border:none;border-top:1px solid var(--sl-border);margin:1.5rem 0;}
.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;border-radius:8px;padding:0.75rem 1rem;font-size:0.875rem;margin-bottom:1rem;display:none;}
.error.show{display:block;}
.spinner{display:none;width:20px;height:20px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:spin 0.6s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="brand">
    <h1>Scout<span>Link</span></h1>
    <p>Football Player Intelligence Platform</p>
  </div>
  <div class="card">
    <div id="errorMsg" class="error"></div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">
      <span id="btnText">Sign In</span>
      <div class="spinner" id="spinner"></div>
    </button>
    <div class="links">
      <a href="forgot-password.html">Forgot password?</a>
    </div>
    <hr class="divider">
    <div class="links">
      New to ScoutLink? <a href="register.html">Register here</a>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fwxnggklfsgrydcoeiuh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3eG5nZ2tsZnNncnlkY29laXVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NDgwOTMsImV4cCI6MjA5NjMyNDA5M30.lV6TCjabEHevU5woLHLa0cCwBvm-0dFpce09ialfpKw';
const ROLE_TYPE_MAP = { stratex:'Stratex', scout:'Scout', coach:'Coach', player:'Player' };
const BASE = '/scoutlink-app/frontend/pages/';

// Bug fix: Only auto-redirect from login page if NOT logging out, NOT on an expired session,
// and we have a valid session AND role. Use a flag to prevent redirect loops.
(function() {
  const params = new URLSearchParams(window.location.search);
  const justLoggedOut = params.get('logout') === '1';
  const sessionExpired = params.get('expired') === '1';

  // Do NOT redirect if logging out or session expired (explicit landing on login page)
  if (justLoggedOut || sessionExpired) {
    // Clear storage on logout
    if (justLoggedOut) {
      localStorage.removeItem('sl_session');
      localStorage.removeItem('sl_token');
      localStorage.removeItem('sl_user');
      localStorage.removeItem('sl_type');
      localStorage.removeItem('sl_user_id');
      localStorage.removeItem('sl_user_email');
      localStorage.removeItem('sl_user_role');
      localStorage.removeItem('sl_user_data');
    }
    return;
  }

  // Check if already logged in - redirect to appropriate dashboard
  // Only redirect if we have BOTH a valid session AND a known role
  try {
    const token = localStorage.getItem('sl_token');
    const type = localStorage.getItem('sl_type');
    const s = JSON.parse(localStorage.getItem('sl_session') || 'null');
    
    const sessionValid = s && s.access_token && s.expires_at && (Date.now() / 1000 < s.expires_at);
    const tokenValid = token && token.length > 20;
    
    if ((sessionValid || tokenValid) && type) {
      const map = {
        Stratex: 'stratex-dashboard.html',
        Scout: 'scout-dashboard.html',
        Coach: 'coach-dashboard.html',
        Player: 'player-dashboard.html'
      };
      if (map[type]) {
        window.location.replace(BASE + map[type]);
        return;
      }
    }
  } catch(e) {
    // Ignore parse errors
  }
})();

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}
function hideError() { document.getElementById('errorMsg').classList.remove('show'); }
function setLoading(on) {
  document.getElementById('loginBtn').disabled = on;
  document.getElementById('btnText').style.display = on ? 'none' : 'inline';
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
}

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  hideError();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { showError('Please enter your email and password.'); return; }
  setLoading(true);
  try {
    // Step 1: Authenticate with Supabase
    const authResp = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const authData = await authResp.json();
    if (!authData.access_token) {
      throw new Error(authData.error_description || authData.msg || 'Invalid email or password');
    }

    const bearerToken = authData.access_token;
    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + bearerToken,
      'Content-Type': 'application/json'
    };

    // Step 2: Find user profile across role tables
    const tables = [
      { table: 'stratex', role: 'stratex' },
      { table: 'scouts', role: 'scout' },
      { table: 'coaches', role: 'coach' },
      { table: 'players', role: 'player' }
    ];
    let profile = null, userRole = null;
    for (const t of tables) {
      const r = await fetch(SUPABASE_URL + '/rest/v1/' + t.table + '?email=eq.' + encodeURIComponent(email.toLowerCase()) + '&select=*', { headers });
      const data = await r.json();
      if (Array.isArray(data) && data.length > 0) {
        profile = data[0];
        userRole = t.role;
        break;
      }
    }
    if (!profile) throw new Error('Account not found. Please register or contact Stratex.');

    // Step 3: Store session data - store the Supabase access token as sl_token
    // so the api() helper in main.js sends it as Bearer for API calls
    const roleType = ROLE_TYPE_MAP[userRole] || userRole;
    localStorage.setItem('sl_session', JSON.stringify(authData));
    localStorage.setItem('sl_token', bearerToken);
    localStorage.setItem('sl_user', JSON.stringify({
      id: profile.id,
      firstName: profile.first_name,
      lastName: profile.last_name,
      email: email.toLowerCase()
    }));
    localStorage.setItem('sl_type', roleType);
    localStorage.setItem('sl_user_email', email.toLowerCase());
    localStorage.setItem('sl_user_role', userRole);
    localStorage.setItem('sl_user_data', JSON.stringify(profile));
    localStorage.setItem('sl_user_id', profile.id);

    // Step 4: Redirect to correct dashboard
    const dashMap = {
      stratex: 'stratex-dashboard.html',
      scout: profile.preferences_set ? 'scout-dashboard.html' : 'scout-preferences.html',
      coach: 'coach-dashboard.html',
      player: 'player-dashboard.html'
    };
    window.location.href = BASE + (dashMap[userRole] || 'login.html');
  } catch(e) {
    showError(e.message || 'Login failed. Please try again.');
    setLoading(false);
  }
}
</script>
</body>
</html>
