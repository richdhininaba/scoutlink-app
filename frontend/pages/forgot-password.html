<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forgot Password – ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body class="form-page">
<div class="form-page-inner"><div class="form-container">
  <div class="form-logo"><a href="../index.html" style="font-size:28px;font-weight:900">⚡ Scout<span style="color:#00E676">Link</span></a></div>
  <h1 class="form-title">Reset Password</h1>
  <p class="form-subtitle">Enter your email and account type. We'll send a reset code.</p>
  <div class="form-error" id="formError"></div>
  <div class="form-success" id="formSuccess"></div>
  <div class="form-group"><label>Account Type</label>
    <select id="accountType"><option value="Player">Player</option><option value="Coach">Coach</option><option value="Scout">Scout</option></select>
  </div>
  <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="your@email.com"></div>
  <button class="btn btn-primary btn-full" onclick="sendReset()">Send Reset Code</button>
  <div class="form-divider"></div>
  <div class="form-link"><a href="/login">Back to Sign In</a></div>
</div></div>
<script src="../js/main.js"></script>
<script>
async function sendReset(){
  const err=document.getElementById('formError'),suc=document.getElementById('formSuccess');
  err.classList.remove('show');suc.classList.remove('show');
  try{const d=await api('POST','/api/auth/forgot-password',{email:document.getElementById('email').value,accountType:document.getElementById('accountType').value});suc.textContent=d.message;suc.classList.add('show');}
  catch(e){err.textContent=e.message;err.classList.add('show');}
}
</script>
<script src="../js/mobile.js"></script>
</body></html>
