<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Player Rankings - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--card:#161b22;--accent:#1d9e75;--text:#ffffff;--text-secondary:#8b949e;--border:#30363d;}
.sl-table{width:100%;border-collapse:collapse;}
.sl-table th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-secondary);border-bottom:1px solid var(--border);}
.sl-table td{padding:12px;border-bottom:1px solid var(--border);font-size:14px;}
.sl-table tr:hover td{background:rgba(255,255,255,0.02);}
.btn{padding:8px 16px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
.btn-sm{padding:6px 12px;font-size:13px;}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900;color:#fff;text-decoration:none">Scout<span style="color:var(--accent)">Link</span></a></div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
  <span class="topbar-title">Player Rankings</span>
  <div class="topbar-right">
    <button class="notif-btn" id="notifToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="notif-badge" id="notifBadge" style="display:none">0</span>
    </button>
    <button class="btn btn-sm btn-outline" id="logoutBtn">Sign Out</button>
  </div>
</div>
<div class="page-content">
<div class="table-card">
  <div class="table-header">
    <div><h3 style="font-size:16px;font-weight:700">Player Rankings</h3><p style="font-size:12px;color:var(--text-secondary);margin-top:2px">Top players by compatibility with your team profile</p></div>
    <a href="scout-setup.html" class="btn btn-sm btn-outline" style="text-decoration:none">Edit Team Setup</a>
  </div>
  <div id="rankContent"><div style="display:flex;align-items:center;gap:12px;padding:32px;color:var(--text-secondary)"><div class="spinner"></div><span>Loading rankings...</span></div></div>
</div>
</div>
</div>
</div>
<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-header">
    <h3>Notifications</h3>
    <button id="closeNotifBtn" style="background:none;border:none;color:var(--text-secondary);font-size:20px;cursor:pointer">x</button>
  </div>
  <div class="notif-list" id="notifList"></div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
function logout(){if(typeof Auth!=='undefined')Auth.clear();window.location.href='login.html?logout=1';}

function initNav(){
  if(typeof Auth==='undefined'||!Auth.isLoggedIn()||Auth.type!=='Scout'){window.location.href='login.html';return;}
  if(typeof buildScoutNav==='function')buildScoutNav('sidebarNav','Scout');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u){
    var ini=(u.firstName||'?')[0]+(u.lastName||'?')[0];
    uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:var(--accent);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">'+ini.toUpperCase()+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role" style="color:var(--text-secondary);font-size:12px">Scout</div></div></div>';
  }
  if(typeof updateNotifBadge==='function')updateNotifBadge();
}

function dOv(v){var n=parseFloat(v);return isNaN(n)?'--':(n>10?n/10:n).toFixed(1);}
function cColor(s){return s>=80?'#1d9e75':s>=65?'#FFC107':s>=50?'#FF9800':'#f85149';}
function pColor(g){return {Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#17a2b8',Forward:'#ff6b35'}[g]||'#1d9e75';}
function fmtVal(v){if(!v||v<1000)return '-';if(v>=1000000)return (''+Math.round(v/1000000*10)/10).replace(/\.0$/,'')+'M';return Math.round(v/1000)+'K';}
function initials(f,l){return((f||'')[0]||(l||'')[0]||'?').toUpperCase()+((l||'')[0]||'').toUpperCase();}

document.addEventListener('DOMContentLoaded',function(){
  initNav();
  document.getElementById('notifToggle').addEventListener('click',toggleNotifPanel);
  document.getElementById('closeNotifBtn').addEventListener('click',toggleNotifPanel);
  document.getElementById('logoutBtn').addEventListener('click',logout);
  if(typeof api==='function'){
    api('GET','/api/scouts/recommended-players').then(function(d){
      if(d.setupRequired){
        document.getElementById('rankContent').innerHTML='<div style="text-align:center;padding:48px 20px;color:var(--text-secondary)"><p style="font-size:16px;font-weight:600;margin-bottom:8px">Team setup required</p><p style="font-size:13px;margin-bottom:16px">Complete your team setup to see personalised rankings.</p><a href="scout-setup.html" class="btn btn-primary" style="text-decoration:none">Set Up My Team</a></div>';
        return;
      }
      var players=d.data||[];
      if(!players.length){
        document.getElementById('rankContent').innerHTML='<div style="text-align:center;padding:48px 20px;color:var(--text-secondary)"><p>No players found. Adjust your search preferences.</p><a href="scout-setup.html" class="btn btn-outline" style="margin-top:14px;display:inline-block;text-decoration:none">Edit Setup</a></div>';
        return;
      }
      var html='<div style="overflow-x:auto"><table class="sl-table"><thead><tr><th>#</th><th>Player</th><th>Position</th><th>Age Group</th><th>Club</th><th>Compat.</th><th>Overall</th><th>Value</th><th></th></tr></thead><tbody>';
      players.slice(0,50).forEach(function(p,i){
        var ov=dOv(p.overall_rating);
        var ovN=parseFloat(p.overall_rating||0);var ovP=ovN>10?ovN:ovN*10;
        var cs=Math.round(p.compatibilityScore||0);
        var pCol=pColor(p.position_group);
        html+='<tr>'+
          '<td style="color:var(--text-secondary);font-weight:700;font-size:16px">#'+(i+1)+'</td>'+
          '<td><div style="display:flex;align-items:center;gap:8px"><div style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:'+pCol+';color:'+(pCol==='#FFC107'?'#000':'#fff')+'">'+initials(p.first_name,p.last_name)+'</div><b>'+(p.first_name||'')+' '+(p.last_name||'')+'</b></div></td>'+
          '<td style="font-size:12px">'+(p.specific_position||p.primary_position||'--')+'</td>'+
          '<td><span style="font-size:11px;padding:2px 8px;background:rgba(29,158,117,.1);color:var(--accent);border-radius:4px">'+(p.age_group||'--')+'</span></td>'+
          '<td style="color:var(--text-secondary);font-size:12px">'+(p.team_name||'--')+'</td>'+
          '<td style="font-weight:800;color:'+cColor(cs)+'">'+cs+'</td>'+
          '<td style="font-weight:800;color:'+cColor(ovP)+'">'+ov+'</td>'+
          '<td style="color:var(--accent);font-size:12px">'+fmtVal(p.transfer_value||0)+'</td>'+
          '<td><a href="player-profile.html?id='+p.id+'" class="btn btn-sm btn-outline" style="text-decoration:none">View</a></td>'+
          '</tr>';
      });
      html+='</tbody></table></div>';
      document.getElementById('rankContent').innerHTML=html;
    }).catch(function(e){
      document.getElementById('rankContent').innerHTML='<div style="text-align:center;padding:48px;color:var(--text-secondary)">Could not load rankings.<br><small>'+e.message+'</small></div>';
    });
  }
});
</script>
<script src="../js/mobile.js"></script>
</body></html>
