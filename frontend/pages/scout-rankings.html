<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rankings - ScoutLink</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Rankings</span><div class="topbar-right"><button class="notif-btn" onclick="toggleNotifPanel()">Notifs<span class="notif-badge" id="notifBadge" style="display:none">0</span></button><button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button></div></div>
<div class="page-content">
<div class="table-card">
  <div class="table-header"><h3>Player Rankings</h3><span id="rankCount" style="color:#546E7A;font-size:13px"></span></div>
  <div id="rankingsTable"><div class="loading-state"><div class="spinner"></div></div></div>
</div>
<script>
async function loadPage() {
  try {
    var d = await api('GET', '/api/stratex/rankings?limit=100');
    var players = d.data || [];
    document.getElementById('rankCount').textContent = (d.total || 0) + ' players';
    if (!players.length) { document.getElementById('rankingsTable').innerHTML = '<div style="text-align:center;padding:48px;color:#546E7A">No player data yet</div>'; return; }
    document.getElementById('rankingsTable').innerHTML = '<table class="sl-table"><thead><tr><th>Rank</th><th>Player</th><th>Age</th><th>Position</th><th>Team</th><th>Overall</th><th>Value</th><th></th></tr></thead><tbody>' +
      players.map(function(p) {
        return '<tr><td style="color:#546E7A;font-weight:700">#'+p.rank+'</td>' +
          '<td><b>'+p.first_name+' '+p.last_name+'</b></td>' +
          '<td>'+p.age+'</td><td>'+(p.specific_position||p.primary_position||'--')+'</td>' +
          '<td>'+(p.team_name||'--')+'</td>' +
          '<td style="color:'+ratingColor(p.overall_rating)+';font-weight:700">'+Math.round(p.overall_rating||0)+'</td>' +
          '<td>'+formatValue(p.transfer_value||0)+'</td>' +
          '<td><a href="player-profile.html?id='+p.id+'" class="btn btn-sm btn-outline">View</a></td></tr>';
      }).join('') + '</tbody></table>';
  } catch(e) { document.getElementById('rankingsTable').innerHTML = '<div style="padding:16px;color:#ff6666">Error: ' + e.message + '</div>'; }
}
</script></div>
</div></div>
<div class="notif-panel" id="notifPanel"><div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">×</button></div><div class="notif-list" id="notifList"></div></div>
<script src="../js/main.js"></script>
<script>
var SCOUT_NAV=[{label:'Dashboard',href:'scout-dashboard.html'},{label:'Player Search',href:'player-search.html'},{label:'My Pipeline',href:'scout-pipeline.html'},{label:'Rankings',href:'scout-rankings.html'},{label:'Fixtures',href:'scout-fixtures.html'},{label:'Predictions',href:'scout-predictions.html'},{label:'Exports',href:'scout-exports.html'},{label:'Notifications',href:'#',action:'toggleNotifPanel'},{label:'Settings',href:'scout-settings.html'}];
function initNav(){if(!Auth.isLoggedIn()||Auth.type!=='Scout'){window.location.href='login.html';return;}var nav=document.getElementById('sidebarNav');var cur=window.location.pathname.split('/').pop();if(nav)nav.innerHTML=SCOUT_NAV.map(function(i){return'<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'" '+(i.action?'onclick="'+i.action+'();return false"':'')+'>'+i.label+'</a>';}).join('');var u=Auth.user;var uel=document.getElementById('sidebarUser');if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+u.firstName+' '+u.lastName+'</div><div class="user-role">Scout</div></div></div>';updateNotifBadge();}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
document.addEventListener('DOMContentLoaded',function(){initNav();if(typeof loadPage==='function')loadPage();});
</script>
</body></html>
