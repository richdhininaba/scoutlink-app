<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register as Scout – ScoutLink</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body class="form-page">
<div class="form-page-inner"><div class="form-container">
  <div class="form-logo"><a href="../index.html" style="font-size:28px;font-weight:900">⚡ Scout<span style="color:#00E676">Link</span></a></div>
  <h1 class="form-title">Register as Scout</h1>
  <p class="form-subtitle">Submit your details for Stratex review. You'll hear back within 24 hours.</p>
  <div class="form-error" id="formError"></div>
  <div class="form-success" id="formSuccess"></div>
  <div class="form-row">
    <div class="form-group"><label>First Name <span class="required">*</span></label><input type="text" id="firstName" placeholder="John"></div>
    <div class="form-group"><label>Last Name <span class="required">*</span></label><input type="text" id="lastName" placeholder="Smith"></div>
  </div>
  <div class="form-group"><label>Email Address <span class="required">*</span></label><input type="email" id="emailAddr" placeholder="scout@club.co.uk"></div>
  <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" placeholder="+44 7700 000000"></div>
  <div class="form-divider"></div>
  <div class="form-group"><label>Professional Club / Organisation <span class="required">*</span></label><input type="text" id="scoutClub" placeholder="e.g. Arsenal FC Academy"></div>
  <div class="form-group"><label>League / Division</label><input type="text" id="scoutLeague" placeholder="e.g. Premier League 2"></div>
  <div class="form-divider"></div>
  <div class="policy-check">
    <input type="checkbox" id="policyAgreed">
    <p>I agree to the <a href="data-policy.html" target="_blank">ScoutLink Data Policy</a> and confirm I am an authorised representative of my club.</p>
  </div>
  <button class="btn btn-primary btn-full" onclick="submitReg()">Submit Registration</button>
  <div class="form-divider"></div>
  <div class="form-link">Already registered? <a href="login.html">Sign In</a></div>
</div></div>
<script src="../js/main.js"></script>
<script>
async function submitReg() {
  const err=document.getElementById('formError'),suc=document.getElementById('formSuccess');
  err.classList.remove('show');suc.classList.remove('show');
  if(!document.getElementById('policyAgreed').checked){err.textContent='Please agree to the data policy.';err.classList.add('show');return;}
  try {
    const d=await api('POST','/api/registrations/scout',{firstName:document.getElementById('firstName').value,lastName:document.getElementById('lastName').value,emailAddr:document.getElementById('emailAddr').value,phone:document.getElementById('phone').value,scoutClub:document.getElementById('scoutClub').value,scoutLeague:document.getElementById('scoutLeague').value,dataPolicyAgreed:true});
    suc.textContent=d.message;suc.classList.add('show');document.querySelector('.btn').disabled=true;
  } catch(e){err.textContent=e.message;err.classList.add('show');}
}
</script>
</body></html>
