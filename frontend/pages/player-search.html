<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Player Database - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.scout-card{background:#111827;border:1px solid #1e2a3a;border-radius:12px;padding:18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.scout-card:hover{border-color:#00E676;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,230,118,.1);}
.scout-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#00E676,#00BCD4);}
.attr-bar-mini{height:5px;background:#1e2a3a;border-radius:3px;overflow:hidden;margin-top:3px;}
.attr-bar-fill-mini{height:100%;border-radius:3px;}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Ã¢ÂÂ¡ Scout<span style="color:#00E676">Link</span></a></div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
  <div class="topbar">
    <span class="topbar-title">Player Database</span>
    <div class="topbar-right">
      <button class="notif-btn" onclick="toggleNotifPanel()">Ã°ÂÂÂ<span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
      <button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button>
    </div>
  </div>
  <div class="page-content">
    <!-- Search Filters -->
    <div style="background:#111827;border:1px solid #1e2a3a;border-radius:12px;padding:20px;margin-bottom:20px">
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end">
        <div class="form-group" style="margin:0">
          <label>Ã°ÂÂÂ Search Player</label>
          <input type="text" id="searchInput" placeholder="Name..." oninput="debouncedSearch()">
        </div>
        <div class="form-group" style="margin:0">
          <label>Position</label>
          <select id="posFilter" onchange="loadPlayers()">
            <option value="">All Positions</option>
            <option value="Goalkeeper">Ã°ÂÂ§Â¤ Goalkeeper</option>
            <option value="Defender">Ã°ÂÂÂ¡Ã¯Â¸Â Defender</option>
            <option value="Midfielder">Ã°ÂÂÂ Midfielder</option>
            <option value="Forward">Ã¢ÂÂ¡ Forward</option>
          </select>
        </div>
        <div class="form-group" style="margin:0">
          <label>Min Age</label>
          <input type="number" id="minAge" placeholder="e.g. 14" min="10" max="25" oninput="debouncedSearch()">
        </div>
        <div class="form-group" style="margin:0">
          <label>Max Age</label>
          <input type="number" id="maxAge" placeholder="e.g. 21" min="10" max="25" oninput="debouncedSearch()">
        </div>
        <button class="btn btn-primary" onclick="loadPlayers()" style="margin-bottom:0">Search</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <span id="resultCount" style="color:#546E7A;font-size:13px"></span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm btn-outline active-tab" id="tabCards" onclick="setView('cards')">Ã°ÂÂÂ Cards</button>
        <button class="btn btn-sm btn-ghost" id="tabTable" onclick="setView('table')">Ã°ÂÂÂ Table</button>
      </div>
    </div>

    <div id="resultsContainer"></div>
    <div id="pagination" style="display:flex;justify-content:center;gap:8px;margin-top:20px"></div>
  </div>
</div>
</div>
<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">ÃÂ</button></div>
  <div class="notif-list" id="notifList"></div>
</div>
<script src="../js/main.js"></script>
<script>
function dispOverall(v){var n=parseFloat(v);if(isNaN(n))return '--';return (n>10?n/10:n).toFixed(1);}
function dispAttr(v){var n=parseFloat(v);if(isNaN(n))return '--';return (n>10?n/10:n).toFixed(1);}
function attrPct(v){var n=parseFloat(v);if(isNaN(n))return 0;return Math.round(n>10?n:n*10);}
function attrColor(pct){return pct>=80?'#00E676':pct>=65?'#FFC107':pct>=50?'#FF9800':'#f44336';}
function posColor(g){return {Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#00BCD4',Forward:'#FF5722'}[g]||'#00E676';}

var NAV_MAP = {
  Scout:[
    {label:'Ã°ÂÂÂ  Dashboard',href:'scout-dashboard.html'},{label:'Ã°ÂÂÂ Player Search',href:'player-search.html'},
    {label:'Ã°ÂÂÂ My Pipeline',href:'scout-pipeline.html'},{label:'Ã°ÂÂÂ Rankings',href:'scout-rankings.html'},
    {label:'Ã°ÂÂÂ Fixtures',href:'scout-fixtures.html'},{label:'Ã°ÂÂÂ® Predictions',href:'scout-predictions.html'},
    {label:'Ã°ÂÂÂ Exports',href:'scout-exports.html'},{label:'Ã°ÂÂÂ Notifications',href:'#',action:'toggleNotifPanel'},
    {label:'Ã¢ÂÂÃ¯Â¸Â Settings',href:'scout-settings.html'}
  ],
  Coach:[
    {label:'Ã°ÂÂÂ  Dashboard',href:'coach-dashboard.html'},{label:'Ã°ÂÂÂ¥ My Players',href:'coach-my-players.html'},
    {label:'Ã¢ÂÂ Add Player',href:'add-player.html'},{label:'Ã°ÂÂÂ¦ Bulk Import',href:'bulk-add-players.html'},
    {label:'Ã°ÂÂÂ Match Facts',href:'match-facts.html'},{label:'Ã°ÂÂÂ Fixtures',href:'coach-fixtures.html'},
    {label:'Ã°ÂÂÂ¥ Video Reels',href:'coach-video-reels.html'},
    {label:'Ã°ÂÂÂ Notifications',href:'#',action:'toggleNotifPanel'},{label:'Ã¢ÂÂÃ¯Â¸Â Settings',href:'coach-settings.html'}
  ],
  Stratex:[
    {label:'Ã°ÂÂÂ  Dashboard',href:'stratex-dashboard.html'},{label:'Ã°ÂÂÂ Registrations',href:'stratex-registrations.html'},
    {label:'Ã°ÂÂÂ¤ Players',href:'stratex-players.html'},{label:'Ã°ÂÂÂ Scouts',href:'stratex-scouts.html'},
    {label:'Ã°ÂÂÂÃ¯Â¸Â Coaches',href:'stratex-coaches.html'},{label:'Ã°ÂÂÂ Notifications',href:'#',action:'toggleNotifPanel'},
    {label:'Ã¢ÂÂÃ¯Â¸Â Settings',href:'stratex-settings.html'}
  ]
};

function initNav(){
  if(!Auth.isLoggedIn()){window.location.href='login.html';return;}
  var t=Auth.type; var items=NAV_MAP[t]||[];
  var nav=document.getElementById('sidebarNav');
  var cur=window.location.pathname.split('/').pop();
  if(nav) nav.innerHTML=items.map(function(i){return '<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'" '+(i.action?'onclick="'+i.action+'();return false"':'')+'>'+i.label+'</a>';}).join('');
  var u=Auth.user;
  var uel=document.getElementById('sidebarUser');
  if(uel&&u) uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#00E676;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">'+t+'</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}

var viewMode='cards', currentPage=1, debounceTimer;
function debouncedSearch(){clearTimeout(debounceTimer);debounceTimer=setTimeout(loadPlayers,400);}
function setView(mode){
  viewMode=mode;
  document.getElementById('tabCards').className='btn btn-sm '+(mode==='cards'?'btn-outline active-tab':'btn-ghost');
  document.getElementById('tabTable').className='btn btn-sm '+(mode==='table'?'btn-outline active-tab':'btn-ghost');
  loadPlayers();
}

async function loadPlayers(page){
  if(!page) page=1; currentPage=page;
  var search=document.getElementById('searchInput').value;
  var posGroup=document.getElementById('posFilter').value;
  var minAge=document.getElementById('minAge').value;
  var maxAge=document.getElementById('maxAge').value;
  var url='/api/players?page='+page+'&limit=18';
var ageGroup=document.getElementById('ageGroupFilter')?document.getElementById('ageGroupFilter').value:'';
  if(search) url+='&search='+encodeURIComponent(search);
  if(posGroup) url+='&posGroup='+posGroup;
  if(minAge) url+='&minAge='+minAge;
  if(maxAge) url+='&maxAge='+maxAge;
  document.getElementById('resultsContainer').innerHTML='<div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Searching...</span></div>';
  try{
    var d = await api('GET', url);
    var players = d.data||[];
    document.getElementById('resultCount').textContent = (d.total||0) + ' players found';
    if(!players.length){
      document.getElementById('resultsContainer').innerHTML='<div style="text-align:center;padding:48px;color:#546E7A"><p>No players found.</p></div>';
      return;
    }
    if(viewMode==='cards'){
      var html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px">';
      players.forEach(function(p){
        var ov=dispOverall(p.overall_rating); var ovNum=parseFloat(p.overall_rating||0); var ovPct=ovNum>10?ovNum:ovNum*10;
        var ovColor=attrColor(ovPct); var pCol=posColor(p.position_group);
        var keyAttrs=[];
        if(p.position_group==='Forward') keyAttrs=[['Pace',p.pace],['Shooting',p.shooting]];
        else if(p.position_group==='Midfielder') keyAttrs=[['Passing',p.passing],['Stamina',p.stamina]];
        else if(p.position_group==='Defender') keyAttrs=[['Defending',p.defending],['Strength',p.strength]];
        else keyAttrs=[['Reflexes',p.gk_reflexes],['Handling',p.gk_handling]];
        html += '<div class="scout-card" onclick="location.href='player-profile.html?id='+p.id+''">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">' +
            '<div style="display:flex;align-items:center;gap:10px">' +
              '<div class="user-avatar" style="background:'+pCol+';color:'+(pCol==='#FFC107'?'#000':'#fff')+'">'+initials(p.first_name,p.last_name)+'</div>' +
              '<div><div style="font-weight:700">'+p.first_name+' '+p.last_name+'</div>' +
              '<div style="font-size:12px;color:#546E7A">'+(p.specific_position||p.primary_position||'--')+' ÃÂ· '+p.age+' yrs</div></div>' +
            '</div>' +
            '<div style="font-size:22px;font-weight:900;color:'+ovColor+'">'+ov+'</div>' +
          '</div>' +
          keyAttrs.map(function(a){
            var pct=attrPct(a[1]); var col=attrColor(pct);
            return '<div style="display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px">' +
              '<span style="color:#546E7A;width:65px">'+a[0]+'</span>' +
              '<div class="attr-bar-mini" style="flex:1"><div class="attr-bar-fill-mini" style="width:'+pct+'%;background:'+col+'"></div></div>' +
              '<span style="color:'+col+';font-weight:700;width:24px;text-align:right">'+dispAttr(a[1])+'</span>' +
            '</div>';
          }).join('') +
          '<div style="display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid #1e2a3a;font-size:12px">' +
            '<span style="color:#00E676;font-weight:700">'+formatValue(p.transfer_value||0)+'</span>' +
            '<span style="color:#546E7A">'+(p.team_name||'Free Agent')+'</span>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
      document.getElementById('resultsContainer').innerHTML = html;
    } else {
      var thtml = '<div style="overflow-x:auto"><table class="sl-table"><thead><tr>' +
        '<th>Player</th><th>Position</th><th>Age</th><th>Nationality</th><th>Height</th><th>Build</th><th>Overall</th><th>Value</th><th>Club</th><th></th>' +
        '</tr></thead><tbody>';
      players.forEach(function(p){
        var ov=dispOverall(p.overall_rating); var ovNum=parseFloat(p.overall_rating||0); var ovPct=ovNum>10?ovNum:ovNum*10;
        var pCol=posColor(p.position_group);
        thtml += '<tr>' +
          '<td><div style="display:flex;align-items:center;gap:8px">' +
            '<div class="user-avatar" style="width:30px;height:30px;font-size:11px;background:'+pCol+'">'+initials(p.first_name,p.last_name)+'</div>' +
            '<b>'+p.first_name+' '+p.last_name+'</b></div></td>' +
          '<td style="color:'+pCol+';font-weight:600;font-size:12px">'+(p.specific_position||p.primary_position||'--')+'</td>' +
          '<td>'+p.age+'</td>' +
          '<td style="font-size:12px">'+(p.nationality||'England')+'</td>' +
          '<td><span class="badge badge-blue">'+(p.height_category||'--')+'</span></td>' +
          '<td style="font-size:12px">'+(p.build_category||'--')+'</td>' +
          '<td style="font-weight:800;color:'+attrColor(ovPct)+'">'+ov+'</td>' +
          '<td style="color:#00E676;font-weight:700">'+formatValue(p.transfer_value||0)+'</td>' +
          '<td style="font-size:12px;color:#546E7A">'+(p.team_name||'--')+'</td>' +
          '<td><a href="player-profile.html?id='+p.id+'" class="btn btn-sm btn-outline">Scout</a></td>' +
        '</tr>';
      });
      thtml += '</tbody></table></div>';
      document.getElementById('resultsContainer').innerHTML = thtml;
    }
    var totalPages = Math.ceil((d.total||0)/18);
    document.getElementById('pagination').innerHTML = totalPages>1 ?
      Array.from({length:Math.min(totalPages,10)},function(_,i){
        return '<button class="btn btn-sm '+(i+1===page?'btn-primary':'btn-ghost')+'" onclick="loadPlayers('+(i+1)+')">'+(i+1)+'</button>';
      }).join('') : '';
  } catch(e) {
    document.getElementById('resultsContainer').innerHTML='<div style="padding:24px;color:#f44336">Error: '+e.message+'</div>';
  }
}
document.addEventListener('DOMContentLoaded', function(){ initNav(); loadPlayers(); });
</script>
<script src="../js/mobile.js"></script>
</body></html>
