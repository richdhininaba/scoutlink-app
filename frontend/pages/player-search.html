:root{--bg:#0d1117;--card:#161b22;--accent:#1d9e75;--text:#ffffff;--text-secondary:#8b949e;--border:#30363d;}
.scout-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.scout-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(29,158,117,.1);}
.scout-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#17a2b8);}
.attr-bar-mini{height:5px;background:#21262d;border-radius:3px;overflow:hidden;margin-top:3px;}
.attr-bar-fill-mini{height:100%;border-radius:3px;}
.filter-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;}
.btn{padding:8px 16px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#17856a;}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
.btn-sm{padding:6px 12px;font-size:13px;}
.active-tab{background:rgba(29,158,117,0.1) !important;border-color:var(--accent) !important;color:var(--accent) !important;}
.sl-table{width:100%;border-collapse:collapse;}
.sl-table th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-secondary);border-bottom:1px solid var(--border);}
.sl-table td{padding:12px;border-bottom:1px solid var(--border);font-size:14px;}
.sl-table tr:hover td{background:rgba(255,255,255,0.02);}
.badge-blue{background:rgba(23,130,186,0.2);color:#58a6ff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}

<script>
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
function logout(){if(typeof Auth!=='undefined')Auth.clear();navigateClean('login.html?logout=1');}

function initNav(){
  if(typeof Auth==='undefined'||!Auth.isLoggedIn()||Auth.type!=='Scout'){navigateClean('login.html');return;}
  if(typeof buildScoutNav==='function')buildScoutNav('sidebarNav','Scout');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u){
    var ini=(u.firstName||'?')[0]+(u.lastName||'?')[0];
    uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:var(--accent);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">'+ini.toUpperCase()+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role" style="color:var(--text-secondary);font-size:12px">Scout</div></div></div>';
  }
  if(typeof updateNotifBadge==='function')updateNotifBadge();
}

function dispOverall(v){var n=parseFloat(v);if(isNaN(n))return '--';return Math.round(n>10?n:n*10);}
function dispAttr(v){var n=parseFloat(v);if(isNaN(n))return '--';return (n>10?n/10:n).toFixed(1);}
function attrPct(v){var n=parseFloat(v);if(isNaN(n))return 0;return Math.round(n>10?n:n*10);}
function attrColor(pct){return pct>=80?'#1d9e75':pct>=65?'#FFC107':pct>=50?'#FF9800':'#f85149';}
function posColor(g){return {Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#17a2b8',Forward:'#ff6b35'}[g]||'#1d9e75';}
function formatValue(v){if(!v||v<1000)return '-';if(v>=1000000)return (''+Math.round(v/1000000*10)/10).replace(/\.0$/,'')+'M';return Math.round(v/1000)+'K';}
function initials(f,l){return ((f||'')[0]||(l||'')[0]||'?').toUpperCase()+((l||'')[0]||'').toUpperCase();}
function sentenceCase(v){return String(v||'--').replace(/_/g,' ').toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase();});}
function locationText(p){return p.team_city||p.city||p.location||'--';}
function h(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

var viewMode='table',currentPage=1,debounceTimer,sortMode='compatibility';

function setView(mode){
  viewMode=mode;
  document.getElementById('tabCards').className='btn btn-sm '+(mode==='cards'?'active-tab':'btn-ghost');
  document.getElementById('tabTable').className='btn btn-sm '+(mode==='table'?'active-tab':'btn-ghost');
  loadPlayers(1);
}

function loadPlayers(page){
  if(!page)page=1;currentPage=page;
  var search=document.getElementById('searchInput').value;
  var posGroup=document.getElementById('posFilter').value;
  var minAge=document.getElementById('minAge').value;
  var maxAge=document.getElementById('maxAge').value;
  var city=document.getElementById('locationFilter').value;
  var url='/api/players?page='+page+'&limit=18';
  if(search)url+='&search='+encodeURIComponent(search);
  if(posGroup)url+='&posGroup='+posGroup;
  if(minAge)url+='&minAge='+minAge;
  if(maxAge)url+='&maxAge='+maxAge;
  if(city)url+='&city='+encodeURIComponent(city);
  sortMode=document.getElementById('sortMode')?document.getElementById('sortMode').value:'compatibility';
  url+='&sort='+encodeURIComponent(sortMode);
  document.getElementById('resultsContainer').innerHTML='<div style="display:flex;align-items:center;gap:12px;padding:32px;color:var(--text-secondary)"><div class="spinner"></div><span>Searching...</span></div>';
  if(typeof api!=='function')return;
  api('GET',url).then(function(d){
    var players=sortPlayers(d.data||[],sortMode);
    document.getElementById('resultCount').textContent=(d.total||0)+' players found';
    if(!players.length){
      document.getElementById('resultsContainer').innerHTML='<div style="text-align:center;padding:48px;color:var(--text-secondary)"><p style="font-size:16px;font-weight:600;margin-bottom:8px">No players found</p><p style="font-size:13px">Try adjusting your search filters.</p></div>';
      return;
    }
    renderResults(players,d.total||0,page);
  }).catch(function(e){
    document.getElementById('resultsContainer').innerHTML='<div style="padding:24px;color:#f85149">Error: '+e.message+'</div>';
  });
}

function sortPlayers(players,mode){
  var keyMap={compatibility:'compatibilityScore',overall:'overall_rating',goals:'goals',assists:'assists',appearances:'appearances',clean_sheets:'clean_sheets',value:'transfer_value'};
  return (players||[]).slice().sort(function(a,b){
    if(mode==='newest')return new Date(b.created_at||0)-new Date(a.created_at||0);
    if(mode==='updated')return new Date(b.updated_at||b.created_at||0)-new Date(a.updated_at||a.created_at||0);
    var key=keyMap[mode]||'compatibilityScore';
    return (Number(b[key])||0)-(Number(a[key])||0);
  });
}

function loadLocations(){
  api('GET','/api/players/locations').then(function(d){
    var sel=document.getElementById('locationFilter');
    var current=sel.value;
    sel.innerHTML='<option value="">All Locations</option>'+(d.data||[]).map(function(city){return '<option value="'+city+'">'+city+'</option>';}).join('');
    sel.value=current;
  }).catch(function(){});
}
</script><script>
function renderResults(players,total,page){
  if(window.isScoutLinkPhone && window.isScoutLinkPhone() && viewMode==='table'){
    var list='<div class="phone-list-results">';
    players.forEach(function(p){
      var ov=dispOverall(p.overall_rating);
      var ovNum=parseFloat(p.overall_rating||0);
      var ovPct=ovNum>10?ovNum:ovNum*10;
      var pCol=posColor(p.position_group);
      var name=((p.first_name||'')+' '+(p.last_name||'')).trim()||'Player';
      var pos=p.specific_position||p.primary_position||'--';
      var age=p.age||'--';
      var comp=Math.round(p.compatibilityScore||0);
      var compColor=attrColor(comp);
      list+='<article class="phone-list-row">'+
        (window.playerAvatarMarkup?window.playerAvatarMarkup(p,38):'<div class="phone-player-avatar" style="background:'+pCol+';color:'+(pCol==='#FFC107'?'#111827':'#fff')+'">'+h(initials(p.first_name,p.last_name))+'</div>')+
        '<div class="phone-list-main"><h4>'+h(name)+'</h4><p>'+h(pos)+' - '+h(age)+' yrs - '+h(locationText(p))+'</p></div>'+
        '<div class="phone-list-score" style="color:'+compColor+'">'+h(comp)+'%</div>'+
        '<div class="phone-list-meta"><small>Overall '+h(ov)+'/100 - '+h(formatValue(p.transfer_value||0))+' - '+h(p.team_name||'Free Agent')+'</small><a href="player-profile.html?id='+p.id+'" class="btn btn-sm btn-outline">View profile</a></div>'+
      '</article>';
    });
    list+='</div>';
    document.getElementById('resultsContainer').innerHTML=list;
    var totalPages=Math.ceil(total/18);
    document.getElementById('pagination').innerHTML=totalPages>1?Array.from({length:Math.min(totalPages,10)},function(_,i){return '<button class="btn btn-sm '+(i+1===page?'btn-primary':'btn-ghost')+'" data-page="'+(i+1)+'">'+(i+1)+'</button>';}).join(''):'';
    return;
  }
  if(viewMode==='cards'){
    var html='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px">';
    players.forEach(function(p){
      var ov=dispOverall(p.overall_rating);
      var ovNum=parseFloat(p.overall_rating||0);
      var ovPct=ovNum>10?ovNum:ovNum*10;
      var ovColor=attrColor(ovPct);
      var pCol=posColor(p.position_group);
      var keyAttrs=[];
      if(p.position_group==='Forward')keyAttrs=[['Pace',p.pace],['Shooting',p.shooting]];
      else if(p.position_group==='Midfielder')keyAttrs=[['Passing',p.passing],['Stamina',p.stamina]];
      else if(p.position_group==='Defender')keyAttrs=[['Defending',p.defending],['Strength',p.strength]];
      else keyAttrs=[['Composure',p.composure],['Jumping',p.jumping]];
      html+='<div class="scout-card" data-pid="'+p.id+'">';
      html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">';
      html+='<div style="display:flex;align-items:center;gap:10px">';
      html+=(window.playerAvatarMarkup?window.playerAvatarMarkup(p,38):'<div style="width:38px;height:38px;border-radius:50%;background:'+pCol+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:'+(pCol==='#FFC107'?'#000':'#fff')+'">'+initials(p.first_name,p.last_name)+'</div>');
      html+='<div><div style="font-weight:700;font-size:14px">'+p.first_name+' '+p.last_name+'</div>';
      html+='<div style="font-size:12px;color:var(--text-secondary)">'+(p.specific_position||p.primary_position||'--')+' &middot; '+(p.age||'--')+' yrs &middot; '+locationText(p)+'</div></div></div>';
      var comp=Math.round(p.compatibilityScore||0);
      html+='<div style="text-align:right"><div style="font-size:24px;font-weight:900;color:'+attrColor(comp)+'">'+comp+'%</div><small style="color:var(--text-secondary);font-size:10px;text-transform:uppercase;font-weight:800">Compatibility</small></div></div>';
      keyAttrs.forEach(function(a){
        var pct=attrPct(a[1]);var col=attrColor(pct);
        html+='<div style="display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px">';
        html+='<span style="color:var(--text-secondary);width:65px">'+a[0]+'</span>';
        html+='<div class="attr-bar-mini" style="flex:1"><div class="attr-bar-fill-mini" style="width:'+pct+'%;background:'+col+'"></div></div>';
        html+='<span style="color:'+col+';font-weight:700;width:24px;text-align:right">'+dispAttr(a[1])+'</span></div>';
      });
      html+='<div style="display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:12px">';
      html+='<span style="color:var(--accent);font-weight:700">'+formatValue(p.transfer_value||0)+'</span>';
      html+='<span style="color:var(--text-secondary)">'+(p.team_name||'Free Agent')+'</span></div>';
      html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span style="font-size:12px;color:var(--text-secondary);font-weight:800">Overall '+ov+'/100</span><a href="player-profile.html?id='+p.id+'" class="btn btn-sm btn-outline" onclick="event.stopPropagation()">VIEW PROFILE</a></div></div>';
    });
    html+='</div>';
    document.getElementById('resultsContainer').innerHTML=html;
  } else {
    var thtml='<div style="overflow-x:auto"><table class="sl-table"><thead><tr>';
    thtml+='<th>Player</th><th>Position</th><th>Age</th><th>Location</th><th>Height</th><th>Build</th><th>Club</th><th>Compatibility</th><th>Overall rating</th><th></th>';
    thtml+='</tr></thead><tbody>';
    players.forEach(function(p){
      var ov=dispOverall(p.overall_rating);
      var ovNum=parseFloat(p.overall_rating||0);
      var ovPct=ovNum>10?ovNum:ovNum*10;
      var pCol=posColor(p.position_group);
      thtml+='<tr>';
      thtml+='<td><div style="display:flex;align-items:center;gap:8px">'+(window.playerAvatarMarkup?window.playerAvatarMarkup(p,30):'<div style="width:30px;height:30px;border-radius:50%;background:'+pCol+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:'+(pCol==='#FFC107'?'#000':'#fff')+'">'+initials(p.first_name,p.last_name)+'</div>')+'<b>'+p.first_name+' '+p.last_name+'</b></div></td>';
      thtml+='<td style="color:'+pCol+';font-weight:600;font-size:12px">'+(p.specific_position||p.primary_position||'--')+'</td>';
      thtml+='<td>'+p.age+'</td>';
      thtml+='<td style="font-size:12px">'+locationText(p)+'</td>';
      thtml+='<td><span class="badge-blue">'+sentenceCase(p.height_category)+'</span></td>';
      thtml+='<td style="font-size:12px">'+sentenceCase(p.build_category)+'</td>';
      thtml+='<td style="font-size:12px;color:var(--text-secondary)">'+(p.team_name||'--')+'</td>';
      thtml+='<td style="color:#FFC107;font-weight:800">'+Math.round(p.compatibilityScore||0)+'%</td>';
      thtml+='<td style="font-weight:800;color:'+attrColor(ovPct)+'">'+ov+'</td>';
      thtml+='<td><a href="player-profile.html?id='+p.id+'" class="btn btn-sm btn-outline" style="text-decoration:none">VIEW PROFILE</a></td>';
      thtml+='</tr>';
    });
    thtml+='</tbody></table></div>';
    document.getElementById('resultsContainer').innerHTML=thtml;
  }
  var totalPages=Math.ceil(total/18);
  if(totalPages>1){
    document.getElementById('pagination').innerHTML=Array.from({length:Math.min(totalPages,10)},function(_,i){
      return '<button class="btn btn-sm '+(i+1===page?'btn-primary':'btn-ghost')+'" data-page="'+(i+1)+'">'+(i+1)+'</button>';
    }).join('');
  } else {
    document.getElementById('pagination').innerHTML='';
  }
}

document.addEventListener('DOMContentLoaded',function(){

  loadLocations();loadPlayers(1);

  document.getElementById('logoutBtn').addEventListener('click',logout);

  document.getElementById('locationFilter').addEventListener('change',function(){loadPlayers(1);});

  });
