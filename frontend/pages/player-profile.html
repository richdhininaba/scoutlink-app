<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Player Profile - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.profile-hero{background:linear-gradient(135deg,var(--bg2) 0%,#111827 100%);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px;position:relative;overflow:hidden;}
.profile-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#1d9e75,#00BCD4,#2979FF);}
.attr-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.attr-label{font-size:12px;color:var(--text3);width:88px;flex-shrink:0;text-transform:capitalize;}
.attr-num{font-size:13px;font-weight:700;width:28px;text-align:right;}
.attr-bar-wrap{flex:1;height:6px;background:#1e2a3a;border-radius:3px;overflow:hidden;}
.attr-bar-inner{height:100%;border-radius:3px;transition:width .4s ease;}
.stat-box{background:#0a0f1e;border-radius:8px;padding:12px;text-align:center;}
.stat-num{font-size:22px;font-weight:800;}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:2px;}
.match-row{padding:10px 12px;background:#0a0f1e;border-radius:8px;margin-bottom:6px;}
.compat-bar-row{margin-bottom:10px;}
.compat-bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
.compat-bar-bg{height:8px;background:#1e2a3a;border-radius:4px;overflow:hidden;}
.compat-bar-fill{height:100%;border-radius:4px;}
.section-heading{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;}
.action-btn{min-height:40px;padding:8px 14px;font-size:13px;}
.video-card{background:#0a0f1e;border:1px solid var(--border);border-radius:10px;padding:14px;}
.prediction-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
.overall-gauge{text-align:center;padding:28px 20px;background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:14px;margin-bottom:20px}
.gauge-ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;border:6px solid;}
.gauge-score{font-size:40px;font-weight:900;line-height:1}
.gauge-desc-lbl{font-size:11px;color:var(--text-secondary,#8b949e);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.gauge-desc-val{font-size:15px;font-weight:700}
.stats-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-box{background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:10px;padding:14px;text-align:center}
.stat-val{font-size:22px;font-weight:800}
.stat-lbl{font-size:11px;color:var(--text-secondary,#8b949e);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.attr-details summary{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;font-size:14px;font-weight:700;color:var(--text,#fff);background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:10px;list-style:none}
.attr-details summary::-webkit-details-marker{display:none}
.attr-details[open] summary{border-radius:10px 10px 0 0;border-bottom-color:transparent}
.attr-details .attr-inner{background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-top:none;border-radius:0 0 10px 10px;padding:16px 18px;margin-bottom:20px}
.fixture-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#0a0f1e;border-radius:8px;margin-bottom:8px;gap:10px;flex-wrap:wrap;}
.fixture-date{font-size:12px;color:#8b949e;min-width:80px;}
.fixture-opponent{font-size:14px;font-weight:600;flex:1;}
.fixture-venue{font-size:12px;color:#8b949e;}
.pred-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border,#30363d);background:transparent;color:#8b949e;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;}
.pred-btn.active{background:#1d9e75;color:#000;border-color:#1d9e75;}
.pred-btn:hover:not(.active){border-color:#1d9e75;color:#1d9e75;}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Scout<span style="color:#1d9e75">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title" id="profileTitle">Player Profile</span>
<div class="topbar-right">
<a href="javascript:history.back()" class="btn btn-sm btn-outline action-btn">&#8592; Back</a>
<button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost desktop-signout" onclick="logout()">Sign Out</button>
</div>
</div>
<div class="page-content" id="profileContent">
<div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Loading player profile...</span></div>
</div>
</div>
</div>
<div class="notif-panel" id="notifPanel">
<div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">&#10005;</button></div>
<div class="notif-list" id="notifList"></div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>

// ===================== HELPERS =====================
function safe(v){return v!=null&&v!==undefined&&v!=='null'&&v!=='undefined'?String(v):'--';}
function dOv(v){var n=parseFloat(v);if(isNaN(n))return '--';return(n>10?n/10:n).toFixed(1);}
function dAttr(v){var n=parseFloat(v);if(isNaN(n))return '--';return(n>10?n/10:n).toFixed(1);}
function aPct(v){var n=parseFloat(v);if(isNaN(n))return 0;return Math.min(100,Math.round(n>10?n:n*10));}
function aColor(p){return p>=70?'#1d9e75':p>=50?'#FFC107':'#f44336';}
function cColor(s){return s>=80?'#1d9e75':s>=65?'#FFC107':s>=50?'#FF9800':'#f44336';}
function pColor(g){return{Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#00BCD4',Forward:'#FF5722'}[g]||'#1d9e75';}
function confLabel(apps){var n=parseInt(apps)||0;if(n===0)return{label:'Very Low',color:'#f44336'};if(n<=4)return{label:'Low',color:'#FF9800'};if(n<=9)return{label:'Medium',color:'#FFC107'};if(n<=19)return{label:'High',color:'#00BCD4'};return{label:'Very High',color:'#1d9e75'};}
function attrLabel(k){var m={pace:'Pace',agility:'Agility',strength:'Strength',stamina:'Stamina',jumping:'Jumping',composure:'Composure',shooting:'Shooting',passing:'Passing',dribbling:'Dribbling',defending:'Defending',crossing:'Crossing',vision:'Vision',positioning:'Positioning',heading:'Heading',tackling:'Tackling',gk_diving:'Diving',gk_reflexes:'Reflexes',gk_handling:'Handling',gk_positioning:'GK Positioning',gk_kicking:'Kicking',gk_distribution:'Distribution',gk_communication:'Communication',gk_sweeping:'Sweeping'};return m[k]||k;}
function buildAttrBar(label,val){var n=parseFloat(val);var pct=isNaN(n)?0:Math.min(100,Math.round(n>10?n:n*10));var col=pct>=70?'#1d9e75':pct>=50?'#FFC107':'#f44336';return '<div class="attr-row"><span class="attr-label">'+label+'</span><div class="attr-bar-wrap"><div class="attr-bar-inner" style="width:'+pct+'%;background:'+col+'"></div></div><span class="attr-num" style="color:'+col+'">'+((!isNaN(n))?(n>10?n/10:n).toFixed(1):'--')+'</span></div>';}
function statBadge(label,val){return '<div class="stat-box"><div class="stat-num">'+val+'</div><div class="stat-lbl">'+label+'</div></div>';}

function initNav(){
if(!Auth.isLoggedIn()){window.location.href='login.html';return;}
var role=Auth.type;
if(role==='Scout'||role==='Coach'){if(typeof buildScoutNav==='function')buildScoutNav('sidebarNav',role);}
else{var nav=document.getElementById('sidebarNav');if(nav)nav.innerHTML='<a class="nav-item" href="stratex-dashboard.html">Dashboard</a>';}
var u=Auth.user,uel=document.getElementById('sidebarUser');
if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#1d9e75;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">'+role+'</div></div></div>';
updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}

// ===================== REGISTER INTEREST =====================
var _interestsRemaining = 200;
var _alreadyInPipeline = false;

function registerInterest(playerId){
var btn=document.getElementById('btnInterest');
if(!btn)return;
if(_alreadyInPipeline){return;}
if(_interestsRemaining<=0){
alert('You have used all your interests for this plan. Please upgrade to add more players to your pipeline.');
return;
}
btn.disabled=true;btn.textContent='Adding...';
api('POST','/api/players/'+playerId+'/scout-interest',{interestLevel:7}).then(function(r){
if(r.alreadyInPipeline){
_alreadyInPipeline=true;
btn.textContent='In Pipeline';btn.style.background='#1d9e75';btn.style.color='#000';btn.disabled=false;
}else{
_alreadyInPipeline=true;
_interestsRemaining=r.interestsRemaining||(_interestsRemaining-1);
btn.textContent='Added to Pipeline â';btn.style.background='#1d9e75';btn.style.color='#000';btn.disabled=true;
var rem=document.getElementById('interestsRemainingCount');
if(rem){rem.textContent=_interestsRemaining+' interests remaining';}
}
}).catch(function(e){
btn.disabled=false;btn.textContent='+ Register Interest';
if(e.message&&e.message.indexOf('402')>=0){alert('You have used all your interests. Upgrade to add more.');}
else{alert('Could not add to pipeline: '+(e.message||'Error'));}
});
}

function exportProfile(playerId){
var btn=document.getElementById('btnExport');
if(btn){btn.disabled=true;btn.textContent='Exporting...';}
setTimeout(function(){if(btn){btn.disabled=false;btn.textContent='Export Profile';}alert('PDF export coming soon.');},800);
}
function scrollToVideos(){var el=document.getElementById('videoSection');if(el)el.scrollIntoView({behavior:'smooth'});}

// ===================== COMPATIBILITY =====================
function showCompatBreakdown(playerId){
var el=document.getElementById('compatBreakdown');
if(!el)return;
el.innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
api('POST','/api/players/'+playerId+'/analyse',{}).then(function(r){
var b=r.compatibilityBreakdown||{};var score=Math.round(r.compatibilityScore||0);var sColor=cColor(score);
var breakdown=[
{label:'Team Weakness Fit (40%)',val:Math.round(b.weaknessFit||50),color:'#1d9e75'},
{label:'Role Expectation Fit (20%)',val:Math.round(b.roleFit||50),color:'#00BCD4'},
{label:'Playing Style Fit (20%)',val:Math.round(b.styleFit||50),color:'#42A5F5'},
{label:'Formation Fit (10%)',val:Math.round(b.formationFit||50),color:'#FFC107'},
{label:'Long-Term Goals Fit (10%)',val:Math.round(b.goalsFit||50),color:'#FF9800'},
];
var barsHtml=breakdown.map(function(bd){return '<div class="compat-bar-row"><div class="compat-bar-label"><span style="color:var(--text2)">'+bd.label+'</span><span style="font-weight:700;color:'+bd.color+'">'+bd.val+'</span></div><div class="compat-bar-bg"><div class="compat-bar-fill" style="width:'+bd.val+'%;background:'+bd.color+'"></div></div></div>';}).join('');
var apps=parseInt(b.appearances||0);var conf=confLabel(apps);
el.innerHTML='<div class="table-card"><div class="table-header"><h3>Compatibility Breakdown</h3><span style="font-size:32px;font-weight:900;color:'+sColor+'">'+score+'</span></div><div style="padding:20px">'+barsHtml+'<div style="margin-top:14px;padding:12px;background:#0a0f1e;border-radius:8px;font-size:12px;color:var(--text2)"><strong>Confidence:</strong> <span style="color:'+conf.color+'">'+conf.label+'</span> &mdash; Based on '+apps+' appearance'+(apps!==1?'s':'')+'.</div></div></div>';
}).catch(function(e){el.innerHTML='<div style="padding:16px;color:var(--text3)">Compatibility breakdown unavailable: '+e.message+'</div>';});
}

// ===================== PREDICTIONS =====================
var PRED_TYPE_MAP = {
'attribute_trajectory': 'Attribute trajectory',
'maturation_flag': 'Maturation and relative age risk',
'positional_ceiling': 'Positional ceiling estimate',
'scenario_simulation': 'Match scenario simulation',
'value_trajectory': 'Transfer value trajectory',
'consistency_score': 'Consistency and reliability score'
};
function runPrediction(playerId, predType){
var res=document.getElementById('predResultArea');
if(!res)return;
res.innerHTML='<div style="color:#8b949e;padding:10px">Analysing...</div>';
document.querySelectorAll('.pred-btn').forEach(function(b){b.classList.remove('active');});
var activeBtn=document.querySelector('.pred-btn[data-pred-type="'+predType+'"]');
if(activeBtn)activeBtn.classList.add('active');
var backendType=PRED_TYPE_MAP[predType]||predType;
api('POST','/api/predictions/run',{playerId:playerId,predictionType:backendType}).then(function(r){
var result=r.result||r||{};
var html='<div style="background:#0d1117;border-radius:8px;padding:16px;margin-top:8px">';
if(predType==='maturation_flag'){
html+='<p style="font-size:13px;color:#B0BEC5;line-height:1.6">'+(result.quarterMessage||result.message||'Analysis complete.')+'</p>';
if(result.maturationWarning)html+='<p style="color:#FF9800;font-size:12px;margin-top:8px">'+result.maturationWarning+'</p>';
if(result.birthQuarter)html+='<p style="font-size:12px;color:#8b949e;margin-top:8px">Birth quarter: <b style="color:#fff">'+result.birthQuarter+' ('+result.quarterLabel+')</b></p>';
}else if(predType==='positional_ceiling'){
html+='<p style="font-size:13px;color:#B0BEC5;line-height:1.6">'+(result.ceiling||result.message||'Analysis complete.')+'</p>';
if(result.reliabilityNote)html+='<p style="color:#FF9800;font-size:12px;margin-top:8px">'+result.reliabilityNote+'</p>';
html+='<p style="font-size:12px;color:#8b949e;margin-top:8px">Overall: <b style="color:#1d9e75">'+(result.overallRating||'--')+'</b> • Appearances: <b>'+(result.appearances||0)+'</b></p>';
}else if(predType==='consistency_score'){
if(result.insufficient){html+='<p style="font-size:13px;color:#FF9800">'+result.message+'</p>';}
else{html+='<p style="font-size:13px;color:#B0BEC5;line-height:1.6">'+(result.message||result.label||'Analysis complete.')+'</p><p style="font-size:12px;color:#8b949e;margin-top:8px">Avg std dev: <b>'+(result.avgStdDev||'--')+'</b> • Matches analysed: <b>'+(result.matchesAnalysed||0)+'</b></p>';}
}else if(predType==='attribute_trajectory'){
if(result.currentOverall)html+='<div style="margin-bottom:8px;font-size:13px;color:#8b949e">Current overall: <b style="color:#1d9e75">'+result.currentOverall+'</b> | Focus: <b style="color:#fff">'+(result.trainingFocus||'Balanced')+'</b></div>';
if(result.trajectory&&result.trajectory.length){html+=result.trajectory.map(function(y){return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1e2a3a;font-size:13px"><span style="color:#8b949e">Year '+y.year+'</span><span>Low: <b style="color:#FFC107">'+y.overallLow+'</b> — High: <b style="color:#1d9e75">'+y.overallHigh+'</b></span></div>';}).join('');}
if(result.lowConfidenceWarning)html+='<p style="color:#FF9800;font-size:12px;margin-top:8px">'+result.lowConfidenceWarning+'</p>';
}else if(predType==='value_trajectory'){
if(result.currentValue)html+='<div style="margin-bottom:8px;font-size:13px;color:#8b949e">Current value: <b style="color:#1d9e75">'+result.currentValue+'</b></div>';
if(result.trajectory&&result.trajectory.length){html+=result.trajectory.map(function(y){return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1e2a3a;font-size:13px"><span style="color:#8b949e">Year '+y.year+'</span><span>Low: <b style="color:#FFC107">'+(y.projectedLow||'--')+'</b> — High: <b style="color:#1d9e75">'+(y.projectedHigh||'--')+'</b></span></div>';}).join('');}
if(result.note)html+='<p style="color:#8b949e;font-size:12px;margin-top:8px">'+result.note+'</p>';
}else if(predType==='scenario_simulation'){
html+='<div style="padding:8px 0;border-bottom:1px solid #1e2a3a;font-size:13px;display:flex;justify-content:space-between"><span style="color:#8b949e">Baseline compatibility</span><b style="color:#fff">'+(result.baselineCompatibility||'--')+'</b></div>';
html+='<div style="padding:8px 0;border-bottom:1px solid #1e2a3a;font-size:13px;display:flex;justify-content:space-between"><span style="color:#8b949e">Simulated ('+(result.opponentStrength||'Similar')+')</span><b style="color:#1d9e75">'+(result.simulatedCompatibility||'--')+'</b></div>';
if(result.delta!==undefined)html+='<div style="padding:8px 0;font-size:13px">Delta: <b style="color:'+(result.delta>=0?'#1d9e75':'#f44336')+'">'+(result.deltaLabel||result.delta)+'</b></div>';
if(result.note)html+='<p style="color:#8b949e;font-size:12px;margin-top:8px">'+result.note+'</p>';
}else{html+='<p style="font-size:13px;color:#B0BEC5">'+JSON.stringify(result).substring(0,500)+'</p>';}
html+='</div>';
res.innerHTML=html;
if(typeof r.creditsRemaining==='number'){var el2=document.getElementById('predCredits');if(el2)el2.textContent=r.creditsRemaining+' prediction credits remaining';}
}).catch(function(err){res.innerHTML='<p style="color:#f44336;font-size:13px">Could not run prediction: '+(err&&err.message||'Error')+'</p>';});
}

// ===================== MAIN LOAD =====================
document.addEventListener('DOMContentLoaded',function(){
initNav();
var params=new URLSearchParams(window.location.search);
var playerId=params.get('id');
if(!playerId){
document.getElementById('profileContent').innerHTML='<div style="text-align:center;padding:48px;color:var(--text3)">No player ID specified. <a href="player-search.html" class="btn btn-primary" style="margin-top:14px;display:inline-block">Browse Players</a></div>';
return;
}

api('GET','/api/players/'+playerId).then(function(d){
if(!d||!d.player){throw new Error('Player not found');}
var p=d.player;
var matches=d.recentMatches||[];
var videos=d.videos||[];
var fixtures=d.upcomingFixtures||[];
var pipelineStatus=d.pipelineStatus||null;
var interestsRem=typeof d.interestsRemaining==='number'?d.interestsRemaining:200;
_interestsRemaining=interestsRem;
_alreadyInPipeline=!!pipelineStatus;

document.getElementById('profileTitle').textContent=(p.first_name||'')+' '+(p.last_name||'');

// Age out warning
var ageOutBanner='';
if(p.date_of_birth){
var dob=new Date(p.date_of_birth);var today=new Date();
var next17=new Date(dob);next17.setFullYear(today.getFullYear());
if(next17<today)next17.setFullYear(today.getFullYear()+1);
var turnsAge=next17.getFullYear()-dob.getFullYear();
if(turnsAge===17){var daysUntil=Math.ceil((next17-today)/(1000*60*60*24));
if(daysUntil<=30)ageOutBanner='<div style="background:rgba(255,152,0,.15);border:1px solid #FF9800;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px"><span style="font-size:20px">&#9888;</span><div><div style="font-weight:700;color:#FF9800">Age Out Warning</div><div style="font-size:13px;color:#E2E8F0">This player turns 17 in <strong>'+daysUntil+' day'+(daysUntil===1?'':'s')+'</strong> and will age out of the platform.</div></div></div>';
}}

// Overall
var ovNum=parseFloat(p.overall_rating||0);
var ov100=ovNum>10?Math.round(ovNum):Math.round(ovNum*10);
var ovColor=ov100>=90?'#7ee8a2':ov100>=80?'#1d9e75':ov100>=70?'#FFC107':ov100>=55?'#FF9800':'#f85149';
var descs=[[90,'Elite grassroots'],[80,'Excellent'],[70,'Strong'],[55,'Promising'],[40,'Emerging'],[0,'Developing']];
var ovDesc=(descs.find(function(d2){return ov100>=d2[0];})||descs[descs.length-1])[1];

// Stats
var apps=parseInt(p.appearances)||0;
var goals=parseInt(p.goals)||0;
var assts=parseInt(p.assists)||0;
var cs=parseInt(p.clean_sheets)||0;
var yc=parseInt(p.yellow_cards)||0;
var rc=parseInt(p.red_cards)||0;
var gpg=apps>0?(goals/apps).toFixed(2):'-';
var apg=apps>0?(assts/apps).toFixed(2):'-';
var cspg=apps>0?(cs/apps).toFixed(2):'-';

// Position
var isGK=(p.position_group||'').toLowerCase()==='goalkeeper';
var outfieldAttrs=['pace','agility','strength','stamina','shooting','passing','dribbling','defending','composure','crossing','vision','positioning','heading','tackling','jumping'];
var gkAttrs=['gk_diving','gk_reflexes','gk_handling','gk_positioning','gk_kicking','gk_distribution','gk_communication','gk_sweeping'];
var attrsToShow=isGK?gkAttrs:outfieldAttrs;

// Build attribute HTML - full list
var attrRows='';
attrsToShow.forEach(function(a){
var val=p[a];var display=dAttr(val);var pct=aPct(val);var col=aColor(pct);
attrRows+='<div class="attr-row"><span class="attr-label">'+attrLabel(a)+'</span><div class="attr-bar-wrap"><div class="attr-bar-inner" style="width:'+pct+'%;background:'+col+'"></div></div><span class="attr-num" style="color:'+col+'">'+display+'</span></div>';
});

// Action buttons
var actionBtns='';
if(Auth.type==='Scout'){
var btnLabel=_alreadyInPipeline?'In Pipeline':'+ Register Interest';
var btnStyle=_alreadyInPipeline?'background:#1d9e75;color:#000;':'';
actionBtns='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center">'+
'<button id="btnInterest" class="btn btn-primary action-btn" style="'+btnStyle+'" '+((_alreadyInPipeline)?'disabled':'')+'>'+btnLabel+'</button>'+
'<button id="btnExport" class="btn btn-outline action-btn">Export Profile</button>'+
'<button class="btn btn-outline action-btn" onclick="scrollToVideos()">&#9654; Watch Videos</button>'+
'<span id="interestsRemainingCount" style="font-size:12px;color:#8b949e;margin-left:4px">'+interestsRem+' interests remaining</span>'+
'</div>';
}

// Match facts
var matchHtml='';
if(matches.length){
matchHtml=matches.slice(0,5).map(function(m){
var perf=parseInt(m.performance_score||50);var pCol2=cColor(perf);
return '<div class="match-row"><div style="display:flex;align-items:center;gap:10px">'+
'<div style="width:36px;height:36px;border-radius:50%;background:'+pCol2+'22;color:'+pCol2+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">'+perf+'</div>'+
'<div style="flex:1"><div style="font-size:13px;font-weight:600">'+(m.opponent_name||m.opponent||'Unknown Opponent')+'</div>'+
'<div style="font-size:11px;color:var(--text3)">'+(m.competition||m.format||'Match')+' &middot; '+(m.match_date?m.match_date.slice(0,10):'--')+'</div></div>'+
'<div style="text-align:right;font-size:12px;min-width:60px">'+
'<span style="color:#1d9e75;font-weight:700">'+(m.goals_scored||m.goals||0)+'G</span> '+
'<span style="color:#42A5F5;font-weight:700">'+(m.assists||0)+'A</span>'+
(m.yellow_card||m.yellow_cards?'<span style="color:#FFC107;margin-left:4px">Y</span>':'')+
(m.red_card||m.red_cards?'<span style="color:#f44336;margin-left:4px">R</span>':'')+
'</div></div></div>';
}).join('');
}else{matchHtml='<div style="text-align:center;padding:20px;color:#8b949e;font-size:13px">No match facts recorded yet for this player.</div>';}

// Upcoming fixtures
var fixtureHtml='';
if(fixtures.length){
fixtureHtml=fixtures.map(function(fx){
var fdate=fx.fixture_date?new Date(fx.fixture_date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'TBC';
var home=fx.home_or_away==='Home'?'H':'A';
var homeColor=home==='H'?'#1d9e75':'#FF9800';
return '<div class="fixture-row">'+
'<span class="fixture-date">'+fdate+'</span>'+
'<span class="fixture-opponent" style="font-size:14px;font-weight:600">'+(fx.home_or_away==='Home'?'vs ':'@ ')+safe(fx.opponent)+'</span>'+
'<span style="background:'+homeColor+'22;color:'+homeColor+';border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700">'+home+'</span>'+
'<span class="fixture-venue">'+(fx.venue||fx.format||'')+'</span>'+
'</div>';
}).join('');
}else{fixtureHtml='<div style="text-align:center;padding:20px;color:#8b949e;font-size:13px">No upcoming fixtures scheduled.</div>';}

// Videos
var videoHtml='';
if(videos.length){
videoHtml=videos.map(function(v){
var url=v.video_url||v.url||'#';
return '<div class="video-card">'+
'<div style="font-weight:600;font-size:13px;margin-bottom:4px">'+(v.title||'Video')+'</div>'+
'<div style="font-size:12px;color:var(--text3);margin-bottom:8px">'+(v.category||'Highlight')+' &middot; '+(v.description||'')+'</div>'+
'<a href="'+url+'" target="_blank" class="btn btn-sm btn-outline" style="min-height:36px">&#9654; Watch</a>'+
'</div>';
}).join('');
}else{videoHtml='<div style="text-align:center;padding:32px;color:var(--text3)">No video reels uploaded yet.</div>';}

// Transfer value
var tvHtml='<div style="font-size:24px;font-weight:900;color:#1d9e75">'+(p.transfer_value&&p.transfer_value>0?'\u00A3'+Number(p.transfer_value).toLocaleString('en-GB',{maximumFractionDigits:0}):'Calculating...')+'</div>';

// ===================== RENDER =====================
document.getElementById('profileContent').innerHTML=
ageOutBanner+
// Hero card
'<div class="profile-card" style="background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:14px;padding:24px;margin-bottom:20px">'+
'<div style="display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap">'+
'<div class="user-avatar" style="width:72px;height:72px;border-radius:50%;background:#1d9e75;color:#000;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0">'+initials(p.first_name,p.last_name)+'</div>'+
'<div style="flex:1;min-width:180px">'+
'<h2 style="font-size:22px;font-weight:800;margin:0 0 4px">'+safe(p.first_name)+' '+safe(p.last_name)+'</h2>'+
'<div style="font-size:14px;color:#8b949e;margin-bottom:8px">'+safe(p.specific_position||p.primary_position)+' &bull; '+safe(p.age_group)+' &bull; '+safe(p.team_name)+'</div>'+
'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">'+
'<span style="background:rgba(29,158,117,.12);color:#1d9e75;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700">Overall: '+ov100+'/100</span>'+
'<span style="background:rgba(29,158,117,.12);color:#1d9e75;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700">'+safe(p.foot)+' foot</span>'+
'<span style="background:rgba(29,158,117,.08);color:#8b949e;border-radius:20px;padding:3px 12px;font-size:12px">'+safe(p.nationality)+'</span>'+
'</div>'+
actionBtns+
'</div>'+
'<div style="text-align:right">'+tvHtml+'<div style="font-size:11px;color:#8b949e">Est. transfer value</div></div>'+
'</div></div>'+

// Overall gauge
'<div class="overall-gauge">'+
'<div class="gauge-desc-lbl">Overall match performance rating</div>'+
'<div class="gauge-ring" style="border-color:'+ovColor+'">'+
'<div><div class="gauge-score" style="color:'+ovColor+'">'+ov100+'</div><div style="font-size:10px;color:#8b949e">/100</div></div>'+
'</div>'+
'<div class="gauge-desc-val" style="color:'+ovColor+'">'+ovDesc+'</div>'+
'</div>'+

// Per-game stats
'<div class="stats-trio" style="margin-bottom:20px">'+
'<div class="stat-box"><div class="stat-val" style="color:#1d9e75">'+gpg+'</div><div class="stat-lbl">Goals per game</div></div>'+
'<div class="stat-box"><div class="stat-val" style="color:#58a6ff">'+apg+'</div><div class="stat-lbl">Assists per game</div></div>'+
'<div class="stat-box"><div class="stat-val" style="color:#FFC107">'+cspg+'</div><div class="stat-lbl">Clean sheets PG</div></div>'+
'</div>'+

// 3-column grid: attributes, stats, physical
'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px">'+
// Attributes card
'<div class="profile-card" style="background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:12px;padding:16px">'+
'<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;font-weight:700">All Attributes</div>'+
attrRows+
'</div>'+
// Stats card
'<div class="profile-card" style="background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:12px;padding:16px">'+
'<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;font-weight:700">Match Statistics</div>'+
'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
statBadge('Appearances',apps)+statBadge('Goals',goals)+statBadge('Assists',assts)+statBadge('Clean Sheets',cs)+
'<div class="stat-box"><div class="stat-num" style="color:#FFC107">'+yc+'</div><div class="stat-lbl">Yellow Cards</div></div>'+
'<div class="stat-box"><div class="stat-num" style="color:#f44336">'+rc+'</div><div class="stat-lbl">Red Cards</div></div>'+
'</div></div>'+
// Physical card
'<div class="profile-card" style="background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:12px;padding:16px">'+
'<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;font-weight:700">Physical Profile</div>'+
'<div style="font-size:13px;color:#e6edf3;margin-bottom:8px">Height: <b>'+safe(p.height_range_cm)+'</b></div>'+
'<div style="font-size:13px;color:#e6edf3;margin-bottom:8px">Build: <b>'+safe(p.build_category)+'</b></div>'+
'<div style="font-size:13px;color:#e6edf3;margin-bottom:8px">Height category: <b>'+safe(p.height_category)+'</b></div>'+
'<div style="font-size:13px;color:#e6edf3;margin-bottom:8px">Nationality: <b>'+safe(p.nationality)+'</b></div>'+
'<div style="font-size:13px;color:#e6edf3">DOB: <b>'+safe(p.date_of_birth?p.date_of_birth.slice(0,10):null)+'</b></div>'+
'</div></div>'+

// Match Facts
'<div id="matchSection" class="profile-card" style="background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:12px;padding:16px;margin-bottom:20px">'+
'<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;font-weight:700">Last 5 Match Facts</div>'+
matchHtml+
'</div>'+

// Upcoming Fixtures
'<div id="fixtureSection" class="profile-card" style="background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:12px;padding:16px;margin-bottom:20px">'+
'<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;font-weight:700">Upcoming Fixtures</div>'+
fixtureHtml+
'</div>'+

// Video Reels
'<div id="videoSection" class="profile-card" style="background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:12px;padding:16px;margin-bottom:20px">'+
'<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;font-weight:700">Video Reels'+(videos.length?' ('+videos.length+')':'')+'</div>'+
(videos.length?'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">'+videoHtml+'</div>':videoHtml)+
'</div>'+

// Compatibility
(Auth.type==='Scout'?
'<div id="compatBreakdown" class="profile-card" style="background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:12px;padding:16px;margin-bottom:20px">'+
'<div style="text-align:center;padding:16px">'+
'<button class="btn btn-outline" id="btnShowCompat" style="min-height:40px">Show Compatibility Analysis</button>'+
'</div></div>':'')+

// Predictions
(Auth.type==='Scout'?
'<div class="profile-card" style="background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:12px;padding:16px;margin-bottom:20px">'+
'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
'<div><div style="font-size:16px;font-weight:700">Prediction analysis</div><div style="font-size:12px;color:#8b949e;margin-top:2px">Evidence-based development predictions</div></div>'+
'<div id="predCredits" style="font-size:12px;color:#8b949e"></div>'+
'</div>'+
'<div style="background:rgba(255,152,0,.06);border:1px solid rgba(255,152,0,.2);border-radius:8px;padding:12px 16px;margin:12px 0;font-size:12px;color:#8b949e;line-height:1.6">Predictions are illustrative estimates based on current coach-entered data. They are not guarantees of development.</div>'+
'<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">'+
'<button class="pred-btn" data-pred-type="attribute_trajectory">Attribute development</button>'+
'<button class="pred-btn" data-pred-type="maturation_flag">Maturation and age risk</button>'+
'<button class="pred-btn" data-pred-type="positional_ceiling">Positional ceiling</button>'+
'<button class="pred-btn" data-pred-type="scenario_simulation">Match scenario simulation</button>'+
'<button class="pred-btn" data-pred-type="value_trajectory">Transfer value trajectory</button>'+
'<button class="pred-btn" data-pred-type="consistency_score">Consistency and reliability</button>'+
'</div>'+
'<div id="predResultArea"><div style="color:#8b949e;font-size:13px;text-align:center;padding:20px">Click a prediction type above to run analysis</div></div>'+
'</div>':'');

// ===================== EVENT LISTENERS =====================
var btnInterest=document.getElementById('btnInterest');
if(btnInterest)btnInterest.addEventListener('click',function(){registerInterest(playerId);});

var btnExport=document.getElementById('btnExport');
if(btnExport)btnExport.addEventListener('click',function(){exportProfile(playerId);});

var btnShowCompat=document.getElementById('btnShowCompat');
if(btnShowCompat)btnShowCompat.addEventListener('click',function(){showCompatBreakdown(playerId);});

// Prediction buttons
document.querySelectorAll('.pred-btn').forEach(function(btn){
btn.addEventListener('click',function(){runPrediction(playerId,btn.getAttribute('data-pred-type'));});
});

// Load prediction credits
if(Auth.type==='Scout'){
api('GET','/api/scouts/profile').then(function(d){
var rem=d&&d.scout&&d.scout.predictions_remaining;
if(typeof rem==='number'){var el2=document.getElementById('predCredits');if(el2)el2.textContent=rem+' prediction credits remaining';}
}).catch(function(){});
}

}).catch(function(e){
document.getElementById('profileContent').innerHTML='<div style="text-align:center;padding:48px;color:var(--text3)"><p>Could not load player profile.</p><p style="font-size:12px;margin-top:8px;color:#f44336">'+e.message+'</p><a href="player-search.html" class="btn btn-outline" style="margin-top:14px">Back to Player Search</a></div>';
console.error('[PlayerProfile]',e);
});
});
</script>
<script src="../js/mobile.js"></script>
</body></html>
