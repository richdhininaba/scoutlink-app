<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Player Profile - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.profile-hero{background:linear-gradient(135deg,#0a0f1e 0%,#111827 100%);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px;position:relative;overflow:hidden;}
.profile-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#00E676,#00BCD4,#2979FF);}
.big-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;}
.attr-section{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.attr-row{display:flex;align-items:center;gap:8px;}
.attr-label{font-size:12px;color:#94a3b8;width:80px;flex-shrink:0;text-transform:capitalize;}
.attr-num{font-size:13px;font-weight:700;width:28px;text-align:right;}
.attr-bar-wrap{flex:1;height:6px;background:#1e2a3a;border-radius:3px;overflow:hidden;}
.attr-bar-inner{height:100%;border-radius:3px;}
.match-row{padding:10px 12px;background:#0a0f1e;border-radius:8px;margin-bottom:6px;}
.perf-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Ã¢ÂÂ¡ Scout<span style="color:#00E676">Link</span></a></div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
  <div class="topbar">
    <span class="topbar-title">Player Profile</span>
    <div class="topbar-right">
      <a href="javascript:history.back()" class="btn btn-sm btn-outline">Ã¢ÂÂ Back</a>
      <button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
      <button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button>
    </div>
  </div>
  <div class="page-content" id="profileContent">
    <div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Loading player profile...</span></div>
  </div>
</div>
</div>
<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">ÃÂ</button></div>
  <div class="notif-list" id="notifList"></div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>
function dispOverall(v){var n=parseFloat(v);if(isNaN(n))return '--';return (n>10?n/10:n).toFixed(1);}
function dispAttr(v){var n=parseFloat(v);if(isNaN(n))return '--';return (n>10?n/10:n).toFixed(1);}
function attrPct(v){var n=parseFloat(v);if(isNaN(n))return 0;return Math.round(n>10?n:n*10);}
function attrColor(pct){return pct>=80?'#00E676':pct>=65?'#FFC107':pct>=50?'#FF9800':'#f44336';}
function compatColor(s){return s>=80?'#00E676':s>=65?'#FFC107':s>=50?'#FF9800':'#f44336';}
function posColor(g){return {Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#00BCD4',Forward:'#FF5722'}[g]||'#00E676';}
var currentRole = (localStorage.getItem('sl_type')||'').toLowerCase();
var NAV_SCOUT=[
  {label:'Ã°ÂÂÂ  Dashboard',href:'scout-dashboard.html'},{label:'Ã°ÂÂÂ Player Search',href:'player-search.html'},
  {label:'Ã°ÂÂÂ My Pipeline',href:'scout-pipeline.html'},{label:'Ã°ÂÂÂ Rankings',href:'scout-rankings.html'},
  {label:'Ã°ÂÂÂ Fixtures',href:'scout-fixtures.html'},{label:'Ã°ÂÂÂ® Predictions',href:'scout-predictions.html'},
  {label:'Ã°ÂÂÂ Exports',href:'scout-exports.html'},{label:'Ã°ÂÂÂ Notifications',href:'#',action:'toggleNotifPanel'},
  {label:'Ã¢ÂÂÃ¯Â¸Â Settings',href:'scout-settings.html'}
];
var NAV_COACH=[
  {label:'Ã°ÂÂÂ  Dashboard',href:'coach-dashboard.html'},{label:'Ã°ÂÂÂ¥ My Players',href:'coach-my-players.html'},
  {label:'Ã¢ÂÂ Add Player',href:'add-player.html'},{label:'Ã°ÂÂÂ Fixtures',href:'coach-fixtures.html'},
  {label:'Ã°ÂÂÂ Notifications',href:'#',action:'toggleNotifPanel'},{label:'Ã¢ÂÂÃ¯Â¸Â Settings',href:'coach-settings.html'}
];
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Scout'){window.location.href='login.html';return;}
  if(typeof buildScoutNav==='function') buildScoutNav('sidebarNav','Scout');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u) uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#00E676;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Scout</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}

document.addEventListener('DOMContentLoaded', async function(){
  initNav();
  var params = new URLSearchParams(window.location.search);
  var playerId = params.get('id');
  if(!playerId){document.getElementById('profileContent').innerHTML='<div style="text-align:center;padding:48px;color:#546E7A">No player specified.</div>';return;}
  try {
    var d = await api('GET', '/api/players/'+playerId);
    var p = d.player;
// Age-out countdown: check if player turns 17 within 30 days
var ageOutBanner = '';
if (p.date_of_birth) {
  var dob = new Date(p.date_of_birth);
  var today = new Date();
  var next17 = new Date(dob);
  next17.setFullYear(today.getFullYear());
  if (next17 < today) next17.setFullYear(today.getFullYear() + 1);
  // Check if this birthday makes them 17
  var turnsAge = today.getFullYear() - dob.getFullYear();
  if (next17 < today) turnsAge++;
  if (turnsAge === 17) {
    var daysUntil = Math.ceil((next17 - today) / (1000*60*60*24));
    if (daysUntil <= 30) {
      ageOutBanner = '<div style="background:rgba(255,152,0,.15);border:1px solid #FF9800;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px"><span style="font-size:20px">â ï¸</span><div><div style="font-weight:700;color:#FF9800">Age Out Warning</div><div style="font-size:13px;color:#E2E8F0">This player turns 17 in <strong>' + daysUntil + ' day' + (daysUntil===1?'':'s') + '</strong> and will age out of the platform.</div></div></div>';
    }
  }
}

    var matches = d.recentMatches||[];
    var videos = d.videos||[];
    var ov = dispOverall(p.overall_rating);
    var ovNum = parseFloat(p.overall_rating||0); var ovPct = ovNum>10?ovNum:ovNum*10;
    var ovColor = compatColor(ovPct);
    var pCol = posColor(p.position_group);

    // Build attributes by position
    var outfieldAttrs = ['pace','agility','strength','stamina','shooting','passing','dribbling','defending','composure','vision','heading','tackling'];
    var gkAttrs = ['gk_diving','gk_reflexes','gk_handling','gk_positioning','gk_kicking','gk_distribution','gk_communication','gk_sweeping'];
    var isGK = (p.position_group||'').toLowerCase()==='goalkeeper';
    var attrsToShow = isGK ? gkAttrs : outfieldAttrs;

    function attrLabel(k){var m={gk_diving:'Diving',gk_reflexes:'Reflexes',gk_handling:'Handling',gk_positioning:'Positioning',gk_kicking:'Kicking',gk_distribution:'Distribution',gk_communication:'Communication',gk_sweeping:'Sweeping'};return m[k]||k.charAt(0).toUpperCase()+k.slice(1);}

    var attrHtml = '<div class="attr-section">';
    attrsToShow.forEach(function(a){
      var val = p[a]; var display = dispAttr(val); var pct = attrPct(val); var col = attrColor(pct);
      attrHtml += '<div class="attr-row"><span class="attr-label">'+attrLabel(a)+'</span>' +
        '<div class="attr-bar-wrap"><div class="attr-bar-inner" style="width:'+pct+'%;background:'+col+'"></div></div>' +
        '<span class="attr-num" style="color:'+col+'">'+display+'</span></div>';
    });
    attrHtml += '</div>';

    var matchHtml = '';
    if(matches.length){
      matchHtml = matches.map(function(m){
        var perf = m.performance_score||50;
        var pCol2 = perf>=80?'#00E676':perf>=60?'#FFC107':'#FF9800';
        return '<div class="match-row"><div style="display:flex;align-items:center;gap:10px">' +
          '<div class="perf-badge" style="background:'+pCol2+'22;color:'+pCol2+'">'+perf+'</div>' +
          '<div style="flex:1"><div style="font-size:13px;font-weight:600">'+(m.opponent_name||'Unknown Opponent')+'</div>' +
          '<div style="font-size:11px;color:#546E7A">'+(m.competition||'Match')+' ÃÂ· '+(m.match_date?m.match_date.slice(0,10):'--')+'</div></div>' +
          '<div style="text-align:right;font-size:12px">' +
            '<span style="color:#00E676;font-weight:700">'+(m.goals||0)+'G</span> ' +
            '<span style="color:#42A5F5;font-weight:700">'+(m.assists||0)+'A</span>' +
          '</div></div></div>';
      }).join('');
    }

    // Scout actions (only for scouts)
    var scoutActions = '';
    if(Auth.type==='Scout'){
      scoutActions = '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">' +
        '<button class="btn btn-primary" onclick="addToPipeline(''+p.id+'')">+ Add to Pipeline</button>' +
        '<button class="btn btn-outline" onclick="showCompatibility(''+p.id+'')">Ã°ÂÂÂ® Analyse Compatibility</button>' +
      '</div>';
    }

    document.getElementById('profileContent').innerHTML =
      '<div class="profile-hero">' +
        '<div style="display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap">' +
          '<div class="big-avatar" style="background:'+pCol+';color:'+(pCol==='#FFC107'?'#000':'#fff')+';flex-shrink:0">'+initials(p.first_name,p.last_name)+'</div>' +
          '<div style="flex:1;min-width:200px">' +
            '<div style="font-size:26px;font-weight:900">'+p.first_name+' '+p.last_name+'</div>' +
            '<div style="color:#546E7A;font-size:14px;margin:6px 0">'+(p.specific_position||p.primary_position||'--')+' ÃÂ· '+(p.position_group||'--')+' ÃÂ· '+(p.age||'--')+' yrs ÃÂ· '+(p.nationality||'England')+'</div>' +
            '<div style="font-size:12px;color:#546E7A">Club: '+(p.team_name||'Free Agent')+'</div>' +
            scoutActions +
          '</div>' +
          '<div style="text-align:center">' +
            '<div style="font-size:64px;font-weight:900;color:'+ovColor+';line-height:1">'+ov+'</div>' +
            '<div style="font-size:12px;color:#546E7A">Overall / 10</div>' +
            '<div style="font-size:18px;font-weight:800;color:#00E676;margin-top:8px">'+formatValue(p.transfer_value||0)+'</div>' +
            '<div style="font-size:12px;color:#546E7A">Transfer Value</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">' +

        '<div class="table-card">' +
          '<div class="table-header"><h3>Attribute Ratings <span style="font-size:12px;font-weight:400;color:#546E7A">/ 10</span></h3></div>' +
          '<div style="padding:16px">'+attrHtml+'</div>' +
        '</div>' +

        '<div>' +
          '<div class="table-card" style="margin-bottom:16px">' +
            '<div class="table-header"><h3>Physical Profile</h3></div>' +
            '<div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
              '<div style="background:#0a0f1e;border-radius:8px;padding:12px;text-align:center">' +
                '<div style="font-weight:700;font-size:15px">'+(p.height_category||'--')+'</div><div style="font-size:11px;color:#546E7A">Height</div>' +
                (p.height_range_cm?'<div style="font-size:11px;color:#94a3b8;margin-top:2px">'+p.height_range_cm+'</div>':'') +
              '</div>' +
              '<div style="background:#0a0f1e;border-radius:8px;padding:12px;text-align:center">' +
                '<div style="font-weight:700;font-size:15px">'+(p.build_category||'--')+'</div><div style="font-size:11px;color:#546E7A">Build</div>' +
                (p.weight_range_kg?'<div style="font-size:11px;color:#94a3b8;margin-top:2px">'+p.weight_range_kg+'</div>':'') +
              '</div>' +
              '<div style="background:#0a0f1e;border-radius:8px;padding:12px;text-align:center">' +
                '<div style="font-weight:700;font-size:15px">'+(p.foot||'Right')+'</div><div style="font-size:11px;color:#546E7A">Preferred Foot</div>' +
              '</div>' +
              '<div style="background:#0a0f1e;border-radius:8px;padding:12px;text-align:center">' +
                '<div style="font-weight:700;font-size:15px">'+(p.work_rate||'Med/Med')+'</div><div style="font-size:11px;color:#546E7A">Work Rate</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="table-card">' +
            '<div class="table-header"><h3>Season Stats</h3></div>' +
            '<div style="padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center">' +
              '<div><div style="font-size:24px;font-weight:800">'+(p.appearances||0)+'</div><div style="font-size:11px;color:#546E7A">Apps</div></div>' +
              '<div><div style="font-size:24px;font-weight:800;color:#00E676">'+(p.goals||0)+'</div><div style="font-size:11px;color:#546E7A">Goals</div></div>' +
              '<div><div style="font-size:24px;font-weight:800;color:#42A5F5">'+(p.assists||0)+'</div><div style="font-size:11px;color:#546E7A">Assists</div></div>' +
              '<div><div style="font-size:24px;font-weight:800;color:#FFC107">'+(p.clean_sheets||0)+'</div><div style="font-size:11px;color:#546E7A">CS</div></div>' +
            '</div>' +
          '</div>' +
        '</div>' +

      '</div>' +

      (matches.length?
        '<div class="table-card" style="margin-bottom:20px">' +
          '<div class="table-header"><h3>Recent Matches</h3><span style="font-size:12px;color:#546E7A">Performance scores 0-100</span></div>' +
          '<div style="padding:16px">'+matchHtml+'</div>' +
        '</div>' : '') +

      (videos.length?
        '<div class="table-card">' +
          '<div class="table-header"><h3>Ã°ÂÂÂ¹ Video Highlights</h3></div>' +
          '<div style="padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">' +
          videos.map(function(v){return '<div style="background:#0a0f1e;border-radius:8px;padding:12px"><div style="font-weight:600;font-size:13px;margin-bottom:6px">'+v.title+'</div><a href="'+v.url+'" target="_blank" class="btn btn-sm btn-outline">Ã¢ÂÂ¶ Watch</a></div>';}).join('') +
          '</div></div>' : '') +

      '<div id="compatResult"></div>';

  } catch(e) {
    document.getElementById('profileContent').innerHTML='<div style="text-align:center;padding:48px;color:#546E7A"><p>Could not load player profile.</p><p style="font-size:12px;margin-top:8px">'+e.message+'</p></div>';
    console.error(e);
  }
});

async function addToPipeline(playerId){
  try{
    await api('POST','/api/players/'+playerId+'/scout-interest',{interestLevel:7});
    alert('Added to pipeline! Check My Pipeline to manage stages.');
  }catch(e){alert('Error: '+e.message);}
}

async function showCompatibility(playerId){
  document.getElementById('compatResult').innerHTML='<div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Running compatibility analysis...</span></div>';
  try{
    var r = await api('POST','/api/players/'+playerId+'/analyse',{teamId:'bbbbbbbb-1111-1111-1111-111111111111'});
    var b = r.compatibilityBreakdown||{};
    var score = r.compatibilityScore||0;
    var sColor = compatColor(score);
    document.getElementById('compatResult').innerHTML=
      '<div class="table-card" style="margin-top:20px">' +
        '<div class="table-header"><h3>Ã°ÂÂÂ® Compatibility vs Riverside Rangers</h3></div>' +
        '<div style="padding:20px">' +
          '<div style="display:flex;align-items:center;gap:20px;margin-bottom:20px">' +
            '<div style="font-size:72px;font-weight:900;color:'+sColor+';line-height:1">'+Math.round(score)+'</div>' +
            '<div><div style="font-size:16px;font-weight:700">Compatibility Score</div>' +
            '<div style="font-size:13px;color:#546E7A">Based on 6 weighted factors + weakness exploitation</div>' +
            '<div style="font-size:20px;font-weight:800;color:#00E676;margin-top:6px">'+formatValue(r.transferValue||0)+'</div>' +
            '<div style="font-size:11px;color:#546E7A">Recommended Transfer Value</div></div>' +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
            '<div><div style="font-size:12px;color:#94a3b8;margin-bottom:4px">Technical (35%)</div><div style="height:8px;background:#1e2a3a;border-radius:4px"><div style="height:100%;width:'+(b.technical||0)+'%;background:#00BCD4;border-radius:4px"></div></div><div style="font-size:11px;color:#546E7A;text-align:right">'+Math.round(b.technical||0)+'</div></div>' +
            '<div><div style="font-size:12px;color:#94a3b8;margin-bottom:4px">Tier Fit (20%)</div><div style="height:8px;background:#1e2a3a;border-radius:4px"><div style="height:100%;width:'+(b.tierFit||0)+'%;background:#42A5F5;border-radius:4px"></div></div><div style="font-size:11px;color:#546E7A;text-align:right">'+Math.round(b.tierFit||0)+'</div></div>' +
            '<div><div style="font-size:12px;color:#94a3b8;margin-bottom:4px">Age Fit (15%)</div><div style="height:8px;background:#1e2a3a;border-radius:4px"><div style="height:100%;width:'+(b.ageFit||0)+'%;background:#00E676;border-radius:4px"></div></div><div style="font-size:11px;color:#546E7A;text-align:right">'+Math.round(b.ageFit||0)+'</div></div>' +
            '<div><div style="font-size:12px;color:#94a3b8;margin-bottom:4px">Physical (10%)</div><div style="height:8px;background:#1e2a3a;border-radius:4px"><div style="height:100%;width:'+(b.physScore||0)+'%;background:#FFC107;border-radius:4px"></div></div><div style="font-size:11px;color:#546E7A;text-align:right">'+Math.round(b.physScore||0)+'</div></div>' +
            '<div><div style="font-size:12px;color:#94a3b8;margin-bottom:4px">Match Stats (7%)</div><div style="height:8px;background:#1e2a3a;border-radius:4px"><div style="height:100%;width:'+(b.statsScore||0)+'%;background:#FF9800;border-radius:4px"></div></div><div style="font-size:11px;color:#546E7A;text-align:right">'+Math.round(b.statsScore||0)+'</div></div>' +
            '<div><div style="font-size:12px;color:#94a3b8;margin-bottom:4px">Weakness Bonus</div><div style="height:8px;background:#1e2a3a;border-radius:4px"><div style="height:100%;width:Math.min((b.weaknessBonus||0)*10,100)+"%;background:#FF5722;border-radius:4px"></div></div><div style="font-size:11px;color:#546E7A;text-align:right">+'+Math.round((b.weaknessBonus||0))+'pts</div></div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }catch(e){document.getElementById('compatResult').innerHTML='<div style="padding:16px;color:#546E7A">Compatibility analysis unavailable: '+e.message+'</div>';}
}
</script>
<script src="../js/mobile.js"></script>
</body></html>
