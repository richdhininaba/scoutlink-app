<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Showcase Events - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-box{background:#111827;border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:900px;margin:auto}
.event-panel{display:grid;grid-template-columns:1fr 380px;gap:20px}
.confirm-bar{position:sticky;bottom:0;background:#0a0f1e;border-top:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-radius:0 0 16px 16px}
.status-chip{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.status-draft{background:rgba(84,110,122,.2);color:#94a3b8}
.status-published{background:rgba(66,165,245,.15);color:#42A5F5}
.status-confirmed{background:rgba(0,230,118,.15);color:#00E676}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">&#9889; Scout<span style="color:#00E676">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">&#127914; Showcase Events</span>
<div class="topbar-right">
<button class="btn btn-sm btn-primary" onclick="openCreateModal()">+ Create Event</button>
<button class="notif-btn" onclick="toggleNotifPanel()">&#128276;<span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button>
</div>
</div>
<div class="page-content">
<div id="eventsList"><div class="loading-state"><div class="spinner"></div></div></div>
</div>
</div>
</div>

<!-- Create Event Modal -->
<div id="createModal" style="display:none" class="modal-overlay">
<div class="modal-box" style="max-width:580px">
<h3 style="font-size:17px;font-weight:800;margin-bottom:20px">&#127914; Create Showcase Event</h3>
<div class="form-group"><label>Event Name *</label><input type="text" id="newEventName" placeholder="e.g. Spring Showcase 2026" style="background:#0a0f1e;border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:#E2E8F0;font-size:14px;width:100%"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div class="form-group"><label>Event Date & Time</label><input type="datetime-local" id="newEventDate" style="background:#0a0f1e;border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:#E2E8F0;font-size:14px;width:100%"></div>
<div class="form-group"><label>Max Scout Attendees</label><input type="number" id="newMaxScouts" value="20" min="1" style="background:#0a0f1e;border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:#E2E8F0;font-size:14px;width:100%"></div>
</div>
<div class="form-group"><label>Venue Name</label><input type="text" id="newVenueName" placeholder="e.g. St George's Park" style="background:#0a0f1e;border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:#E2E8F0;font-size:14px;width:100%"></div>
<div class="form-group"><label>Venue Address</label><input type="text" id="newVenueAddress" placeholder="Full address" style="background:#0a0f1e;border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:#E2E8F0;font-size:14px;width:100%"></div>
<div class="form-group"><label>Description</label><textarea id="newDescription" rows="3" placeholder="Describe the event..." style="background:#0a0f1e;border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:#E2E8F0;font-size:14px;width:100%;resize:vertical"></textarea></div>
<div class="form-group"><label>Status</label><select id="newStatus" style="background:#0a0f1e;border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:#E2E8F0;font-size:14px;width:100%"><option value="draft">Draft</option><option value="published">Published</option></select></div>
<div id="createMsg" style="font-size:13px;margin:8px 0"></div>
<div style="display:flex;gap:12px;margin-top:8px">
<button class="btn btn-ghost" onclick="document.getElementById('createModal').style.display='none'">Cancel</button>
<button class="btn btn-primary" onclick="createEvent()" id="createBtn">Create Event</button>
</div>
</div>
</div>

<!-- Event Detail Modal -->
<div id="eventModal" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeEventModal()">
<div class="modal-box">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
<h3 style="font-size:17px;font-weight:800" id="modalEventName"></h3>
<button onclick="closeEventModal()" style="background:none;border:none;color:#B0BEC5;font-size:24px;cursor:pointer">x</button>
</div>
<div class="event-panel">
<div>
<div style="margin-bottom:16px;padding:16px;background:#0a0f1e;border-radius:10px">
<div style="font-size:12px;color:#546E7A" id="modalEventMeta"></div>
</div>
<div class="table-header" style="margin-bottom:12px"><h4>Available Players</h4><input type="text" id="playerSearchModal" placeholder="Search..." style="background:#0a0f1e;border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:#E2E8F0;font-size:12px;width:160px" oninput="filterModalPlayers()"></div>
<div id="allPlayersModal" style="max-height:340px;overflow-y:auto"></div>
</div>
<div>
<h4 style="margin-bottom:12px">Selected Players <span id="selectedCount" style="color:#00E676"></span></h4>
<div id="showcasePlayersList" style="max-height:280px;overflow-y:auto;margin-bottom:16px"></div>
<div style="background:#0a0f1e;border-radius:10px;padding:14px;margin-bottom:16px">
<div style="font-size:13px;font-weight:700;margin-bottom:4px" id="attendanceCount"></div>
<div style="font-size:12px;color:#546E7A">Scout attendance</div>
</div>
<button class="btn btn-sm btn-outline" onclick="showAttendees()" style="width:100%;margin-bottom:8px">View Attendees</button>
</div>
</div>
<div class="confirm-bar">
<div style="font-size:13px;color:#94a3b8" id="confirmWarning"></div>
<button class="btn btn-primary" onclick="confirmEvent()" id="confirmEventBtn" style="min-width:160px">&#10003; Confirm Event</button>
</div>
</div>
</div>

<!-- Attendees Modal -->
<div id="attendeesModal" style="display:none" class="modal-overlay">
<div class="modal-box" style="max-width:600px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
<h3 style="font-size:17px;font-weight:800">Scout Attendees</h3>
<button onclick="document.getElementById('attendeesModal').style.display='none'" style="background:none;border:none;color:#B0BEC5;font-size:24px;cursor:pointer">x</button>
</div>
<div id="attendeesList"></div>
</div>
</div>

<script src="../js/main.js"></script>
<script>
var STRATEX_NAV=[{"icon":"🏠","label":"Dashboard","href":"stratex-dashboard.html"},{"icon":"📋","label":"Registrations","href":"stratex-registrations.html"},{"icon":"👥","label":"Users","href":"stratex-users.html"},{"icon":"⚽","label":"Players","href":"stratex-players.html"},{"icon":"🔍","label":"Scouts","href":"stratex-scouts.html"},{"icon":"🏋️","label":"Coaches","href":"stratex-coaches.html"},{"icon":"🏆","label":"Scout Teams","href":"stratex-scout-teams.html"},{"icon":"🏫","label":"School Teams","href":"stratex-school-teams.html"},{"icon":"🎖️","label":"Award Nominations","href":"stratex-award-nominations.html"},{"icon":"🎪","label":"Showcase Events","href":"stratex-showcase-events.html"},{"icon":"🔔","label":"Notifications","href":"#","action":"toggleNotifPanel"},{"icon":"⚙️","label":"Settings","href":"stratex-settings.html"}];
var allPlayersGlobal=[], currentEventId=null;

function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Stratex'){window.location.href='login.html';return;}
  var nav=document.getElementById('sidebarNav');
  var cur=window.location.pathname.split('/').pop();
  if(nav) nav.innerHTML=STRATEX_NAV.map(function(i){return'<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'"'+(i.action?' onclick="'+i.action+'();return false"':'')+'>'+i.icon+' '+i.label+'</a>';}).join('');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#FF5722;color:#fff">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Stratex Admin</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){}

function statusChip(s){var cls={draft:'status-draft',published:'status-published',confirmed:'status-confirmed'}[s]||'status-draft';return'<span class="status-chip '+cls+'">'+s+'</span>';}

async function loadEvents(){
  try{
    var d=await api('GET','/api/showcase');
    var events=d.data||[];
    if(!events.length){document.getElementById('eventsList').innerHTML='<div style="text-align:center;padding:48px;color:#546E7A"><p>No showcase events yet.</p><button class="btn btn-primary" onclick="openCreateModal()" style="margin-top:16px">+ Create First Event</button></div>';return;}
    document.getElementById('eventsList').innerHTML='<div style="display:grid;gap:16px">'+events.map(function(ev){
      var dateStr=ev.event_date?new Date(ev.event_date).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'Date TBC';
      return'<div class="table-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px"><div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="font-size:18px;font-weight:800">'+ev.event_name+'</span>'+statusChip(ev.status)+'</div><div style="font-size:13px;color:#94a3b8;margin-bottom:4px">&#128197; '+dateStr+' &nbsp;&nbsp; &#128205; '+(ev.venue_name||'Venue TBC')+'</div><div style="font-size:12px;color:#546E7A">'+(ev.description||'')+'</div></div><div style="display:flex;gap:10px;align-items:center"><div style="text-align:center;min-width:80px"><div style="font-size:22px;font-weight:900;color:#00E676">'+(ev.confirmedCount||0)+'</div><div style="font-size:11px;color:#546E7A">/ '+ev.max_scouts+' scouts</div></div><button class="btn btn-outline" onclick="openEventModal('+JSON.stringify(ev.id)+')">Manage</button></div></div></div>';
    }).join('')+'</div>';
  }catch(e){document.getElementById('eventsList').innerHTML='<div style="padding:24px;color:#f44336">Error: '+e.message+'</div>';}
}

function openCreateModal(){document.getElementById('createModal').style.display='flex';}

async function createEvent(){
  var name=document.getElementById('newEventName').value.trim();
  if(!name){document.getElementById('createMsg').textContent='Event name required';document.getElementById('createMsg').style.color='#f44336';return;}
  var btn=document.getElementById('createBtn');btn.disabled=true;btn.textContent='Creating...';
  try{
    await api('POST','/api/showcase',{eventName:name,eventDate:document.getElementById('newEventDate').value||null,venueName:document.getElementById('newVenueName').value,venueAddress:document.getElementById('newVenueAddress').value,description:document.getElementById('newDescription').value,maxScouts:Number(document.getElementById('newMaxScouts').value)||20,status:document.getElementById('newStatus').value});
    document.getElementById('createModal').style.display='none';
    loadEvents();
  }catch(e){document.getElementById('createMsg').textContent='Error: '+e.message;document.getElementById('createMsg').style.color='#f44336';}
  btn.disabled=false;btn.textContent='Create Event';
}

function posColor(g){return{Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#00BCD4',Forward:'#FF5722'}[g]||'#00E676';}
function dispOverall(v){var n=parseFloat(v);if(isNaN(n))return '--';return(n>10?n/10:n).toFixed(1);}

async function openEventModal(eventId){
  currentEventId=eventId;
  document.getElementById('eventModal').style.display='flex';
  document.getElementById('allPlayersModal').innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  document.getElementById('showcasePlayersList').innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  try{
    var [evData, playersData] = await Promise.all([api('GET','/api/showcase/'+eventId), api('GET','/api/awards/players')]);
    var ev=evData.event;
    var spIds=(evData.players||[]).map(function(p){return p.player_id;});
    allPlayersGlobal=playersData.data||[];
    document.getElementById('modalEventName').textContent=ev.event_name;
    var dateStr=ev.event_date?new Date(ev.event_date).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Date TBC';
    document.getElementById('modalEventMeta').innerHTML='&#128197; '+dateStr+'<br>&#128205; '+(ev.venue_name||'')+(ev.venue_address?', '+ev.venue_address:'')+'<br>Status: '+ev.status;
    document.getElementById('attendanceCount').textContent=(evData.confirmedCount||0)+' / '+ev.max_scouts+' scouts confirmed';
    // Render all players (not already in showcase)
    renderModalPlayers(allPlayersGlobal.filter(function(p){return !spIds.includes(p.id);}), spIds);
    // Render showcase players
    renderShowcasePlayers(evData.players||[]);
    // Confirm warning
    document.getElementById('confirmWarning').textContent=ev.confirmed?'Event already confirmed':'Press Confirm when ready to notify all scouts';
    document.getElementById('confirmEventBtn').textContent=ev.confirmed?'&#10003; Confirmed':'&#10003; Confirm Event';
    document.getElementById('confirmEventBtn').disabled=ev.confirmed;
  }catch(e){document.getElementById('allPlayersModal').innerHTML='<div style="color:#f44336;padding:12px">Error: '+e.message+'</div>';}
}

function renderModalPlayers(players, excludeIds){
  if(!players.length){document.getElementById('allPlayersModal').innerHTML='<div style="padding:12px;color:#546E7A">No more players to add</div>';return;}
  document.getElementById('allPlayersModal').innerHTML=players.filter(function(p){return !excludeIds||!excludeIds.includes(p.id);}).map(function(p){
    var pCol=posColor(p.position_group);
    return'<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border)"><div class="user-avatar" style="width:26px;height:26px;font-size:9px;background:'+pCol+'">'+initials(p.first_name,p.last_name)+'</div><div style="flex:1"><div style="font-size:13px;font-weight:600">'+p.first_name+' '+p.last_name+'</div><div style="font-size:11px;color:#546E7A">'+(p.age_group||'')+'  '+dispOverall(p.overall_rating)+' OVR</div></div><button class="btn btn-sm btn-primary" onclick="addPlayerToShowcase('+JSON.stringify(p.id)+')">Add</button></div>';
  }).join('');
}

function filterModalPlayers(){
  var q=document.getElementById('playerSearchModal').value.toLowerCase();
  renderModalPlayers(allPlayersGlobal.filter(function(p){return(p.first_name+' '+p.last_name).toLowerCase().includes(q);}), []);
}

function renderShowcasePlayers(spRows){
  document.getElementById('selectedCount').textContent='('+spRows.length+')';
  if(!spRows.length){document.getElementById('showcasePlayersList').innerHTML='<div style="padding:12px;color:#546E7A">No players selected yet</div>';return;}
  document.getElementById('showcasePlayersList').innerHTML=spRows.map(function(sp){
    var p=sp.players;
    var pName=p?p.first_name+' '+p.last_name:'Unknown';
    return'<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border)"><div style="flex:1"><div style="font-size:13px;font-weight:600">'+pName+'</div><div style="font-size:11px;color:#546E7A">'+(p&&p.age_group||'')+'</div></div><button class="btn btn-sm btn-ghost" style="color:#f44336" onclick="removePlayerFromShowcase('+JSON.stringify(sp.player_id)+')">Remove</button></div>';
  }).join('');
}

async function addPlayerToShowcase(playerId){
  try{
    await api('POST','/api/showcase/'+currentEventId+'/players',{playerId:playerId});
    openEventModal(currentEventId);
  }catch(e){alert('Error: '+e.message);}
}

async function removePlayerFromShowcase(playerId){
  try{
    await api('DELETE','/api/showcase/'+currentEventId+'/players/'+playerId);
    openEventModal(currentEventId);
  }catch(e){alert('Error: '+e.message);}
}

async function confirmEvent(){
  if(!confirm('Confirm this event and notify all active scouts?')) return;
  var btn=document.getElementById('confirmEventBtn');btn.disabled=true;btn.textContent='Confirming...';
  try{
    await api('POST','/api/showcase/'+currentEventId+'/confirm');
    btn.textContent='&#10003; Confirmed';
    document.getElementById('confirmWarning').textContent='Event confirmed. All scouts have been notified.';
    loadEvents();
  }catch(e){alert('Error: '+e.message);btn.disabled=false;btn.textContent='&#10003; Confirm Event';}
}

async function showAttendees(){
  document.getElementById('attendeesList').innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  document.getElementById('attendeesModal').style.display='flex';
  try{
    var d=await api('GET','/api/showcase/'+currentEventId+'/attendees');
    var html='';
    if(d.confirmed&&d.confirmed.length){
      html+='<h4 style="color:#00E676;margin-bottom:10px">Confirmed ('+d.confirmed.length+')</h4>';
      html+=d.confirmed.map(function(a){var s=a.scouts;return'<div style="padding:8px 12px;border-bottom:1px solid var(--border)"><div style="font-weight:600">'+(s?s.first_name+' '+s.last_name:'Unknown')+'</div><div style="font-size:11px;color:#546E7A">'+(s&&s.email||'')+' &bull; Confirmed: '+new Date(a.confirmed_at).toLocaleDateString('en-GB')+'</div></div>';}).join('');
    }
    if(d.waitlisted&&d.waitlisted.length){
      html+='<h4 style="color:#FFC107;margin:16px 0 10px">Waitlisted ('+d.waitlisted.length+')</h4>';
      html+=d.waitlisted.map(function(a){var s=a.scouts;return'<div style="padding:8px 12px;border-bottom:1px solid var(--border)"><div style="font-weight:600">'+(s?s.first_name+' '+s.last_name:'Unknown')+'</div></div>';}).join('');
    }
    if(!html) html='<div style="text-align:center;padding:32px;color:#546E7A">No attendees yet</div>';
    document.getElementById('attendeesList').innerHTML=html;
  }catch(e){document.getElementById('attendeesList').innerHTML='<div style="color:#f44336">Error: '+e.message+'</div>';}
}

function closeEventModal(){document.getElementById('eventModal').style.display='none';currentEventId=null;}

document.addEventListener('DOMContentLoaded',function(){initNav();loadEvents();});
</script>
<script src="../js/mobile.js"></script>
</body></html>
