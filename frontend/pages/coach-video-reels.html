<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Video Reels - ScoutLink</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Video Reels</span><div class="topbar-right"><button class="notif-btn" onclick="toggleNotifPanel()">Notifs<span class="notif-badge" id="notifBadge" style="display:none">0</span></button><button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button></div></div>
<div class="page-content"><div style="text-align:center;padding:80px 40px;color:#546E7A"><div style="font-size:48px;margin-bottom:16px">🚧</div><h2 style="color:#B0BEC5;margin-bottom:8px">Video Reels</h2><p>This section is coming soon.</p></div></div>
</div></div>
<div class="notif-panel" id="notifPanel"><div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">×</button></div><div class="notif-list" id="notifList"></div></div>
<script src="../js/main.js"></script>
<script>
var COACH_NAV=[{label:'Dashboard',href:'coach-dashboard.html'},{label:'My Players',href:'coach-my-players.html'},{label:'Add Players',href:'add-player.html'},{label:'Bulk Add Players',href:'bulk-add-players.html'},{label:'Match Facts',href:'match-facts.html'},{label:'Fixtures',href:'coach-fixtures.html'},{label:'Video Reels',href:'coach-video-reels.html'},{label:'Notifications',href:'#',action:'toggleNotifPanel'},{label:'Settings',href:'coach-settings.html'}];
function initNav(){if(!Auth.isLoggedIn()||Auth.type!=='Coach'){window.location.href='login.html';return;}var nav=document.getElementById('sidebarNav');var cur=window.location.pathname.split('/').pop();if(nav)nav.innerHTML=COACH_NAV.map(function(i){return'<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'" '+(i.action?'onclick="'+i.action+'();return false"':'')+'>'+i.label+'</a>';}).join('');var u=Auth.user;var uel=document.getElementById('sidebarUser');if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+u.firstName+' '+u.lastName+'</div><div class="user-role">Coach</div></div></div>';updateNotifBadge();}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
document.addEventListener('DOMContentLoaded',function(){initNav();if(typeof loadPage==='function')loadPage();});
</script>
</body></html>
