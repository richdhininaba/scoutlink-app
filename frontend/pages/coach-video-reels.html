<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Reels - ScoutLink</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.data-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.data-card h3{font-size:15px;font-weight:600;margin-bottom:12px;color:#1a1a2e}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-box{background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.stat-box .val{font-size:28px;font-weight:700;color:#4f46e5}
.stat-box .lbl{font-size:12px;color:#666;margin-top:4px}
table{width:100%;border-collapse:collapse}
th{background:#f8f9fa;padding:10px 14px;text-align:left;font-size:13px;color:#666;font-weight:600}
td{padding:12px 14px;border-bottom:1px solid #f0f0f0;font-size:14px}
tr:hover td{background:#f8f9fa}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge-green{background:#d1fae5;color:#065f46}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-purple{background:#ede9fe;color:#5b21b6}
.badge-yellow{background:#fef3c7;color:#92400e}
.btn-primary{background:#4f46e5;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-secondary{background:#f3f4f6;color:#374151;border:1px solid #e0e0e0;padding:9px 20px;border-radius:8px;font-size:13px;cursor:pointer}
.empty-state{text-align:center;padding:60px 20px;color:#666}
.empty-icon{font-size:64px;color:#e0e0e0;margin-bottom:16px}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span style="font-size:20px;font-weight:700;color:#4f46e5">ScoutLink</span></div>
    <nav class="sidebar-nav"><a href="coach-dashboard.html"><i class="fas fa-home"></i> Dashboard</a><a href="coach-my-players.html"><i class="fas fa-users"></i> My Players</a><a href="add-player.html"><i class="fas fa-user-plus"></i> Add Players</a><a href="bulk-add-players.html"><i class="fas fa-file-import"></i> Bulk Add Players</a><a href="match-facts.html"><i class="fas fa-clipboard"></i> Match Facts</a><a href="coach-fixtures.html"><i class="fas fa-calendar"></i> Fixtures</a><a href="coach-video-reels.html" class="active"><i class="fas fa-video"></i> Video Reels</a><a href="coach-notifications.html"><i class="fas fa-bell"></i> Notifications</a><a href="coach-settings.html"><i class="fas fa-cog"></i> Settings</a></nav>
    <div class="sidebar-footer"><button onclick="logout()" style="width:100%;background:#f3f4f6;border:1px solid #e0e0e0;padding:10px;border-radius:8px;cursor:pointer"><i class="fas fa-sign-out-alt"></i> Sign Out</button></div>
  </aside>
  <main class="main-content">
    <div class="page-header"><h1><i class="fas fa-video" style="color:#4f46e5;margin-right:8px"></i>Video Reels</h1></div>
    
<div class="data-card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h3>Team Video Reels</h3>
    <button class="btn-primary"><i class="fas fa-plus"></i> Upload Team Video</button>
  </div>
  <p style="color:#666;margin-bottom:20px">Upload and manage video highlights for your team and individual players.</p>
  <div id="videoList">
    <div style="border:2px dashed #e0e0e0;border-radius:12px;padding:60px;text-align:center">
      <i class="fas fa-video" style="font-size:48px;color:#e0e0e0;margin-bottom:16px"></i>
      <h3 style="color:#666">No videos uploaded yet</h3>
      <p style="color:#999;margin-bottom:20px">Upload team training footage or match highlights</p>
      <button class="btn-primary"><i class="fas fa-upload"></i> Upload First Video</button>
    </div>
  </div>
</div>
  </main>
</div>
<script src="../js/auth.js"></script>
<script>
function logout(){if(window.supabaseClient)window.supabaseClient.auth.signOut();localStorage.clear();sessionStorage.clear();window.location.href='../pages/login.html';}
</script>
<script src="../js/mobile.js"></script>
</body>
</html>
