<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Video Reels - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.video-card{background:#0d1117;border:1px solid #30363d;border-radius:12px;padding:16px;margin-bottom:12px;}
.upload-zone{border:2px dashed #30363d;border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all .2s;}
.upload-zone:hover{border-color:#1d9e75;background:rgba(29,158,117,.04);}
.form-input{width:100%;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 14px;color:#ffffff;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;}
.form-input:focus{border-color:#1d9e75;}
.tab-btn{padding:8px 18px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid #30363d;background:#0d1117;color:#8b949e;transition:all .2s;}
.tab-btn.active{border-color:#1d9e75;background:rgba(29,158,117,.1);color:#1d9e75;}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Scout<span style="color:#1d9e75">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">Video Reels</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost desktop-signout" onclick="logout()">Sign Out</button>
</div>
</div>
<div class="page-content">

<!-- Upload Form -->
<div class="table-card" style="margin-bottom:20px">
<div class="table-header"><h3>Upload Video Reel</h3></div>
<div style="padding:20px">
<div style="display:flex;gap:12px;margin-bottom:20px">
<button class="tab-btn active" id="tabUrl">Video URL</button>
<button class="tab-btn" id="tabFile">Upload File</button>
</div>

<div id="urlSection">
<div style="margin-bottom:14px"><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Video URL *</label><input type="url" id="videoUrl" class="form-input" placeholder="https://youtube.com/watch?v=... or Vimeo URL"></div>
</div>
<div id="fileSection" style="display:none">
<div style="margin-bottom:14px">
<label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Video File</label>
<div class="upload-zone" id="uploadZone"><div style="font-size:32px;margin-bottom:8px">&#9654;</div><p style="color:#8b949e;margin-bottom:8px">Click to choose a video file</p><p style="font-size:11px;color:#8b949e">MP4, MOV, AVI (max 100MB)</p><input type="file" id="videoFile" accept="video/*" style="display:none">
<div id="fileNameDisplay" style="font-size:12px;color:#8b949e;margin-top:6px"></div></div>
<div id="fileStatus" style="font-size:12px;color:#1d9e75;margin-top:6px;display:none"></div>
</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px">
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Title *</label><input type="text" id="videoTitle" class="form-input" placeholder="e.g. Match Highlights vs Arsenal"></div>
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Category</label>
<select id="videoCategory" class="form-input"><option value="Highlight">Highlight</option><option value="Training">Training</option><option value="Match">Match</option><option value="Skills">Skills</option><option value="Goal">Goal</option></select>
</div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px">
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Assign to Player</label>
<select id="playerAssign" class="form-input"><option value="">No player (team video)</option></select>
</div>
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Description (optional)</label><input type="text" id="videoDesc" class="form-input" placeholder="Short description..."></div>
</div>
<div style="display:flex;gap:12px;align-items:center">
<button class="btn btn-primary" id="uploadBtn">Upload Video</button>
<span id="uploadMsg" style="font-size:13px;color:#1d9e75"></span>
</div>
</div>
</div>

<!-- Video List -->
<div class="table-card">
<div class="table-header"><h3>All Videos</h3><button class="btn btn-sm btn-outline" id="refreshBtn">Refresh</button></div>
<div id="videoList"><div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Loading videos...</span></div></div>
</div>

</div>
</div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Coach'){window.location.href='login.html';return;}
  if(typeof buildScoutNav==='function') buildScoutNav('sidebarNav','Coach');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u) uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#1d9e75;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Coach</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){}

var _uploadMode = 'url';
var _videos = [];

function loadVideos(){
  api('GET','/api/videos?type=player').then(function(d){
    _videos = d.data||[];
    renderVideoList();
  }).catch(function(e){
    document.getElementById('videoList').innerHTML='<div style="padding:32px;text-align:center;color:#8b949e">Could not load videos: '+e.message+'</div>';
  });
}

function renderVideoList(){
  if(!_videos.length){
    document.getElementById('videoList').innerHTML='<div style="padding:48px;text-align:center;color:#8b949e"><div style="font-size:48px;margin-bottom:12px">&#9654;</div><h3 style="color:#ffffff;margin-bottom:8px">No videos yet</h3><p>Upload your first player video above.</p></div>';
    return;
  }
  var html='<div style="padding:16px">';
  _videos.forEach(function(v,idx){
    var url=v.video_url||v.url||'#';
    var player=v.players||(v.player_id?{first_name:'Player',last_name:''}:null);
    html+='<div class="video-card">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:15px;font-weight:700;margin-bottom:4px">'+(v.title||'Video')+'</div>'+
      '<div style="font-size:12px;color:#8b949e;margin-bottom:4px">'+
      '<span style="background:rgba(0,188,212,.1);color:#00BCD4;padding:2px 8px;border-radius:4px;font-weight:700">'+(v.category||'Highlight')+'</span>'+
      (player?' &bull; <span style="color:#8b949e">'+(player.first_name||'')+' '+(player.last_name||'')+'</span>':'<span style="color:#8b949e"> &bull; Team video</span>')+
      '</div>'+
      (v.description?'<div style="font-size:12px;color:#8b949e">'+v.description+'</div>':'')+
      '</div>'+
      '<div style="display:flex;gap:8px;flex-shrink:0">'+
      '<a href="'+url+'" target="_blank" class="btn btn-sm btn-outline" style="min-height:36px">&#9654; Watch</a>'+
      '<button class="btn btn-sm btn-danger" data-vid="'+v.id+'" data-action="delete" style="min-height:36px">Delete</button>'+
      '</div></div></div>';
  });
  html+='</div>';
  document.getElementById('videoList').innerHTML=html;

  document.getElementById('videoList').addEventListener('click',function(e){
    var btn=e.target.closest('[data-action="delete"]');
    if(btn&&confirm('Delete this video?')){
      api('DELETE','/api/videos/'+btn.getAttribute('data-vid'),{}).then(function(){loadVideos();}).catch(function(e){alert('Error: '+e.message);});
    }
  });
}

function loadPlayers(){
  api('GET','/api/players?limit=200').then(function(d){
    var sel=document.getElementById('playerAssign');
    (d.data||[]).forEach(function(p){
      var opt=document.createElement('option');
      opt.value=p.id;
      opt.textContent=(p.first_name||'')+' '+(p.last_name||'')+' ('+(p.specific_position||p.position_group||'--')+')';
      sel.appendChild(opt);
    });
  }).catch(function(){});
}

function doUpload(){
  var title=document.getElementById('videoTitle').value.trim();
  if(!title){alert('Please enter a video title.');return;}
  var btn=document.getElementById('uploadBtn');
  var msg=document.getElementById('uploadMsg');
  btn.disabled=true;btn.textContent='Uploading...';
  msg.textContent='';

  var payload={
    title:title,
    category:document.getElementById('videoCategory').value,
    playerId:document.getElementById('playerAssign').value||null,
    description:document.getElementById('videoDesc').value.trim()||null,
  };

  if(_uploadMode==='url'){
    var url=document.getElementById('videoUrl').value.trim();
    if(!url){alert('Please enter a video URL.');btn.disabled=false;btn.textContent='Upload Video';return;}
    payload.videoUrl=url;
    saveVideo(payload,btn,msg);
  } else {
    var file=document.getElementById('videoFile').files[0];
    if(!file){alert('Please select a video file.');btn.disabled=false;btn.textContent='Upload Video';return;}
    // Upload to Supabase storage via API
    var formData=new FormData();
    formData.append('file',file);
    formData.append('title',title);
    formData.append('category',payload.category);
    if(payload.playerId) formData.append('playerId',payload.playerId);
    if(payload.description) formData.append('description',payload.description);

    var token=localStorage.getItem('sl_token');
    fetch('/api/videos/upload',{
      method:'POST',
      headers:{'Authorization':'Bearer '+token},
      body:formData
    }).then(function(r){return r.json();}).then(function(d){
      if(d.error) throw new Error(d.error);
      msg.textContent='Video uploaded!';msg.style.color='#1d9e75';
      resetForm(btn);loadVideos();
    }).catch(function(e){
      msg.textContent='Error: '+e.message;msg.style.color='#f44336';
      btn.disabled=false;btn.textContent='Upload Video';
    });
  }
}

function saveVideo(payload,btn,msg){
  api('POST','/api/videos',payload).then(function(){
    msg.textContent='Video saved!';msg.style.color='#1d9e75';
    resetForm(btn);loadVideos();
  }).catch(function(e){
    msg.textContent='Error: '+e.message;msg.style.color='#f44336';
    btn.disabled=false;btn.textContent='Upload Video';
  });
}

function resetForm(btn){
  btn.disabled=false;btn.textContent='Upload Video';
  document.getElementById('videoTitle').value='';
  document.getElementById('videoUrl').value='';
  document.getElementById('videoDesc').value='';
  document.getElementById('videoFile').value='';
  document.getElementById('fileStatus').style.display='none';
}

document.addEventListener('DOMContentLoaded',function(){
  initNav();
  loadPlayers();
  loadVideos();

  // Tab switching
  document.getElementById('tabUrl').addEventListener('click',function(){
    _uploadMode='url';
    this.classList.add('active');document.getElementById('tabFile').classList.remove('active');
    document.getElementById('urlSection').style.display='block';
    document.getElementById('fileSection').style.display='none';
  });
  document.getElementById('tabFile').addEventListener('click',function(){
    _uploadMode='file';
    this.classList.add('active');document.getElementById('tabUrl').classList.remove('active');
    document.getElementById('urlSection').style.display='none';
    document.getElementById('fileSection').style.display='block';
  });

  // Upload zone click
  document.getElementById('uploadZone').addEventListener('click',function(){
    document.getElementById('videoFile').click();
  });
  document.getElementById('videoFile').addEventListener('change',function(){
    var file=this.files[0];
    if(file){
      var status=document.getElementById('fileStatus');
      status.textContent='Selected: '+file.name+' ('+Math.round(file.size/1024/1024*10)/10+' MB)';
      status.style.display='block';
    }
  });

  document.getElementById('uploadBtn').addEventListener('click',doUpload);
  document.getElementById('refreshBtn').addEventListener('click',loadVideos);
});
</script>
<script src="../js/mobile.js"></script>
</body></html>
