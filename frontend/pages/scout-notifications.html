<div class="table-header"><div><h3>Notifications</h3><p style="font-size:12px;color:#546E7A">Updates about players in your pipeline</p></div><button class="btn btn-sm btn-outline" onclick="markAllRead()">Mark All Read</button></div>
<div id="notifContent"><div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Loading notifications...</span></div></div>
</div>
<script>
async function loadNotifications(){
try{
var d=await api('GET','/api/notifications?limit=50');
var rows=d.data||[];
if(!rows.length){document.getElementById('notifContent').innerHTML='<div style="text-align:center;padding:40px;color:#546E7A">No notifications yet.</div>';return;}
document.getElementById('notifContent').innerHTML='<div style="padding:8px">'+rows.map(function(n){
var icon=n.notification_type==='scout_interest'?'Ã¢Â­Â':n.notification_type==='system'?'Ã¢ÂÂ¹Ã¯Â¸Â':'Ã°ÂÂÂ';
return '<div class="notif-item'+(n.is_read?'':' unread')+'" style="padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer" onclick="markRead(\''+n.id+'\')">'+
'<div style="display:flex;gap:12px;align-items:flex-start"><span style="font-size:20px">'+icon+'</span><div style="flex:1"><div style="font-weight:700;color:#E2E8F0;margin-bottom:2px">'+n.title+'</div><div style="font-size:13px;color:#B0BEC5;margin-bottom:4px">'+n.body+'</div><div style="font-size:11px;color:#546E7A">'+relTime(n.created_at)+'</div></div>'+(n.is_read?'':'<div style="width:8px;height:8px;border-radius:50%;background:#00E676;margin-top:6px;flex-shrink:0"></div>')+'</div></div>';
}).join('')+'</div>';
}catch(e){document.getElementById('notifContent').innerHTML='<div style="text-align:center;padding:40px;color:#546E7A">Could not load notifications.</div>';}
}
async function markRead(id){try{await api('PATCH','/api/notifications/'+id+'/read');loadNotifications();}catch(e){}}
async function markAllRead(){try{await api('PATCH','/api/notifications/read-all');loadNotifications();}catch(e){}}
document.addEventListener('DOMContentLoaded',loadNotifications);
</script>

function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Scout'){window.location.href='login.html';return;}
  var nav=document.getElementById('sidebarNav');
  var cur=window.location.pathname.split('/').pop();
  if(nav) nav.innerHTML=SCOUT_NAV.map(function(i){return '<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'">'+i.icon+' '+i.label+'</a>';}).join('');
  var u=Auth.user,uel=document.getElementById('sidebarUser');

  updateNotifBadge();
}
