<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notifications - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Scout<span style="color:#1d9e75">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Notifications</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button>
</div></div>
<div class="page-content">
<div class="table-card">
<div class="table-header"><div><h3>Notifications</h3><p style="font-size:12px;color:#8b949e">Updates about players in your pipeline</p></div><button class="btn btn-sm btn-outline" id="markAllBtn">Mark All Read</button></div>
<div id="notifContent"><div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Loading notifications...</span></div></div>
</div>
</div>
</div>
</div>

<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Scout'){window.location.href='login.html';return;}
  if(typeof buildScoutNav==='function') buildScoutNav('sidebarNav','Scout');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u) uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#1d9e75;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Scout</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){}
</script>
<script>
function loadNotifications(){
  api('GET','/api/notifications?limit=50').then(function(d){
    var rows=d.data||[];
    if(!rows.length){document.getElementById('notifContent').innerHTML='<div style="text-align:center;padding:40px;color:#8b949e">No notifications yet.</div>';return;}
    document.getElementById('notifContent').innerHTML='<div style="padding:8px">'+rows.map(function(n,idx){
      return '<div class="notif-item'+(n.is_read?'':' unread')+'" style="padding:14px 16px;border-bottom:1px solid #30363d;cursor:pointer" data-nid="'+n.id+'">'+
        '<div style="display:flex;gap:12px;align-items:flex-start"><span style="font-size:20px">&#128276;</span><div style="flex:1"><div style="font-weight:700;color:#ffffff;margin-bottom:2px">'+n.title+'</div><div style="font-size:13px;color:#8b949e;margin-bottom:4px">'+n.body+'</div><div style="font-size:11px;color:#8b949e">'+relTime(n.created_at)+'</div></div>'+(n.is_read?'':'<div style="width:8px;height:8px;border-radius:50%;background:#1d9e75;margin-top:6px;flex-shrink:0"></div>')+'</div></div>';
    }).join('')+'</div>';
    document.getElementById('notifContent').addEventListener('click',function(e){
      var item=e.target.closest('[data-nid]');
      if(item) api('PATCH','/api/notifications/'+item.getAttribute('data-nid')+'/read').then(function(){loadNotifications();}).catch(function(){});
    });
  }).catch(function(){document.getElementById('notifContent').innerHTML='<div style="text-align:center;padding:40px;color:#8b949e">Could not load notifications.</div>';});
}
document.addEventListener('DOMContentLoaded',function(){
  initNav();
  loadNotifications();
  document.getElementById('markAllBtn').addEventListener('click',function(){
    api('PATCH','/api/notifications/read-all').then(function(){loadNotifications();}).catch(function(){});
  });
});
</script>
<script src="../js/mobile.js"></script>
</body></html>
