<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Compare Players - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.compare-card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:20px}
.attr-compare-row{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;gap:8px;margin-bottom:8px}
.attr-bar-left{height:8px;border-radius:4px;margin-left:auto}
.attr-bar-right{height:8px;border-radius:4px}
.player-select{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px;color:#ffffff;font-size:14px;font-family:inherit;outline:none;width:100%}
.player-select:focus{border-color:#1d9e75}
.big-stat{font-size:48px;font-weight:900;line-height:1;text-align:center}
.stat-label{font-size:11px;color:#8b949e;text-align:center;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.rec-row{padding:12px;background:#0d1117;border-radius:8px;margin-bottom:8px;font-size:13px;color:#8b949e;line-height:1.5}
.rec-row strong{color:#ffffff}
.filter-btn{padding:5px 12px;border-radius:6px;border:1px solid #30363d;font-size:12px;font-weight:700;cursor:pointer;background:#0d1117;color:#8b949e;transition:all .2s}
.filter-btn.active{border-color:#1d9e75;background:rgba(29,158,117,.1);color:#1d9e75}
@media(max-width:768px){.compare-grid{grid-template-columns:1fr}.attr-compare-row{grid-template-columns:1fr}}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Scout<span style="color:#1d9e75">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">Compare Players</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost desktop-signout" onclick="logout()">Sign Out</button>
</div>
</div>
<div class="page-content">

<!-- Player selectors -->
<div class="table-card" style="margin-bottom:20px">
<div class="table-header"><h3>Select Two Players to Compare</h3></div>
<div style="padding:16px">
<div class="compare-grid">
<div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em">Player 1</label>
<div style="display:flex;gap:6px">
<button class="filter-btn active" id="f1All">All Players</button>
<button class="filter-btn" id="f1Pipeline">Pipeline Only</button>
</div>
</div>
<input type="text" id="search1" placeholder="Search by name..." class="player-select" style="margin-bottom:8px">
<select id="player1" class="player-select" size="1"><option value="">Select player...</option></select>
</div>
<div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em">Player 2</label>
<div style="display:flex;gap:6px">
<button class="filter-btn active" id="f2All">All Players</button>
<button class="filter-btn" id="f2Pipeline">Pipeline Only</button>
</div>
</div>
<input type="text" id="search2" placeholder="Search by name..." class="player-select" style="margin-bottom:8px">
<select id="player2" class="player-select" size="1"><option value="">Select player...</option></select>
</div>
</div>
</div>
</div>

<div id="compareResult"></div>

</div>
</div>
</div>

<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>
var _allPlayers=[], _pipelineIds=[], _scoutTeam=null;
var _filter1='all', _filter2='all';

function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Scout'){window.location.href='login.html';return;}
  if(typeof buildScoutNav==='function') buildScoutNav('sidebarNav','Scout');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u) uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#1d9e75;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Scout</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){}

function dOv(v){var n=parseFloat(v);return isNaN(n)?0:(n>10?n:n*10);}
function dDisp(v){var n=dOv(v);return n.toFixed(1);}
function cColor(s){return s>=80?'#1d9e75':s>=65?'#FFC107':s>=50?'#FF9800':'#f44336';}
function pColor(g){return{Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#00BCD4',Forward:'#FF5722'}[g]||'#1d9e75';}

function populateSelect(selId, players){
  var sel=document.getElementById(selId);
  var curVal=sel.value;
  sel.innerHTML='<option value="">Select player...</option>';
  players.forEach(function(p){
    var opt=document.createElement('option');
    opt.value=p.id;
    opt.textContent=(p.first_name||'')+' '+(p.last_name||'')+' — '+(p.age_group||'')+(p.specific_position?' ('+p.specific_position+')':'')+' '+( p.team_name?'| '+p.team_name:'');
    if(p.id===curVal) opt.selected=true;
    sel.appendChild(opt);
  });
}

function getFilteredPlayers(filter){
  if(filter==='pipeline') return _allPlayers.filter(function(p){return _pipelineIds.indexOf(p.id)>=0;});
  return _allPlayers;
}

function searchPlayers(searchId, selId, filter){
  var q=document.getElementById(searchId).value.toLowerCase();
  var base=getFilteredPlayers(filter);
  var filtered=q?base.filter(function(p){return((p.first_name||'')+' '+(p.last_name||'')).toLowerCase().includes(q);}):base;
  populateSelect(selId,filtered.slice(0,100));
}

function updateComparison(){
  var p1id=document.getElementById('player1').value;
  var p2id=document.getElementById('player2').value;
  if(!p1id||!p2id){document.getElementById('compareResult').innerHTML='';return;}
  var p1=_allPlayers.find(function(p){return p.id===p1id;});
  var p2=_allPlayers.find(function(p){return p.id===p2id;});
  if(!p1||!p2){return;}
  renderComparison(p1,p2);
}

var ATTRS=['pace','agility','strength','stamina','jumping','composure','shooting','passing','dribbling','defending','crossing','vision','positioning','heading','tackling'];
var ATTR_LABELS={pace:'Pace',agility:'Agility',strength:'Strength',stamina:'Stamina',jumping:'Jumping',composure:'Composure',shooting:'Shooting',passing:'Passing',dribbling:'Dribbling',defending:'Defending',crossing:'Crossing',vision:'Vision',positioning:'Positioning',heading:'Heading',tackling:'Tackling'};

function renderComparison(p1,p2){
  var ov1=dOv(p1.overall_rating);var ov2=dOv(p2.overall_rating);
  var cs1=Math.round(p1.compatibilityScore||0);var cs2=Math.round(p2.compatibilityScore||0);
  var tv1=formatValue(p1.transfer_value||0);var tv2=formatValue(p2.transfer_value||0);
  var apps1=parseInt(p1.appearances)||0;var apps2=parseInt(p2.appearances)||0;
  var goals1=parseInt(p1.goals)||0;var goals2=parseInt(p2.goals)||0;
  var assts1=parseInt(p1.assists)||0;var assts2=parseInt(p2.assists)||0;
  var cs_1=parseInt(p1.clean_sheets)||0;var cs_2=parseInt(p2.clean_sheets)||0;
  var gpg1=apps1>0?(goals1/apps1).toFixed(2):'0.00';var gpg2=apps2>0?(goals2/apps2).toFixed(2):'0.00';
  var apg1=apps1>0?(assts1/apps1).toFixed(2):'0.00';var apg2=apps2>0?(assts2/apps2).toFixed(2):'0.00';
  var cspg1=apps1>0?(cs_1/apps1).toFixed(2):'0.00';var cspg2=apps2>0?(cs_2/apps2).toFixed(2):'0.00';

  function statRow(label,v1,v2,higherIsBetter){
    var n1=parseFloat(v1)||0,n2=parseFloat(v2)||0;
    var w1=(higherIsBetter!==false)?n1>n2:'#8b949e',w2=(higherIsBetter!==false)?n2>n1:'#8b949e';
    var c1=w1?'#1d9e75':'#8b949e',c2=w2?'#1d9e75':'#8b949e';
    return '<tr><td style="color:'+c1+';font-weight:'+(n1>n2?'800':'400')+'">'+v1+'</td><td style="color:#8b949e;font-size:11px;text-align:center;padding:6px">'+label+'</td><td style="color:'+c2+';font-weight:'+(n2>n1?'800':'400')+'">'+v2+'</td></tr>';
  }

  // Attribute bars
  var attrHtml='';
  ATTRS.forEach(function(a){
    var v1=dOv(p1[a]);var v2=dOv(p2[a]);
    var c1=v1>=v2?'#1d9e75':'#FF9800';var c2=v2>=v1?'#1d9e75':'#FF9800';
    var max=Math.max(v1,v2,10);
    var w1=Math.round((v1/100)*100);var w2=Math.round((v2/100)*100);
    attrHtml+='<div style="display:grid;grid-template-columns:1fr 52px 1fr;align-items:center;gap:6px;margin-bottom:8px">';
    attrHtml+='<div style="display:flex;align-items:center;gap:6px;justify-content:flex-end"><span style="font-size:11px;color:'+c1+';font-weight:700;min-width:24px;text-align:right">'+v1.toFixed(1)+'</span><div style="height:8px;border-radius:4px 0 0 4px;background:'+c1+';width:'+w1+'px;max-width:80px;min-width:4px"></div></div>';
    attrHtml+='<div style="text-align:center;font-size:10px;color:#8b949e;font-weight:700;text-transform:uppercase">'+ATTR_LABELS[a]+'</div>';
    attrHtml+='<div style="display:flex;align-items:center;gap:6px"><div style="height:8px;border-radius:0 4px 4px 0;background:'+c2+';width:'+w2+'px;max-width:80px;min-width:4px"></div><span style="font-size:11px;color:'+c2+';font-weight:700;min-width:24px">'+v2.toFixed(1)+'</span></div>';
    attrHtml+='</div>';
  });

  // Recommendation panel
  var recHtml='';
  if(_scoutTeam&&(_scoutTeam.team_weaknesses||[]).length){
    var weaknessAttrs={
      'Insufficient Game Pace and Speed':['pace','agility','stamina'],
      'Physical Fragility and Injury Risk':['stamina','strength'],
      'Lack of Physical Presence':['strength','jumping','heading'],
      'Weak Defensive Base':['defending','positioning','tackling'],
      'Poor Defensive Output':['tackling','defending','positioning'],
      'Low Team Chemistry and Leadership':['vision','passing','composure'],
      'Technical Deficiencies Under Pressure':['composure','dribbling','passing'],
      'Tactical Awareness Gaps':['positioning','composure','vision'],
      'Poor Goal Output':['shooting','positioning'],
    };
    (_scoutTeam.team_weaknesses||[]).forEach(function(w){
      var attrs=weaknessAttrs[w]||['overall_rating'];
      var key=attrs[0];
      var v1=dOv(p1[key]);var v2=dOv(p2[key]);
      var n1=p1.first_name+' '+p1.last_name,n2=p2.first_name+' '+p2.last_name;
      var sentence='';
      if(Math.abs(v1-v2)<0.5){
        sentence='Both players are equally matched in this area.';
      } else {
        var winner=v1>v2?n1:n2;var score=v1>v2?v1:v2;
        sentence='<strong>'+winner+'</strong> is the stronger fit with a '+ATTR_LABELS[key]+' score of '+score.toFixed(1)+'.';
      }
      recHtml+='<div class="rec-row">For <strong>'+w+'</strong>: '+sentence+'</div>';
    });
  } else {
    recHtml='<div style="padding:16px;color:#8b949e;text-align:center">Complete your team setup to see recommendations based on your team weaknesses.</div>';
  }

  var n1=p1.first_name+' '+p1.last_name,n2=p2.first_name+' '+p2.last_name;
  var pc1=pColor(p1.position_group),pc2=pColor(p2.position_group);

  document.getElementById('compareResult').innerHTML=
    '<div class="table-card" style="margin-bottom:20px"><div class="table-header"><h3>Head to Head</h3></div><div style="padding:16px">'+
    '<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start;margin-bottom:20px">'+
    '<div style="text-align:center">'+
    '<div class="big-stat" style="color:'+cColor(ov1)+'">'+ov1.toFixed(1)+'</div><div class="stat-label">Overall</div>'+
    '<div style="margin-top:8px;font-size:18px;font-weight:800;color:#1d9e75">'+tv1+'</div><div class="stat-label" style="margin-top:0">Value</div>'+
    '<div style="margin-top:10px;font-size:16px;font-weight:900">'+n1+'</div>'+
    '<div style="font-size:12px;color:#8b949e">'+(p1.age_group||'')+' &bull; '+(p1.specific_position||p1.primary_position||'--')+'</div>'+
    '<div style="font-size:12px;color:#8b949e">'+(p1.team_name||'Free Agent')+'</div>'+
    '</div>'+
    '<div style="text-align:center;padding:16px 0;color:#30363d;font-size:24px;font-weight:900">VS</div>'+
    '<div style="text-align:center">'+
    '<div class="big-stat" style="color:'+cColor(ov2)+'">'+ov2.toFixed(1)+'</div><div class="stat-label">Overall</div>'+
    '<div style="margin-top:8px;font-size:18px;font-weight:800;color:#1d9e75">'+tv2+'</div><div class="stat-label" style="margin-top:0">Value</div>'+
    '<div style="margin-top:10px;font-size:16px;font-weight:900">'+n2+'</div>'+
    '<div style="font-size:12px;color:#8b949e">'+(p2.age_group||'')+' &bull; '+(p2.specific_position||p2.primary_position||'--')+'</div>'+
    '<div style="font-size:12px;color:#8b949e">'+(p2.team_name||'Free Agent')+'</div>'+
    '</div>'+
    '</div>'+
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">'+
    '<thead><tr><th style="text-align:right;padding:6px;font-size:11px;color:#8b949e;font-weight:700;text-transform:uppercase;letter-spacing:.04em">'+n1+'</th><th style="text-align:center;padding:6px"></th><th style="text-align:left;padding:6px;font-size:11px;color:#8b949e;font-weight:700;text-transform:uppercase;letter-spacing:.04em">'+n2+'</th></tr></thead>'+
    '<tbody style="font-size:14px">'+
    statRow('Apps',apps1,apps2)+
    statRow('Goals',goals1,goals2)+
    statRow('Assists',assts1,assts2)+
    statRow('G/Game',gpg1,gpg2)+
    statRow('A/Game',apg1,apg2)+
    statRow('CS/Game',cspg1,cspg2)+
    statRow('Yellow Cards',parseInt(p1.yellow_cards)||0,parseInt(p2.yellow_cards)||0,false)+
    statRow('Red Cards',parseInt(p1.red_cards)||0,parseInt(p2.red_cards)||0,false)+
    '</tbody></table></div>'+
    '</div></div>'+

    '<div class="table-card" style="margin-bottom:20px"><div class="table-header"><h3>Attribute Comparison</h3><div style="display:flex;gap:20px;font-size:12px"><span style="color:#1d9e75;font-weight:700">&#9632; Higher</span><span style="color:#FF9800;font-weight:700">&#9632; Lower</span></div></div><div style="padding:16px">'+
    '<div style="display:grid;grid-template-columns:1fr 52px 1fr;gap:6px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #30363d"><div style="text-align:center;font-size:12px;font-weight:700;color:#ffffff">'+n1+'</div><div></div><div style="text-align:center;font-size:12px;font-weight:700;color:#ffffff">'+n2+'</div></div>'+
    attrHtml+
    '</div></div>'+

    '<div class="table-card"><div class="table-header"><h3>Scout Recommendation</h3><span style="font-size:12px;color:#8b949e">Based on your team weaknesses</span></div><div style="padding:16px">'+
    recHtml+
    '</div></div>';
}

document.addEventListener('DOMContentLoaded',function(){
  initNav();

  // Load scout team for recommendations
  api('GET','/api/scouts/setup').then(function(d){_scoutTeam=d.scoutTeam||null;}).catch(function(){});

  // Load pipeline IDs
  api('GET','/api/scouts/pipeline?limit=200').then(function(d){
    _pipelineIds=(d.data||[]).map(function(r){return r.player_id||((r.players||{}).id);}).filter(Boolean);
  }).catch(function(){});

  // Load all players
  api('GET','/api/players?limit=200').then(function(d){
    _allPlayers=d.data||[];
    populateSelect('player1',_allPlayers.slice(0,200));
    populateSelect('player2',_allPlayers.slice(0,200));
  }).catch(function(e){console.error('load players failed',e.message);});

  // Search handlers
  document.getElementById('search1').addEventListener('input',function(){searchPlayers('search1','player1',_filter1);});
  document.getElementById('search2').addEventListener('input',function(){searchPlayers('search2','player2',_filter2);});

  // Filter buttons
  document.getElementById('f1All').addEventListener('click',function(){
    _filter1='all';this.classList.add('active');document.getElementById('f1Pipeline').classList.remove('active');
    searchPlayers('search1','player1','all');
  });
  document.getElementById('f1Pipeline').addEventListener('click',function(){
    _filter1='pipeline';this.classList.add('active');document.getElementById('f1All').classList.remove('active');
    searchPlayers('search1','player1','pipeline');
  });
  document.getElementById('f2All').addEventListener('click',function(){
    _filter2='all';this.classList.add('active');document.getElementById('f2Pipeline').classList.remove('active');
    searchPlayers('search2','player2','all');
  });
  document.getElementById('f2Pipeline').addEventListener('click',function(){
    _filter2='pipeline';this.classList.add('active');document.getElementById('f2All').classList.remove('active');
    searchPlayers('search2','player2','pipeline');
  });

  // Change handlers
  document.getElementById('player1').addEventListener('change',updateComparison);
  document.getElementById('player2').addEventListener('change',updateComparison);
});
</script>
<script src="../js/mobile.js"></script>
</body></html>
