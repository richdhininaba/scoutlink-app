<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contracts & Pay - ScoutLink Stratex</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.contracts-layout{display:grid;gap:16px}
.contracts-card{background:#0f1620;border:1px solid rgba(148,163,184,.18);border-radius:14px;overflow:hidden}
.contracts-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid rgba(148,163,184,.14)}
.contracts-head h3{margin:0;font-size:18px}.contracts-head p{margin:4px 0 0;color:#8ea2b5;font-size:12px}
.contracts-table{display:grid}
.contract-row{display:grid;grid-template-columns:minmax(240px,1.4fr) minmax(180px,.9fr) minmax(190px,.9fr) minmax(120px,.6fr) minmax(250px,1fr);gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid rgba(148,163,184,.12)}
.contract-row:last-child{border-bottom:0}
.contract-person b{display:block;color:#fff;font-size:14px}.contract-person span,.contract-field span{display:block;color:#8ea2b5;font-size:12px;line-height:1.45;overflow-wrap:anywhere}
.contract-field b{display:block;color:#fff;font-size:13px;margin-top:3px}
.contract-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.contract-pay-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;padding:14px 20px;background:#0b111c;border-top:1px solid rgba(148,163,184,.12)}
.contract-pay-form input,.contract-pay-form select{min-height:38px}
.contract-upload{display:none}
.contract-edit-panel{display:none}
.contract-row.editing + .contract-edit-panel{display:grid}
.contract-empty{padding:24px;color:#8ea2b5}
@media(max-width:1100px){
  .contract-row{grid-template-columns:1fr 1fr;align-items:start}
  .contract-actions{justify-content:flex-start}
  .contract-pay-form{grid-template-columns:1fr 1fr}
}
@media(max-width:767px){
  .contracts-head{padding:14px 16px;align-items:flex-start;display:grid}
  .contract-row{display:grid;grid-template-columns:1fr;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;margin:12px 0;padding:14px}
  .contracts-table{padding:0 16px 16px}
  .contract-person b,.contract-field b{color:#111827}
  .contract-person span,.contract-field span{color:#64748b}
  .contract-actions{display:grid;grid-template-columns:1fr 1fr}
  .contract-actions .btn{width:100%;height:40px}
  .contract-pay-form{grid-template-columns:1fr;padding:12px;border:1px solid #e5e7eb;border-radius:14px;background:#f8fafc;margin:0 0 12px}
}
</style><link rel="stylesheet" href="/css/phone-base.css">
<link rel="stylesheet" href="/css/phone-shell.css">
<link rel="stylesheet" href="/css/phone-pages.css">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Contracts & Pay</span><div class="topbar-right"><button class="btn btn-sm btn-outline" onclick="loadContracts()">Refresh</button><button class="btn btn-sm btn-ghost" onclick="logout()">Sign out</button></div></div>
<div class="page-content">
<div class="form-error" id="err"></div><div class="form-success" id="ok"></div>
<section class="contracts-card">
  <div class="contracts-head">
    <div><h3>Contracts and pay</h3><p>Secure contract uploads and pay metadata for your reporting tree only.</p></div>
    <a class="btn btn-sm btn-outline" href="stratex-users.html">Manage admins</a>
  </div>
  <div class="contracts-table" id="contracts"><div class="loading-state"><div class="spinner"></div></div></div>
</section>
</div></div></div>
<script src="../js/stratex-nav.js"></script>
<script src="../js/main.js"></script>
<script>
var contractRows=[],canEditContracts=false;
function logout(){logoutToLogin();}
function safe(v){return String(v==null||v===''?'--':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function show(id,msg){var el=document.getElementById(id);el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},3500);}
function money(v){var n=Number(v);return Number.isFinite(n)&&n>0?'\u00a3'+n.toLocaleString('en-GB',{maximumFractionDigits:0}):'Not set';}
function payText(c){if(!c)return'Not set';var amount=money(c.payAmount||c.salary||c.pay);var freq=c.payFrequency||c.frequency||'';return amount+(freq&&amount!=='Not set'?' / '+freq:'');}
function contractText(c){if(!c||!c.contractPath)return'Not uploaded';return c.contractFileName||'Uploaded contract';}
function badge(active){return active?'<span class="badge badge-green">Active</span>':'<span class="badge badge-red">Inactive</span>';}
function rowHtml(a){
  var c=a.contract_data||{};
  var disabled=canEditContracts?'':'disabled';
  return '<article class="contract-row" id="row-'+safe(a.id)+'">'+
    '<div class="contract-person"><b>'+safe((a.first_name||'')+' '+(a.last_name||''))+'</b><span>'+safe(a.job_title||a.admin_role||a.role)+' - '+safe(a.email)+'</span></div>'+
    '<div class="contract-field"><span>Contract</span><b>'+safe(contractText(c))+'</b></div>'+
    '<div class="contract-field"><span>Pay</span><b>'+safe(payText(c))+'</b></div>'+
    '<div class="contract-field"><span>Status</span>'+badge(a.is_active)+'</div>'+
    '<div class="contract-actions">'+
      '<button class="btn btn-sm btn-outline" onclick="downloadContract(\''+a.id+'\')" '+(!c.contractPath?'disabled':'')+'>Download</button>'+
      '<label class="btn btn-sm btn-outline '+(!canEditContracts?'disabled':'')+'" '+(!canEditContracts?'aria-disabled="true"':'')+'>Upload<input class="contract-upload" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onchange="uploadContract(\''+a.id+'\',this)" '+disabled+'></label>'+
      '<button class="btn btn-sm btn-primary" onclick="toggleEdit(\''+a.id+'\')" '+disabled+'>Edit pay</button>'+
    '</div>'+
  '</article>'+
  '<section class="contract-edit-panel" id="edit-'+safe(a.id)+'">'+
    '<div class="contract-pay-form">'+
      '<input id="payAmount-'+safe(a.id)+'" type="number" min="0" placeholder="Pay amount" value="'+safe(c.payAmount||c.salary||'')+'">'+
      '<select id="payFrequency-'+safe(a.id)+'"><option value="">Frequency</option>'+['Hourly','Daily','Monthly','Annually'].map(function(x){return'<option '+((c.payFrequency||'')===x?'selected':'')+'>'+x+'</option>';}).join('')+'</select>'+
      '<select id="payStatus-'+safe(a.id)+'"><option value="">Status</option>'+['Active','Pending','Paused','Ended'].map(function(x){return'<option '+((c.payStatus||'')===x?'selected':'')+'>'+x+'</option>';}).join('')+'</select>'+
      '<button class="btn btn-primary" onclick="savePay(\''+a.id+'\')">Save</button>'+
    '</div>'+
  '</section>';
}
function render(rows){
  var box=document.getElementById('contracts');
  if(!rows.length){box.innerHTML='<div class="contract-empty">No visible contract records for your account.</div>';return;}
  box.innerHTML=rows.map(rowHtml).join('');
}
function toggleEdit(id){var row=document.getElementById('row-'+id);if(row)row.classList.toggle('editing');}
async function loadContracts(){
  var d=await api('GET','/api/stratex/contracts-pay');
  contractRows=d.data||[];canEditContracts=!!d.canEdit;render(contractRows);
  if(window.refreshMobileLayout)window.refreshMobileLayout();
}
async function savePay(id){
  try{
    await api('PATCH','/api/stratex/contracts-pay/'+id+'/pay',{
      payAmount:document.getElementById('payAmount-'+id).value,
      payFrequency:document.getElementById('payFrequency-'+id).value,
      payStatus:document.getElementById('payStatus-'+id).value
    });
    show('ok','Pay details updated.');await loadContracts();
  }catch(e){show('err',e.message);}
}
async function uploadContract(id,input){
  try{
    if(!input.files||!input.files[0])return;
    var fd=new FormData();fd.append('contract',input.files[0]);
    var token=localStorage.getItem('sl_token')||'';
    var res=await fetch(API+'/api/stratex/contracts-pay/'+encodeURIComponent(id)+'/contract',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});
    var json=await res.json().catch(function(){return{};});
    if(!res.ok)throw new Error(json.error||'Could not upload contract');
    show('ok','Contract uploaded.');await loadContracts();
  }catch(e){show('err',e.message);}finally{input.value='';}
}
async function downloadContract(id){
  try{
    var d=await api('GET','/api/stratex/contracts-pay/'+id+'/contract-url');
    window.open(d.url,'_blank','noopener');
  }catch(e){show('err',e.message);}
}
document.addEventListener('DOMContentLoaded',function(){initStratexPage();loadContracts().catch(function(e){document.getElementById('contracts').innerHTML='<div class="contract-empty" style="color:#dc2626">'+safe(e.message)+'</div>';});});
</script>
<script src="/js/phone-routes.js"></script>
<script src="/js/phone-shell.js"></script>
<script src="/js/phone-pages.js"></script>
</body></html>
