<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Pipeline - ScoutLink</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">⚡ Scout<span style="color:#00E676">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">📋 My Pipeline</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()">🔔<span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button>
</div>
</div>
<div class="page-content">

<div class="table-card">
<div class="table-header"><div><h3>My Recruitment Pipeline</h3><p style="font-size:12px;color:#546E7A">FA/UEFA-aligned stages: Watching → Shortlisted → Approached → Negotiating</p></div><a href="player-search.html" class="btn btn-sm btn-outline">Find Players</a></div>
<div id="pipelineContent"><div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Loading pipeline...</span></div></div>
</div>
<script>
(async function(){
try{
var d=await api('GET','/api/scouts/pipeline?limit=50');
var rows=d.data||[];
if(!rows.length){document.getElementById('pipelineContent').innerHTML='<div style="text-align:center;padding:40px;color:#546E7A"><p>No players in your pipeline yet. Browse the player database to find your first match.</p><a href="player-search.html" class="btn btn-primary" style="margin-top:14px">Browse Players</a></div>';return;}
function compatColor(s){return s>=80?'#00E676':s>=65?'#FFC107':s>=50?'#FF9800':'#f44336';}
function stageClass(s){var m={'watching':'stage-watching','shortlisted':'stage-shortlisted','interested':'stage-shortlisted','approached':'stage-approached','trial_pending':'stage-approached','negotiating':'stage-negotiating'};return m[(s||'').toLowerCase().replace(/ /g,'_')]||'stage-watching';}
function dispOv(v){var n=parseFloat(v);return isNaN(n)?'--':(n>10?n/10:n).toFixed(1);}
document.getElementById('pipelineContent').innerHTML='<div style="overflow-x:auto"><table class="sl-table"><thead><tr><th>Player</th><th>Position</th><th>Overall</th><th>Club</th><th>Stage</th><th>Added</th></tr></thead><tbody>'+
rows.map(function(r){
var p=r.players||{};
var ov=dispOv(p.overall_rating);
var ovN=parseFloat(p.overall_rating||0);var ovP=ovN>10?ovN:ovN*10;
return '<tr onclick="location.href=\'player-profile.html?id='+p.id+'\'" style="cursor:pointer">'+
'<td><div style="display:flex;align-items:center;gap:8px"><div class="user-avatar" style="width:32px;height:32px;font-size:11px">'+initials(p.first_name,p.last_name)+'</div><div><b>'+(p.first_name||'')+' '+(p.last_name||'')+'</b><div style="font-size:11px;color:#546E7A">'+(p.age||'--')+' yrs</div></div></div></td>'+
'<td>'+(p.specific_position||p.primary_position||'--')+'</td>'+
'<td style="color:'+compatColor(ovP)+';font-weight:700">'+ov+'</td>'+
'<td style="color:#546E7A;font-size:12px">'+(p.team_name||'--')+'</td>'+
'<td><span class="stage-chip '+stageClass(r.stage)+'">'+(r.stage||'watching').replace(/_/g,' ')+'</span></td>'+
'<td style="color:#546E7A;font-size:11px">'+relTime(r.created_at)+'</td>'+
'</tr>';
}).join('')+'</tbody></table></div>';
}catch(e){document.getElementById('pipelineContent').innerHTML='<div style="text-align:center;padding:40px;color:#546E7A">Could not load pipeline data.<br><a href="player-search.html" class="btn btn-primary" style="margin-top:14px">Browse Players</a></div>';}
})();
</script>
</div>
</div>
</div>
<script src="../js/main.js"></script>
<script>
var SCOUT_NAV=[
  {icon:'🏠',label:'Dashboard',href:'scout-dashboard.html'},
  {icon:'🔍',label:'Player Search',href:'player-search.html'},
  {icon:'📋',label:'My Pipeline',href:'scout-pipeline.html'},
  {icon:'🏆',label:'Rankings',href:'scout-rankings.html'},
  {icon:'📅',label:'Fixtures',href:'scout-fixtures.html'},
  {icon:'🔮',label:'Predictions',href:'scout-predictions.html'},
  {icon:'📊',label:'Exports',href:'scout-exports.html'},
  {icon:'⚙️',label:'My Team Setup',href:'scout-setup.html'},
  {icon:'🔔',label:'Notifications',href:'scout-notifications.html'},
  {icon:'👤',label:'Settings',href:'scout-settings.html'},
];
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Scout'){window.location.href='login.html';return;}
  var nav=document.getElementById('sidebarNav');
  var cur=window.location.pathname.split('/').pop();
  if(nav) nav.innerHTML=SCOUT_NAV.map(function(i){return '<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'">'+i.icon+' '+i.label+'</a>';}).join('');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u) uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#00E676;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Scout</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){}
document.addEventListener('DOMContentLoaded',function(){initNav();});
</script>
</body></html>
