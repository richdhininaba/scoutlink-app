<style>
.step-indicator{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.step{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;border:2px solid #30363d;color:#8b949e;}
.step.active{border-color:#1d9e75;color:#1d9e75;background:rgba(29,158,117,.08);}
.step.done{border-color:rgba(29,158,117,.4);color:rgba(29,158,117,.7);background:rgba(29,158,117,.04);}
.mode-card{background:#161b22;border:2px solid #30363d;border-radius:14px;padding:24px;cursor:pointer;transition:all .2s;text-align:center;}
.mode-card:hover,.mode-card.sel{border-color:#1d9e75;background:rgba(29,158,117,.06);}
.mode-icon{font-size:40px;margin-bottom:12px;}
.mode-title{font-size:16px;font-weight:700;margin-bottom:6px;}
.mode-desc{font-size:12px;color:#8b949e;}
.rating-row{display:grid;grid-template-columns:100px 1fr 40px;gap:12px;align-items:center;margin-bottom:10px;}
.rating-label{font-size:13px;font-weight:600;color:#8b949e;}
.rating-slider{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#1e2a3a;outline:none;width:100%;}
.rating-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#1d9e75;cursor:pointer;}
.rating-val{font-size:14px;font-weight:700;color:#1d9e75;text-align:center;}
.player-rating-card{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:16px;margin-bottom:12px;}
.confirm-row{display:flex;align-items:center;gap:12px;background:rgba(29,158,117,.06);border:1px solid rgba(29,158,117,.2);border-radius:8px;padding:14px 16px;}
.form-select{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:8px 12px;color:#ffffff;font-size:13px;font-family:inherit;width:100%;}
.form-input-sm{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 14px;color:#ffffff;font-size:14px;font-family:inherit;width:100%;box-sizing:border-box;outline:none;}
.form-input-sm:focus{border-color:#1d9e75;}
.score-box{text-align:center;}
.score-box label{font-size:12px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:8px;}
.score-input{background:#161b22;border:2px solid #30363d;border-radius:10px;padding:12px 0;color:#ffffff;font-size:28px;font-weight:900;font-family:inherit;width:80px;text-align:center;outline:none;-moz-appearance:textfield;}
.score-input::-webkit-inner-spin-button,.score-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.score-input:focus{border-color:#1d9e75;}
.score-vs{font-size:20px;font-weight:900;color:#8b949e;padding:0 8px;margin-top:28px;}
/* ===== PITCH STYLES ===== */
.pitch-wrap{max-width:480px;margin:0 auto;position:relative;user-select:none;}
.pitch-svg-container{position:relative;width:100%;padding-bottom:148%;background:#2d6a35;border-radius:12px;overflow:visible;}
.pitch-svg-container svg{position:absolute;top:0;left:0;width:100%;height:100%;}
.pos-slot{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#1a2a1a;border:2px solid rgba(255,255,255,0.6);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;z-index:10;}
.pos-slot:hover{border-color:#fff;background:#243424;}
.pos-slot.assigned{background:#1d9e75;border-color:#1d9e75;}
.pos-slot.assigned:hover{background:#16805e;}
.pos-slot.sub-off{background:#444;border-color:#666;opacity:.7;}
.pos-slot .pos-label{font-size:9px;font-weight:700;color:rgba(255,255,255,0.8);letter-spacing:.05em;text-align:center;line-height:1;}
.pos-slot .pos-initials{font-size:13px;font-weight:900;color:#fff;letter-spacing:-.5px;text-align:center;line-height:1;}

.pos-slot .event-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:900;}
.pos-slot .card-badge{position:absolute;top:-4px;left:-4px;width:10px;height:16px;border-radius:2px;}
.pos-slot.yc-border{border-color:#FFC107 !important;box-shadow:0 0 8px rgba(255,193,7,.5);}
.pos-slot.rc-border{border-color:#f44336 !important;box-shadow:0 0 8px rgba(244,67,54,.5);opacity:.6;}
.action-menu{position:absolute;z-index:100;background:#1e2a3a;border:1px solid #30363d;border-radius:10px;padding:6px;min-width:160px;box-shadow:0 4px 20px rgba(0,0,0,.6);}

// Determine position group from slot key
function posGroupFromSlot(key){
  var k=key.toUpperCase();
  if(k==='GK') return 'Goalkeeper';
  if(k.indexOf('CB')>=0||k.indexOf('LB')>=0||k.indexOf('RB')>=0||k.indexOf('WB')>=0) return 'Defender';
  if(k.indexOf('CM')>=0||k.indexOf('DM')>=0||k.indexOf('AM')>=0||k.indexOf('LM')>=0||k.indexOf('RM')>=0) return 'Midfielder';
  return 'Forward';
}

function setStep(n){
  currentStep=n;
  ['s1','s2','s3','s4','s5'].forEach(function(id,i){
    var el=document.getElementById(id);
    if(el) el.className='step'+(i+1===n?' active':i+1<n?' done':'');
  });
}

function initials(f,l){return ((f||'?')[0]+(l||'?')[0]).toUpperCase();}
function playerName(id){var p=myPlayers.find(function(x){return x.id===id;});return p?((p.first_name||'')+' '+(p.last_name||'')).trim():'Unknown';}
function playerInitials(id){var p=myPlayers.find(function(x){return x.id===id;});return p?initials(p.first_name,p.last_name):'??';}
function fixtureDateValue(fx){return fx&&fx.fixture_date?String(fx.fixture_date).slice(0,10):'';}
function fixtureLabel(fx){
  var date=fixtureDateValue(fx)||'TBC';
  var loc=fx.home_or_away==='Away'?'@':'vs';
  return date+' '+loc+' '+(fx.opponent||'Opponent');
}
function applySelectedFixture(id){
  var fx=(state.fixtures||[]).find(function(f){return f.id===id;});
  if(!fx)return;
  var opp=document.getElementById('mfOpponent');
  var dt=document.getElementById('mfDate');
  var fmt=document.getElementById('mfFormat');
  var formation=document.getElementById('mfFormation');
  state.opponent=fx.opponent||'';
  state.matchDate=fixtureDateValue(fx);
  if(opp)opp.value=fx.opponent||'';
  if(dt)dt.value=fixtureDateValue(fx);
  if(fmt&&fx.format){
    state.format=String(fx.format);
    fmt.value=state.format;
    if(formation){
      formation.innerHTML=(FORMATIONS[fmt.value]||FORMATIONS['11']).map(function(f){return '<option value="'+f+'">'+f+'</option>';}).join('');
    }
  }
}

function goToStep2(){
  state.fixtureId=document.getElementById('mfFixture').value||null;
  state.opponent=document.getElementById('mfOpponent').value.trim();
  state.matchDate=document.getElementById('mfDate').value;
  state.format=document.getElementById('mfFormat').value;
  state.formation=document.getElementById('mfFormation').value;
  if(!state.opponent||!state.matchDate){alert('Please fill in opponent and date.');return;}
  if(!state.mode){alert('Please select a match mode (Post-game or Live).');return;}
  state.players=[];
  document.querySelectorAll('.player-check:checked').forEach(function(cb){
    state.players.push({id:cb.value,name:cb.getAttribute('data-name'),position:cb.getAttribute('data-pos')});
  });
  if(state.mode==='live'){
    renderStep2Live();
  } else {
    renderStep2Post();
  }
}

function renderStep2Live(){
  setStep(2);
  var slots=FORMATION_SLOTS[state.formation]||FORMATION_SLOTS['4-4-2'];
  var pitchHtml=buildPitchHtml(slots,true);
  var assignedCount=Object.keys(state.playerPositions).filter(function(k){return state.playerPositions[k];}).length;
  var allAssigned=assignedCount===slots.length;

  document.getElementById('stepContent').innerHTML=

  '<div class="pitch-wrap" id="pitchWrap">'+pitchHtml+'</div>'+
  '<div id="playerDropdownPanel" style="display:none;margin-top:12px"></div>'+
  '<div id="assignStatus" style="margin-top:12px;font-size:13px;color:#8b949e;text-align:center">'+(allAssigned?'<span style="color:#1d9e75;font-weight:700">All positions assigned &#10003;</span>':'Tap a position circle to assign a player')+'</div>'+
  '<div style="display:flex;gap:12px;margin-top:16px">'+
  '<button class="btn btn-ghost" id="backToStep1Btn">&#8592; Back</button>'+
  '<button class="btn btn-primary" id="nextToStep3Btn"'+(allAssigned?'':' disabled')+'>Next: Start match &#8594;</button>'+

function buildPitchHtml(slots,isAssignment){
  // SVG pitch markings
  var pitchSvg='<svg viewBox="0 0 100 148" preserveAspectRatio="xMidYMid meet" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none">'+
  // Background already green from CSS
  // Outer border
  '<rect x="2" y="2" width="96" height="144" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>'+
  // Centre line
  '<line x1="2" y1="74" x2="98" y2="74" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>'+
  // Centre circle
  '<circle cx="50" cy="74" r="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>'+
  '<circle cx="50" cy="74" r="0.8" fill="rgba(255,255,255,0.5)"/>'+
  // Top penalty area (opponent goal)
  '<rect x="22" y="2" width="56" height="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>'+
  '<rect x="36" y="2" width="28" height="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>'+
  // Top goal
  '<rect x="41" y="0.5" width="18" height="3" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="0.4"/>'+
  // Bottom penalty area (our goal)
  '<rect x="22" y="126" width="56" height="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>'+
  '<rect x="36" y="136" width="28" height="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>'+
  // Bottom goal
  '<rect x="41" y="144.5" width="18" height="3" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="0.4"/>'+
  // Corner arcs
  '<path d="M2,6 Q4,2 6,2" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>'+
  '<path d="M94,2 Q98,2 98,6" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>'+
  '<path d="M2,142 Q2,146 6,146" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>'+
  '<path d="M94,146 Q98,146 98,142" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>'+
  '</svg>';

  var slotsHtml=slots.map(function(slot){
    var pid=state.playerPositions[slot.key]||null;
    var isSubOff=(state.events||[]).some(function(e){return e.type==='substitution'&&e.playerOffId===pid;});
    var eventsForPid=pid?(state.events||[]).filter(function(e){return e.playerId===pid||e.playerOnId===pid;}):[];
    var goalCount=eventsForPid.filter(function(e){return e.type==='goal';}).length;
    var hasAssist=eventsForPid.some(function(e){return e.type==='assist';});
    var hasYC=eventsForPid.some(function(e){return e.type==='yellow_card';});
    var hasRC=eventsForPid.some(function(e){return e.type==='red_card';});

    var cls='pos-slot'+(pid?' assigned':'')+(isSubOff?' sub-off':'')+(hasYC?' yc-border':'')+(hasRC?' rc-border':'');
    var inner=pid?
      '<div class="pos-initials">'+playerInitials(pid)+'</div>'+
      (isAssignment?'<div class="pos-name" style="max-width:58px">'+playerName(pid).split(' ')[0]+'</div>':'')+
      (goalCount>0?'<div class="event-badge" style="background:#FFD700;color:#000">'+goalCount+'</div>':'')+
      (hasAssist&&!goalCount?'<div class="event-badge" style="background:#42A5F5;color:#fff">A</div>':'')+
      (isSubOff?'<div class="event-badge" style="background:#888;color:#fff;font-size:8px">OFF</div>':''):
      '<div class="pos-label">'+slot.label+'</div>';

    return '<div class="pos-slot" id="pslot-'+slot.key+'" class="'+cls+'" data-key="'+slot.key+'" style="top:'+slot.top+'%;left:'+slot.left+'%">'+inner+'</div>';
  }).join('');

  // After building, apply classes via script
  return '<div class="pitch-svg-container" id="pitchSvg">'+pitchSvg+slotsHtml+'</div>';
}

function attachPitchSlotListeners(slots,isAssignment){
  slots.forEach(function(slot){
    var el=document.getElementById('pslot-'+slot.key);
    if(!el) return;
    // Apply correct class
    refreshSlotUI(slot.key);
    el.addEventListener('click',function(e){
      e.stopPropagation();
      if(isAssignment){
        openAssignDropdown(slot.key,slots);
      } else {
        openActionMenu(slot.key);
      }
    });
  });
  // Close menu on pitch click
  var pitchEl=document.getElementById('pitchSvg');
  if(pitchEl){
    pitchEl.addEventListener('click',function(){
      var m=document.getElementById('actionMenu');
      if(m) m.remove();
    });
  }
}

function refreshSlotUI(key){
  var el=document.getElementById('pslot-'+key);
  if(!el) return;
  var pid=state.playerPositions[key]||null;
  var slot=getAllSlots().find(function(s){return s.key===key;});
  var isSubOff=pid&&(state.events||[]).some(function(e){return e.type==='substitution'&&e.playerOffId===pid;});
  var evts=pid?(state.events||[]).filter(function(e){return e.playerId===pid||e.playerOnId===pid;}):[];
  var goalCount=evts.filter(function(e){return e.type==='goal';}).length;
  var hasAssist=evts.some(function(e){return e.type==='assist';});
  var hasYC=evts.some(function(e){return e.type==='yellow_card';});
  var hasRC=evts.some(function(e){return e.type==='red_card';});

  el.className='pos-slot'+(pid?' assigned':'')+(isSubOff?' sub-off':'')+(hasYC?' yc-border':'')+(hasRC?' rc-border':'');
  el.innerHTML=pid?
    '<div class="pos-initials">'+playerInitials(pid)+'</div>'+
    '<div class="pos-name">'+playerName(pid).split(' ')[0]+'</div>'+
    (goalCount>0?'<div class="event-badge" style="background:#FFD700;color:#000">'+goalCount+'</div>':'')+
    (hasAssist&&!goalCount?'<div class="event-badge" style="background:#42A5F5;color:#fff">A</div>':'')+
    (isSubOff?'<div class="event-badge" style="background:#888;color:#fff;font-size:8px">OFF</div>':''):
    '<div class="pos-label">'+(slot?slot.label:key)+'</div>';
}

function getAllSlots(){return FORMATION_SLOTS[state.formation]||FORMATION_SLOTS['4-4-2'];}

function openAssignDropdown(slotKey,slots){
  var panel=document.getElementById('playerDropdownPanel');
  var pid=state.playerPositions[slotKey]||null;
  var assignedIds=Object.values(state.playerPositions).filter(Boolean);
  var slot=slots.find(function(s){return s.key===slotKey;});

  var options=state.players.map(function(p){
    var taken=assignedIds.indexOf(p.id)>=0&&p.id!==pid;
    return '<option value="'+p.id+'"'+(p.id===pid?' selected':'')+(taken?' disabled':'')+'>'+p.name+(taken?' (assigned)':'')+'</option>';
  }).join('');

  panel.style.display='block';
  panel.innerHTML='<div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px">'+
  '<div style="font-size:12px;font-weight:700;color:#8b949e;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em">Assign player to '+slotKey+'</div>'+
  '<select id="assignSelect" class="form-select" style="margin-bottom:10px">'+
  '<option value="">Select player...</option>'+options+'</select>'+
  '<div style="display:flex;gap:8px">'+
  '<button class="btn btn-primary btn-sm" id="confirmAssignBtn">Assign</button>'+
  (pid?'<button class="btn btn-ghost btn-sm" id="unassignBtn">Unassign</button>':'')+
  '<button class="btn btn-ghost btn-sm" id="cancelAssignBtn">Cancel</button>'+
  '</div></div>';

  document.getElementById('confirmAssignBtn').addEventListener('click',function(){
    var sel=document.getElementById('assignSelect').value;
    if(!sel){alert('Please select a player.');return;}
    state.playerPositions[slotKey]=sel;
    refreshSlotUI(slotKey);
    panel.style.display='none';
    updateAssignStatus(slots);
  });
  if(pid){
    document.getElementById('unassignBtn').addEventListener('click',function(){
      delete state.playerPositions[slotKey];
      refreshSlotUI(slotKey);
      panel.style.display='none';
      updateAssignStatus(slots);
    });
  }
  document.getElementById('cancelAssignBtn').addEventListener('click',function(){panel.style.display='none';});
}

function updateAssignStatus(slots){
  var total=slots.length;
  var assigned=Object.keys(state.playerPositions).filter(function(k){return state.playerPositions[k];}).length;
  var allDone=assigned===total;
  var statusEl=document.getElementById('assignStatus');
  var nextBtn=document.getElementById('nextToStep3Btn');
  if(statusEl) statusEl.innerHTML=allDone?'<span style="color:#1d9e75;font-weight:700">All positions assigned &#10003;</span>':assigned+' of '+total+' positions assigned';
  if(nextBtn) nextBtn.disabled=!allDone;
}

  setStep(3);
  if(state.timerInterval) clearInterval(state.timerInterval);

  document.getElementById('stepContent').innerHTML=

  // Timer
  '<div style="text-align:center;margin-bottom:16px">'+
  '<div class="timer-display" id="timerDisp">00:00</div>'+

  '<div style="display:flex;justify-content:center;gap:10px;margin-top:12px">'+

  '<button class="btn btn-danger" id="fullTimeBtn">Full time</button>'+
  '</div></div>'+

  '<div id="eventsLog" style="max-height:160px;overflow-y:auto;font-size:12px;color:#8b949e">No events yet</div>'+

function toggleTimer(){
  var btn=document.getElementById('timerToggleBtn');
  if(state.timerInterval){
    clearInterval(state.timerInterval);
    state.timerInterval=null;
    if(btn) btn.textContent='Resume timer';
  } else {
    state.timerInterval=setInterval(function(){
      if(!state.halfTimePaused){
        state.timerSeconds++;
        updateTimerDisplay();
      }
    },1000);
    if(btn) btn.textContent='Pause timer';
  }
}

function updateTimerDisplay(){
  var el=document.getElementById('timerDisp');
  if(!el) return;
  var m=Math.floor(state.timerSeconds/60),s=state.timerSeconds%60;
  el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  var scoreEl=document.getElementById('timerScore');
  if(scoreEl) scoreEl.textContent=state.liveGoals+' - 0';
}

function triggerHalfTime(){
  state.halfTimePaused=true;
  if(state.timerInterval){clearInterval(state.timerInterval);state.timerInterval=null;}
  var ov=document.getElementById('halfTimeOverlay');
  if(ov){
    ov.style.display='flex';
    ov.style.flexDirection='column';
    var hs=document.getElementById('htScore');
    if(hs) hs.textContent=state.liveGoals+' - 0';
  }
  document.getElementById('resumeBtn').addEventListener('click',function(){
    state.halfTimePaused=false;
    var ovel=document.getElementById('halfTimeOverlay');
    if(ovel) ovel.style.display='none';
    state.timerInterval=setInterval(function(){
      state.timerSeconds++;
      updateTimerDisplay();
    },1000);
    var tb=document.getElementById('timerToggleBtn');
    if(tb) tb.textContent='Pause timer';
  });
}

function triggerFullTime(){
  if(!confirm('End the match and proceed to player ratings?')) return;
  if(state.timerInterval){clearInterval(state.timerInterval);state.timerInterval=null;}
  state.halfTimePaused=false;
  // Determine which players participated (starters + subs on)
  var starters=Object.values(state.playerPositions).filter(Boolean);
  var subsOn=(state.events||[]).filter(function(e){return e.type==='substitution';}).map(function(e){return e.playerOnId;});
  var allActive=[...new Set([...starters,...subsOn])];
  // Narrow state.players to only active
  state.players=state.players.filter(function(p){return allActive.indexOf(p.id)>=0;});
  // Tally live stats into goals/yellowCards/redCards
  state.goals=(state.events||[]).filter(function(e){return e.type==='goal';}).map(function(e){return {player:e.playerId,assist:'',minute:e.minute};});
  state.yellowCards=[...(new Set((state.events||[]).filter(function(e){return e.type==='yellow_card';}).map(function(e){return e.playerId;})))];
  state.redCards=[...(new Set((state.events||[]).filter(function(e){return e.type==='red_card';}).map(function(e){return e.playerId;})))];
  renderStep4();
}

/* ===== ACTION MENU ===== */
function openActionMenu(slotKey){
  // Remove existing
  var old=document.getElementById('actionMenu');
  if(old){old.style.display='none';old.innerHTML='';}
  var pid=state.playerPositions[slotKey];
  if(!pid) return;
  var pName=playerName(pid);
  var isSubOff=(state.events||[]).some(function(e){return e.type==='substitution'&&e.playerOffId===pid;});
  if(isSubOff){alert(pName+' has been substituted off.');return;}

  var menu=document.getElementById('actionMenu');
  menu.style.display='block';
  menu.innerHTML='<div style="font-size:12px;font-weight:700;color:#1d9e75;margin-bottom:6px;text-transform:uppercase">'+pName+'</div>'+
  '<div class="action-menu">'+
  '<button id="amGoal">&#9917; Goal scored</button>'+
  '<button id="amAssist">&#128314; Assist</button>'+
  '<div class="sep"></div>'+
  '<button id="amYC" style="color:#FFC107">&#9646; Yellow card</button>'+
  '<button id="amRC" style="color:#f44336">&#9646; Red card</button>'+
  '<div class="sep"></div>'+
  '<button id="amSub">&#8645; Substitution out</button>'+
  '<div class="sep"></div>'+
  '<button id="amClose" style="color:#8b949e">Close</button>'+
  '</div>';

  var min=Math.floor(state.timerSeconds/60);

  document.getElementById('amGoal').addEventListener('click',function(){
    state.events.push({type:'goal',playerId:pid,minute:min});
    state.liveGoals++;
    updateTimerDisplay();
    refreshSlotUI(slotKey);
    updateEventsLog();
    menu.style.display='none';
  });
  document.getElementById('amAssist').addEventListener('click',function(){
    state.events.push({type:'assist',playerId:pid,minute:min});
    refreshSlotUI(slotKey);
    updateEventsLog();
    menu.style.display='none';
  });
  document.getElementById('amYC').addEventListener('click',function(){
    state.events.push({type:'yellow_card',playerId:pid,minute:min});
    refreshSlotUI(slotKey);
    updateEventsLog();
    menu.style.display='none';
  });
  document.getElementById('amRC').addEventListener('click',function(){
    state.events.push({type:'red_card',playerId:pid,minute:min});
    refreshSlotUI(slotKey);
    updateEventsLog();
    menu.style.display='none';
  });
  document.getElementById('amSub').addEventListener('click',function(){
    menu.style.display='none';
    openSubPanel(slotKey,pid,min);
  });
  document.getElementById('amClose').addEventListener('click',function(){menu.style.display='none';});
}

function openSubPanel(slotKey,playerOffId,min){
  var panel=document.getElementById('subPanel');
  // Bench players: in state.players but NOT currently in player_positions values
  var onPitch=Object.values(state.playerPositions).filter(Boolean);
  var bench=state.players.filter(function(p){return onPitch.indexOf(p.id)<0;});
  if(!bench.length){
    panel.style.display='block';
    panel.innerHTML='<div style="color:#8b949e;font-size:13px">No substitutes available on the bench.</div>'+
    '<button class="btn btn-ghost btn-sm" style="margin-top:8px" id="closeSub">Close</button>';
    document.getElementById('closeSub').addEventListener('click',function(){panel.style.display='none';});
    return;
  }
  var opts=bench.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('');
  panel.style.display='block';
  panel.innerHTML='<div style="font-size:13px;font-weight:700;margin-bottom:10px">Substitution</div>'+
  '<div style="font-size:12px;color:#8b949e;margin-bottom:4px">Player off: <b style="color:#fff">'+playerName(playerOffId)+'</b></div>'+
  '<div style="margin-bottom:10px"><label style="font-size:12px;color:#8b949e;display:block;margin-bottom:4px">Player on:</label>'+
  '<select id="subInSelect" class="form-select">'+opts+'</select></div>'+
  '<div style="display:flex;gap:8px">'+
  '<button class="btn btn-primary btn-sm" id="confirmSubBtn">Confirm sub</button>'+
  '<button class="btn btn-ghost btn-sm" id="cancelSubBtn">Cancel</button>'+
  '</div>';

  document.getElementById('confirmSubBtn').addEventListener('click',function(){
    var newPid=document.getElementById('subInSelect').value;
    if(!newPid) return;
    state.events.push({type:'substitution',playerOffId:playerOffId,playerOnId:newPid,minute:min});
    // Update player_positions
    state.playerPositions[slotKey]=newPid;
    refreshSlotUI(slotKey);
    updateEventsLog();
    panel.style.display='none';
  });
  document.getElementById('cancelSubBtn').addEventListener('click',function(){panel.style.display='none';});
}

function updateEventsLog(){
  var el=document.getElementById('eventsLog');
  if(!el) return;
  if(!state.events.length){el.textContent='No events yet';return;}
  el.innerHTML=state.events.map(function(e){
    var min=(e.minute||0)+'min';
    if(e.type==='goal') return '<div style="padding:3px 0">&#9917; '+min+' Goal Ã¢ÂÂ '+playerName(e.playerId)+'</div>';
    if(e.type==='assist') return '<div style="padding:3px 0">&#128314; '+min+' Assist Ã¢ÂÂ '+playerName(e.playerId)+'</div>';
    if(e.type==='yellow_card') return '<div style="padding:3px 0;color:#FFC107">&#9646; '+min+' Yellow card Ã¢ÂÂ '+playerName(e.playerId)+'</div>';
    if(e.type==='red_card') return '<div style="padding:3px 0;color:#f44336">&#9646; '+min+' Red card Ã¢ÂÂ '+playerName(e.playerId)+'</div>';
    if(e.type==='substitution') return '<div style="padding:3px 0;color:#42A5F5">&#8645; '+min+' Sub Ã¢ÂÂ '+playerName(e.playerOffId)+' OFF / '+playerName(e.playerOnId)+' ON</div>';
    return '';
  }).join('');
}

/* =====================================================================
   SUBMISSION
   ===================================================================== */
function submitMatchFacts(){
  var btn=document.getElementById('submitBtn');
  var msg=document.getElementById('submitMsg');
  btn.disabled=true; btn.textContent='Submitting...'; msg.textContent='';

  var errors=[];
  var submitted=0;

  // Build players list for multi-player submission
  var playersList=state.players.map(function(p){
    var playerGoals=0,playerAssists=0,playerYC=0,playerRC=0;
    if(state.mode==='live'){
      var evts=state.events||[];
      playerGoals=evts.filter(function(e){return e.type==='goal'&&e.playerId===p.id;}).length;
      playerAssists=evts.filter(function(e){return e.type==='assist'&&e.playerId===p.id;}).length;
      playerYC=evts.filter(function(e){return e.type==='yellow_card'&&e.playerId===p.id;}).length;
      playerRC=evts.filter(function(e){return e.type==='red_card'&&e.playerId===p.id;}).length;
    } else {
      playerGoals=state.goals.filter(function(g){return g.player===p.id;}).length;
      playerAssists=state.goals.filter(function(g){return g.assist===p.id;}).length;
      playerYC=state.yellowCards.filter(function(id){return id===p.id;}).length;
      playerRC=state.redCards.filter(function(id){return id===p.id;}).length;
    }
    var ratings=state.ratings&&state.ratings[p.id]||{};
    return {
      playerId: p.id,
      goals: playerGoals, assists: playerAssists,
      yellowCards: playerYC, redCards: playerRC,
      ...ratings
    };
  });

  var payload={
    fixtureId: state.fixtureId||null,
    teamId: state.coachTeamId||null,
    matchDate: state.matchDate,
    opponent: state.opponent,
    homeScore: state.homeScore,
    awayScore: state.awayScore,
    format: state.format,
    formation: state.formation,
    mode: state.mode||'post',
    players: playersList,
    events: state.mode==='live'?(state.events||[]):undefined,
    playerPositions: state.mode==='live'?state.playerPositions:undefined
  };

  api('POST','/api/match-facts',payload).then(function(r){
    submitted=playersList.length;
    msg.textContent='Match facts submitted for '+submitted+' player'+(submitted!==1?'s':'')+'. &#10003;';
    msg.style.color='#1d9e75';
    setTimeout(function(){
      if(confirm(submitted+' player record'+(submitted!==1?'s':'')+' updated. Submit another match?')){
        state={mode:null,opponent:'',matchDate:'',format:'11',formation:'4-4-2',myTeamName:state.myTeamName,coachTeamId:state.coachTeamId,fixtureId:null,fixtures:state.fixtures,
          players:[],goals:[],yellowCards:[],redCards:[],homeScore:0,awayScore:0,result:'',
          ratings:{},playerPositions:{},events:[],timerSeconds:0,timerInterval:null,halfTimePaused:false,liveGoals:0};
        renderStep1();
      }
    },1500);
  }).catch(function(e){
    msg.textContent='Error: '+(e.message||'Could not submit. Please try again.');
    msg.style.color='#f44336';
    btn.disabled=false; btn.textContent='Submit match facts';
  });
}

/* =====================================================================
   INIT
   ===================================================================== */
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Coach'){navigateClean('login.html');return;}
  if(typeof buildScoutNav==='function') buildScoutNav('sidebarNav','Coach');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u) uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#1d9e75;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Coach</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();navigateClean('login.html?logout=1');}

document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('logoutBtn').addEventListener('click',logout);
  document.getElementById('notifToggleBtn').addEventListener('click',function(){if(typeof toggleNotifPanel==='function')toggleNotifPanel();});
  initNav();
  var profileReq=api('GET','/api/coaches/profile').then(function(d){
    if(d&&d.coach){
      if(d.coach.team_name)state.myTeamName=d.coach.team_name;
      state.coachTeamId=d.coach.team_id||null;
    }
  }).catch(function(){});
  var fixturesReq=api('GET','/api/fixtures?upcoming=true').then(function(fd){state.fixtures=fd.data||[];}).catch(function(){state.fixtures=[];});
  var playersReq=api('GET','/api/coaches/my-players').then(function(pd){myPlayers=pd.players||pd.data||[];}).catch(function(){myPlayers=[];});
  Promise.all([profileReq,fixturesReq,playersReq]).finally(function(){renderStep1();});
});
</script>
