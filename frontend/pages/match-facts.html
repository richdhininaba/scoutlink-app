<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Match Facts - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Match Facts</span><div class="topbar-right"><button class="notif-btn" onclick="toggleNotifPanel()">Notifs<span class="notif-badge" id="notifBadge" style="display:none">0</span></button><button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button></div></div>
<div class="page-content">
<div class="table-card" style="max-width:700px">
  <div class="table-header"><h3>Add Match Facts</h3></div>
  <div style="padding:20px">
    <p style="color:#B0BEC5;font-size:14px;margin-bottom:20px">Record performance data for your players after each match.</p>
    <div class="form-group"><label>Select Player</label>
      <select id="mfPlayer"><option value="">Loading players...</option></select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="form-group"><label>Match Date</label><input type="date" id="mfDate"></div>
      <div class="form-group"><label>Opponent</label><input type="text" id="mfOpponent" placeholder="e.g. Arsenal U15"></div>
      <div class="form-group"><label>Minutes Played</label><input type="number" id="mfMinutes" placeholder="90" min="0" max="120"></div>
      <div class="form-group"><label>Goals</label><input type="number" id="mfGoals" placeholder="0" min="0"></div>
      <div class="form-group"><label>Assists</label><input type="number" id="mfAssists" placeholder="0" min="0"></div>
      <div class="form-group"><label>Shots on Target</label><input type="number" id="mfShots" placeholder="0" min="0"></div>
      <div class="form-group"><label>Passes Completed</label><input type="number" id="mfPasses" placeholder="0" min="0"></div>
      <div class="form-group"><label>Tackles Won</label><input type="number" id="mfTackles" placeholder="0" min="0"></div>
      <div class="form-group"><label>Yellow Cards</label><input type="number" id="mfYellow" placeholder="0" min="0" max="2"></div>
      <div class="form-group"><label>Red Cards</label><input type="number" id="mfRed" placeholder="0" min="0" max="1"></div>
    </div>
    <div class="form-group"><label>Coach Notes</label><textarea id="mfNotes" rows="3" style="width:100%;padding:0.75rem;background:#0a0f1e;border:1px solid #1e2a3a;border-radius:8px;color:#e2e8f0;font-size:0.95rem" placeholder="Performance notes..."></textarea></div>
    <div class="form-error" id="mfError" style="margin-bottom:12px"></div>
    <div class="form-success" id="mfSuccess" style="margin-bottom:12px"></div>
    <button class="btn btn-primary" onclick="saveMatchFact()">Save Match Facts</button>
  </div>
</div>
<script>
async function loadPage() {
  try {
    var d = await api('GET', '/api/coaches/my-players');
    var players = d.data || [];
    var sel = document.getElementById('mfPlayer');
    sel.innerHTML = '<option value="">Select player...</option>' + players.map(function(p) { return '<option value="'+p.id+'">'+p.first_name+' '+p.last_name+' ('+( p.specific_position||p.primary_position||'')+' Age '+p.age+')</option>'; }).join('');
    document.getElementById('mfDate').value = new Date().toISOString().split('T')[0];
  } catch(e) {}
}
async function saveMatchFact() {
  var err = document.getElementById('mfError'), suc = document.getElementById('mfSuccess');
  err.classList.remove('show'); suc.classList.remove('show');
  var playerId = document.getElementById('mfPlayer').value;
  if (!playerId) { err.textContent = 'Please select a player.'; err.classList.add('show'); return; }
  try {
    await api('POST', '/api/match-facts', {
      playerId, matchDate: document.getElementById('mfDate').value,
      opponent: document.getElementById('mfOpponent').value,
      minutesPlayed: parseInt(document.getElementById('mfMinutes').value)||0,
      goals: parseInt(document.getElementById('mfGoals').value)||0,
      assists: parseInt(document.getElementById('mfAssists').value)||0,
      shotsOnTarget: parseInt(document.getElementById('mfShots').value)||0,
      passesCompleted: parseInt(document.getElementById('mfPasses').value)||0,
      tacklesWon: parseInt(document.getElementById('mfTackles').value)||0,
      yellowCards: parseInt(document.getElementById('mfYellow').value)||0,
      redCards: parseInt(document.getElementById('mfRed').value)||0,
      coachNotes: document.getElementById('mfNotes').value
    });
    suc.textContent = 'Match facts saved successfully!'; suc.classList.add('show');
    document.getElementById('mfGoals').value = '';
    document.getElementById('mfAssists').value = '';
    document.getElementById('mfOpponent').value = '';
    document.getElementById('mfNotes').value = '';
  } catch(e) { err.textContent = e.message; err.classList.add('show'); }
}
</script></div>
</div></div>
<div class="notif-panel" id="notifPanel"><div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">×</button></div><div class="notif-list" id="notifList"></div></div>
<script src="../js/main.js"></script>
<script>
var COACH_NAV=[{label:'Dashboard',href:'coach-dashboard.html'},{label:'My Players',href:'coach-my-players.html'},{label:'Add Players',href:'add-player.html'},{label:'Bulk Add Players',href:'bulk-add-players.html'},{label:'Match Facts',href:'match-facts.html'},{label:'Fixtures',href:'coach-fixtures.html'},{label:'Video Reels',href:'coach-video-reels.html'},{label:'Notifications',href:'#',action:'toggleNotifPanel'},{label:'Settings',href:'coach-settings.html'}];
function initNav(){if(!Auth.isLoggedIn()||Auth.type!=='Coach'){window.location.href='login.html';return;}var nav=document.getElementById('sidebarNav');var cur=window.location.pathname.split('/').pop();if(nav)nav.innerHTML=COACH_NAV.map(function(i){return'<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'" '+(i.action?'onclick="'+i.action+'();return false"':'')+'>'+i.label+'</a>';}).join('');var u=Auth.user;var uel=document.getElementById('sidebarUser');if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+u.firstName+' '+u.lastName+'</div><div class="user-role">Coach</div></div></div>';updateNotifBadge();}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
document.addEventListener('DOMContentLoaded',function(){initNav();if(typeof loadPage==='function')loadPage();});
</script>
<script src="../js/mobile.js"></script>
</body></html>
