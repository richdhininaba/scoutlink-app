<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Match Facts - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.step-indicator{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.step{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;border:2px solid var(--border);color:var(--text3);}
.step.active{border-color:#00E676;color:#00E676;background:rgba(0,230,118,.08);}
.step.done{border-color:rgba(0,230,118,.4);color:rgba(0,230,118,.7);background:rgba(0,230,118,.04);}
.mode-card{background:var(--card2);border:2px solid var(--border);border-radius:14px;padding:24px;cursor:pointer;transition:all .2s;text-align:center;}
.mode-card:hover,.mode-card.sel{border-color:#00E676;background:rgba(0,230,118,.06);}
.mode-icon{font-size:40px;margin-bottom:12px;}
.mode-title{font-size:16px;font-weight:700;margin-bottom:6px;}
.mode-desc{font-size:12px;color:var(--text3);}
.rating-row{display:grid;grid-template-columns:100px 1fr 40px;gap:12px;align-items:center;margin-bottom:10px;}
.rating-label{font-size:13px;font-weight:600;color:var(--text2);}
.rating-slider{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#1e2a3a;outline:none;}
.rating-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#00E676;cursor:pointer;}
.rating-val{font-size:14px;font-weight:700;color:#00E676;text-align:center;}
.player-rating-card{background:#0a0f1e;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;}
.confirm-row{display:flex;align-items:center;gap:12px;background:rgba(0,230,118,.06);border:1px solid rgba(0,230,118,.2);border-radius:8px;padding:14px 16px;}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Scout<span style="color:#00E676">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">Match Facts</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost desktop-signout" onclick="logout()">Sign Out</button>
</div>
</div>
<div class="page-content">

<div class="step-indicator" id="stepIndicator">
<div class="step active" id="s1">1 Mode &amp; Setup</div>
<div class="step" id="s2">2 Game Events</div>
<div class="step" id="s3">3 Player Ratings</div>
<div class="step" id="s4">4 Review &amp; Submit</div>
</div>

<div id="stepContent"></div>

</div>
</div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Coach'){window.location.href='login.html';return;}
  if(typeof buildScoutNav==='function') buildScoutNav('sidebarNav','Coach');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#42A5F5;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Coach</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){}

var state={
  mode:null, // 'live' or 'post'
  opponent:'', matchDate:'', format:'11', formation:'4-4-2',
  players:[], // [{id, name, position}]
  goals:[], assists:[], yellowCards:[], redCards:[],
  ratings:{}, // {playerId: {pace:5,...}}
};
var myPlayers=[];
var currentStep=1;

var FORMATIONS={
  '5':['2-1-1','1-2-1','2-2','1-1-2','1-3'],
  '7':['3-2-1','2-3-1','3-1-2','2-2-2','1-3-2'],
  '9':['3-3-2','4-3-1','3-2-3','3-4-1'],
  '11':['4-4-2','4-3-3','3-5-2','4-2-3-1','4-5-1','3-4-3','5-3-2','4-1-4-1'],
};
var RATING_ATTRS=['pace','agility','strength','stamina','jumping','composure','shooting','passing','dribbling','defending','crossing','vision','positioning','heading','tackling'];

function setStep(n){
  currentStep=n;
  ['s1','s2','s3','s4'].forEach(function(id,i){
    var el=document.getElementById(id);
    el.className='step'+(i+1===n?' active':i+1<n?' done':'');
  });
}

function renderStep1(){
  setStep(1);
  document.getElementById('stepContent').innerHTML=
    '<div class="table-card"><div class="table-header"><h3>Select Match Mode</h3></div><div style="padding:20px">'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px">'+
    '<div class="mode-card'+(state.mode==='post'?' sel':'')+'" onclick="state.mode='post';document.querySelectorAll('.mode-card').forEach(function(c){c.classList.remove('sel');});this.classList.add('sel')">'+
    '<div class="mode-icon">&#128203;</div><div class="mode-title">Post-Game Mode</div><div class="mode-desc">Enter match events and ratings after the game.</div></div>'+
    '<div class="mode-card'+(state.mode==='live'?' sel':'')+'" onclick="state.mode='live';document.querySelectorAll('.mode-card').forEach(function(c){c.classList.remove('sel');});this.classList.add('sel')">'+
    '<div class="mode-icon">&#9654;</div><div class="mode-title">Live Game Mode</div><div class="mode-desc">Record events in real time during the match.</div></div>'+
    '</div>'+
    '<hr style="border-color:var(--border);margin-bottom:20px">'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">'+
    '<div><label style="font-size:12px;font-weight:600;color:var(--text3);display:block;margin-bottom:6px">Opponent *</label><input id="mfOpponent" value="'+state.opponent+'" placeholder="e.g. Arsenal FC Academy" type="text" style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit"></div>'+
    '<div><label style="font-size:12px;font-weight:600;color:var(--text3);display:block;margin-bottom:6px">Date *</label><input id="mfDate" value="'+state.matchDate+'" type="date" style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit"></div>'+
    '<div><label style="font-size:12px;font-weight:600;color:var(--text3);display:block;margin-bottom:6px">Format</label>'+
    '<select id="mfFormat" onchange="updateFormations()" style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit">'+
    '<option value="5"'+(state.format==='5'?' selected':'')+'>5-a-side</option>'+
    '<option value="7"'+(state.format==='7'?' selected':'')+'>7-a-side</option>'+
    '<option value="9"'+(state.format==='9'?' selected':'')+'>9-a-side</option>'+
    '<option value="11"'+(state.format==='11'?' selected':'')+'>11-a-side</option>'+
    '</select></div>'+
    '<div><label style="font-size:12px;font-weight:600;color:var(--text3);display:block;margin-bottom:6px">Formation</label>'+
    '<select id="mfFormation" style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit">'+
    (FORMATIONS[state.format]||FORMATIONS['11']).map(function(f){return'<option value="'+f+'"'+(f===state.formation?' selected':'')+'>'+f+'</option>';}).join('')+
    '</select></div>'+
    '</div>'+
    '<div style="margin-bottom:16px"><label style="font-size:12px;font-weight:600;color:var(--text3);display:block;margin-bottom:6px">Players in this match</label>'+
    '<p style="font-size:12px;color:var(--text3);margin-bottom:10px">Select the players who played:</p>'+
    '<div id="playerCheckboxes">'+(myPlayers.length?myPlayers.map(function(p){var sel=state.players.some(function(sp){return sp.id===p.id;});return'<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer"><input type="checkbox" value="'+p.id+'" data-name="'+(p.first_name+' '+p.last_name)+'" data-pos="'+(p.specific_position||p.primary_position||'')+'" '+(sel?'checked':'')+' style="width:16px;height:16px;accent-color:#00E676"><span style="font-size:13px;font-weight:600">'+(p.first_name||'')+' '+(p.last_name||'')+'</span><span style="font-size:11px;color:var(--text3);margin-left:4px">'+(p.specific_position||p.primary_position||'')+'</span></label>';}).join(''):'<p style="color:var(--text3)">No players found. <a href="add-player.html" style="color:#00E676">Add players first</a>.</p>')+
    '</div></div>'+
    '<button class="btn btn-primary" onclick="goToStep2()">Next: Game Events &#8594;</button>'+
    '</div></div>';
  
  // Set today as default
  if(!state.matchDate) document.getElementById('mfDate').value=new Date().toISOString().split('T')[0];
}

function updateFormations(){
  var fmt=document.getElementById('mfFormat').value;
  var sel=document.getElementById('mfFormation');
  sel.innerHTML=(FORMATIONS[fmt]||FORMATIONS['11']).map(function(f){return'<option value="'+f+'">'+f+'</option>';}).join('');
}

function goToStep2(){
  state.opponent=document.getElementById('mfOpponent').value.trim();
  state.matchDate=document.getElementById('mfDate').value;
  state.format=document.getElementById('mfFormat').value;
  state.formation=document.getElementById('mfFormation').value;
  if(!state.opponent||!state.matchDate){alert('Please fill in opponent and date.');return;}
  
  // Get selected players
  state.players=[];
  document.querySelectorAll('#playerCheckboxes input[type="checkbox"]:checked').forEach(function(cb){
    state.players.push({id:cb.value,name:cb.getAttribute('data-name'),position:cb.getAttribute('data-pos')});
  });
  
  renderStep2();
}

function renderStep2(){
  setStep(2);
  
  var playerOptions=state.players.map(function(p){return'<option value="'+p.id+'">'+p.name+'</option>';}).join('');
  var noPlayers=!state.players.length;
  
  document.getElementById('stepContent').innerHTML=
    '<div class="table-card"><div class="table-header"><h3>Game Events</h3><span style="font-size:13px;color:var(--text3)">'+state.opponent+' &bull; '+state.matchDate+'</span></div><div style="padding:20px">'+
    (noPlayers?'<p style="color:var(--text3);margin-bottom:16px">No players selected. You can still record events below.</p>':'')+
    
    // Goals
    '<div style="margin-bottom:20px"><h4 style="margin-bottom:10px;color:var(--text2)">&#9917; Goals Scored</h4>'+
    '<div id="goalEntries">'+(state.goals.length?state.goals.map(renderGoalRow).join(''):renderGoalRow({player:'',assist:''}))+
    '</div><button class="btn btn-sm btn-ghost" onclick="addGoalRow()" style="margin-top:8px">+ Add Goal</button></div>'+
    
    // Cards
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">'+
    '<div><h4 style="margin-bottom:10px;color:#FFC107">&#9646; Yellow Cards</h4>'+
    '<div id="ycEntries">'+(state.yellowCards.length?state.yellowCards.map(function(p){return renderCardRow(p,'yc');}).join(''):renderCardRow('','yc'))+
    '</div><button class="btn btn-sm btn-ghost" onclick="addCardRow('yc')" style="margin-top:8px">+ Add Yellow Card</button></div>'+
    '<div><h4 style="margin-bottom:10px;color:#f44336">&#9646; Red Cards</h4>'+
    '<div id="rcEntries">'+(state.redCards.length?state.redCards.map(function(p){return renderCardRow(p,'rc');}).join(''):renderCardRow('','rc'))+
    '</div><button class="btn btn-sm btn-ghost" onclick="addCardRow('rc')" style="margin-top:8px">+ Add Red Card</button></div>'+
    '</div>'+
    
    // Result
    '<div style="margin-bottom:16px"><label style="font-size:12px;font-weight:600;color:var(--text3);display:block;margin-bottom:6px">Match Result (optional)</label><input id="mfResult" placeholder="e.g. 2-1 Win, 0-0 Draw" type="text" style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit" value="'+( state.result||'')+'"></div>'+
    
    '<div style="display:flex;gap:12px">'+
    '<button class="btn btn-ghost" onclick="renderStep1()">&#8592; Back</button>'+
    '<button class="btn btn-primary" onclick="goToStep3()">Next: Player Ratings &#8594;</button>'+
    '</div></div></div>';
}

function renderGoalRow(g){
  return '<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px">'+
    '<select class="goal-scorer" style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;font-family:inherit"><option value="">Scorer...</option>'+state.players.map(function(p){return'<option value="'+p.id+'"'+(g&&g.player===p.id?' selected':'')+'>'+p.name+'</option>';}).join('')+'</select>'+
    '<select class="goal-assist" style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;font-family:inherit"><option value="">Assist (opt)</option>'+state.players.map(function(p){return'<option value="'+p.id+'"'+(g&&g.assist===p.id?' selected':'')+'>'+p.name+'</option>';}).join('')+'</select>'+
    '<button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()" style="min-height:40px;min-width:40px">&#10005;</button></div>';
}

function renderCardRow(playerId, type){
  return '<div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px">'+
    '<select class="'+type+'-player" style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;font-family:inherit"><option value="">Select player...</option>'+state.players.map(function(p){return'<option value="'+p.id+'"'+(playerId===p.id?' selected':'')+'>'+p.name+'</option>';}).join('')+'</select>'+
    '<button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()" style="min-height:40px;min-width:40px">&#10005;</button></div>';
}

function addGoalRow(){document.getElementById('goalEntries').insertAdjacentHTML('beforeend',renderGoalRow({}));}
function addCardRow(type){document.getElementById(type+'Entries').insertAdjacentHTML('beforeend',renderCardRow('',type));}

function goToStep3(){
  state.goals=[...document.querySelectorAll('.goal-scorer')].map(function(s,i){return{player:s.value,assist:document.querySelectorAll('.goal-assist')[i]?.value||''};}).filter(function(g){return g.player;});
  state.yellowCards=[...document.querySelectorAll('.yc-player')].map(function(s){return s.value;}).filter(Boolean);
  state.redCards=[...document.querySelectorAll('.rc-player')].map(function(s){return s.value;}).filter(Boolean);
  state.result=document.getElementById('mfResult').value.trim();
  renderStep3();
}

function renderStep3(){
  setStep(3);
  
  if(!state.players.length){
    document.getElementById('stepContent').innerHTML='<div class="table-card"><div style="padding:32px;text-align:center;color:var(--text3)"><p>No players selected to rate. Go back and select players who played.</p><button class="btn btn-outline" onclick="renderStep1()" style="margin-top:14px">&#8592; Back to Setup</button></div></div>';
    return;
  }
  
  var html='<form id="ratingsForm">';
  state.players.forEach(function(p){
    var savedRatings=state.ratings[p.id]||{};
    html+='<div class="player-rating-card"><div style="font-size:15px;font-weight:700;margin-bottom:14px">'+p.name+'<span style="font-size:12px;color:var(--text3);margin-left:8px">'+p.position+'</span></div>';
    RATING_ATTRS.forEach(function(attr){
      var val=savedRatings[attr]||5;
      html+='<div class="rating-row"><div class="rating-label">'+attr.charAt(0).toUpperCase()+attr.slice(1)+'</div>'+
        '<input type="range" min="1" max="10" value="'+val+'" class="rating-slider" data-player="'+p.id+'" data-attr="'+attr+'" oninput="this.nextElementSibling.textContent=this.value">'+
        '<div class="rating-val">'+val+'</div></div>';
    });
    html+='</div>';
  });
  html+='</form>';
  
  document.getElementById('stepContent').innerHTML=
    '<div class="table-card"><div class="table-header"><h3>Player Ratings</h3><span style="font-size:12px;color:var(--text3)">Rate each player 1-10 per attribute</span></div><div style="padding:20px">'+
    html+
    '<div style="display:flex;gap:12px;margin-top:16px">'+
    '<button class="btn btn-ghost" onclick="renderStep2()">&#8592; Back</button>'+
    '<button class="btn btn-primary" onclick="goToStep4()">Next: Review &amp; Submit &#8594;</button>'+
    '</div></div></div>';
}

function goToStep4(){
  // Collect ratings
  state.ratings={};
  document.querySelectorAll('.rating-slider').forEach(function(slider){
    var pid=slider.getAttribute('data-player');
    var attr=slider.getAttribute('data-attr');
    if(!state.ratings[pid]) state.ratings[pid]={};
    state.ratings[pid][attr]=parseInt(slider.value);
  });
  renderStep4();
}

function renderStep4(){
  setStep(4);
  
  var goalsSummary=state.goals.length?state.goals.map(function(g){
    var scorer=state.players.find(function(p){return p.id===g.player;});
    var assister=g.assist?state.players.find(function(p){return p.id===g.assist;}):null;
    return (scorer?scorer.name:'Unknown')+(assister?' (assist: '+assister.name+')':'');
  }).join(', '):'None';
  
  var ycSummary=state.yellowCards.map(function(id){var p=state.players.find(function(p){return p.id===id;});return p?p.name:'?';}).join(', ')||'None';
  var rcSummary=state.redCards.map(function(id){var p=state.players.find(function(p){return p.id===id;});return p?p.name:'?';}).join(', ')||'None';
  
  document.getElementById('stepContent').innerHTML=
    '<div class="table-card"><div class="table-header"><h3>Review &amp; Confirm</h3></div><div style="padding:20px">'+
    '<div style="background:#0a0f1e;border-radius:10px;padding:16px;margin-bottom:20px">'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px">'+
    '<div><span style="color:var(--text3)">Opponent:</span> <strong>'+state.opponent+'</strong></div>'+
    '<div><span style="color:var(--text3)">Date:</span> <strong>'+state.matchDate+'</strong></div>'+
    '<div><span style="color:var(--text3)">Format:</span> <strong>'+state.format+'-a-side</strong></div>'+
    '<div><span style="color:var(--text3)">Formation:</span> <strong>'+state.formation+'</strong></div>'+
    '<div><span style="color:var(--text3)">Result:</span> <strong>'+(state.result||'Not recorded')+'</strong></div>'+
    '<div><span style="color:var(--text3)">Players:</span> <strong>'+state.players.length+'</strong></div>'+
    '<div><span style="color:var(--text3)">Goals:</span> <strong>'+goalsSummary+'</strong></div>'+
    '<div><span style="color:var(--text3)">Yellow Cards:</span> <strong>'+ycSummary+'</strong></div>'+
    '<div><span style="color:var(--text3)">Red Cards:</span> <strong>'+rcSummary+'</strong></div>'+
    '</div></div>'+
    '<div class="confirm-row" style="margin-bottom:20px">'+
    '<input type="checkbox" id="confirmCheck" style="width:18px;height:18px;accent-color:#00E676">'+
    '<label for="confirmCheck" style="font-size:13px;font-weight:600;cursor:pointer">I confirm that the information above is accurate to the best of my knowledge.</label>'+
    '</div>'+
    '<div style="display:flex;gap:12px;align-items:center">'+
    '<button class="btn btn-ghost" onclick="renderStep3()">&#8592; Back</button>'+
    '<button class="btn btn-primary" onclick="submitMatchFacts()" id="submitBtn" disabled>Submit Match Facts</button>'+
    '<span id="submitMsg" style="font-size:13px"></span>'+
    '</div></div></div>';
  
  document.getElementById('confirmCheck').addEventListener('change',function(){
    document.getElementById('submitBtn').disabled=!this.checked;
  });
}

async function submitMatchFacts(){
  var btn=document.getElementById('submitBtn');
  var msg=document.getElementById('submitMsg');
  btn.disabled=true;btn.textContent='Submitting...';
  msg.textContent='';
  
  var errors=[];
  var submitted=0;
  
  // Submit one record per player
  for(var i=0;i<state.players.length;i++){
    var p=state.players[i];
    var playerGoals=state.goals.filter(function(g){return g.player===p.id;}).length;
    var playerAssists=state.goals.filter(function(g){return g.assist===p.id;}).length;
    var playerYC=state.yellowCards.filter(function(id){return id===p.id;}).length;
    var playerRC=state.redCards.filter(function(id){return id===p.id;}).length;
    var ratings=state.ratings[p.id]||{};
    
    try{
      await api('POST','/api/match-facts',{
        playerId:p.id,
        matchDate:state.matchDate,
        opponent:state.opponent,
        result:state.result||null,
        format:state.format,
        formation:state.formation,
        minutesPlayed:90,
        goals:playerGoals,
        assists:playerAssists,
        yellowCards:playerYC,
        redCards:playerRC,
        ...ratings
      });
      submitted++;
    }catch(e){
      errors.push(p.name+': '+e.message);
    }
  }
  
  if(errors.length){
    msg.textContent='Submitted '+submitted+'/'+state.players.length+' players. Errors: '+errors.join('; ');
    msg.style.color='#FF9800';
  }else{
    msg.textContent='All match facts submitted!';
    msg.style.color='#00E676';
  }
  
  if(submitted>0){
    setTimeout(function(){
      if(confirm(submitted+' player records updated. Submit another match?')){
