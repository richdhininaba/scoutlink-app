<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Org View - ScoutLink Stratex</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile-foundation.css">
<link rel="stylesheet" href="../css/mobile-shell.css">
<link rel="stylesheet" href="../css/mobile-pages.css">
<style>
.org-board{background:#0f1620;border:1px solid rgba(148,163,184,.18);border-radius:14px;overflow:hidden}
.org-board-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(148,163,184,.14)}
.org-board-head h3{margin:0;font-size:18px}
.org-board-head p{margin:4px 0 0;color:#8ea2b5;font-size:12px}
.org-chart{overflow:auto;padding:30px;background:radial-gradient(circle at top,rgba(0,230,118,.04),transparent 34%),#0b111c}
.org-tree{display:flex;justify-content:center;min-width:max-content}
.org-branch{position:relative;display:flex;flex-direction:column;align-items:center}
.org-node-wrap{position:relative;display:flex;justify-content:center}
.org-branch.has-children>.org-node-wrap:after{content:"";position:absolute;left:50%;bottom:-24px;height:24px;border-left:1px solid rgba(148,163,184,.28)}
.org-children{position:relative;display:flex;gap:18px;justify-content:center;padding-top:48px}
.org-children:before{content:"";position:absolute;top:24px;left:calc(50% / var(--child-count,1));right:calc(50% / var(--child-count,1));border-top:1px solid rgba(148,163,184,.28)}
.org-children>.org-branch:before{content:"";position:absolute;top:24px;left:50%;height:24px;border-left:1px solid rgba(148,163,184,.28)}
.org-person{width:230px;min-height:178px;border:1px solid rgba(148,163,184,.2);background:#111827;border-radius:12px;padding:14px;box-shadow:0 16px 42px rgba(0,0,0,.22)}
.org-person.root{border-color:rgba(0,230,118,.45);box-shadow:0 20px 60px rgba(0,230,118,.08)}
.org-person-top{display:flex;align-items:flex-start;gap:10px}
.org-avatar{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:#00e676;color:#001b12;font-size:13px;font-weight:900;flex:0 0 auto}
.org-name{font-weight:900;color:#fff;font-size:15px;line-height:1.2}
.org-title{color:#00e676;font-weight:800;font-size:12px;line-height:1.35;margin-top:4px}
.org-meta{color:#8ea2b5;font-size:11px;line-height:1.45;margin-top:4px;overflow-wrap:anywhere}
.org-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.org-report-count{font-size:11px;color:#8ea2b5;font-weight:800}
.org-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mini-form{display:grid;gap:10px}
.org-modal{display:none;position:fixed;inset:0;background:rgba(2,6,12,.72);z-index:1400;align-items:center;justify-content:center;padding:16px}
.org-modal.open{display:flex}
.org-modal-card{width:min(520px,100%);background:#111827;border:1px solid rgba(148,163,184,.2);border-radius:14px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.42)}
.org-modal-body{padding:18px;display:grid;gap:10px}
@media(max-width:767px){
  .org-board-head{padding:12px;display:grid}
  .org-chart{overflow:visible;padding:12px}
  .org-tree{display:block;min-width:0}
  .org-branch{display:block;border-left:1px solid rgba(148,163,184,.22);padding-left:12px;margin-left:6px}
  .org-node-wrap{display:block}
  .org-branch.has-children>.org-node-wrap:after,.org-children:before,.org-children>.org-branch:before{display:none}
  .org-children{display:grid;gap:10px;padding-top:10px}
  .org-person{width:100%;min-height:0;padding:12px;border-radius:12px}
  .org-avatar{width:38px;height:38px}
  .org-name{font-size:14px}
  .org-title{font-size:11px}
}
</style></head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Org View</span><div class="topbar-right"><button class="btn btn-sm btn-ghost" onclick="logout()">Sign out</button></div></div>
<div class="page-content">
<div class="form-error" id="msgErr" style="margin-bottom:12px"></div><div class="form-success" id="msgOk" style="margin-bottom:12px"></div>

<section class="org-board">
  <div class="org-board-head">
    <div><h3>Stratex Analytics org</h3><p>Reporting lines, admin roles and direct reports.</p></div>
    <a class="btn btn-sm btn-primary" href="stratex-users.html?tab=admins">Add admin</a>
  </div>
  <div class="org-chart"><div id="orgTree" class="org-tree"><div class="loading-state"><div class="spinner"></div></div></div></div>
</section>
</div></div></div>
<div class="org-modal" id="editModal">
  <div class="org-modal-card">
    <div class="table-header"><h3>Edit admin</h3><button class="modal-close" onclick="closeEdit()" aria-label="Close">&times;</button></div>
    <div class="org-modal-body">
      <input type="hidden" id="editId">
      <label>Job title</label><input id="editJobTitle" placeholder="Job title">
      <label>Permission role</label><select id="editAdminRole"><option>Management</option><option>Operations</option><option>Acquisition</option><option>Safeguarding Reviewer</option><option>Product Demo</option><option>Read Only</option></select>
      <label>Reports to</label><select id="editManager"></select>
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-outline" onclick="closeEdit()">Cancel</button><button class="btn btn-primary" onclick="saveEdit()">Save changes</button></div>
    </div>
  </div>
</div>
<script src="../js/stratex-nav.js"></script>
<script src="../js/main.js"></script>
<script>
var admins=[], canManageSensitive=false, collapsed={};
function logout(){Auth.clear();navigateClean('login.html?logout=1');}
function safe(v){return (v===null||v===undefined||v==='')?'--':String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function showMsg(id,msg){var el=document.getElementById(id);el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},3500);}
function initialsFrom(a){return ((a.first_name||'')[0]||'').toUpperCase()+((a.last_name||'')[0]||'').toUpperCase();}
function roleBadge(a){return '<span class="badge badge-blue">'+safe(a.admin_role||a.role||'Read Only')+'</span>';}
function personCard(a,children,isRoot){
  var canDelete=canManageSensitive&&Auth.user&&Auth.user.id!==a.id;
  var isCollapsed=!!collapsed[a.id];
  return '<article class="org-person '+(isRoot?'root':'')+'">'+
    '<div class="org-person-top"><div class="org-avatar">'+safe(initialsFrom(a)||'SL')+'</div><div style="min-width:0"><div class="org-name">'+safe(a.first_name)+' '+safe(a.last_name)+'</div><div class="org-title">'+safe(a.job_title||a.admin_role||a.role)+'</div><div class="org-meta">'+safe(a.email)+'</div></div></div>'+
    '<div class="org-footer"><div>'+roleBadge(a)+'<div class="org-report-count">'+children.length+' direct report'+(children.length===1?'':'s')+'</div></div>'+
    '<div class="org-actions">'+(children.length?'<button class="btn btn-sm btn-outline" onclick="toggleNode(\''+a.id+'\')">'+(isCollapsed?'Expand':'Collapse')+'</button>':'')+(canManageSensitive?'<button class="btn btn-sm btn-outline" onclick="openEdit(\''+a.id+'\')">Edit</button>':'')+(canDelete?'<button class="btn btn-sm btn-ghost" onclick="deactivateAdmin(\''+a.id+'\')">Deactivate</button>':'')+'</div></div>'+
  '</article>';
}
function treeData(){
  var active=admins.filter(function(a){return a.is_active!==false;});
  var byManager={};
  active.forEach(function(a){var key=a.manager_id||'root';if(!byManager[key])byManager[key]=[];byManager[key].push(a);});
  Object.keys(byManager).forEach(function(k){byManager[k].sort(function(a,b){return String(a.first_name+' '+a.last_name).localeCompare(String(b.first_name+' '+b.last_name));});});
  var founder=active.find(function(a){return (a.email||'').toLowerCase()==='richdhin@stratexanalytics.co.uk';})||active.find(function(a){return !a.manager_id;})||active[0];
  return {founder:founder,byManager:byManager};
}
function renderNode(a,byManager,isRoot){
  var children=(byManager[a.id]||[]).filter(function(c){return c.id!==a.id;});
  var childHtml=children.length&&!collapsed[a.id]?'<div class="org-children" style="--child-count:'+children.length+'">'+children.map(function(c){return renderNode(c,byManager,false);}).join('')+'</div>':'';
  return '<div class="org-branch '+(children.length?'has-children':'')+'"><div class="org-node-wrap">'+personCard(a,children,isRoot)+'</div>'+childHtml+'</div>';
}
function renderOrg(){
  var tree=treeData();
  if(!tree.founder){document.getElementById('orgTree').innerHTML='<div style="color:#8ea2b5">No admin users found.</div>';return;}
  document.getElementById('orgTree').innerHTML=renderNode(tree.founder,tree.byManager,true);
}
function toggleNode(id){collapsed[id]=!collapsed[id];renderOrg();}
async function loadOrg(){
  var d=await api('GET','/api/stratex/org');admins=d.admins||[];canManageSensitive=!!d.canManageSensitive;renderOrg();
}
async function deactivateAdmin(id){if(!confirm('Deactivate this admin?'))return;await api('DELETE','/api/stratex/admins/'+id);showMsg('msgOk','Admin deactivated.');loadOrg();}
function openEdit(id){
  var a=admins.find(function(x){return x.id===id;});if(!a)return;
  document.getElementById('editId').value=a.id;
  document.getElementById('editJobTitle').value=a.job_title||'';
  document.getElementById('editAdminRole').value=a.admin_role||a.role||'Read Only';
  document.getElementById('editManager').innerHTML='<option value="">No direct manager</option>'+admins.filter(function(x){return x.id!==a.id&&x.is_active!==false;}).map(function(x){return '<option value="'+x.id+'">'+safe(x.first_name+' '+x.last_name+' - '+(x.job_title||x.admin_role||x.role||''))+'</option>';}).join('');
  document.getElementById('editManager').value=a.manager_id||'';
  document.getElementById('editModal').classList.add('open');
}
function closeEdit(){document.getElementById('editModal').classList.remove('open');}
async function saveEdit(){
  try{
    var id=document.getElementById('editId').value;
    await api('PATCH','/api/stratex/admins/'+id,{jobTitle:document.getElementById('editJobTitle').value.trim(),adminRole:document.getElementById('editAdminRole').value,managerId:document.getElementById('editManager').value||null});
    closeEdit();showMsg('msgOk','Admin updated.');loadOrg();
  }catch(e){showMsg('msgErr',e.message);}
}
document.addEventListener('DOMContentLoaded',function(){initStratexPage();loadOrg().catch(function(e){document.getElementById('orgTree').innerHTML='<div style="color:#EF5350">'+e.message+'</div>';});});
</script>
<script src="../js/mobile-navigation.js"></script>
<script src="../js/mobile-shell.js"></script>
<script src="../js/mobile-page-adapters.js"></script>
</body></html>
