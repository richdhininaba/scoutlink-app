<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Page Not Found - ScoutLink</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body{min-height:100vh;background:#080d14;color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
    .not-found{width:min(100%,760px);border:1px solid rgba(148,163,184,.2);border-radius:18px;background:#0d141e;padding:34px;box-shadow:0 24px 80px rgba(0,0,0,.28)}
    .brand{font-size:26px;font-weight:900;margin-bottom:34px}
    .brand span{color:var(--green)}
    .code{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--green);margin-bottom:12px}
    h1{font-size:clamp(32px,6vw,56px);line-height:1.02;margin:0 0 12px}
    p{color:var(--text3);font-size:16px;line-height:1.65;max-width:560px;margin:0 0 28px}
    .actions{display:flex;flex-wrap:wrap;gap:12px}
    .metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px 0 0}
    .metric{background:#07111f;border:1px solid rgba(148,163,184,.14);border-radius:12px;padding:14px}
    .metric strong{display:block;color:var(--text);font-size:18px;margin-bottom:4px}
    .metric span{color:var(--text3);font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.06em}
    @media(max-width:640px){body{padding:14px}.not-found{padding:24px;border-radius:14px}.actions{display:grid}.metric-row{grid-template-columns:1fr}.btn{width:100%;justify-content:center}}
  </style>
</head>
<body>
  <main class="not-found">
    <div class="brand">Scout<span>Link</span></div>
    <div class="code">404 - Page not found</div>
    <h1>This page is out of play.</h1>
    <p>The link may have moved, or the route may have been typed incorrectly. Head back to ScoutLink and pick up from the right account area.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/login">Sign in</a>
      <a class="btn btn-outline" href="/">ScoutLink home</a>
      <button class="btn btn-ghost" type="button" onclick="history.length>1?history.back():window.location.href='/'">Go back</button>
    </div>
    <div class="metric-row">
      <div class="metric"><strong>Scout</strong><span>Player intelligence</span></div>
      <div class="metric"><strong>Coach</strong><span>Team development</span></div>
      <div class="metric"><strong>Stratex</strong><span>Platform control</span></div>
    </div>
  </main>
</body>
</html>
