<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Predictions - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Scout<span style="color:#00E676">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">Predictions</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost desktop-signout" onclick="logout()">Sign Out</button>
</div>
</div>
<div class="page-content">

<div id="predSummary" class="kpi-grid" style="margin-bottom:20px">
<div class="kpi-card">
<div class="kpi-label">Predictions Remaining</div>
<div class="kpi-value green" id="kpiRemaining">-</div>
</div>
<div class="kpi-card">
<div class="kpi-label">Plan Limit</div>
<div class="kpi-value" id="kpiLimit">-</div>
</div>
<div class="kpi-card">
<div class="kpi-label">Current Plan</div>
<div class="kpi-value" id="kpiPlan" style="font-size:20px">-</div>
</div>
<div class="kpi-card">
<div class="kpi-label">Total Run</div>
<div class="kpi-value" id="kpiRun">-</div>
</div>
</div>

<div class="table-card">
<div class="table-header">
<div><h3>Prediction History</h3><p style="font-size:12px;color:var(--text3);margin-top:2px">All predictions you have run</p></div>
<a href="player-search.html" class="btn btn-sm btn-outline">Find Players</a>
</div>
<div id="predList"><div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Loading predictions...</span></div></div>
</div>

</div>
</div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>
function initNav() {
  if (!Auth.isLoggedIn() || Auth.type !== 'Scout') { window.location.href = 'login.html'; return; }
  if (typeof buildScoutNav === 'function') buildScoutNav('sidebarNav', 'Scout');
  var u = Auth.user, uel = document.getElementById('sidebarUser');
  if (uel && u) uel.innerHTML = '<div class="user-info"><div class="user-avatar" style="background:#00E676;color:#000">' + initials(u.firstName, u.lastName) + '</div><div><div class="user-name">' + (u.firstName || '') + ' ' + (u.lastName || '') + '</div><div class="user-role">Scout</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){}

function dispOv(v){var n=parseFloat(v);return isNaN(n)?'--':(n>10?n/10:n).toFixed(1);}

document.addEventListener('DOMContentLoaded',async function(){
  initNav();
  try{
    var d=await api('GET','/api/scouts/predictions');
    var preds=d.data||[];
    var remaining=d.remaining??'--';
    var planLimit=d.planLimit||120;
    var plan=d.plan||'Core';
    
    document.getElementById('kpiRemaining').textContent=remaining;
    document.getElementById('kpiLimit').textContent=planLimit;
    document.getElementById('kpiPlan').textContent=plan;
    document.getElementById('kpiRun').textContent=preds.length;
    
    // Usage bar
    if(typeof remaining==='number'&&planLimit){
      var used=planLimit-remaining;
      var pct=Math.round((used/planLimit)*100);
      var barColor=remaining<10?'#f44336':remaining<30?'#FF9800':'#00E676';
      document.getElementById('predSummary').insertAdjacentHTML('afterend',
        '<div style="margin-bottom:20px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-bottom:6px"><span>Predictions used</span><span style="font-weight:700;color:var(--text2)">'+used+' / '+planLimit+'</span></div><div style="height:8px;background:#1e2a3a;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+barColor+';border-radius:4px;transition:width .4s ease"></div></div></div>'
      );
    }
    
    if(!preds.length){
      document.getElementById('predList').innerHTML='<div style="text-align:center;padding:48px 20px;color:var(--text3)"><div style="font-size:48px;margin-bottom:16px">&#128202;</div><h3 style="color:var(--text2);margin-bottom:8px">No predictions yet</h3><p>You have not run any predictions yet.</p><p style="font-size:13px;margin-top:8px;color:var(--text3)">Go to a player profile to run your first prediction.</p><a href="player-search.html" class="btn btn-primary" style="margin-top:14px;display:inline-block">Browse Players</a></div>';
      return;
    }
    
    document.getElementById('predList').innerHTML='<div style="overflow-x:auto"><table class="sl-table"><thead><tr><th>Player</th><th>Team</th><th>Position</th><th>Date Run</th><th>Year 1</th><th>Year 2</th><th>Year 3</th><th></th></tr></thead><tbody>'+
    preds.map(function(pred){
      var pl=pred.players||{};
      return '<tr>'+
        '<td><b>'+(pl.first_name||'Unknown')+' '+(pl.last_name||'')+'</b></td>'+
        '<td style="color:var(--text3);font-size:12px">'+(pl.team_name||'--')+'</td>'+
        '<td><span style="font-size:11px;padding:2px 8px;background:rgba(0,188,212,.12);color:#00BCD4;border-radius:4px">'+(pl.position_group||'--')+'</span></td>'+
        '<td style="color:var(--text3);font-size:12px">'+(pred.created_at?pred.created_at.slice(0,10):'--')+'</td>'+
        '<td style="font-weight:700;color:#FFC107">'+dispOv(pred.yr1_rating)+'</td>'+
        '<td style="font-weight:700;color:#00BCD4">'+dispOv(pred.yr2_rating)+'</td>'+
        '<td style="font-weight:700;color:#00E676">'+dispOv(pred.yr3_rating)+'</td>'+
        '<td><a href="player-profile.html?id='+pred.player_id+'" class="btn btn-sm btn-outline" style="min-height:36px">View Player</a></td>'+
        '</tr>';
    }).join('')+'</tbody></table></div>';
  }catch(e){
    // Show empty state with message on API error
    document.getElementById('kpiRemaining').textContent='--';
    document.getElementById('kpiLimit').textContent='--';
    document.getElementById('kpiPlan').textContent='Core';
    document.getElementById('kpiRun').textContent='0';
    document.getElementById('predList').innerHTML='<div style="text-align:center;padding:48px 20px;color:var(--text3)"><div style="font-size:48px;margin-bottom:16px">&#128202;</div><h3 style="color:var(--text2);margin-bottom:8px">No predictions yet</h3><p>You have not run any predictions yet.</p><p style="font-size:13px;margin-top:8px">Go to a player profile to run your first prediction.</p><a href="player-search.html" class="btn btn-primary" style="margin-top:14px;display:inline-block">Browse Players</a></div>';
  }
});
</script>
<script src="../js/mobile.js"></script>
</body></html>
