<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notifications - ScoutLink Admin</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">&#9889; Scout<span style="color:#00E676">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">&#128276; Admin Notifications</span>
<div class="topbar-right">
<button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button>
</div>
</div>
<div class="page-content">
<div class="table-card">
<div class="table-header"><h3>Notifications</h3><button class="btn btn-sm btn-outline" onclick="markAllRead()">Mark All Read</button></div>
<div id="notifContent"><div class="loading-state"><div class="spinner"></div></div></div>
</div>
</div>
</div>
</div>
<script src="../js/main.js"></script>
<script>
var STRATEX_NAV=[
{label:'&#127968; Dashboard',href:'stratex-dashboard.html'},
{label:'&#128203; Registrations',href:'stratex-registrations.html'},
{label:'&#128101; Users',href:'stratex-users.html'},
{label:'&#9917; Players',href:'stratex-players.html'},
{label:'&#128269; Scouts',href:'stratex-scouts.html'},
{label:'&#127947; Coaches',href:'stratex-coaches.html'},
{label:'&#127942; Scout Teams',href:'stratex-scout-teams.html'},
{label:'&#127979; School Teams',href:'stratex-school-teams.html'},
{label:'&#127894; Award Nominations',href:'stratex-award-nominations.html'},
{label:'&#127914; Showcase Events',href:'stratex-showcase-events.html'},
{label:'&#128276; Notifications',href:'stratex-notifications.html'},
{label:'&#9881; Settings',href:'stratex-settings.html'}
];
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Stratex'){window.location.href='login.html';return;}
  var nav=document.getElementById('sidebarNav');
  var cur=window.location.pathname.split('/').pop();
  if(nav) nav.innerHTML=STRATEX_NAV.map(function(i){return'<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'">'+i.label+'</a>';}).join('');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#FF5722;color:#fff">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Stratex Admin</div></div></div>';
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}

async function loadNotifications(){
  try{
    var d=await api('GET','/api/notifications?limit=50');
    var rows=d.data||[];
    if(!rows.length){document.getElementById('notifContent').innerHTML='<div style="text-align:center;padding:40px;color:#546E7A">No notifications yet.</div>';return;}
    document.getElementById('notifContent').innerHTML='<div style="padding:8px">'+rows.map(function(n){
      var icon='&#128276;';
      if(n.notification_type==='scout_interest') icon='&#11088;';
      if(n.notification_type==='system') icon='&#8505;';
      return'<div class="notif-item'+(n.is_read?'':' unread')+'" style="padding:14px 16px;border-bottom:1px solid var(--border)">'+
      '<div style="display:flex;gap:12px;align-items:flex-start"><span style="font-size:20px">'+icon+'</span><div style="flex:1"><div style="font-weight:700;color:#E2E8F0;margin-bottom:2px">'+n.title+'</div><div style="font-size:13px;color:#B0BEC5;margin-bottom:4px">'+n.body+'</div><div style="font-size:11px;color:#546E7A">'+relTime(n.created_at)+'</div></div>'+(n.is_read?'':'<div style="width:8px;height:8px;border-radius:50%;background:#00E676;margin-top:6px;flex-shrink:0;cursor:pointer" onclick="markRead(''+n.id+'')"></div>')+'</div></div>';
    }).join('')+'</div>';
  }catch(e){document.getElementById('notifContent').innerHTML='<div style="text-align:center;padding:40px;color:#546E7A">Could not load notifications.</div>';}
}
async function markRead(id){try{await api('PATCH','/api/notifications/'+id+'/read');loadNotifications();}catch(e){}}
async function markAllRead(){try{await api('PATCH','/api/notifications/read-all');loadNotifications();}catch(e){}}
document.addEventListener('DOMContentLoaded',function(){initNav();loadNotifications();});
</script>
<script src="../js/mobile.js"></script>
</body></html>
