<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - ScoutLink</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.notif-card{background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06);display:flex;align-items:flex-start;gap:16px;border-left:4px solid #4f46e5;transition:all .2s}
.notif-card.unread{background:#f0f0ff;border-left-color:#4f46e5}
.notif-card.read{border-left-color:#e0e0e0;opacity:.85}
.notif-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.notif-icon.scout{background:#ede9fe;color:#7c3aed}
.notif-icon.match{background:#d1fae5;color:#059669}
.notif-icon.recruitment{background:#dbeafe;color:#1d4ed8}
.notif-icon.system{background:#fef3c7;color:#d97706}
.notif-body h4{margin:0 0 4px;font-size:15px;font-weight:600}
.notif-body p{margin:0;color:#666;font-size:13px;line-height:1.5}
.notif-time{font-size:12px;color:#999;margin-top:4px;display:block}
.notif-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
.btn-icon{background:none;border:none;cursor:pointer;color:#999;font-size:16px;padding:4px}
.btn-icon:hover{color:#4f46e5}
.notif-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.badge{background:#ef4444;color:#fff;border-radius:50%;padding:2px 7px;font-size:12px;font-weight:700}
.empty-state{text-align:center;padding:60px 20px}
.empty-state img{width:120px;margin-bottom:20px;opacity:.4}
.empty-icon{font-size:72px;color:#e0e0e0;margin-bottom:16px}
.filter-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.filter-tab{padding:6px 16px;border-radius:20px;border:1.5px solid #e0e0e0;background:#fff;font-size:13px;cursor:pointer;font-weight:500}
.filter-tab.active{background:#4f46e5;color:#fff;border-color:#4f46e5}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span style="font-size:20px;font-weight:700;color:#4f46e5">ScoutLink</span></div>
    <nav class="sidebar-nav"><a href="coach-dashboard.html"><i class="fas fa-home"></i> Dashboard</a><a href="coach-my-players.html"><i class="fas fa-users"></i> My Players</a><a href="add-player.html"><i class="fas fa-user-plus"></i> Add Players</a><a href="bulk-add-players.html"><i class="fas fa-file-import"></i> Bulk Add Players</a><a href="match-facts.html"><i class="fas fa-clipboard"></i> Match Facts</a><a href="coach-fixtures.html"><i class="fas fa-calendar"></i> Fixtures</a><a href="coach-video-reels.html"><i class="fas fa-video"></i> Video Reels</a><a href="coach-notifications.html" class="active"><i class="fas fa-bell"></i> Notifications</a><a href="coach-settings.html"><i class="fas fa-cog"></i> Settings</a></nav>
    <div class="sidebar-footer"><button onclick="logout()" style="width:100%;background:#f3f4f6;border:1px solid #e0e0e0;padding:10px;border-radius:8px;cursor:pointer"><i class="fas fa-sign-out-alt"></i> Sign Out</button></div>
  </aside>
  <main class="main-content">
    <div class="notif-header">
      <div>
        <h1><i class="fas fa-bell" style="color:#4f46e5;margin-right:8px"></i>Notifications <span class="badge" id="unreadBadge">0</span></h1>
        <p style="color:#666;margin-top:4px">Stay updated with your latest activity</p>
      </div>
      <button onclick="markAllRead()" style="background:#f3f4f6;border:1px solid #e0e0e0;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px"><i class="fas fa-check-double"></i> Mark all read</button>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterNotifs('all',this)">All</button>
      <button class="filter-tab" onclick="filterNotifs('scout_interest',this)"><i class="fas fa-binoculars"></i> Scout Interest</button>
      <button class="filter-tab" onclick="filterNotifs('match_fact',this)"><i class="fas fa-futbol"></i> Match Facts</button>
      <button class="filter-tab" onclick="filterNotifs('recruitment',this)"><i class="fas fa-handshake"></i> Recruitment</button>
      <button class="filter-tab" onclick="filterNotifs('system',this)"><i class="fas fa-info-circle"></i> System</button>
    </div>

    <div id="notifsContainer">
      <div style="text-align:center;padding:40px"><i class="fas fa-spinner fa-spin" style="font-size:32px;color:#4f46e5"></i><p style="margin-top:12px;color:#666">Loading notifications...</p></div>
    </div>
  </main>
</div>
<script src="../js/auth.js"></script>
<script>
const API = window.SCOUTLINK_API || 'https://scoutlink-api.vercel.app';
let allNotifs = [];
let currentFilter = 'all';

const typeIcons = {
  scout_interest: {icon:'fas fa-binoculars', cls:'scout', label:'Scout Interest'},
  match_fact: {icon:'fas fa-futbol', cls:'match', label:'Match Fact'},
  recruitment: {icon:'fas fa-handshake', cls:'recruitment', label:'Recruitment'},
  system: {icon:'fas fa-info-circle', cls:'system', label:'System'}
};

function timeAgo(ts) {
  const d = new Date(ts), now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

function renderNotifs(notifs) {
  const c = document.getElementById('notifsContainer');
  if (!notifs.length) {
    c.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fas fa-bell-slash"></i></div><h3 style="color:#666">No notifications yet</h3><p style="color:#999">When you get notifications they will appear here</p></div>';
    return;
  }
  c.innerHTML = notifs.map(n => {
    const t = typeIcons[n.type] || typeIcons.system;
    return '<div class="notif-card ' + (n.is_read ? 'read' : 'unread') + '" id="n-' + n.id + '">' +
      '<div class="notif-icon ' + t.cls + '"><i class="' + t.icon + '"></i></div>' +
      '<div class="notif-body"><h4>' + (n.title || t.label) + (n.is_read ? '' : ' <span style="background:#4f46e5;color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;vertical-align:middle">NEW</span>') + '</h4>' +
      '<p>' + (n.message || 'No message') + '</p>' +
      '<span class="notif-time"><i class="fas fa-clock" style="margin-right:4px"></i>' + timeAgo(n.created_at) + '</span></div>' +
      '<div class="notif-actions">' + (n.is_read ? '' : '<button class="btn-icon" onclick="markRead('' + n.id + '')" title="Mark read"><i class="fas fa-check"></i></button>') +
      '</div></div>';
  }).join('');
  document.getElementById('unreadBadge').textContent = notifs.filter(n => !n.is_read).length || '';
}

function filterNotifs(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const filtered = type === 'all' ? allNotifs : allNotifs.filter(n => n.type === type);
  renderNotifs(filtered);
}

async function loadNotifications() {
  const token = localStorage.getItem('sl_token');
  if (!token) return;
  try {
    const r = await fetch(API + '/api/notifications', {headers:{'Authorization':'Bearer '+token}});
    if (r.ok) {
      const data = await r.json();
      allNotifs = data.notifications || data || [];
      renderNotifs(allNotifs);
    } else {
      document.getElementById('notifsContainer').innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fas fa-bell"></i></div><h3 style="color:#666">No notifications yet</h3><p style="color:#999">Activity notifications will appear here</p></div>';
    }
  } catch(e) {
    document.getElementById('notifsContainer').innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fas fa-bell"></i></div><h3 style="color:#666">No notifications yet</h3><p style="color:#999">Activity notifications will appear here</p></div>';
  }
}

async function markRead(id) {
  const token = localStorage.getItem('sl_token');
  try { await fetch(API + '/api/notifications/' + id + '/read', {method:'PUT', headers:{'Authorization':'Bearer '+token}}); } catch(e){}
  const n = allNotifs.find(x => x.id === id);
  if (n) { n.is_read = true; filterNotifs(currentFilter, document.querySelector('.filter-tab.active')); }
}

async function markAllRead() {
  const token = localStorage.getItem('sl_token');
  try { await fetch(API + '/api/notifications/read-all', {method:'PUT', headers:{'Authorization':'Bearer '+token}}); } catch(e){}
  allNotifs.forEach(n => n.is_read = true);
  renderNotifs(currentFilter === 'all' ? allNotifs : allNotifs.filter(n => n.type === currentFilter));
}

function logout(){if(window.supabaseClient)window.supabaseClient.auth.signOut();localStorage.clear();sessionStorage.clear();window.location.href='../pages/login.html';}
document.addEventListener('DOMContentLoaded', loadNotifications);
</script>
<script src="../js/mobile.js"></script>
</body>
</html>
