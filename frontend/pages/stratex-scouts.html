<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Scouts - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Scouts</span><div class="topbar-right"><button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button><button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button></div></div>
<div class="page-content">
<div class="table-card">
  <div class="table-header"><h3>All Scouts</h3><span id="scoutCount" style="color:#546E7A;font-size:13px"></span></div>
  <div id="scoutsTable"><div class="loading-state"><div class="spinner"></div></div></div>
</div>
<script>
async function loadPage() {
  try {
    var d = await api('GET', '/api/stratex/scouts');
    document.getElementById('scoutCount').textContent = (d.total || 0) + ' scouts';
    var scouts = d.data || [];
    if (!scouts.length) { document.getElementById('scoutsTable').innerHTML = '<div style="text-align:center;padding:48px;color:#546E7A">No scouts yet</div>'; return; }
    document.getElementById('scoutsTable').innerHTML = '<table class="sl-table"><thead><tr><th>Name</th><th>Email</th><th>Club</th><th>Plan</th><th>Status</th><th>Joined</th></tr></thead><tbody>' +
      scouts.map(function(s) { return '<tr><td><b>'+s.first_name+' '+s.last_name+'</b></td><td>'+s.email+'</td><td>'+(s.club_name||'--')+'</td><td><span class="badge badge-blue">'+(s.subscription_plan||'Core')+'</span></td><td><span class="badge '+(s.is_active?'badge-green':'badge-red')+'">'+(s.is_active?'Active':'Inactive')+'</span></td><td>'+new Date(s.created_at).toLocaleDateString('en-GB')+'</td></tr>'; }).join('') + '</tbody></table>';
  } catch(e) { document.getElementById('scoutsTable').innerHTML = '<div style="padding:16px;color:#ff6666">Error: ' + e.message + '</div>'; }
}
</script></div>
</div></div>
<div class="notif-panel" id="notifPanel"><div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">Ã</button></div><div class="notif-list" id="notifList"></div></div>
<script src="../js/main.js"></script>
<script>
var STRATEX_NAV = [
{label:'🏠 Dashboard',href:'stratex-dashboard.html'},
{label:'📋 Registrations',href:'stratex-registrations.html'},
{label:'👥 Users',href:'stratex-users.html'},
{label:'⚽ Players',href:'stratex-players.html'},
{label:'🔍 Scouts',href:'stratex-scouts.html'},
{label:'🏋️ Coaches',href:'stratex-coaches.html'},
{label:'🏆 Scout Teams',href:'stratex-scout-teams.html'},
{label:'🏫 School Teams',href:'stratex-school-teams.html'},
{label:'🎖️ Award Nominations',href:'stratex-award-nominations.html'},
{label:'🎪 Showcase Events',href:'stratex-showcase-events.html'},
{label:'🔔 Notifications',href:'#',action:'toggleNotifPanel'},
{label:'⚙️ Settings',href:'stratex-settings.html'}
];
function initNav(){if(!Auth.isLoggedIn()||Auth.type!=='Stratex'){window.location.href='login.html';return;}var nav=document.getElementById('sidebarNav');var cur=window.location.pathname.split('/').pop();if(nav)nav.innerHTML=STRATEX_NAV.map(function(i){return'<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'" '+(i.action?'onclick="'+i.action+'();return false"':'')+'>'+i.label+'</a>';}).join('');var u=Auth.user;var uel=document.getElementById('sidebarUser');if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+u.firstName+' '+u.lastName+'</div><div class="user-role">Stratex Admin</div></div></div>';updateNotifBadge();}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
document.addEventListener('DOMContentLoaded',function(){initNav();if(typeof loadPage==='function')loadPage();});
</script>
<script src="../js/mobile.js"></script>
</body></html>
