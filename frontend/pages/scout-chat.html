<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.chat-shell{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;min-height:calc(100vh - 120px);}
.thread-list,.chat-pane{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.thread-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
.thread-item:hover,.thread-item.active{background:rgba(29,158,117,.07);}
.thread-title{font-weight:800;font-size:14px;margin-bottom:4px;}
.thread-meta{font-size:12px;color:var(--text3);line-height:1.4;}
.unread-pill{background:var(--green);color:#001b12;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;margin-left:8px;}
.chat-pane{display:flex;flex-direction:column;}
.chat-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
.messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#0a0f1e;}
.msg{max-width:72%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--card);}
.msg.mine{align-self:flex-end;background:rgba(29,158,117,.14);border-color:rgba(29,158,117,.28);}
.msg .by{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);font-weight:800;margin-bottom:4px;}
.msg .body{font-size:14px;line-height:1.5;white-space:pre-wrap;}
.composer{padding:14px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--card);}
.composer textarea{min-height:46px;max-height:120px;resize:vertical;}
@media(max-width:900px){.chat-shell{grid-template-columns:1fr}.thread-list{max-height:320px}.msg{max-width:92%;}}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900;color:#fff;text-decoration:none">Scout<span style="color:var(--green)">Link</span></a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Chat</span><div class="topbar-right"><button class="btn btn-sm btn-ghost" onclick="logout()">Sign out</button></div></div>
<div class="page-content">
<div class="chat-shell">
<div class="thread-list"><div class="table-header"><h3>Conversations</h3><button class="btn btn-sm btn-outline" id="refreshThreads">Refresh</button></div><div id="threadList"><div class="loading-state"><div class="spinner"></div></div></div></div>
<div class="chat-pane">
<div class="chat-head"><div><div id="chatTitle" style="font-size:16px;font-weight:900">Select a conversation</div><div id="chatMeta" style="font-size:12px;color:var(--text3);margin-top:4px">Chats appear after a scout adds a player to their pipeline.</div></div><a id="profileLink" class="btn btn-sm btn-outline" href="#" style="display:none;text-decoration:none">View player</a></div>
<div class="messages" id="messages"><div style="margin:auto;color:var(--text3);font-size:14px">No conversation selected.</div></div>
<div class="composer"><textarea id="messageBody" placeholder="Write a message..."></textarea><button class="btn btn-primary" id="sendBtn">Send</button></div>
</div>
</div>
</div>
</div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>
var _threads=[],_activeThread=null;
function logout(){logoutToLogin();}
function initNav(){
 if(!Auth.isLoggedIn()||(Auth.type!=='Scout'&&Auth.type!=='Coach')){navigateClean('login.html');return;}
 if(typeof buildScoutNav==='function')buildScoutNav('sidebarNav',Auth.type);
 var u=Auth.user,uel=document.getElementById('sidebarUser');
 if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:var(--green);color:#001b12">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">'+Auth.type+'</div></div></div>';
}
function otherName(t){return Auth.type==='Scout'?((t.coaches&&((t.coaches.first_name||'')+' '+(t.coaches.last_name||'')))||'Coach'):((t.scouts&&((t.scouts.first_name||'')+' '+(t.scouts.last_name||'')))||'Scout');}
function renderThreads(){
 var box=document.getElementById('threadList');
 if(!_threads.length){box.innerHTML='<div style="padding:34px 18px;text-align:center;color:var(--text3);font-size:13px">No chats yet. Scouts can start one from their pipeline.</div>';return;}
 box.innerHTML=_threads.map(function(t,i){var p=t.players||{};return '<div class="thread-item '+(_activeThread&&_activeThread.id===t.id?'active':'')+'" data-thread="'+t.id+'"><div class="thread-title">'+otherName(t)+(t.unreadCount?'<span class="unread-pill">'+t.unreadCount+'</span>':'')+'</div><div class="thread-meta">'+(p.first_name||'')+' '+(p.last_name||'')+' &middot; '+(p.team_name||'')+'</div></div>';}).join('');
 box.querySelectorAll('[data-thread]').forEach(function(el){el.addEventListener('click',function(){selectThread(this.getAttribute('data-thread'));});});
}
function loadThreads(){
 api('GET','/api/chat/threads').then(function(d){_threads=d.data||[];renderThreads();if(!_activeThread&&_threads[0])selectThread(_threads[0].id);}).catch(function(e){document.getElementById('threadList').innerHTML='<div style="padding:24px;color:#f44336">'+e.message+'</div>';});
}
function selectThread(id){
 _activeThread=_threads.find(function(t){return t.id===id;})||null;renderThreads();
 if(!_activeThread)return;
 var p=_activeThread.players||{};
 document.getElementById('chatTitle').textContent=otherName(_activeThread);
 document.getElementById('chatMeta').textContent=((p.first_name||'')+' '+(p.last_name||'')+' - '+(p.team_name||'')).trim();
 var profile=document.getElementById('profileLink');profile.style.display='inline-flex';profile.href='player-profile.html?id='+_activeThread.player_id;
 api('GET','/api/chat/threads/'+id+'/messages').then(function(d){renderMessages(d.data||[]);}).catch(function(e){document.getElementById('messages').innerHTML='<div style="margin:auto;color:#f44336">'+e.message+'</div>';});
}
function renderMessages(messages){
 var box=document.getElementById('messages');
 if(!messages.length){box.innerHTML='<div style="margin:auto;color:var(--text3);font-size:14px">No messages yet.</div>';return;}
 box.innerHTML=messages.map(function(m){var mine=m.sender_id===Auth.user.id;return '<div class="msg '+(mine?'mine':'')+'"><div class="by">'+(mine?'You':m.sender_type)+'</div><div class="body">'+String(m.body||'').replace(/[<>]/g,'')+'</div><div style="font-size:10px;color:var(--text3);margin-top:6px">'+(m.created_at?new Date(m.created_at).toLocaleString('en-GB'):'')+'</div></div>';}).join('');
 box.scrollTop=box.scrollHeight;
}
function sendMessage(){
 if(!_activeThread)return alert('Select a conversation first.');
 var body=document.getElementById('messageBody').value.trim();
 if(!body)return;
 var btn=document.getElementById('sendBtn');btn.disabled=true;
 api('POST','/api/chat/threads/'+_activeThread.id+'/messages',{body:body}).then(function(){document.getElementById('messageBody').value='';selectThread(_activeThread.id);loadThreads();}).catch(function(e){alert(e.message||'Could not send message.');}).finally(function(){btn.disabled=false;});
}
document.addEventListener('DOMContentLoaded',function(){initNav();loadThreads();document.getElementById('refreshThreads').addEventListener('click',loadThreads);document.getElementById('sendBtn').addEventListener('click',sendMessage);});
</script>
<script src="../js/mobile.js"></script>
</body></html>
