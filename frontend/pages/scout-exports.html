</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Scout<span style="color:#1d9e75">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">Exports</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost desktop-signout" onclick="logout()">Sign Out</button>
</div>

<div class="page-content">

<div id="expSummary" class="kpi-grid" style="margin-bottom:20px">
<div class="kpi-card">
<div class="kpi-label">Exports Remaining</div>
<div class="kpi-value green" id="kpiRemaining">-</div>
</div>
<div class="kpi-card">
<div class="kpi-label">Plan Limit</div>
<div class="kpi-value" id="kpiLimit">-</div>
</div>
<div class="kpi-card">
<div class="kpi-label">Current Plan</div>
<div class="kpi-value" id="kpiPlan" style="font-size:20px">-</div>
</div>
<div class="kpi-card">
<div class="kpi-label">Total Exports</div>
<div class="kpi-value" id="kpiTotal">-</div>
</div>
</div>

<div class="table-card">
<div class="table-header">
<div><h3>Export History</h3><p style="font-size:12px;color:var(--text3);margin-top:2px">All profile dossiers you have generated</p></div>
<a href="player-search.html" class="btn btn-sm btn-outline">Find Players</a>
</div>
<div id="expList"><div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Loading export history...</span></div></div>
</div>

</div>
</div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>

<script>
function initNav() {
  if (!Auth.isLoggedIn() || Auth.type !== 'Scout') { navigateClean('login.html'); return; }
  if (typeof buildScoutNav === 'function') buildScoutNav('sidebarNav', 'Scout');
  var u = Auth.user, uel = document.getElementById('sidebarUser');
  if (uel && u) uel.innerHTML = '<div class="user-info"><div class="user-avatar" style="background:#1d9e75;color:#000">' + initials(u.firstName, u.lastName) + '</div><div><div class="user-name">' + (u.firstName || '') + ' ' + (u.lastName || '') + '</div><div class="user-role">Scout</div></div></div>';
  updateNotifBadge();
}
function logout(){logoutToLogin();}
function toggleNotifPanel(){}

// Store exports data for redownload
var _exportsData = [];

function redownload(idx){
  var exp = _exportsData[idx];
  if(!exp) return;
  api('POST','/api/exports/'+exp.id+'/redownload',{}).then(function(r){
    downloadBase64(r.filename,r.mime,r.contentBase64);
  }).catch(function(e){
    alert(e.message||'Could not re-download this export.');
  });
}

function downloadBase64(filename,mime,contentBase64){var bin=atob(contentBase64);var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);var blob=new Blob([bytes],{type:mime});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);}
function sentenceCase(v){return String(v||'profile').replace(/_/g,' ').toLowerCase().replace(/^\w/,function(c){return c.toUpperCase();});}

document.addEventListener('DOMContentLoaded',function(){
  initNav();
  api('GET','/api/scouts/exports').then(function(d){
    var exports_=d.data||[];
    _exportsData = exports_;
    var remaining=d.remaining!=null?d.remaining:'--';
    var planLimit=d.planLimit||30;
    var plan=d.plan||'Core';

    document.getElementById('kpiRemaining').textContent=planLimit>=99999?'Unlimited':remaining;
    document.getElementById('kpiLimit').textContent=planLimit>=99999?'Unlimited':planLimit;
    document.getElementById('kpiPlan').textContent=String(plan).toUpperCase();
    document.getElementById('kpiTotal').textContent=d.teamUsed!=null?d.teamUsed:exports_.length;

    if(typeof remaining==='number'&&planLimit){
      var used=planLimit-remaining;
      var pct=Math.round((used/planLimit)*100);
      var barColor=remaining<3?'#f44336':remaining<10?'#FF9800':'#1d9e75';
      document.getElementById('expSummary').insertAdjacentHTML('afterend',
        '<div style="margin-bottom:20px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-bottom:6px"><span>Exports used</span><span style="font-weight:700;color:var(--text2)">'+used+' / '+planLimit+'</span></div><div style="height:8px;background:#1e2a3a;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+barColor+';border-radius:4px;transition:width .4s ease"></div></div></div>'
      );
    }

    if(!exports_.length){
      document.getElementById('expList').innerHTML='<div style="text-align:center;padding:48px 20px;color:var(--text3)"><h3 style="color:var(--text2);margin-bottom:8px">No exports yet</h3><p>You have not generated any player dossiers yet.</p><p style="font-size:13px;margin-top:8px">Go to a player profile to export your first dossier.</p><a href="player-search.html" class="btn btn-primary" style="margin-top:14px;display:inline-block">Browse Players</a></div>';
      return;
    }

    var tableHtml='<div style="overflow-x:auto"><table class="sl-table"><thead><tr><th>Player</th><th>Team</th><th>Source</th><th>Export Type</th><th>Date</th><th></th></tr></thead><tbody>';
    exports_.forEach(function(exp,idx){
      var pl=exp.players||{};
      var typeBadge=exp.export_type==='PDF'?'badge-red':'badge-green';
      tableHtml+='<tr>'+
        '<td><a href="player-profile.html?id='+exp.player_id+'" style="color:var(--text);font-weight:600">'+(pl.first_name||'Unknown')+' '+(pl.last_name||'')+'</a></td>'+
        '<td style="color:var(--text3);font-size:12px">'+(pl.team_name||'--')+'</td>'+
        '<td style="color:var(--text3);font-size:12px">'+sentenceCase(exp.source||'profile')+'</td>'+
        '<td><span class="badge '+typeBadge+'">'+(exp.export_type||'PDF')+'</span></td>'+
        '<td style="color:var(--text3);font-size:12px">'+(exp.created_at?exp.created_at.slice(0,10):'--')+'</td>'+
        '<td><button class="btn btn-sm btn-outline" style="min-height:36px" data-exp-idx="'+idx+'">Re-download</button></td>'+
        '</tr>';
    });
    tableHtml+='</tbody></table></div>';
    document.getElementById('expList').innerHTML=tableHtml;

    // Event delegation for re-download buttons
    document.getElementById('expList').addEventListener('click',function(e){
      var btn=e.target.closest('[data-exp-idx]');
      if(btn) redownload(parseInt(btn.getAttribute('data-exp-idx')));
    });

  }).catch(function(e){
    document.getElementById('kpiRemaining').textContent='--';
    document.getElementById('kpiLimit').textContent='--';
    document.getElementById('kpiPlan').textContent='Core';
    document.getElementById('kpiTotal').textContent='0';
    document.getElementById('expList').innerHTML='<div style="text-align:center;padding:48px 20px;color:var(--text3)"><div style="font-size:48px;margin-bottom:16px">&#128196;</div><h3 style="color:var(--text2);margin-bottom:8px">No exports yet</h3><p>Go to a player profile to export your first dossier.</p><a href="player-search.html" class="btn btn-primary" style="margin-top:14px;display:inline-block">Browse Players</a></div>';
  });
});
</script>

<script src="../js/phone-pages.js"></script>
</body></html>
