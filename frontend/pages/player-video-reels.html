<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Video Reels - ScoutLink</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Video Reels</span><div class="topbar-right"><button class="notif-btn" onclick="toggleNotifPanel()">Notifs<span class="notif-badge" id="notifBadge" style="display:none">0</span></button><button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button></div></div>
<div class="page-content">
<div class="table-card">
  <div class="table-header"><h3>My Video Reels</h3></div>
  <div id="videoContent" style="padding:20px"><div class="loading-state"><div class="spinner"></div></div></div>
</div>
<script>
async function loadPage() {
  var u = Auth.user;
  if (!u) return;
  try {
    var d = await api('GET', '/api/videos?playerId=' + u.id);
    var videos = d.data || [];
    var el = document.getElementById('videoContent');
    if (!videos.length) {
      el.innerHTML = '<div style="text-align:center;padding:48px;color:#546E7A"><p style="margin-bottom:16px">No videos uploaded yet.</p><p style="font-size:13px">Ask your coach to upload match footage or highlight reels for you.</p></div>';
      return;
    }
    el.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px">' +
      videos.map(function(v) {
        return '<div style="background:#111827;border:1px solid #1e2a3a;border-radius:12px;padding:16px">' +
          '<div style="font-weight:700;margin-bottom:8px">'+v.title+'</div>' +
          '<div style="font-size:12px;color:#546E7A;margin-bottom:12px">'+(v.description||'')+'</div>' +
          (v.video_type ? '<div style="margin-bottom:8px"><span class="badge badge-blue">'+v.video_type+'</span></div>' : '') +
          '<a href="'+v.video_url+'" target="_blank" rel="noopener" class="btn btn-sm btn-outline">Watch Video</a>' +
          '</div>';
      }).join('') + '</div>';
  } catch(e) {
    document.getElementById('videoContent').innerHTML = '<div style="color:#546E7A">Unable to load videos.</div>';
  }
}
</script></div>
</div></div>
<div class="notif-panel" id="notifPanel"><div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">×</button></div><div class="notif-list" id="notifList"></div></div>
<script src="../js/main.js"></script>
<script>
var PLAYER_NAV=[{label:'Dashboard',href:'player-dashboard.html'},{label:'My Profile',href:'player-profile-edit.html'},{label:'Video Reels',href:'player-video-reels.html'},{label:'Notifications',href:'#',action:'toggleNotifPanel'},{label:'Settings',href:'player-settings.html'}];
function initNav(){if(!Auth.isLoggedIn()||Auth.type!=='Player'){window.location.href='login.html';return;}var nav=document.getElementById('sidebarNav');var cur=window.location.pathname.split('/').pop();if(nav)nav.innerHTML=PLAYER_NAV.map(function(i){return'<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'" '+(i.action?'onclick="'+i.action+'();return false"':'')+'>'+i.label+'</a>';}).join('');var u=Auth.user;var uel=document.getElementById('sidebarUser');if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+u.firstName+' '+u.lastName+'</div><div class="user-role">Player</div></div></div>';updateNotifBadge();}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
document.addEventListener('DOMContentLoaded',function(){initNav();if(typeof loadPage==='function')loadPage();});
</script>
</body></html>
