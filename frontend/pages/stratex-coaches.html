<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coaches - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.detail-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:1000;overflow:auto;padding:32px 16px}
.detail-box{background:#162032;border:1px solid #2d3f55;border-radius:10px;max-width:720px;margin:0 auto;padding:24px}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}
.detail-stat{background:#0d1117;border:1px solid #243447;border-radius:8px;padding:14px}
.detail-label{color:#90A4AE;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.detail-value{color:#E0E0E0;font-size:16px;font-weight:800}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Coaches</span><div class="topbar-right"><button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button><button class="btn btn-sm btn-ghost" onclick="logout()">Sign out</button></div></div>
<div class="page-content">
<div class="table-card">
  <div class="table-header"><h3>All Coaches</h3><span id="coachCount" style="color:#546E7A;font-size:13px"></span></div>
  <div id="coachesTable"><div class="loading-state"><div class="spinner"></div></div></div>
</div>
</div></div></div>

<div class="detail-modal" id="coachModal">
  <div class="detail-box">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
      <div><h3 id="modalTitle" style="margin:0;color:#E0E0E0">Coach details</h3><p id="modalSubtitle" style="margin:6px 0 0;color:#90A4AE"></p></div>
      <button onclick="closeCoachModal()" style="background:none;border:none;color:#90A4AE;font-size:24px;cursor:pointer;line-height:1">&times;</button>
    </div>
    <div id="coachDetailBody"><div class="loading-state"><div class="spinner"></div></div></div>
  </div>
</div>

<script src="../js/stratex-nav.js"></script>
<script src="../js/main.js"></script>
<script>
var allCoaches=[];
function safe(v, fallback){return (v===null||v===undefined||v==='')?(fallback||'--'):String(v);}
function dateFmt(v){return v?new Date(v).toLocaleDateString('en-GB'):'--';}
function logout(){Auth.clear();navigateClean('login.html?logout=1');}
function closeCoachModal(){document.getElementById('coachModal').style.display='none';}

async function loadPage() {
  try {
    var d = await api('GET', '/api/stratex/coaches');
    allCoaches = d.data || [];
    document.getElementById('coachCount').textContent = (d.total || allCoaches.length) + ' coaches';
    renderCoaches(allCoaches);
  } catch(e) { document.getElementById('coachesTable').innerHTML = '<div style="padding:16px;color:#ff6666">Error: ' + e.message + '</div>'; }
}

function renderCoaches(coaches){
  if (!coaches.length) { document.getElementById('coachesTable').innerHTML = '<div style="text-align:center;padding:48px;color:#546E7A">No coaches yet</div>'; return; }
  document.getElementById('coachesTable').innerHTML = '<table class="sl-table"><thead><tr><th>Name</th><th>Email</th><th>Team</th><th>Role</th><th>Super user</th><th>Status</th><th>Joined</th><th style="text-align:right">Actions</th></tr></thead><tbody>' +
    coaches.map(function(c) {
      var team=c.academy_team?c.academy_team.team_name:c.team_name;
      return '<tr><td><b>'+safe(c.first_name)+' '+safe(c.last_name,'')+'</b></td><td>'+safe(c.email)+'</td><td>'+safe(team)+'</td><td>'+safe(c.role_at_club,'Coach')+'</td><td><span class="badge '+(c.is_super_user?'badge-green':'badge-blue')+'">'+(c.is_super_user?'Yes':'No')+'</span></td><td><span class="badge '+(c.is_active?'badge-green':'badge-red')+'">'+(c.is_active?'Active':'Inactive')+'</span></td><td>'+dateFmt(c.created_at)+'</td><td style="text-align:right"><div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-sm btn-outline" onclick="viewCoach(\''+c.id+'\')">View details</button><button class="btn btn-sm btn-outline" onclick="toggleCoachSuperUser(\''+c.id+'\','+(!c.is_super_user)+')">'+(c.is_super_user?'Remove super':'Make super')+'</button><button class="btn btn-sm" style="background:rgba(220,38,38,.15);color:#EF5350;border:1px solid rgba(220,38,38,.3)" onclick="deleteCoach(\''+c.id+'\')">Delete</button></div></td></tr>';
    }).join('') + '</tbody></table>';
}

function stat(label,value){return '<div class="detail-stat"><div class="detail-label">'+label+'</div><div class="detail-value">'+safe(value)+'</div></div>';}

async function viewCoach(id){
  document.getElementById('coachModal').style.display='block';
  document.getElementById('coachDetailBody').innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  try{
    var d=await api('GET','/api/stratex/coaches/'+id);
    var c=d.coach||{}, team=d.academyTeam||{}, st=d.stats||{};
    document.getElementById('modalTitle').textContent=safe(c.first_name)+' '+safe(c.last_name,'');
    document.getElementById('modalSubtitle').textContent=safe(c.email);
    document.getElementById('coachDetailBody').innerHTML='<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn btn-sm btn-outline" onclick="toggleCoachSuperUser(\''+c.id+'\','+(!c.is_super_user)+')">'+(c.is_super_user?'Remove super-user access':'Make coach super user')+'</button></div><div class="detail-grid">'+
      stat('Team', safe(team.team_name,c.team_name||'Unassigned'))+
      stat('Role', safe(c.role_at_club,'Coach'))+
      stat('Super user', c.is_super_user?'Yes':'No')+
      stat('Assigned players', safe(st.assignedPlayers,0))+
      stat('Team players', safe(st.teamPlayers,0))+
      stat('Started', dateFmt(st.startedAt))+
      stat('Last active', dateFmt(st.lastActiveAt))+
      stat('County', safe(team.county))+
      stat('League', safe(team.league))+
      '</div>';
  }catch(e){document.getElementById('coachDetailBody').innerHTML='<div style="padding:16px;color:#ff6666">Error: '+e.message+'</div>';}
}

async function toggleCoachSuperUser(id,next){
  var coach=allCoaches.find(function(c){return c.id===id;});
  var name=coach?(safe(coach.first_name)+' '+safe(coach.last_name,'')):'this coach';
  var action=next?'make '+name+' a super user':'remove super-user access from '+name;
  if(!confirm('Are you sure you want to '+action+'?')) return;
  try{
    await api('PATCH','/api/stratex/coaches/'+id+'/super-user',{isSuperUser:!!next});
    allCoaches=allCoaches.map(function(c){return c.id===id?Object.assign({},c,{is_super_user:!!next}):c;});
    renderCoaches(allCoaches);
    if(document.getElementById('coachModal').style.display==='block') viewCoach(id);
  }catch(e){alert('Could not update super-user access: '+e.message);}
}

async function deleteCoach(id){
  var coach=allCoaches.find(function(c){return c.id===id;});
  var name=coach?(safe(coach.first_name)+' '+safe(coach.last_name,'')):'this coach';
  if(!confirm('Delete '+name+' and unlink their player assignments?')) return;
  try{
    await api('DELETE','/api/stratex/coaches/'+id);
    allCoaches=allCoaches.filter(function(c){return c.id!==id;});
    document.getElementById('coachCount').textContent=allCoaches.length+' coaches';
    renderCoaches(allCoaches);
  }catch(e){alert('Could not delete coach: '+e.message);}
}

document.addEventListener('DOMContentLoaded',function(){initStratexPage();loadPage();});
</script>
<script src="../js/mobile.js"></script>
</body></html>
