<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Registrations - ScoutLink Stratex</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
  <div class="topbar">
    <span class="topbar-title">Registration Requests</span>
    <div class="topbar-right">
      <button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
      <button class="btn btn-sm btn-ghost" onclick="logout()">Sign out</button>
    </div>
  </div>
  <div class="page-content">
    <div class="tab-bar" style="max-width:400px">
      <button class="tab-btn active" onclick="switchTab('pending',this)">Pending</button>
      <button class="tab-btn" onclick="switchTab('approved',this)">Approved</button>
      <button class="tab-btn" onclick="switchTab('declined',this)">Declined</button>
    </div>
    <div class="form-error" id="actionError" style="margin-bottom:12px"></div>
    <div class="form-success" id="actionSuccess" style="margin-bottom:12px"></div>
    <div class="table-card">
      <div class="table-header"><h3 id="tableTitle">Pending Registrations</h3><span id="tableCount" style="color:#546E7A;font-size:13px"></span></div>
      <div id="reqsTable"><div class="loading-state"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>
</div>

<div class="modal-overlay" id="approveModal">
  <div class="modal">
    <div class="modal-header"><h3 class="modal-title">Approve Registration</h3><button class="modal-close" onclick="closeApprove()">&times;Â</button></div>
    <div id="approveScoutPlan" style="display:none">
      <div class="form-group"><label>Subscription Plan <span class="required">*</span></label>
        <select id="planSelect">
          <option value="Core">Core - 1 seat, 30 exports, 120 predictions, 200 interests/yr</option>
          <option value="Plus">Plus - 3 seats, 120 exports, 600 predictions, 1000 interests/yr</option>
          <option value="Elite">Elite - 10 seats, 500 exports, 1200 predictions, unlimited interests/yr</option>
          <option value="Enterprise">Enterprise - Custom/unlimited</option>
        </select>
      </div>
    </div>
    <p style="color:#B0BEC5;font-size:14px;margin-bottom:20px">Approve this registration? A login code will be sent by email.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
      <button class="btn btn-ghost" onclick="closeApprove()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmApprove()">Approve and Send Login Code</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="declineModal">
  <div class="modal">
    <div class="modal-header"><h3 class="modal-title">Decline Registration</h3><button class="modal-close" onclick="closeDecline()">&times;Â</button></div>
    <div class="form-group"><label>Reason for Declining <span class="required">*</span></label>
      <select id="declineReasonSel">
        <option value="">Select a reason...</option>
        <option>Unable to verify football team</option>
        <option>Unable to verify professional club affiliation</option>
        <option>Insufficient information provided</option>
        <option>Cannot verify age eligibility</option>
        <option>Duplicate registration</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group" id="customReasonGroup" style="display:none"><label>Custom Reason</label><input type="text" id="customReason" placeholder="Enter reason..."></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
      <button class="btn btn-ghost" onclick="closeDecline()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDecline()">Decline Registration</button>
    </div>
  </div>
</div>

<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">&times;Â</button></div>
  <div class="notif-list" id="notifList"></div>
</div>
<script src="../js/stratex-nav.js"></script>
<script src="../js/main.js"></script>
<script>
function initNav(){initStratexPage();}

function logout() { Auth.clear(); navigateClean('login.html?logout=1'); }
function toggleNotifPanel() { document.getElementById('notifPanel').classList.toggle('open'); }

var currentStatus = 'pending', pendingDeclineId = null, pendingApproveId = null, pendingApproveType = null;

function switchTab(status, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  loadReqs(status);
}

async function loadReqs(status) {
  if (!status) status = 'pending';
  currentStatus = status;
  document.getElementById('tableTitle').textContent = status.charAt(0).toUpperCase() + status.slice(1) + ' Registrations';
  document.getElementById('reqsTable').innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
  try {
    var d = await api('GET', '/api/registrations?status=' + status + '&limit=100');
    document.getElementById('tableCount').textContent = (d.total || 0) + ' results';
    if (!d.data || !d.data.length) {
      document.getElementById('reqsTable').innerHTML = '<div style="text-align:center;padding:48px;color:#546E7A">No ' + status + ' registrations</div>';
      return;
    }
    var rows = d.data.map(function(r) {
      var tc = r.account_type === 'Coach' ? 'badge-blue' : 'badge-green';
      var team = r.team_name || r.scout_club || '&mdash;';
      var role = r.role_at_club || r.scout_league || '&mdash;';
      var date = new Date(r.created_at).toLocaleDateString('en-GB');
      var action = '';
      if (status === 'pending') {
        action = '<div style="display:flex;gap:8px">' +
          '<button class="btn btn-sm btn-primary" onclick="openApprove(\'' + r.id + '\',\'' + r.account_type + '\')">Approve</button>' +
          '<button class="btn btn-sm btn-danger" onclick="openDecline(\'' + r.id + '\')">Decline</button></div>';
      } else {
        var bc = r.status === 'approved' ? 'badge-green' : 'badge-red';
        action = '<span class="badge ' + bc + '">' + r.status + '</span>' +
          (r.decline_reason ? '<div style="font-size:11px;color:#546E7A;margin-top:4px">' + r.decline_reason + '</div>' : '');
      }
      return '<tr><td><b>' + r.first_name + ' ' + r.last_name + '</b></td><td>' + r.email + '</td>' +
        '<td><span class="badge ' + tc + '">' + r.account_type + '</span></td>' +
        '<td>' + team + '</td><td>' + role + '</td><td>' + date + '</td><td>' + action + '</td></tr>';
    });
    document.getElementById('reqsTable').innerHTML = '<table class="sl-table"><thead><tr><th>Name</th><th>Email</th><th>Type</th><th>Team / Club</th><th>Role</th><th>Submitted</th>' +
      (status === 'pending' ? '<th>Actions</th>' : '<th>Decision</th>') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
  } catch(e) {
    document.getElementById('reqsTable').innerHTML = '<div style="padding:24px;color:#ff6666">Error loading registrations: ' + e.message + '</div>';
    console.error('loadReqs error:', e);
  }
}

function openApprove(id, type) {
  pendingApproveId = id;
  pendingApproveType = type;
  document.getElementById('approveScoutPlan').style.display = type === 'Scout' ? 'block' : 'none';
  document.getElementById('approveModal').classList.add('open');
}
function closeApprove() { document.getElementById('approveModal').classList.remove('open'); pendingApproveId = null; pendingApproveType = null; }

async function confirmApprove() {
  var suc = document.getElementById('actionSuccess'), err = document.getElementById('actionError');
  suc.classList.remove('show'); err.classList.remove('show');
  var body = {};
  if (pendingApproveType === 'Scout') body.subscriptionPlan = document.getElementById('planSelect').value;
  try {
    await api('POST', '/api/registrations/' + pendingApproveId + '/approve', body);
    closeApprove();
    suc.textContent = 'Approved! Login code sent by email.';
    suc.classList.add('show');
    loadReqs(currentStatus);
  } catch(e) { err.textContent = e.message; err.classList.add('show'); }
}

function openDecline(id) { pendingDeclineId = id; document.getElementById('declineModal').classList.add('open'); }
function closeDecline() { document.getElementById('declineModal').classList.remove('open'); pendingDeclineId = null; }

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('declineReasonSel').addEventListener('change', function() {
    document.getElementById('customReasonGroup').style.display = this.value === 'Other' ? 'block' : 'none';
  });
  initNav();
  loadReqs('pending');
});

async function confirmDecline() {
  var reason = document.getElementById('declineReasonSel').value;
  var custom = document.getElementById('customReason').value;
  if (!reason) { alert('Please select a reason.'); return; }
  var suc = document.getElementById('actionSuccess'), err = document.getElementById('actionError');
  suc.classList.remove('show'); err.classList.remove('show');
  try {
    await api('POST', '/api/registrations/' + pendingDeclineId + '/decline', { declineReason: reason, customReason: custom });
    closeDecline();
    suc.textContent = 'Registration declined. Email sent.';
    suc.classList.add('show');
    loadReqs(currentStatus);
  } catch(e) { err.textContent = e.message; err.classList.add('show'); }
}
</script>
<script src="../js/mobile.js"></script>
</body></html>
