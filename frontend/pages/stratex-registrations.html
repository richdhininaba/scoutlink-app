<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Registrations – ScoutLink Stratex</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">⚡ Scout<span style="color:#00E676">Link</span></a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Registration Requests</span><div class="topbar-right"><button class="notif-btn" onclick="toggleNotifPanel()">🔔<span class="notif-badge" id="notifBadge" style="display:none">0</span></button><button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button></div></div>
<div class="page-content">
  <div class="tab-bar" style="max-width:400px">
    <button class="tab-btn active" onclick="loadReqs('pending')">Pending</button>
    <button class="tab-btn" onclick="loadReqs('approved')">Approved</button>
    <button class="tab-btn" onclick="loadReqs('declined')">Declined</button>
  </div>
  <div class="form-error" id="actionError" style="margin-bottom:12px"></div>
  <div class="form-success" id="actionSuccess" style="margin-bottom:12px"></div>
  <div class="table-card">
    <div class="table-header"><h3 id="tableTitle">Pending Registrations</h3><span id="tableCount" style="color:#546E7A;font-size:13px"></span></div>
    <div id="reqsTable"><div class="loading-state"><div class="spinner"></div></div></div>
  </div>
</div>
</div>
</div>
<div class="modal-overlay" id="declineModal">
  <div class="modal">
    <div class="modal-header"><h3 class="modal-title">Decline Registration</h3><button class="modal-close" onclick="closeDecline()">×</button></div>
    <div class="form-group"><label>Reason for Declining <span class="required">*</span></label>
      <select id="declineReasonSel">
        <option value="">Select a reason...</option>
        <option>Unable to verify football team</option>
        <option>Unable to verify professional club affiliation</option>
        <option>Insufficient information provided</option>
        <option>Cannot verify age eligibility</option>
        <option>Duplicate registration</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group" id="customReasonGroup" style="display:none"><label>Custom Reason</label><input type="text" id="customReason" placeholder="Enter reason..."></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
      <button class="btn btn-ghost" onclick="closeDecline()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDecline()">Decline Registration</button>
    </div>
  </div>
</div>
<div class="notif-panel" id="notifPanel"><div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">×</button></div><div class="notif-list" id="notifList"></div></div>
<script src="../js/main.js"></script>
<script>
const NAV_ITEMS={Stratex:[{icon:'🏠',label:'Dashboard',href:'stratex-dashboard.html'},{icon:'📋',label:'Registrations',href:'stratex-registrations.html'},{icon:'🔍',label:'All Players',href:'player-search.html'},{icon:'📊',label:'Pipeline',href:'recruitment-pipeline.html'},{icon:'📋',label:'Bulk Import',href:'bulk-add-players.html'},{icon:'🔔',label:'Notifications',href:'#',action:'toggleNotifPanel'}]};
function initNav(){if(!Auth.isLoggedIn()||Auth.type!=='Stratex'){window.location.href='login.html';return;}const items=NAV_ITEMS.Stratex;const nav=document.getElementById('sidebarNav');const cur=window.location.pathname.split('/').pop();if(nav)nav.innerHTML=items.map(i=>'<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'" '+(i.action?'onclick="'+i.action+'();return false"':'')+'>'+i.icon+' '+i.label+'</a>').join('');const u=Auth.user;const uel=document.getElementById('sidebarUser');if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+u.firstName+' '+u.lastName+'</div><div class="user-role">Stratex</div></div></div>';updateNotifBadge();}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
let currentStatus='pending';
let pendingDeclineId=null;
document.querySelectorAll('.tab-btn').forEach((btn,i)=>{btn.addEventListener('click',()=>{document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');});});
async function loadReqs(status='pending') {
  currentStatus=status;
  document.getElementById('tableTitle').textContent=status.charAt(0).toUpperCase()+status.slice(1)+' Registrations';
  document.getElementById('reqsTable').innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  try {
    const d=await api('GET','/api/registrations?status='+status+'&limit=100');
    document.getElementById('tableCount').textContent=(d.total||0)+' results';
    if(!d.data||!d.data.length){document.getElementById('reqsTable').innerHTML='<div style="text-align:center;padding:48px;color:#546E7A">No '+status+' registrations</div>';return;}
    document.getElementById('reqsTable').innerHTML='<table class="sl-table"><thead><tr><th>Name</th><th>Email</th><th>Type</th><th>Team / Club</th><th>Role</th><th>Submitted</th>'+(status==='pending'?'<th>Actions</th>':'<th>Decision</th>')+'</tr></thead><tbody>'+d.data.map(r=>'<tr><td><b>'+r.first_name+' '+r.last_name+'</b></td><td>'+r.email+'</td><td><span class="badge '+(r.account_type==='Coach'?'badge-blue':'badge-green')+'">'+r.account_type+'</span></td><td>'+(r.team_name||r.scout_club||'—')+'</td><td>'+(r.role_at_club||r.scout_league||'—')+'</td><td>'+new Date(r.created_at).toLocaleDateString('en-GB')+'</td><td>'+(status==='pending'?'<div style="display:flex;gap:8px"><button class="btn btn-sm btn-primary" onclick="approveReq(''+r.id+'')">Approve</button><button class="btn btn-sm btn-danger" onclick="openDecline(''+r.id+'')">Decline</button></div>':'<span class="badge '+(r.status==='approved'?'badge-green':'badge-red')+'">'+r.status+'</span>'+(r.decline_reason?'<div style="font-size:11px;color:#546E7A;margin-top:4px">'+r.decline_reason+'</div>':''))+'</td></tr>').join('')+'</tbody></table>';
  } catch(e){document.getElementById('reqsTable').innerHTML='<div style="padding:24px;color:#ff6666">Error: '+e.message+'</div>';}
}
async function approveReq(id) {
  if(!confirm('Approve this registration? A login code will be sent by email.'))return;
  const suc=document.getElementById('actionSuccess'),err=document.getElementById('actionError');
  suc.classList.remove('show');err.classList.remove('show');
  try{await api('POST','/api/registrations/'+id+'/approve');suc.textContent='Approved! Login code sent by email.';suc.classList.add('show');loadReqs(currentStatus);}
  catch(e){err.textContent=e.message;err.classList.add('show');}
}
function openDecline(id){pendingDeclineId=id;document.getElementById('declineModal').classList.add('open');}
function closeDecline(){document.getElementById('declineModal').classList.remove('open');pendingDeclineId=null;}
document.getElementById('declineReasonSel').addEventListener('change',function(){document.getElementById('customReasonGroup').style.display=this.value==='Other'?'block':'none';});
async function confirmDecline(){
  const reason=document.getElementById('declineReasonSel').value,custom=document.getElementById('customReason').value;
  if(!reason){alert('Please select a reason.');return;}
  const suc=document.getElementById('actionSuccess'),err=document.getElementById('actionError');
  suc.classList.remove('show');err.classList.remove('show');
  try{await api('POST','/api/registrations/'+pendingDeclineId+'/decline',{declineReason:reason,customReason:custom});closeDecline();suc.textContent='Registration declined. Email sent.';suc.classList.add('show');loadReqs(currentStatus);}
  catch(e){err.textContent=e.message;err.classList.add('show');}
}
document.addEventListener('DOMContentLoaded',()=>{initNav();loadReqs('pending');});
</script>
</body></html>
