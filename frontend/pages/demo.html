<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Explore ScoutLink Demo - ScoutLink</title>
<link rel="stylesheet" href="../css/phone-base.css">
<link rel="stylesheet" href="../css/phone-shell.css">
<link rel="stylesheet" href="../css/phone-pages.css">
<style>
body{margin:0;background:#f6f8fa;color:#111827;font-family:Inter,Arial,sans-serif;}
.demo-public-shell{min-height:100vh;padding:22px 18px 34px;display:flex;align-items:center;justify-content:center;}
.demo-public-card{width:min(760px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 24px 70px rgba(15,23,42,.12);overflow:hidden;}
.demo-public-head{padding:24px 24px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:16px;align-items:center;}
.demo-logo{font-size:24px;font-weight:950;letter-spacing:-.04em;color:#111827;text-decoration:none;}
.demo-logo span{color:#0f9f75;}
.demo-login{min-height:40px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;color:#047857;background:#fff;font-weight:850;text-decoration:none;display:inline-flex;align-items:center;}
.demo-public-body{padding:26px 24px 28px;}
.demo-kicker{display:inline-flex;border:1px solid #bbf7d0;background:#ecfdf5;color:#047857;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;}
.demo-public-body h1{font-size:32px;line-height:1.08;margin:0 0 10px;color:#111827;letter-spacing:-.03em;}
.demo-public-body p{max-width:560px;color:#64748b;font-size:15px;line-height:1.55;margin:0 0 24px;}
.demo-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.demo-choice{border:1px solid #e5e7eb;border-radius:20px;background:#fff;padding:18px;text-align:left;box-shadow:0 12px 32px rgba(15,23,42,.06);}
.demo-choice h2{margin:0 0 6px;color:#111827;font-size:18px;}
.demo-choice p{font-size:13px;margin:0 0 16px;color:#64748b;}
.demo-choice button{width:100%;min-height:44px;border:0;border-radius:14px;background:#0f9f75;color:#fff;font-weight:900;font-size:14px;cursor:pointer;}
.demo-choice button:hover{background:#047857;}
@media(max-width:767px){
  .demo-public-shell{align-items:flex-start;padding:16px;}
  .demo-public-card{border-radius:22px;}
  .demo-public-head{padding:18px;}
  .demo-public-body{padding:22px 18px;}
  .demo-public-body h1{font-size:26px;}
  .demo-public-body p{font-size:14px;}
  .demo-choice-grid{grid-template-columns:1fr;}
}
</style>

</head>
<body>
<main class="demo-public-shell">
  <section class="demo-public-card">
    <div class="demo-public-head">
      <a class="demo-logo" href="../index.html">Scout<span>Link</span></a>
      <a class="demo-login" href="login.html">Log in</a>
    </div>
    <div class="demo-public-body">
      <span class="demo-kicker">Product demo</span>
      <h1>Explore ScoutLink demo</h1>
      <p>Try ScoutLink with fake coach, scout and player data.</p>
      <div class="demo-choice-grid" aria-label="Choose demo experience">
        <article class="demo-choice">
          <h2>Explore as Coach</h2>
          <p>Use Marcus Reed's demo squad to add players, fixtures and match facts.</p>
          <button type="button" onclick="startPublicDemo('Coach')">Explore as Coach</button>
        </article>
        <article class="demo-choice">
          <h2>Explore as Scout</h2>
          <p>Use Noah Patel's demo workspace to search, compare and shortlist players.</p>
          <button type="button" onclick="startPublicDemo('Scout')">Explore as Scout</button>
        </article>
      </div>
    </div>
  </section>
</main>
<script src="../js/main.js"></script>
<script src="../js/phone-pages.js"></script>
</body>
</html>
