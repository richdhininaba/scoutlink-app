<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Experience selector - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{background:#080d14;color:var(--text,#f8fafc);font-family:Inter,sans-serif;min-height:100vh;}
.selector-shell{min-height:100vh;padding:32px clamp(18px,4vw,56px);display:flex;flex-direction:column;gap:24px;}
.selector-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.selector-brand{font-size:24px;font-weight:900;color:#fff;text-decoration:none;}
.selector-brand span{color:var(--green,#00e676);}
.selector-title{max-width:760px;}
.selector-title h1{font-size:clamp(28px,4vw,48px);line-height:1.02;margin:18px 0 10px;letter-spacing:0;}
.selector-title p{color:var(--text3,#8ea2b5);font-size:15px;line-height:1.55;margin:0;}
.experience-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:stretch;}
.experience-card{background:#111827;border:1px solid rgba(148,163,184,.18);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:245px;box-shadow:0 20px 60px rgba(0,0,0,.18);}
.experience-card.admin{border-color:rgba(255,112,67,.5);background:linear-gradient(180deg,rgba(255,112,67,.12),#111827 42%);}
.experience-badge{align-self:flex-start;border:1px solid rgba(29,158,117,.45);color:var(--green,#00e676);border-radius:999px;padding:4px 9px;font-size:10px;text-transform:uppercase;font-weight:900;letter-spacing:.05em;}
.experience-card.admin .experience-badge{border-color:rgba(255,112,67,.65);color:#ff8a65;}
.experience-card h2{font-size:22px;margin:0;}
.experience-card p{color:var(--text3,#8ea2b5);font-size:13px;line-height:1.5;margin:0;flex:1;}
.tour-toggle{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;background:#07111f;border:1px solid rgba(148,163,184,.14);border-radius:10px;padding:10px;}
.tour-toggle input{width:20px;height:20px;accent-color:var(--green,#00e676);}
.tour-toggle span{font-size:13px;color:#dce7f3;font-weight:800;}
.demo-user-list{display:grid;gap:8px;background:#07111f;border:1px solid rgba(148,163,184,.14);border-radius:10px;padding:8px;}
.demo-user-option{width:100%;min-height:44px;text-align:left;border:1px solid rgba(148,163,184,.16);background:#0b1320;color:#dce7f3;border-radius:9px;padding:8px 10px;cursor:pointer;}
.demo-user-option strong{display:block;font-size:13px;color:#fff;}
.demo-user-option span{display:block;font-size:11px;color:#8ea2b5;margin-top:2px;}
.demo-user-option.active{border-color:var(--green,#00e676);box-shadow:0 0 0 1px rgba(0,230,118,.18) inset;}
.selector-msg{min-height:20px;color:var(--text3,#8ea2b5);font-size:13px;}
@media(max-width:767px){
  .selector-shell{padding:18px 14px 92px;}
  .selector-top{align-items:flex-start;}
  .selector-title h1{font-size:30px;}
  .experience-grid{grid-template-columns:1fr;}
  .experience-card{min-height:0;border-radius:12px;}
  .experience-card .btn{width:100%;justify-content:center;}
}
</style>
<link rel="stylesheet" href="/css/phone-base.css">
<link rel="stylesheet" href="/css/phone-shell.css">
<link rel="stylesheet" href="/css/phone-pages.css">
</head><body>
<main class="selector-shell">
  <div class="selector-top">
    <a class="selector-brand" href="/">Scout<span>Link</span></a>
    <button class="btn btn-sm btn-ghost" id="logoutBtn" type="button">Sign out</button>
  </div>
  <section class="selector-title">
    <div class="experience-badge">Product access</div>
    <h1>Choose your ScoutLink experience</h1>
    <p>Open the admin view, move between linked real roles, or launch a guided demo without logging out. Demo sessions are isolated from real platform records and are used for walkthroughs only.</p>
  </section>
  <div id="selectorMsg" class="selector-msg">Loading experiences...</div>
  <section class="experience-grid" id="experienceGrid"></section>
</main>
<script src="../js/main.js"></script>
<script>
var experiences=[];
var selectedDemoUsers={};
function roleHome(type){
  return {Stratex:'stratex-dashboard.html',Scout:'scout-dashboard.html',Coach:'coach-dashboard.html',Player:'player-dashboard.html'}[type]||'login.html';
}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function badgeText(x){if(x.admin)return 'Admin view'; if(x.demo)return 'Demo experience'; return x.current?'Current role':'Linked role';}
function render(){
  var grid=document.getElementById('experienceGrid');
  if(!experiences.length){grid.innerHTML='';document.getElementById('selectorMsg').textContent='No additional experiences are available for this account.';return;}
  document.getElementById('selectorMsg').textContent='Select an experience. Turn on the product tour when you want a guided walkthrough.';
  grid.innerHTML=experiences.map(function(x,i){
    if(x.demo&&(x.demoUsers||[]).length&&!selectedDemoUsers[i]) selectedDemoUsers[i]=x.demoUsers[0].id;
    var userChoices=(x.demo&&(x.demoUsers||[]).length)?'<div class="demo-user-list" aria-label="Choose demo user">'+x.demoUsers.map(function(u){
      var active=selectedDemoUsers[i]===u.id;
      return '<button type="button" class="demo-user-option '+(active?'active':'')+'" data-demo-card="'+i+'" data-demo-user="'+esc(u.id)+'"><strong>'+esc(u.label||((u.firstName||'')+' '+(u.lastName||''))||u.email)+'</strong><span>'+esc(u.teamName||u.email||'Demo account')+'</span></button>';
    }).join('')+'</div>':'';
    return '<article class="experience-card '+(x.admin?'admin':'')+'">'+
      '<span class="experience-badge">'+esc(badgeText(x))+'</span>'+
      '<h2>'+esc(x.label||x.accountType)+'</h2>'+
      '<p>'+esc(x.description||'Open this ScoutLink experience.')+'</p>'+
      userChoices+
      '<label class="tour-toggle"><input type="checkbox" id="tour-'+i+'"><span>Include product tour</span></label>'+
      '<button class="btn btn-primary" type="button" data-enter="'+i+'">Enter as '+esc(x.accountType)+'</button>'+
    '</article>';
  }).join('');
  grid.querySelectorAll('[data-demo-user]').forEach(function(btn){btn.addEventListener('click',function(){
    selectedDemoUsers[this.dataset.demoCard]=this.dataset.demoUser;
    render();
  });});
  grid.querySelectorAll('[data-enter]').forEach(function(btn){btn.addEventListener('click',function(){enterExperience(Number(this.dataset.enter));});});
}
function storeAdminIfNeeded(){
  if(Auth.type==='Stratex' && !isDemoMode()){
    localStorage.setItem('sl_admin_token',Auth.token);
    localStorage.setItem('sl_admin_user',JSON.stringify(Auth.user));
    localStorage.setItem('sl_admin_type','Stratex');
  }
}
async function enterExperience(idx){
  var x=experiences[idx]; if(!x)return;
  var includeTour=!!document.getElementById('tour-'+idx).checked;
  var msg=document.getElementById('selectorMsg');
  msg.textContent='Opening '+(x.label||x.accountType)+'...';
  try{
    storeAdminIfNeeded();
    if(!x.demo && x.accountType===Auth.type){
      if(includeTour) sessionStorage.setItem('sl_force_tour_'+x.accountType,'1');
      navigateClean(roleHome(x.accountType)+(includeTour?'?tour=1':''));
      return;
    }
    var d=await api('POST','/api/auth/switch-experience',{accountType:x.accountType,demo:!!x.demo,includeTour:includeTour,demoUserId:x.demo?selectedDemoUsers[idx]:null});
    if(x.demo) storeAdminIfNeeded();
    Auth.set(d.token,d.user,d.accountType);
    localStorage.setItem('sl_demo_mode',d.demoMode?'1':'0');
    localStorage.setItem('sl_experience_switcher','1');
    if(includeTour) sessionStorage.setItem('sl_force_tour_'+d.accountType,'1');
    navigateClean(roleHome(d.accountType)+(includeTour?'?tour=1':''));
  }catch(e){
    msg.textContent=e.message||'Could not open that experience.';
    msg.style.color='#ffb4b4';
  }
}
async function load(){
  if(isDemoMode()&&typeof restoreAdminSessionForSelector==='function') restoreAdminSessionForSelector();
  if(!Auth.isLoggedIn()){navigateClean('login.html');return;}
  try{
    var d=await api('GET','/api/auth/experiences');
    experiences=d.data||[];
    render();
  }catch(e){
    document.getElementById('selectorMsg').textContent=e.message||'Could not load experiences.';
    document.getElementById('selectorMsg').style.color='#ffb4b4';
  }
}
document.getElementById('logoutBtn').addEventListener('click',function(){Auth.clear();navigateClean('login.html?logout=1');});
document.addEventListener('DOMContentLoaded',load);
</script>
<script src="/js/phone-routes.js"></script>
<script src="/js/phone-shell.js"></script>
<script src="/js/phone-pages.js"></script>
</body></html>
