<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Award nominations - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--card:#161b22;--accent:#1d9e75;--text:#ffffff;--text-secondary:#8b949e;--border:#30363d;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:500px;}
.status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.status-pending{background:rgba(255,193,7,.15);color:#FFC107;border:1px solid rgba(255,193,7,.3);}
.status-confirmed{background:rgba(29,158,117,.15);color:var(--accent);border:1px solid rgba(29,158,117,.3);}
.status-withdrawn{background:rgba(248,81,73,.15);color:#f85149;border:1px solid rgba(248,81,73,.3);}
.btn{padding:8px 16px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#17856a;}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
.btn-danger{background:transparent;color:#f85149;border:1px solid rgba(248,81,73,.4);}
.btn-sm{padding:6px 12px;font-size:13px;}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;}
.sl-table{width:100%;border-collapse:collapse;}
.sl-table th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary);border-bottom:1px solid var(--border);}
.sl-table td{padding:12px;border-bottom:1px solid var(--border);font-size:14px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary);}
.form-input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;width:100%;font-size:14px;}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900;color:#fff;text-decoration:none">Scout<span style="color:var(--accent)">Link</span></a></div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
  <span class="topbar-title" id="pageTitle">Award nominations</span>
  <div class="topbar-right">
    <button class="btn btn-sm btn-outline" id="logoutBtn">Sign out</button>
  </div>
</div>
<div class="page-content">

<div id="yearHeading" style="margin-bottom:24px">
  <h2 style="font-size:22px;font-weight:800">Stratex Football Honours <span id="yearDisplay"></span></h2>
  <p style="color:var(--text-secondary);font-size:14px;margin-top:4px">Award nominations for the current season</p>
  <div style="margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <label style="font-size:12px;color:var(--text-secondary)">Filter by year:</label>
    <select id="yearFilter" class="form-input" style="width:auto;min-width:100px">
      <option value="">Loading...</option>
    </select>
  </div>
</div>

<div class="table-card">
  <div class="table-header">
    <div>
      <h3 style="font-size:16px;font-weight:700">All players</h3>
      <p style="font-size:12px;color:var(--text-secondary);margin-top:2px">Select a player to nominate them for an award</p>
    </div>
    <input type="text" id="playerSearch" placeholder="Search player..." class="form-input" style="width:200px">
  </div>
  <div id="playersTable"><div style="display:flex;align-items:center;gap:12px;padding:32px;color:var(--text-secondary)"><div class="spinner"></div><span>Loading players...</span></div></div>
</div>

<div class="table-card" id="nominationsSection">
  <div class="table-header">
    <div>
      <h3 style="font-size:16px;font-weight:700">Current year nominations</h3>
      <p id="nominationsSubtitle" style="font-size:12px;color:var(--text-secondary);margin-top:2px">Nominations for <span id="nominationsYear"></span></p>
    </div>
  </div>
  <div id="nominationsList"><div style="display:flex;align-items:center;gap:12px;padding:32px;color:var(--text-secondary)"><div class="spinner"></div></div></div>
</div>

</div>
</div>
</div>

<div id="nominateModal" style="display:none" class="modal-overlay">
  <div class="modal-box">
    <h3 style="font-size:18px;font-weight:800;margin-bottom:4px">Nominate player</h3>
    <div id="nominatePlayerName" style="font-size:20px;font-weight:800;color:var(--accent);margin-bottom:20px"></div>
    <div class="form-group">
      <label>Select award</label>
      <select id="awardSelect" class="form-input">
        <option value="">Choose an award...</option>
        <option>Stratex Young Player of the Year</option>
        <option>Breakthrough Player of the Year</option>
        <option>Most Improved Player</option>
        <option>Leadership Award</option>
        <option>Resilience Award</option>
        <option>Best Forward</option>
        <option>Best Midfielder</option>
        <option>Best Defender</option>
        <option>Best U6-U7 Player</option>
        <option>Best U8-U9 Player</option>
        <option>Best U10-U11 Player</option>
        <option>Best U12-U13 Player</option>
        <option>Best U14-U15 Player</option>
        <option>Best U16 Player</option>
        <option>Scout's Choice Award</option>
        <option>Player to Watch</option>
      </select>
    </div>
    <div id="nominateMsg" style="font-size:13px;min-height:20px;margin-bottom:12px"></div>
    <div style="display:flex;gap:12px;justify-content:flex-end">
      <button class="btn btn-ghost" id="cancelNomBtn">Cancel</button>
      <button class="btn btn-primary" id="confirmNomBtn">Confirm nomination</button>
    </div>
  </div>
</div>

<script src="../js/stratex-nav.js"></script>
<script src="../js/main.js"></script>
<script>
var CURRENT_YEAR = new Date().getFullYear();
var allPlayers = [], currentPlayerId = null, selectedPlayerName = '';

function initNav(){
  if(typeof Auth==='undefined'||!Auth.isLoggedIn()||Auth.type!=='Stratex'){window.location.href='login.html';return;}
  if(typeof buildStratexNav==='function')buildStratexNav('sidebarNav',Auth.user);
  if(typeof updateNotifBadge==='function')updateNotifBadge();
}
function logout(){if(typeof Auth!=='undefined')Auth.clear();window.location.href='login.html?logout=1';}
function fmtDate(ts){if(!ts)return '--';return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function posColor(g){return{Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#17a2b8',Forward:'#ff6b35'}[g]||'var(--accent)';}
function dOv(v){var n=parseFloat(v);return isNaN(n)?'--':(n>10?n/10:n).toFixed(1);}
function fmtVal(v){if(!v||v<1000)return '-';if(v>=1000000)return '£'+(v/1000000).toFixed(1)+'M';return '£'+Math.round(v/1000)+'K';}
function initials(f,l){return((f||'?')[0]+(l||'?')[0]).toUpperCase();}

function loadPlayers(){
  if(typeof api!=='function')return;
  api('GET','/api/awards/players').then(function(d){
    allPlayers=d.data||[];
    renderPlayers(allPlayers);
  }).catch(function(){
    document.getElementById('playersTable').innerHTML='<div style="padding:24px;color:var(--text-secondary)">Could not load players.</div>';
  });
}

function renderPlayers(players){
  if(!players.length){document.getElementById('playersTable').innerHTML='<div style="padding:24px;color:var(--text-secondary)">No players found.</div>';return;}
  document.getElementById('playersTable').innerHTML='<div style="overflow-x:auto"><table class="sl-table"><thead><tr>'+
    '<th>Player</th><th>Age group</th><th>Team</th><th>Overall</th><th>Position</th><th>Appearances</th><th>Est. value</th><th></th>'+
    '</tr></thead><tbody>'+players.map(function(p){
      var ov=dOv(p.overall_rating);
      var pCol=posColor(p.position_group);
      return '<tr><td><div style="display:flex;align-items:center;gap:8px">'+
        '<div style="width:30px;height:30px;border-radius:50%;background:'+pCol+';color:'+(pCol==='#FFC107'?'#000':'#fff')+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">'+initials(p.first_name,p.last_name)+'</div>'+
        '<b>'+p.first_name+' '+p.last_name+'</b></div></td>'+
        '<td><span style="background:rgba(41,121,255,.15);color:#58a6ff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700">'+(p.age_group||'--')+'</span></td>'+
        '<td style="font-size:12px;color:var(--text-secondary)">'+(p.team_name||'--')+'</td>'+
        '<td style="font-weight:800;color:var(--accent)">'+ov+'</td>'+
        '<td style="font-size:12px">'+(p.specific_position||p.position_group||'--')+'</td>'+
        '<td>'+(p.appearances||0)+'</td>'+
        '<td style="color:var(--accent);font-size:12px">'+fmtVal(p.transfer_value)+'</td>'+
        '<td><button class="btn btn-sm btn-primary" data-pid="'+p.id+'" data-pname="'+p.first_name+' '+p.last_name+'">Nominate</button></td></tr>';
    }).join('')+'</tbody></table></div>';
}

function loadNominations(year){
  var y=year||CURRENT_YEAR;
  document.getElementById('nominationsYear').textContent=y;
  if(typeof api!=='function')return;
  api('GET','/api/awards?year='+y).then(function(d){
    var noms=d.data||[];
    if(!noms.length){document.getElementById('nominationsList').innerHTML='<div style="padding:24px;text-align:center;color:var(--text-secondary)">No nominations for '+y+' yet.</div>';return;}
    document.getElementById('nominationsList').innerHTML='<div style="overflow-x:auto"><table class="sl-table"><thead><tr>'+
      '<th>Player</th><th>Award</th><th>Nominated</th><th>Status</th><th></th></tr></thead><tbody>'+
      noms.map(function(n){
        var p=n.players||{};
        var st=n.status||'pending';
        return '<tr><td><b>'+(p.first_name||'Unknown')+' '+(p.last_name||'')+'</b></td>'+
          '<td style="font-size:12px">'+n.award_name+'</td>'+
          '<td style="font-size:12px;color:var(--text-secondary)">'+fmtDate(n.nominated_at)+'</td>'+
          '<td><span class="status-badge status-'+st+'">'+st.charAt(0).toUpperCase()+st.slice(1)+'</span></td>'+
          '<td>'+(st!=='withdrawn'?'<button class="btn btn-sm btn-danger" data-withdraw="'+n.id+'">Withdraw</button>':'')+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }).catch(function(){
    document.getElementById('nominationsList').innerHTML='<div style="padding:24px;color:var(--text-secondary)">Could not load nominations.</div>';
  });
}

function setupYearFilter(){
  var cy=CURRENT_YEAR;
  var opts='<option value="'+cy+'">'+cy+' (Current)</option>';
  for(var y=cy-1;y>=cy-3;y--){opts+='<option value="'+y+'">'+y+'</option>';}
  document.getElementById('yearFilter').innerHTML=opts;
  document.getElementById('yearDisplay').textContent=cy;
  document.getElementById('nominationsYear').textContent=cy;
}

document.addEventListener('DOMContentLoaded',function(){
  initNav();loadPlayers();setupYearFilter();loadNominations(CURRENT_YEAR);

  document.getElementById('logoutBtn').addEventListener('click',logout);

  document.getElementById('playerSearch').addEventListener('input',function(){
    var q=this.value.toLowerCase();
    renderPlayers(allPlayers.filter(function(p){
      return (p.first_name+' '+p.last_name).toLowerCase().includes(q)||(p.team_name||'').toLowerCase().includes(q);
    }));
  });

  document.getElementById('yearFilter').addEventListener('change',function(){
    loadNominations(this.value||CURRENT_YEAR);
  });

  // Nominate button click
  document.getElementById('playersTable').addEventListener('click',function(e){
    var btn=e.target.closest('[data-pid]');
    if(!btn)return;
    currentPlayerId=btn.dataset.pid;
    selectedPlayerName=btn.dataset.pname;
    document.getElementById('nominatePlayerName').textContent=selectedPlayerName;
    document.getElementById('awardSelect').value='';
    document.getElementById('nominateMsg').textContent='';
    document.getElementById('nominateModal').style.display='flex';
  });

  // Withdraw button
  document.getElementById('nominationsList').addEventListener('click',function(e){
    var btn=e.target.closest('[data-withdraw]');
    if(!btn)return;
    if(!confirm('Withdraw this nomination?'))return;
    api('PATCH','/api/awards/'+btn.dataset.withdraw+'/withdraw').then(function(){
      loadNominations(document.getElementById('yearFilter').value||CURRENT_YEAR);
    }).catch(function(e){alert('Error: '+e.message);});
  });

  document.getElementById('cancelNomBtn').addEventListener('click',function(){
    document.getElementById('nominateModal').style.display='none';
    currentPlayerId=null;
  });

  document.getElementById('confirmNomBtn').addEventListener('click',function(){
    var award=document.getElementById('awardSelect').value;
    if(!award){document.getElementById('nominateMsg').textContent='Please select an award.';document.getElementById('nominateMsg').style.color='#f85149';return;}
    var btn=document.getElementById('confirmNomBtn');
    btn.disabled=true;btn.textContent='Nominating...';
    document.getElementById('nominateMsg').textContent='';
    if(typeof api!=='function')return;
    api('POST','/api/awards/nominate',{playerId:currentPlayerId,awardName:award}).then(function(){
      document.getElementById('nominateMsg').textContent='Nominated! Emails and notifications sent.';
      document.getElementById('nominateMsg').style.color='var(--accent)';
      setTimeout(function(){
        document.getElementById('nominateModal').style.display='none';
        loadNominations(CURRENT_YEAR);
      },1500);
    }).catch(function(e){
      document.getElementById('nominateMsg').textContent='Error: '+e.message;
      document.getElementById('nominateMsg').style.color='#f85149';
    }).finally(function(){btn.disabled=false;btn.textContent='Confirm nomination';});
  });
});
</script>
<script src="../js/mobile.js"></script>
</body></html>
