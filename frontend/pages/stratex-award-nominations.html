<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Award Nominations - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.award-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(0,230,118,.15);color:#00E676;border:1px solid rgba(0,230,118,.3)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#111827;border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:480px}
.modal-box h3{font-size:17px;font-weight:800;margin-bottom:16px}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">&#9889; Scout<span style="color:#00E676">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">&#127894; Award Nominations</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()">&#128276;<span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button>
</div>
</div>
<div class="page-content">
<div style="display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start">
<div>
<div class="table-card">
<div class="table-header">
<div><h3>All Players</h3><p style="font-size:12px;color:#546E7A">Select a player and nominate them for an award</p></div>
<div style="display:flex;gap:8px">
<input type="text" id="playerSearch" placeholder="Search player..." style="background:#0a0f1e;border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:#E2E8F0;font-size:13px;width:200px" oninput="filterPlayers()">
</div>
</div>
<div id="playersTable"><div class="loading-state"><div class="spinner"></div></div></div>
</div>
</div>
<div>
<div class="table-card" style="margin-bottom:20px">
<div class="table-header"><h3>Recent Nominations</h3></div>
<div id="nominationsList"><div class="loading-state"><div class="spinner"></div></div></div>
</div>
</div>
</div>
</div>
</div>
</div>

<div id="nominateModal" style="display:none" class="modal-overlay">
<div class="modal-box">
<h3>&#127894; Nominate Player</h3>
<div id="nominatePlayerName" style="font-size:18px;font-weight:800;margin-bottom:16px;color:#00E676"></div>
<div class="form-group">
<label>Select Award</label>
<select id="awardSelect" style="background:#0a0f1e;border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:#E2E8F0;font-size:14px;width:100%">
<option value="">Choose an award...</option>
<option value="Stratex Young Player of the Year">Stratex Young Player of the Year</option><option value="Breakthrough Player of the Year">Breakthrough Player of the Year</option><option value="Most Improved Player">Most Improved Player</option><option value="Leadership Award">Leadership Award</option><option value="Resilience Award">Resilience Award</option><option value="Best Forward">Best Forward</option><option value="Best Midfielder">Best Midfielder</option><option value="Best Defender">Best Defender</option><option value="Best U6-U7 Player">Best U6-U7 Player</option><option value="Best U8-U9 Player">Best U8-U9 Player</option><option value="Best U10-U11 Player">Best U10-U11 Player</option><option value="Best U12-U13 Player">Best U12-U13 Player</option><option value="Best U14-U15 Player">Best U14-U15 Player</option><option value="Best U16 Player">Best U16 Player</option><option value="Scout's Choice Award">Scout's Choice Award</option><option value="Player to Watch">Player to Watch</option>
</select>
</div>
<div id="nominateMsg" style="font-size:13px;margin:8px 0"></div>
<div style="display:flex;gap:12px;margin-top:16px">
<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
<button class="btn btn-primary" onclick="confirmNomination()" id="confirmBtn">&#127894; Nominate</button>
</div>
</div>
</div>

<script src="../js/main.js"></script>
<script>
var STRATEX_NAV=[{"icon":"🏠","label":"Dashboard","href":"stratex-dashboard.html"},{"icon":"📋","label":"Registrations","href":"stratex-registrations.html"},{"icon":"👥","label":"Users","href":"stratex-users.html"},{"icon":"⚽","label":"Players","href":"stratex-players.html"},{"icon":"🔍","label":"Scouts","href":"stratex-scouts.html"},{"icon":"🏋️","label":"Coaches","href":"stratex-coaches.html"},{"icon":"🏆","label":"Scout Teams","href":"stratex-scout-teams.html"},{"icon":"🏫","label":"School Teams","href":"stratex-school-teams.html"},{"icon":"🎖️","label":"Award Nominations","href":"stratex-award-nominations.html"},{"icon":"🎪","label":"Showcase Events","href":"stratex-showcase-events.html"},{"icon":"🔔","label":"Notifications","href":"#","action":"toggleNotifPanel"},{"icon":"⚙️","label":"Settings","href":"stratex-settings.html"}];
var allPlayers=[], currentPlayerId=null;

function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Stratex'){window.location.href='login.html';return;}
  var nav=document.getElementById('sidebarNav');
  var cur=window.location.pathname.split('/').pop();
  if(nav) nav.innerHTML=STRATEX_NAV.map(function(i){return'<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'"'+(i.action?' onclick="'+i.action+'();return false"':'')+'>'+i.icon+' '+i.label+'</a>';}).join('');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#FF5722;color:#fff">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Stratex Admin</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){}

async function loadPlayers(){
  try{
    var d=await api('GET','/api/awards/players');
    allPlayers=d.data||[];
    renderPlayers(allPlayers);
  }catch(e){document.getElementById('playersTable').innerHTML='<div style="padding:20px;color:#546E7A">Could not load players</div>';}
}

function posColor(g){return{Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#00BCD4',Forward:'#FF5722'}[g]||'#00E676';}
function dispOverall(v){var n=parseFloat(v);if(isNaN(n))return '--';return(n>10?n/10:n).toFixed(1);}

function renderPlayers(players){
  if(!players.length){document.getElementById('playersTable').innerHTML='<div style="padding:20px;color:#546E7A">No players found</div>';return;}
  document.getElementById('playersTable').innerHTML='<div style="overflow-x:auto"><table class="sl-table"><thead><tr><th>Player</th><th>Age Group</th><th>Team</th><th>Overall</th><th>Position</th><th>Apps</th><th></th></tr></thead><tbody>'+
  players.map(function(p){
    var ov=dispOverall(p.overall_rating);
    var pCol=posColor(p.position_group);
    return'<tr><td><div style="display:flex;align-items:center;gap:8px"><div class="user-avatar" style="width:28px;height:28px;font-size:10px;background:'+pCol+'">'+initials(p.first_name,p.last_name)+'</div><b>'+p.first_name+' '+p.last_name+'</b></div></td>'+
    '<td><span class="badge badge-blue">'+(p.age_group||'--')+'</span></td>'+
    '<td style="font-size:12px;color:#546E7A">'+(p.team_name||'--')+'</td>'+
    '<td style="font-weight:800;color:#00E676">'+ov+'</td>'+
    '<td style="font-size:12px">'+(p.specific_position||p.position_group||'--')+'</td>'+
    '<td>'+(p.appearances||0)+'</td>'+
    '<td><button class="btn btn-sm btn-primary" onclick="openNominate('+JSON.stringify(p.id)+','+JSON.stringify(p.first_name+' '+p.last_name)+')">&#127894; Nominate</button></td>'+
    '</tr>';
  }).join('')+'</tbody></table></div>';
}

function filterPlayers(){
  var q=document.getElementById('playerSearch').value.toLowerCase();
  renderPlayers(allPlayers.filter(function(p){return(p.first_name+' '+p.last_name).toLowerCase().includes(q)||(p.team_name||'').toLowerCase().includes(q);
  }));
}

async function loadNominations(){
  try{
    var d=await api('GET','/api/awards');
    var noms=d.data||[];
    if(!noms.length){document.getElementById('nominationsList').innerHTML='<div style="padding:20px;color:#546E7A;text-align:center">No nominations yet</div>';return;}
    document.getElementById('nominationsList').innerHTML='<div style="padding:8px">'+noms.map(function(n){
      var p=n.players;
      var pName=p?p.first_name+' '+p.last_name:'Unknown';
      return'<div style="padding:12px;border-bottom:1px solid var(--border)"><div style="font-weight:700;font-size:13px">'+pName+'</div><div class="award-badge" style="margin:4px 0">'+n.award_name+'</div><div style="font-size:11px;color:#546E7A">'+new Date(n.nominated_at).toLocaleDateString('en-GB')+'</div></div>';
    }).join('')+'</div>';
  }catch(e){document.getElementById('nominationsList').innerHTML='<div style="padding:20px;color:#546E7A">Could not load</div>';}
}

function openNominate(id,name){
  currentPlayerId=id;
  document.getElementById('nominatePlayerName').textContent=name;
  document.getElementById('awardSelect').value='';
  document.getElementById('nominateMsg').textContent='';
  document.getElementById('nominateModal').style.display='flex';
}
function closeModal(){document.getElementById('nominateModal').style.display='none';currentPlayerId=null;}

async function confirmNomination(){
  var award=document.getElementById('awardSelect').value;
  if(!award){document.getElementById('nominateMsg').textContent='Please select an award';document.getElementById('nominateMsg').style.color='#f44336';return;}
  var btn=document.getElementById('confirmBtn');
  btn.disabled=true;btn.textContent='Nominating...';
  document.getElementById('nominateMsg').textContent='';
  try{
    await api('POST','/api/awards/nominate',{playerId:currentPlayerId,awardName:award});
    document.getElementById('nominateMsg').textContent='Nominated successfully! Emails sent.';
    document.getElementById('nominateMsg').style.color='#00E676';
    setTimeout(function(){closeModal();loadNominations();},1500);
  }catch(e){
    document.getElementById('nominateMsg').textContent='Error: '+e.message;
    document.getElementById('nominateMsg').style.color='#f44336';
  }
  btn.disabled=false;btn.textContent='&#127894; Nominate';
}

document.addEventListener('DOMContentLoaded',function(){initNav();loadPlayers();loadNominations();});
</script>
<script src="../js/mobile.js"></script>
</body></html>
