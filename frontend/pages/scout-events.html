<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Events - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.event-card{background:#111827;border:1px solid #1e2a3a;border-radius:14px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.event-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#00E676,#00BCD4)}
.attendance-bar{height:8px;background:#1e2a3a;border-radius:4px;overflow:hidden;margin-top:6px}
.attendance-fill{height:100%;background:linear-gradient(90deg,#00E676,#00BCD4);border-radius:4px;transition:width .3s}
.att-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.att-confirmed{background:rgba(0,230,118,.15);color:#00E676;border:1px solid rgba(0,230,118,.3)}
.att-waitlisted{background:rgba(255,193,7,.1);color:#FFC107;border:1px solid rgba(255,193,7,.3)}
.att-cancelled{background:rgba(244,67,54,.1);color:#f44336;border:1px solid rgba(244,67,54,.3)}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">&#9889; Scout<span style="color:#00E676">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">&#127914; Showcase Events</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button>
</div>
</div>
<div class="page-content">
<div style="margin-bottom:20px">
<h2 style="font-size:20px;font-weight:800;margin-bottom:4px">Upcoming Showcase Events</h2>
<p style="font-size:13px;color:#546E7A">Events where you can scout elite youth players</p>
</div>
<div id="eventsContainer"><div class="loading-state"><div class="spinner"></div></div></div>
</div>
</div>
</div>
<script src="../js/main.js"></script>
<script>
var SCOUT_NAV=[
{icon:'&#127968;',label:'Dashboard',href:'scout-dashboard.html'},
{icon:'&#128269;',label:'Player Search',href:'player-search.html'},
{icon:'&#128203;',label:'My Pipeline',href:'scout-pipeline.html'},
{icon:'&#127942;',label:'Rankings',href:'scout-rankings.html'},
{icon:'&#128197;',label:'Fixtures',href:'scout-fixtures.html'},
{icon:'&#128302;',label:'Predictions',href:'scout-predictions.html'},
{icon:'&#128202;',label:'Exports',href:'scout-exports.html'},
{icon:'&#9881;',label:'My Team Setup',href:'scout-setup.html'},
{icon:'&#127914;',label:'Events',href:'scout-events.html'},
{icon:'&#128276;',label:'Notifications',href:'scout-notifications.html'},
{icon:'&#128100;',label:'Settings',href:'scout-settings.html'},
];

function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Scout'){window.location.href='login.html';return;}
  var nav=document.getElementById('sidebarNav');
  var cur=window.location.pathname.split('/').pop();
  if(nav)nav.innerHTML=SCOUT_NAV.map(function(i){return'<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'">'+i.icon+' '+i.label+'</a>';}).join('');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#00E676;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Scout</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){}

async function loadEvents(){
  try{
    var d=await api('GET','/api/showcase');
    var events=d.data||[];
    if(!events.length){document.getElementById('eventsContainer').innerHTML='<div style="text-align:center;padding:48px;color:#546E7A"><p style="font-size:20px">&#127914;</p><p>No showcase events available yet.</p><p style="font-size:12px;margin-top:8px">Check back soon or watch your notifications.</p></div>';return;}
    document.getElementById('eventsContainer').innerHTML=events.map(function(ev){return renderEventCard(ev);}).join('');
  }catch(e){document.getElementById('eventsContainer').innerHTML='<div style="padding:24px;color:#f44336">Could not load events: '+e.message+'</div>';}
}

function renderEventCard(ev){
  var dateStr=ev.event_date?new Date(ev.event_date).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Date TBC';
  var timeStr=ev.event_date?new Date(ev.event_date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'';
  var pct=Math.round(((ev.confirmedCount||0)/(ev.max_scouts||1))*100);
  var full=(ev.confirmedCount||0)>=(ev.max_scouts||20);
  var myStatus=ev.myAttendanceStatus;
  var statusHtml='';
  if(myStatus==='confirmed') statusHtml='<span class="att-badge att-confirmed">&#10003; Confirmed</span>';
  else if(myStatus==='waitlisted') statusHtml='<span class="att-badge att-waitlisted">&#8987; Waitlisted</span>';
  else if(myStatus==='cancelled') statusHtml='<span class="att-badge att-cancelled">Cancelled</span>';

  var actionHtml='';
  if(!myStatus||myStatus==='cancelled'){
    if(full) actionHtml='<button class="btn btn-outline" onclick="joinWaitlist('+JSON.stringify(ev.id)+')">Join Waitlist</button>';
    else actionHtml='<button class="btn btn-primary" onclick="confirmAttendance('+JSON.stringify(ev.id)+')">Confirm Attendance</button>';
  } else if(myStatus==='confirmed'){
    actionHtml='<button class="btn btn-ghost" style="color:#f44336" onclick="cancelAttendance('+JSON.stringify(ev.id)+')">Cancel Attendance</button>';
  } else if(myStatus==='waitlisted'){
    actionHtml='<button class="btn btn-ghost" style="color:#f44336" onclick="cancelAttendance('+JSON.stringify(ev.id)+')">Leave Waitlist</button>';
  }

  return'<div class="event-card" id="ev-'+ev.id+'">' +
  '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">' +
  '<div><div style="font-size:20px;font-weight:900;margin-bottom:6px">'+ev.event_name+'</div>' +
  '<div style="font-size:13px;color:#94a3b8;margin-bottom:4px">&#128197; '+dateStr+(timeStr?' at '+timeStr:'')+'</div>' +
  '<div style="font-size:13px;color:#94a3b8;margin-bottom:8px">&#128205; '+(ev.venue_name||'Venue TBC')+(ev.venue_address?', '+ev.venue_address:'')+'</div>' +
  (ev.description?'<div style="font-size:13px;color:#B0BEC5;margin-bottom:12px">'+ev.description+'</div>':'')+
  statusHtml+
  '</div>' +
  '<div style="text-align:center;min-width:120px">' +
  '<div style="font-size:28px;font-weight:900;color:#00E676">'+(ev.confirmedCount||0)+'</div>' +
  '<div style="font-size:12px;color:#546E7A">of '+ev.max_scouts+' places</div>' +
  '<div class="attendance-bar"><div class="attendance-fill" style="width:'+pct+'%"></div></div>' +
  (full&&(!myStatus||myStatus==='cancelled')?'<div style="font-size:11px;color:#FFC107;margin-top:4px">Fully Booked</div>':'')+
  '</div>' +
  '</div>' +
  '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'+actionHtml+'</div>' +
  '</div>';
}

async function confirmAttendance(eventId){
  try{
    var d=await api('POST','/api/scout/showcase-attendance',{eventId:eventId});
    if(d.status==='waitlisted') alert('Event is fully booked. You have been added to the waitlist!');
    else alert('Attendance confirmed! See you there.');
    loadEvents();
  }catch(e){alert('Error: '+e.message);}
}

async function joinWaitlist(eventId){
  try{
    var d=await api('POST','/api/scout/showcase-attendance',{eventId:eventId});
    alert(d.message||'Added to waitlist!');
    loadEvents();
  }catch(e){alert('Error: '+e.message);}
}

async function cancelAttendance(eventId){
  if(!confirm('Cancel your attendance?')) return;
  try{
    await api('POST','/api/scout/showcase-cancel',{eventId:eventId});
    loadEvents();
  }catch(e){alert('Error: '+e.message);}
}

document.addEventListener('DOMContentLoaded',function(){initNav();loadEvents();});
</script>
<script src="../js/mobile.js"></script>
</body></html>
