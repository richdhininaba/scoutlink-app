<style>
:root{--bg:#0d1117;--card:#161b22;--accent:#1d9e75;--text:#ffffff;--text-secondary:#8b949e;--border:#30363d;}
.event-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.event-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#17a2b8)}
.attendance-bar{height:8px;background:#21262d;border-radius:4px;overflow:hidden;margin-top:6px}
.attendance-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.att-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.att-confirmed{background:rgba(29,158,117,.15);color:var(--accent);border:1px solid rgba(29,158,117,.3)}
.att-waitlisted{background:rgba(255,193,7,.1);color:#FFC107;border:1px solid rgba(255,193,7,.3)}
.att-cancelled{background:rgba(248,81,73,.1);color:#f85149;border:1px solid rgba(248,81,73,.3)}
.btn{padding:8px 16px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#17856a;}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
.btn-sm{padding:6px 12px;font-size:13px;}
</style>
<link rel="stylesheet" href="../css/phone-base.css">
<link rel="stylesheet" href="../css/phone-shell.css">
<link rel="stylesheet" href="../css/phone-pages.css">
<script type="text/javascript">

</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900;color:#fff;text-decoration:none">Scout<span style="color:var(--accent)">Link</span></a></div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
  <span class="topbar-title">Showcase Events</span>
  <div class="topbar-right">
    <button class="notif-btn" id="notifToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="notif-badge" id="notifBadge" style="display:none">0</span>
    </button>
    <button class="btn btn-sm btn-outline" id="logoutBtn">Sign Out</button>
  </div>
</div>
<div class="page-content">
  <div style="margin-bottom:20px">
    <h2 style="font-size:20px;font-weight:800;margin-bottom:4px">Upcoming Showcase Events</h2>
    <p style="font-size:13px;color:var(--text-secondary)">Events where you can scout elite youth players</p>
  </div>
  <div id="eventsContainer"><div class="loading-state"><div class="spinner"></div></div></div>
</div>
</div>
</div>
<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-header">
    <h3>Notifications</h3>
    <button id="closeNotifBtn" style="background:none;border:none;color:var(--text-secondary);font-size:20px;cursor:pointer">x</button>
  </div>
  <div class="notif-list" id="notifList"></div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script src="../js/heap-analytics.js"></script>
<script>
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
function logout(){if(typeof Auth!=='undefined')Auth.clear();navigateClean('login.html?logout=1');}

function initNav(){
  if(typeof Auth==='undefined'||!Auth.isLoggedIn()||Auth.type!=='Scout'){navigateClean('login.html');return;}
  if(typeof buildScoutNav==='function')buildScoutNav('sidebarNav','Scout');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u){
    var ini=(u.firstName||'?')[0]+(u.lastName||'?')[0];
    uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:var(--accent);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">'+ini.toUpperCase()+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role" style="color:var(--text-secondary);font-size:12px">Scout</div></div></div>';
  }
  if(typeof updateNotifBadge==='function')updateNotifBadge();
}

function loadEvents(){
  if(typeof api!=='function')return;
  api('GET','/api/showcase').then(function(d){
    var events=d.data||[];
    if(!events.length){
      document.getElementById('eventsContainer').innerHTML='<div style="text-align:center;padding:48px;color:var(--text-secondary)"><p style="font-size:32px;margin-bottom:12px">&#127914;</p><p style="font-size:16px;font-weight:600;margin-bottom:6px">No events available yet</p><p style="font-size:13px">Check back soon or watch your notifications.</p></div>';
      return;
    }
    document.getElementById('eventsContainer').innerHTML=events.map(function(ev){return renderEventCard(ev);}).join('');
  }).catch(function(e){
    document.getElementById('eventsContainer').innerHTML='<div style="padding:24px;color:#f85149">Could not load events: '+e.message+'</div>';
  });
}

function renderEventCard(ev){
  var dateStr=ev.event_date?new Date(ev.event_date).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Date TBC';
  var timeStr=ev.event_date?new Date(ev.event_date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'';
  var pct=Math.round(((ev.confirmedCount||0)/(ev.max_scouts||1))*100);
  var full=(ev.confirmedCount||0)>=(ev.max_scouts||20);
  var myStatus=ev.myAttendanceStatus;
  var statusHtml='';
  if(myStatus==='confirmed')statusHtml='<span class="att-badge att-confirmed">&#10003; Confirmed</span>';
  else if(myStatus==='waitlisted')statusHtml='<span class="att-badge att-waitlisted">&#8987; Waitlisted</span>';
  else if(myStatus==='cancelled')statusHtml='<span class="att-badge att-cancelled">Cancelled</span>';
  var actionHtml='';
  if(!myStatus||myStatus==='cancelled'){
    if(full)actionHtml='<button class="btn btn-outline" data-action="waitlist" data-evid="'+ev.id+'">Join Waitlist</button>';
    else actionHtml='<button class="btn btn-primary" data-action="confirm" data-evid="'+ev.id+'">Confirm Attendance</button>';
  } else if(myStatus==='confirmed'){
    actionHtml='<button class="btn btn-ghost" style="color:#f85149" data-action="cancel" data-evid="'+ev.id+'">Cancel Attendance</button>';
  } else if(myStatus==='waitlisted'){
    actionHtml='<button class="btn btn-ghost" style="color:#f85149" data-action="cancel" data-evid="'+ev.id+'">Leave Waitlist</button>';
  }
  return '<div class="event-card" id="ev-'+ev.id+'">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">'+
    '<div><div style="font-size:18px;font-weight:800;margin-bottom:6px">'+ev.event_name+'</div>'+
    '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px">&#128197; '+dateStr+(timeStr?' at '+timeStr:'')+'</div>'+
    '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">&#128205; '+(ev.venue_name||'Venue TBC')+(ev.venue_address?', '+ev.venue_address:'')+'</div>'+
    (ev.description?'<div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">'+ev.description+'</div>':'')+
    statusHtml+'</div>'+
    (full&&(!myStatus||myStatus==='cancelled')?'<span style="background:rgba(255,193,7,.15);color:#FFC107;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700">&#9940; Event Full</span>':'')+
    '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'+actionHtml+'</div></div>';
}

document.addEventListener('DOMContentLoaded',function(){
  initNav();loadEvents();
  document.getElementById('notifToggle').addEventListener('click',toggleNotifPanel);
  document.getElementById('closeNotifBtn').addEventListener('click',toggleNotifPanel);
  document.getElementById('logoutBtn').addEventListener('click',logout);
  document.getElementById('eventsContainer').addEventListener('click',function(e){
    var btn=e.target.closest('[data-action]');
    if(!btn)return;
    var action=btn.dataset.action;
    var evid=btn.dataset.evid;
    if(action==='confirm'){
      if(typeof api==='function'){
        api('POST','/api/scout/showcase-attendance',{eventId:evid}).then(function(d){
          if(d.status==='waitlisted')alert('Event is fully booked. You have been added to the waitlist!');
          else alert('Attendance confirmed! See you there.');
          loadEvents();
        }).catch(function(e){alert('Error: '+e.message);});
      }
    } else if(action==='waitlist'){
      if(typeof api==='function'){
        api('POST','/api/scout/showcase-attendance',{eventId:evid}).then(function(d){alert(d.message||'Added to waitlist!');loadEvents();}).catch(function(e){alert('Error: '+e.message);});
      }
    } else if(action==='cancel'){
      if(!confirm('Cancel your attendance?'))return;
      if(typeof api==='function'){
        api('POST','/api/scout/showcase-cancel',{eventId:evid}).then(function(){loadEvents();}).catch(function(e){alert('Error: '+e.message);});
      }
    }
  });
});
</script>

<script src="../js/phone-pages.js"></script>
</body></html>
