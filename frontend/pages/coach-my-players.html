<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Players - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:20px;}
.player-card2{background:#111827;border:1px solid #1e2a3a;border-radius:12px;padding:18px;cursor:pointer;transition:all .2s;position:relative;}
.player-card2:hover{border-color:#00E676;transform:translateY(-1px);}
.attr-mini-row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px;}
.attr-mini-bar2{flex:1;height:4px;background:#1e2a3a;border-radius:2px;overflow:hidden;}
.attr-mini-fill2{height:100%;border-radius:2px;}
.filter-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.filter-bar input,.filter-bar select{padding:8px 12px;background:#111827;border:1px solid #1e2a3a;border-radius:8px;color:#e2e8f0;font-size:13px;}
</style>
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">⚡ Scout<span style="color:#00E676">Link</span></a></div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
  <div class="topbar">
    <span class="topbar-title">My Players</span>
    <div class="topbar-right">
      <a href="add-player.html" class="btn btn-sm btn-primary">+ Add Player</a>
      <button class="notif-btn" onclick="toggleNotifPanel()">🔔<span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
      <button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button>
    </div>
  </div>
  <div class="page-content">
    <!-- Squad KPIs -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px">
      <div class="kpi-card"><div class="kpi-label">Total Players</div><div class="kpi-value green" id="kpiTotal">-</div></div>
      <div class="kpi-card"><div class="kpi-label">Avg Overall</div><div class="kpi-value" id="kpiAvg">-</div><div class="kpi-sub">/ 10</div></div>
      <div class="kpi-card"><div class="kpi-label">Top Player</div><div class="kpi-value green" id="kpiTop">-</div></div>
      <div class="kpi-card"><div class="kpi-label">Squad Value</div><div class="kpi-value" id="kpiValue">-</div></div>
    </div>
    <!-- Filters -->
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="🔍 Search name..." oninput="renderPlayers()">
      <select id="posFilter" onchange="renderPlayers()">
        <option value="">All Positions</option>
        <option value="Goalkeeper">Goalkeepers</option>
        <option value="Defender">Defenders</option>
        <option value="Midfielder">Midfielders</option>
        <option value="Forward">Forwards</option>
      </select>
      <select id="viewMode" onchange="renderPlayers()">
        <option value="grid">Card View</option>
        <option value="table">Table View</option>
      </select>
    </div>
    <div id="playersContainer"><div class="loading-state"><div class="spinner"></div></div></div>
  </div>
</div>
</div>
<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">×</button></div>
  <div class="notif-list" id="notifList"></div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>
function dispOverall(v){var n=parseFloat(v);if(isNaN(n))return '--';return (n>10?n/10:n).toFixed(1);}
function dispAttr(v){var n=parseFloat(v);if(isNaN(n))return '--';return (n>10?n/10:n).toFixed(1);}
function attrPct(v){var n=parseFloat(v);if(isNaN(n))return 0;return Math.round(n>10?n:n*10);}
function attrColor(pct){return pct>=80?'#00E676':pct>=65?'#FFC107':pct>=50?'#FF9800':'#f44336';}
function posColor(g){return {Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#00BCD4',Forward:'#FF5722'}[g]||'#00E676';}
var allPlayers = [];
var COACH_NAV = [
  {label:'🏠 Dashboard',href:'coach-dashboard.html'},{label:'👥 My Players',href:'coach-my-players.html'},
  {label:'➕ Add Player',href:'add-player.html'},{label:'📦 Bulk Import',href:'bulk-add-players.html'},
  {label:'📝 Match Facts',href:'match-facts.html'},{label:'📅 Fixtures',href:'coach-fixtures.html'},
  {label:'🎥 Video Reels',href:'coach-video-reels.html'},
  {label:'🔔 Notifications',href:'#',action:'toggleNotifPanel'},{label:'⚙️ Settings',href:'coach-settings.html'}
];
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Coach'){window.location.href='login.html';return;}
  if(typeof buildScoutNav==='function') buildScoutNav('sidebarNav','Coach');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#42A5F5;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Coach</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}

document.addEventListener('DOMContentLoaded', async function(){
  initNav();
  try {
    var d = await api('GET', '/api/coaches/my-players');
    allPlayers = d.data||[];
    var total = allPlayers.length;
    document.getElementById('kpiTotal').textContent = total;
    if(total){
      var avgOv = allPlayers.reduce(function(s,p){var n=parseFloat(p.overall_rating||0);return s+(n>10?n:n*10);},0)/total;
      document.getElementById('kpiAvg').textContent = (avgOv/10).toFixed(1);
      var top = allPlayers.reduce(function(a,p){return parseFloat(p.overall_rating||0)>parseFloat(a.overall_rating||0)?p:a;});
      document.getElementById('kpiTop').textContent = top.first_name+' '+top.last_name;
      var totalVal = allPlayers.reduce(function(s,p){return s+(p.transfer_value||0);},0);
      document.getElementById('kpiValue').textContent = formatValue(totalVal);
    }
    renderPlayers();
  } catch(e) {
    document.getElementById('playersContainer').innerHTML='<div style="text-align:center;padding:48px;color:#546E7A"><p>No players yet.</p><a href="bulk-add-players.html" class="btn btn-primary" style="margin-top:14px">Import Squad</a></div>';
    document.getElementById('kpiTotal').textContent='0';
    console.error(e);
  }
});

function renderPlayers(){
  var search = (document.getElementById('searchInput').value||'').toLowerCase();
  var posF = document.getElementById('posFilter').value;
  var mode = document.getElementById('viewMode').value;
  var filtered = allPlayers.filter(function(p){
    var nm = !search||(p.first_name+' '+p.last_name).toLowerCase().includes(search);
    var pos = !posF||p.position_group===posF;
    return nm&&pos;
  });
  if(!filtered.length){document.getElementById('playersContainer').innerHTML='<div style="text-align:center;padding:48px;color:#546E7A">No players match your filter.</div>';return;}
  if(mode==='grid') renderGrid(filtered);
  else renderTable(filtered);
}

function renderGrid(players){
  var html = '<div class="player-grid">';
  players.forEach(function(p){
    var ov = dispOverall(p.overall_rating); var ovNum=parseFloat(p.overall_rating||0); var ovPct=ovNum>10?ovNum:ovNum*10;
    var ovColor=attrColor(ovPct); var pCol=posColor(p.position_group);
    var keyAttrs = [];
    if(p.position_group==='Forward') keyAttrs=[['Pace',p.pace],['Shooting',p.shooting],['Dribbling',p.dribbling]];
    else if(p.position_group==='Midfielder') keyAttrs=[['Passing',p.passing],['Stamina',p.stamina],['Vision',p.vision]];
    else if(p.position_group==='Defender') keyAttrs=[['Defending',p.defending],['Strength',p.strength],['Tackling',p.tackling]];
    else keyAttrs=[['Composure',p.composure],['Strength',p.strength],['Pace',p.pace]];
    html += '<div class="player-card2" onclick="location.href='player-profile.html?id='+p.id+''">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">' +
        '<div class="user-avatar" style="background:'+pCol+';color:#000;font-size:14px">'+initials(p.first_name,p.last_name)+'</div>' +
        '<div style="flex:1"><div style="font-weight:700">'+p.first_name+' '+p.last_name+'</div>' +
        '<div style="font-size:12px;color:#546E7A">'+(p.specific_position||p.primary_position||'--')+' · '+p.age+' yrs</div></div>' +
        '<div style="font-size:22px;font-weight:900;color:'+ovColor+'">'+ov+'</div>' +
      '</div>' +
      keyAttrs.map(function(a){var pct=attrPct(a[1]);var col=attrColor(pct);return '<div class="attr-mini-row"><span style="color:#546E7A;width:70px">'+a[0]+'</span><div class="attr-mini-bar2"><div class="attr-mini-fill2" style="width:'+pct+'%;background:'+col+'"></div></div><span style="color:'+col+';font-weight:700;font-size:11px">'+dispAttr(a[1])+'</span></div>';}).join('') +
      '<div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px">' +
        '<span style="color:#00E676;font-weight:700">'+formatValue(p.transfer_value||0)+'</span>' +
        '<span style="color:#546E7A">'+formatSalary(p.predicted_salary_weekly||0)+'</span>' +
      '</div>' +
    '</div>';
  });
  html += '</div>';
  document.getElementById('playersContainer').innerHTML = html;
}

function renderTable(players){
  var html = '<div style="overflow-x:auto"><table class="sl-table"><thead><tr><th>Player</th><th>Position</th><th>Age</th><th>Overall</th><th>Height</th><th>Build</th><th>Apps</th><th>Goals</th><th>Value</th><th></th></tr></thead><tbody>';
  players.forEach(function(p){
    var ov=dispOverall(p.overall_rating); var ovNum=parseFloat(p.overall_rating||0); var ovPct=ovNum>10?ovNum:ovNum*10;
    var pCol=posColor(p.position_group);
    html += '<tr>' +
      '<td><div style="display:flex;align-items:center;gap:8px"><div class="user-avatar" style="width:30px;height:30px;font-size:11px;background:'+pCol+'">'+initials(p.first_name,p.last_name)+'</div><b>'+p.first_name+' '+p.last_name+'</b></div></td>' +
      '<td><span style="color:'+pCol+';font-size:12px;font-weight:600">'+(p.specific_position||p.primary_position||'--')+'</span></td>' +
      '<td>'+p.age+'</td>' +
      '<td style="color:'+attrColor(ovPct)+';font-weight:700">'+ov+'</td>' +
      '<td style="font-size:12px">'+(p.height_category||'--')+'</td>' +
      '<td style="font-size:12px">'+(p.build_category||'--')+'</td>' +
      '<td>'+(p.appearances||0)+'</td>' +
      '<td style="color:#00E676">'+(p.goals||0)+'</td>' +
      '<td style="color:#00E676;font-weight:700">'+formatValue(p.transfer_value||0)+'</td>' +
      '<td><a href="player-profile.html?id='+p.id+'" class="btn btn-sm btn-outline">View</a></td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('playersContainer').innerHTML = html;
}
</script>
<script src="../js/mobile.js"></script>
</body></html>
