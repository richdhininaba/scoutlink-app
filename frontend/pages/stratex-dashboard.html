<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stratex Dashboard - ScoutLink</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">ScoutLink</a></div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
  <div class="topbar">
    <span class="topbar-title">Stratex Admin Dashboard</span>
    <div class="topbar-right">
      <button class="notif-btn" onclick="toggleNotifPanel()">Notifs<span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
      <button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button>
    </div>
  </div>
  <div class="page-content">
    <div class="kpi-grid" id="kpiGrid">
      <div class="kpi-card"><div class="kpi-label">Total Players</div><div class="kpi-value green" id="kpiPlayers">-</div></div>
      <div class="kpi-card"><div class="kpi-label">Active Coaches</div><div class="kpi-value" id="kpiCoaches">-</div></div>
      <div class="kpi-card"><div class="kpi-label">Active Scouts</div><div class="kpi-value" id="kpiScouts">-</div></div>
      <div class="kpi-card"><div class="kpi-label">Pending Requests</div><div class="kpi-value" id="kpiPending">-</div><div class="kpi-sub" id="kpiPendingSub"></div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="table-card">
        <div class="table-header"><h3>Pending Registrations</h3><a href="stratex-registrations.html" class="btn btn-sm btn-primary">Review All</a></div>
        <div id="pendingRegs"><div class="loading-state"><div class="spinner"></div></div></div>
      </div>
      <div class="table-card">
        <div class="table-header"><h3>Top Players by Overall</h3><a href="player-search.html" class="btn btn-sm btn-outline">All Players</a></div>
        <div id="topPlayers"><div class="loading-state"><div class="spinner"></div></div></div>
      </div>
    </div>
  </div>
</div>
</div>
<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">×</button></div>
  <div class="notif-list" id="notifList"></div>
</div>
<script src="../js/main.js"></script>
<script>
var STRATEX_NAV = [
  {label:'Dashboard', href:'stratex-dashboard.html'},
  {label:'Registrations', href:'stratex-registrations.html'},
  {label:'Users', href:'stratex-users.html'},
  {label:'Players', href:'stratex-players.html'},
  {label:'Scouts', href:'stratex-scouts.html'},
  {label:'Coaches', href:'stratex-coaches.html'},
  {label:'Scout Teams', href:'stratex-scout-teams.html'},
  {label:'School Teams', href:'stratex-school-teams.html'},
  {label:'Notifications', href:'#', action:'toggleNotifPanel'},
  {label:'Settings', href:'stratex-settings.html'}
];

function initNav() {
  if (!Auth.isLoggedIn() || Auth.type !== 'Stratex') { window.location.href = 'login.html'; return; }
  var nav = document.getElementById('sidebarNav');
  var cur = window.location.pathname.split('/').pop();
  if (nav) nav.innerHTML = STRATEX_NAV.map(function(i) {
    return '<a class="nav-item' + (cur === i.href ? ' active' : '') + '" href="' + i.href + '" ' +
      (i.action ? 'onclick="' + i.action + '();return false"' : '') + '>' + i.label + '</a>';
  }).join('');
  var u = Auth.user;
  var uel = document.getElementById('sidebarUser');
  if (uel && u) uel.innerHTML = '<div class="user-info"><div class="user-avatar">' + initials(u.firstName, u.lastName) + '</div><div><div class="user-name">' + u.firstName + ' ' + u.lastName + '</div><div class="user-role">Stratex Admin</div></div></div>';
  updateNotifBadge();
}

function logout() { Auth.clear(); window.location.href = 'login.html?logout=1'; }
function toggleNotifPanel() { document.getElementById('notifPanel').classList.toggle('open'); }

document.addEventListener('DOMContentLoaded', function() { initNav(); loadDashboard(); });

async function loadDashboard() {
  try {
    var d = await api('GET', '/api/stratex/dashboard');
    document.getElementById('kpiPlayers').textContent = d.totalPlayers || 0;
    document.getElementById('kpiCoaches').textContent = d.totalCoaches || 0;
    document.getElementById('kpiScouts').textContent = d.totalScouts || 0;
    document.getElementById('kpiPending').textContent = d.pendingReqs || 0;
    if (d.pendingReqs > 0) {
      document.getElementById('kpiPending').className = 'kpi-value green';
      document.getElementById('kpiPendingSub').innerHTML = '<a href="stratex-registrations.html" style="color:#00E676">Review now</a>';
    } else {
      document.getElementById('kpiPendingSub').textContent = 'All clear';
    }
    var regs = d.recentPendingRegistrations || [];
    if (regs.length) {
      var rows = regs.map(function(r) {
        var tc = r.account_type === 'Coach' ? 'badge-blue' : 'badge-green';
        return '<tr><td><b>' + r.first_name + ' ' + r.last_name + '</b><br><span style="font-size:11px;color:#546E7A">' + r.email + '</span></td>' +
          '<td><span class="badge ' + tc + '">' + r.account_type + '</span></td>' +
          '<td>' + (r.team_name || r.scout_club || '&mdash;') + '</td>' +
          '<td><a href="stratex-registrations.html" class="btn btn-sm btn-primary">Review</a></td></tr>';
      });
      document.getElementById('pendingRegs').innerHTML = '<table class="sl-table"><thead><tr><th>Name</th><th>Type</th><th>Team</th><th></th></tr></thead><tbody>' + rows.join('') + '</tbody></table>';
    } else {
      document.getElementById('pendingRegs').innerHTML = '<div style="text-align:center;padding:32px;color:#546E7A">No pending registrations</div>';
    }
  } catch(e) {
    document.getElementById('kpiPlayers').textContent = '0';
    document.getElementById('kpiCoaches').textContent = '0';
    document.getElementById('kpiScouts').textContent = '0';
    document.getElementById('kpiPending').textContent = '0';
    document.getElementById('pendingRegs').innerHTML = '<div style="padding:16px;color:#546E7A">Unable to load. Please refresh.</div>';
    console.error('Dashboard error:', e);
  }
  try {
    var top = await api('GET', '/api/stratex/rankings?limit=5');
    var players = top.data || [];
    if (players.length) {
      var rows2 = players.map(function(p) {
        return '<tr><td style="color:#546E7A;font-weight:700">#' + p.rank + '</td>' +
          '<td><b>' + p.first_name + ' ' + p.last_name + '</b></td>' +
          '<td>' + p.specific_position + '</td>' +
          '<td style="color:#00E676;font-weight:700">' + Math.round(p.overall_rating || 0) + '</td>' +
          '<td>' + formatValue(p.transfer_value || 0) + '</td></tr>';
      });
      document.getElementById('topPlayers').innerHTML = '<table class="sl-table"><thead><tr><th>Rank</th><th>Player</th><th>Position</th><th>Overall</th><th>Value</th></tr></thead><tbody>' + rows2.join('') + '</tbody></table>';
    } else {
      document.getElementById('topPlayers').innerHTML = '<div style="text-align:center;padding:32px;color:#546E7A">No player data yet</div>';
    }
  } catch(e) {
    document.getElementById('topPlayers').innerHTML = '<div style="text-align:center;padding:32px;color:#546E7A">No player data yet</div>';
  }
}
</script>
</body></html>
