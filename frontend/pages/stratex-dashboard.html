<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stratex Admin Dashboard - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/mobile.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">â¡ Scout<span style="color:#00E676">Link</span></a></div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
  <div class="topbar">
    <span class="topbar-title" id="dashTitle">Stratex Admin</span>
    <div class="topbar-right">
      <button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
      <button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button>
    </div>
  </div>
  <div class="page-content">
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Total Players</div><div class="kpi-value green" id="kpiPlayers">-</div></div>
      <div class="kpi-card"><div class="kpi-label">Active Coaches</div><div class="kpi-value" id="kpiCoaches">-</div></div>
      <div class="kpi-card"><div class="kpi-label">Active Scouts</div><div class="kpi-value" id="kpiScouts">-</div></div>
      <div class="kpi-card"><div class="kpi-label">Pending Requests</div><div class="kpi-value" id="kpiPending">-</div><div class="kpi-sub" id="kpiPendingSub"></div></div>
    </div>
    <div class="dash-two-col" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
      <div class="table-card">
        <div class="table-header">
          <h3>Pending Registrations</h3>
          <a href="stratex-registrations.html" class="btn btn-sm btn-primary">Review All</a>
        </div>
        <div id="pendingRegs"><div class="loading-state"><div class="spinner"></div></div></div>
      </div>
      <div class="table-card">
        <div class="table-header">
          <h3>Top Players by Overall <span style="font-size:12px;font-weight:400;color:#546E7A">/ 10</span></h3>
          <a href="player-search.html" class="btn btn-sm btn-outline">All Players</a>
        </div>
        <div id="topPlayers"><div class="loading-state"><div class="spinner"></div></div></div>
      </div>
    </div>
    <!-- Platform Stats -->
    <div style="margin-top:20px;background:#111827;border:1px solid #1e2a3a;border-radius:12px;padding:20px">
      <h3 style="margin-bottom:16px;color:#94a3b8;font-size:13px;text-transform:uppercase;letter-spacing:.5px">Platform Overview</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
        <div style="background:#0a0f1e;border-radius:8px;padding:14px;text-align:center">
          <div style="font-size:28px;font-weight:900;color:#00E676" id="statPlayers">-</div>
          <div style="font-size:12px;color:#546E7A">Players Registered</div>
        </div>
        <div style="background:#0a0f1e;border-radius:8px;padding:14px;text-align:center">
          <div style="font-size:28px;font-weight:900;color:#42A5F5" id="statCoaches">-</div>
          <div style="font-size:12px;color:#546E7A">Coaches Active</div>
        </div>
        <div style="background:#0a0f1e;border-radius:8px;padding:14px;text-align:center">
          <div style="font-size:28px;font-weight:900;color:#FFC107" id="statScouts">-</div>
          <div style="font-size:12px;color:#546E7A">Scouts Active</div>
        </div>
        <div style="background:#0a0f1e;border-radius:8px;padding:14px;text-align:center">
          <div style="font-size:28px;font-weight:900;color:#FF7043" id="statPending">-</div>
          <div style="font-size:12px;color:#546E7A">Awaiting Review</div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">Ã</button></div>
  <div class="notif-list" id="notifList"></div>
</div>
<script src="../js/main.js"></script>
<script>
function dispOverall(v){var n=parseFloat(v);if(isNaN(n))return '--';return (n>10?n/10:n).toFixed(1);}
function posColor(g){return {Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#00BCD4',Forward:'#FF5722'}[g]||'#00E676';}
var STRATEX_NAV = [
{label:'🏠 Dashboard',href:'stratex-dashboard.html'},
{label:'📋 Registrations',href:'stratex-registrations.html'},
{label:'👥 Users',href:'stratex-users.html'},
{label:'⚽ Players',href:'stratex-players.html'},
{label:'🔍 Scouts',href:'stratex-scouts.html'},
{label:'🏋️ Coaches',href:'stratex-coaches.html'},
{label:'🏆 Scout Teams',href:'stratex-scout-teams.html'},
{label:'🏫 School Teams',href:'stratex-school-teams.html'},
{label:'🎖️ Award Nominations',href:'stratex-award-nominations.html'},
{label:'🎪 Showcase Events',href:'stratex-showcase-events.html'},
{label:'🔔 Notifications',href:'#',action:'toggleNotifPanel'},
{label:'⚙️ Settings',href:'stratex-settings.html'}
];
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Stratex'){window.location.href='login.html';return;}
  var nav=document.getElementById('sidebarNav');
  var cur=window.location.pathname.split('/').pop();
  if(nav) nav.innerHTML=STRATEX_NAV.map(function(i){return '<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'" '+(i.action?'onclick="'+i.action+'();return false"':'')+'>'+i.label+'</a>';}).join('');
  var u=Auth.user;
  var uel=document.getElementById('sidebarUser');
  if(uel&&u){
    uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#FF5722;color:#fff">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Stratex Admin</div></div></div>';
    document.getElementById('dashTitle').textContent = 'Welcome, '+(u.firstName||'Admin');
  }
  updateNotifBadge();
}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
document.addEventListener('DOMContentLoaded', function(){ initNav(); loadDashboard(); });

async function loadDashboard(){
  try {
    var d = await api('GET', '/api/stratex/dashboard');
    var total = d.totalPlayers||0;
    var coaches = d.totalCoaches||0;
    var scouts = d.totalScouts||0;
    var pending = d.pendingReqs||0;
    document.getElementById('kpiPlayers').textContent = total;
    document.getElementById('kpiCoaches').textContent = coaches;
    document.getElementById('kpiScouts').textContent = scouts;
    document.getElementById('kpiPending').textContent = pending;
    document.getElementById('statPlayers').textContent = total;
    document.getElementById('statCoaches').textContent = coaches;
    document.getElementById('statScouts').textContent = scouts;
    document.getElementById('statPending').textContent = pending;
    if(pending>0){
      document.getElementById('kpiPending').className='kpi-value green';
      document.getElementById('kpiPendingSub').innerHTML='<a href="stratex-registrations.html" style="color:#00E676">Review now â</a>';
    } else {
      document.getElementById('kpiPendingSub').textContent='All reviewed';
    }
    var regs = d.recentPendingRegistrations||[];
    if(regs.length){
      document.getElementById('pendingRegs').innerHTML = '<table class="sl-table"><thead><tr><th>Name</th><th>Type</th><th>Team</th><th></th></tr></thead><tbody>'+
        regs.map(function(r){
          var tc=r.account_type==='Coach'?'badge-blue':'badge-green';
          return '<tr><td><b>'+r.first_name+' '+r.last_name+'</b><br><span style="font-size:11px;color:#546E7A">'+r.email+'</span></td>'+
            '<td><span class="badge '+tc+'">'+r.account_type+'</span></td>'+
            '<td style="font-size:12px">'+(r.team_name||r.scout_club||'â')+'</td>'+
            '<td><a href="stratex-registrations.html" class="btn btn-sm btn-primary">Review</a></td></tr>';
        }).join('')+'</tbody></table>';
    } else {
      document.getElementById('pendingRegs').innerHTML='<div style="text-align:center;padding:32px;color:#546E7A">â No pending registrations</div>';
    }
  } catch(e) {
    ['kpiPlayers','kpiCoaches','kpiScouts','kpiPending','statPlayers','statCoaches','statScouts','statPending'].forEach(function(id){document.getElementById(id).textContent='0';});
    document.getElementById('pendingRegs').innerHTML='<div style="padding:16px;color:#546E7A">Could not load data. Please refresh.</div>';
    console.error('Dashboard error:', e);
  }
  try {
    var top = await api('GET', '/api/stratex/rankings?limit=6');
    var players = top.data||[];
    if(players.length){
      document.getElementById('topPlayers').innerHTML = '<table class="sl-table"><thead><tr><th>#</th><th>Player</th><th>Position</th><th>Overall</th><th>Value</th></tr></thead><tbody>'+
        players.map(function(p){
          var ov = dispOverall(p.overall_rating);
          var ovNum = parseFloat(p.overall_rating||0); var ovPct = ovNum>10?ovNum:ovNum*10;
          var ovCol = ovPct>=80?'#00E676':ovPct>=65?'#FFC107':'#FF9800';
          return '<tr>'+
            '<td style="color:#546E7A;font-weight:700">#'+(p.rank||'?')+'</td>'+
            '<td><div style="display:flex;align-items:center;gap:8px"><div class="user-avatar" style="width:28px;height:28px;font-size:10px;background:'+posColor(p.position_group)+'">'+initials(p.first_name,p.last_name)+'</div><b>'+p.first_name+' '+p.last_name+'</b></div></td>'+
            '<td style="font-size:12px">'+(p.specific_position||p.primary_position||'--')+'</td>'+
            '<td style="font-weight:800;color:'+ovCol+'">'+ov+'</td>'+
            '<td style="color:#00E676;font-weight:700">'+formatValue(p.transfer_value||0)+'</td>'+
          '</tr>';
        }).join('')+'</tbody></table>';
    } else {
      document.getElementById('topPlayers').innerHTML='<div style="text-align:center;padding:32px;color:#546E7A">No player data yet</div>';
    }
  } catch(e) {
    document.getElementById('topPlayers').innerHTML='<div style="text-align:center;padding:32px;color:#546E7A">Could not load player rankings</div>';
  }
}
</script>
<script src="../js/mobile.js"></script>
</body></html>
