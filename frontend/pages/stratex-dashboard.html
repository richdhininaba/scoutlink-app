<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stratex Dashboard – ScoutLink</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">⚡ Scout<span style="color:#00E676">Link</span></a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Stratex Admin Dashboard</span><div class="topbar-right"><button class="notif-btn" onclick="toggleNotifPanel()">🔔<span class="notif-badge" id="notifBadge" style="display:none">0</span></button><button class="btn btn-sm btn-ghost" onclick="logout()">Sign Out</button></div></div>
<div class="page-content">
  <div class="kpi-grid" id="kpiGrid"><div class="loading-state"><div class="spinner"></div></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <div class="table-card">
      <div class="table-header"><h3>🔔 Pending Registrations</h3><a href="stratex-registrations.html" class="btn btn-sm btn-primary">Review All</a></div>
      <div id="pendingRegs"><div class="loading-state"><div class="spinner"></div></div></div>
    </div>
    <div class="table-card">
      <div class="table-header"><h3>🏆 Top Players by Overall</h3><a href="player-search.html" class="btn btn-sm btn-outline">All Players →</a></div>
      <div id="topPlayers"><div class="loading-state"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>
</div>
</div>
<div class="notif-panel" id="notifPanel"><div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">×</button></div><div class="notif-list" id="notifList"></div></div>
<script src="../js/main.js"></script>
<script>
const NAV_ITEMS={Stratex:[{icon:'🏠',label:'Dashboard',href:'stratex-dashboard.html'},{icon:'📋',label:'Registrations',href:'stratex-registrations.html'},{icon:'🔍',label:'All Players',href:'player-search.html'},{icon:'📊',label:'Pipeline',href:'recruitment-pipeline.html'},{icon:'📋',label:'Bulk Import',href:'bulk-add-players.html'},{icon:'🔔',label:'Notifications',href:'#',action:'toggleNotifPanel'}]};
function initNav(){if(!Auth.isLoggedIn()||Auth.type!=='Stratex'){window.location.href='login.html';return;}const items=NAV_ITEMS.Stratex;const nav=document.getElementById('sidebarNav');const cur=window.location.pathname.split('/').pop();if(nav)nav.innerHTML=items.map(i=>'<a class="nav-item'+(cur===i.href?' active':'')+'" href="'+i.href+'" '+(i.action?'onclick="'+i.action+'();return false"':'')+'>'+i.icon+' '+i.label+'</a>').join('');const u=Auth.user;const uel=document.getElementById('sidebarUser');if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+u.firstName+' '+u.lastName+'</div><div class="user-role">Stratex Admin</div></div></div>';updateNotifBadge();}
function logout(){Auth.clear();window.location.href='login.html?logout=1';}
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
document.addEventListener('DOMContentLoaded',async()=>{
  initNav();
  try {
    const d=await api('GET','/api/stratex/dashboard');
    document.getElementById('kpiGrid').innerHTML='<div class="kpi-card"><div class="kpi-label">Total Players</div><div class="kpi-value green">'+d.totalPlayers+'</div></div><div class="kpi-card"><div class="kpi-label">Active Coaches</div><div class="kpi-value">'+d.totalCoaches+'</div></div><div class="kpi-card"><div class="kpi-label">Active Scouts</div><div class="kpi-value">'+d.totalScouts+'</div></div><div class="kpi-card"><div class="kpi-label">Pending Requests</div><div class="kpi-value '+(d.pendingReqs>0?'green':'')+'">'+d.pendingReqs+'</div><div class="kpi-sub">'+(d.pendingReqs>0?'<a href="stratex-registrations.html" style="color:#00E676">Review now →</a>':'All clear')+'</div></div>';
    const regs=d.recentPendingRegistrations||[];
    document.getElementById('pendingRegs').innerHTML=regs.length?'<table class="sl-table"><thead><tr><th>Name</th><th>Type</th><th>Team</th><th></th></tr></thead><tbody>'+regs.map(r=>'<tr><td><b>'+r.first_name+' '+r.last_name+'</b><br><span style="font-size:11px;color:#546E7A">'+r.email+'</span></td><td><span class="badge '+(r.account_type==='Coach'?'badge-blue':'badge-green')+'">'+r.account_type+'</span></td><td>'+(r.team_name||r.scout_club||'—')+'</td><td><a href="stratex-registrations.html" class="btn btn-sm btn-primary">Review</a></td></tr>').join('')+'</tbody></table>':'<div style="text-align:center;padding:32px;color:#546E7A">✅ No pending registrations</div>';
    const top=await api('GET','/api/stratex/rankings?limit=5');
    document.getElementById('topPlayers').innerHTML='<table class="sl-table"><thead><tr><th>Rank</th><th>Player</th><th>Position</th><th>Overall</th><th>Value</th></tr></thead><tbody>'+( top.data||[]).map(p=>'<tr><td style="color:#546E7A;font-weight:700">#'+p.rank+'</td><td><b>'+p.first_name+' '+p.last_name+'</b></td><td>'+p.specific_position+'</td><td style="color:#00E676;font-weight:700">'+Math.round(p.overall_rating||0)+'</td><td>'+formatValue(p.transfer_value||0)+'</td></tr>').join('')+'</tbody></table>';
  } catch(e){console.error(e);}
});
</script>
</body></html>
