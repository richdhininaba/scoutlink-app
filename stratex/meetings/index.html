var admins=[],meetings=[];function logout(){logoutToLogin();}function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function show(id,msg){var el=document.getElementById(id);el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},3500);}function nameFor(id){var a=admins.find(function(x){return x.id===id;});return a?((a.first_name||'')+' '+(a.last_name||'')):id;}
function render(){meetingAttendees.innerHTML=admins.filter(function(a){return a.is_active!==false;}).map(function(a){return '<option value="'+a.id+'">'+safe((a.first_name||'')+' '+(a.last_name||'')+' - '+(a.job_title||a.admin_role||''))+'</option>';}).join('');meetingRows.innerHTML=meetings.length?meetings.map(function(m){var at=(m.attendees||[]).map(nameFor).join(', ');return '<tr><td><b>'+safe(m.title)+'</b></td><td>'+safe(m.meeting_date?new Date(m.meeting_date).toLocaleString('en-GB'):'')+'</td><td>'+safe(m.location||'')+'</td><td>'+safe(at||'--')+'</td><td>'+safe(m.notes||'')+'</td></tr>';}).join(''):'<tr><td colspan="5" style="color:#8ea2b5">No meetings booked.</td></tr>';if(window.refreshMobileLayout)refreshMobileLayout();}
async function load(){var d=await api('GET','/api/stratex/org');admins=d.admins||[];meetings=d.meetings||[];render();}
async function bookMeeting(){try{if(!meetingTitle.value.trim()||!meetingDate.value)throw new Error('Meeting title and date are required.');var attendees=Array.prototype.map.call(meetingAttendees.selectedOptions,function(o){return o.value;});await api('POST','/api/stratex/org/meetings',{title:meetingTitle.value.trim(),meetingDate:new Date(meetingDate.value).toISOString(),location:meetingLocation.value.trim(),attendees:attendees,notes:meetingNotes.value.trim()});show('ok','Meeting booked.');['meetingTitle','meetingDate','meetingLocation','meetingNotes'].forEach(function(id){document.getElementById(id).value='';});load();}catch(e){show('err',e.message);}}
