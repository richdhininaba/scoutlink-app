<style>
.profile-section{background:var(--card,#161b22);border:1px solid #30363d;border-radius:14px;padding:24px;margin-bottom:20px}
.profile-section h3{font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:16px}
.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.field-item{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em}
.field-value{font-size:15px;font-weight:600;color:#ffffff}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.stat-card{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:14px;text-align:center}
.stat-card .stat-val{font-size:26px;font-weight:900;color:#1d9e75;margin-bottom:4px}
.stat-card .stat-lbl{font-size:11px;color:#8b949e;text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.info-box{background:#21262d;border:1px solid #30363d;border-radius:10px;padding:16px 18px;display:flex;align-items:flex-start;gap:12px;margin-top:20px}
.info-box svg{flex-shrink:0;margin-top:2px}
.info-box p{font-size:13px;color:#8b949e;margin:0;line-height:1.6}
.gauge-wrap{text-align:center;padding:20px 0}
.gauge-ring{width:100px;height:100px;border-radius:50%;border:6px solid #1d9e75;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.gauge-score{font-size:32px;font-weight:900;color:#1d9e75}
.gauge-label{font-size:12px;color:#8b949e;margin-top:4px}
.gauge-band{font-size:14px;font-weight:700;color:#1d9e75;margin-top:4px}
@media(max-width:767px){.field-grid{grid-template-columns:1fr 1fr}.stat-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.field-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}}
</style>
<link rel="stylesheet" href="/frontend/css/phone-base.css">

</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Scout<span style="color:#1d9e75">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">My profile</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost" onclick="logout()">Sign out</button>
</div>
</div>
<div class="page-content" id="pageContent">
<div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Loading your profile...</span></div>
</div>
</div>
</div>
<div class="notif-panel" id="notifPanel">
<div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">&#215;</button></div>
<div class="notif-list" id="notifList"></div>
</div>
<script src="/frontend/js/player-nav.js"></script>
<script src="/frontend/js/main.js"></script>

<script>
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Player'){navigateClean('login.html');return;}
  if(typeof buildPlayerNav==='function') buildPlayerNav('sidebarNav','My profile');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u) uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#1d9e75;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Player</div></div></div>';
  if(typeof updateNotifBadge==='function') updateNotifBadge();
}
function logout(){Auth.clear();navigateClean('login.html?logout=1');}
function toggleNotifPanel(){var p=document.getElementById('notifPanel');if(p)p.classList.toggle('open');}

function safe(v,fallback){return(v!==null&&v!==undefined&&v!=='')?v:(fallback||'N/A');}
function fmtVal(v){var n=Number(v)||0;if(!n)return'N/A';if(n>=1000000)return'\u00a3'+(n/1000000).toFixed(2)+'m';if(n>=1000)return'\u00a3'+(n/1000).toFixed(0)+'k';return'\u00a3'+n;}
function getOvBand(ov100){
  if(ov100>=90)return{label:'Elite grassroots',color:'#7ee8a2'};
  if(ov100>=80)return{label:'Excellent',color:'#1d9e75'};
  if(ov100>=70)return{label:'Strong',color:'#FFC107'};
  if(ov100>=55)return{label:'Promising',color:'#FF9800'};
  if(ov100>=40)return{label:'Emerging',color:'#f44336'};
  return{label:'Developing',color:'#f85149'};
}

document.addEventListener('DOMContentLoaded',function(){
  initNav();
  var u=Auth.user;
  if(!u){navigateClean('login.html');return;}

  api('GET','/api/players/'+u.id).then(function(d){
    if(!d||!d.player){
      document.getElementById('pageContent').innerHTML='<div style="text-align:center;padding:48px;color:#8b949e">Could not load your profile. Please contact your coach.</div>';
      return;
    }
    var p=d.player;
    var ov=parseFloat(p.overall_rating||0);
    var ov100=ov>10?Math.round(ov):Math.round(ov*10);
    var band=getOvBand(ov100);
    var omr=parseFloat(p.overall_match_rating||p.overall_rating||0);
    var omr100=omr>10?Math.round(omr):Math.round(omr*10);
    var omrBand=getOvBand(omr100);

    document.getElementById('pageContent').innerHTML=
      '<div class="profile-section">'+
        '<h3>Personal information</h3>'+
        '<div class="field-grid">'+
          '<div class="field-item"><span class="field-label">Full name</span><span class="field-value">'+safe(p.first_name)+' '+safe(p.last_name,'')+'</span></div>'+
          '<div class="field-item"><span class="field-label">Age group</span><span class="field-value">'+safe(p.age_group)+'</span></div>'+
          '<div class="field-item"><span class="field-label">Preferred foot</span><span class="field-value">'+safe(p.foot)+'</span></div>'+
          '<div class="field-item"><span class="field-label">Height</span><span class="field-value">'+(p.height_cm?p.height_cm+' cm':safe(null))+'</span></div>'+
          '<div class="field-item"><span class="field-label">Weight</span><span class="field-value">'+(p.weight_kg?p.weight_kg+' kg':safe(null))+'</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="profile-section">'+
        '<h3>Football details</h3>'+
        '<div class="field-grid">'+
          '<div class="field-item"><span class="field-label">Position</span><span class="field-value">'+safe(p.specific_position||p.primary_position||p.position_group)+'</span></div>'+
          '<div class="field-item"><span class="field-label">Team</span><span class="field-value">'+safe(p.team_name)+'</span></div>'+
          '<div class="field-item"><span class="field-label">Coach</span><span class="field-value">'+safe(p.coach_name)+'</span></div>'+
          '<div class="field-item"><span class="field-label">Overall rating</span><span class="field-value" style="color:'+band.color+'">'+ov100+' / 100 &mdash; '+band.label+'</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="profile-section">'+
        '<h3>Overall match performance</h3>'+
        '<div class="gauge-wrap">'+
          '<div class="gauge-ring" style="border-color:'+omrBand.color+'">'+
            '<div class="gauge-score" style="color:'+omrBand.color+'">'+(parseInt(p.appearances||0)>0?omr100:'--')+'</div>'+
          '</div>'+
          '<div class="gauge-label">Overall match performance rating</div>'+
          '<div class="gauge-band" style="color:'+omrBand.color+'">'+omrBand.label+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="profile-section">'+
        '<h3>Season statistics</h3>'+
        '<div class="stat-grid">'+
          '<div class="stat-card"><div class="stat-val">'+safe(p.appearances,'0')+'</div><div class="stat-lbl">Appearances</div></div>'+
          '<div class="stat-card"><div class="stat-val" style="color:#58a6ff">'+safe(p.goals,'0')+'</div><div class="stat-lbl">Goals</div></div>'+
          '<div class="stat-card"><div class="stat-val" style="color:#1d9e75">'+safe(p.assists,'0')+'</div><div class="stat-lbl">Assists</div></div>'+
          '<div class="stat-card"><div class="stat-val" style="color:#FFC107">'+safe(p.clean_sheets,'0')+'</div><div class="stat-lbl">Clean sheets</div></div>'+
          '<div class="stat-card"><div class="stat-val" style="color:#FF9800">'+safe(p.yellow_cards,'0')+'</div><div class="stat-lbl">Yellow cards</div></div>'+
          '<div class="stat-card"><div class="stat-val" style="color:#f44336">'+safe(p.red_cards,'0')+'</div><div class="stat-lbl">Red cards</div></div>'+
          '<div class="stat-card"><div class="stat-val" style="color:#1d9e75;font-size:18px">'+fmtVal(p.transfer_value)+'</div><div class="stat-lbl">Estimated value</div></div>'+
        '</div>'+
        '<div class="info-box">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'+
          '<p>If any of your details do not look correct, please speak to your coach. They are able to update your profile on your behalf.</p>'+
        '</div>'+
      '</div>';
  }).catch(function(e){
    document.getElementById('pageContent').innerHTML='<div style="text-align:center;padding:48px;color:#8b949e">Could not load profile: '+e.message+'<br><br>Please contact your coach if this problem persists.</div>';
  });
});
</script>
