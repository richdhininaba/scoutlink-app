<style>
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:16px}
.video-card{background:var(--card,#161b22);border:1px solid #30363d;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.video-card-title{font-size:15px;font-weight:700;color:#ffffff}
.video-badge{display:inline-block;background:rgba(29,158,117,.15);color:#1d9e75;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid rgba(29,158,117,.3)}
.video-desc{font-size:13px;color:#8b949e;line-height:1.5;flex:1}
.video-actions{display:flex;gap:8px;margin-top:4px}
.player-upload-card{background:var(--card,#161b22);border:1px solid #30363d;border-radius:12px;padding:18px;margin-bottom:16px;display:grid;gap:12px}
.player-upload-head h3{margin:0 0 4px;font-size:17px}.player-upload-head p{margin:0;color:#8b949e;font-size:13px;line-height:1.45}
.player-upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player-upload-grid .wide{grid-column:1/-1}
.empty-state{text-align:center;padding:64px 20px;color:#8b949e}
.empty-state h3{font-size:18px;font-weight:700;color:#8b949e;margin-bottom:8px}
.empty-state p{font-size:14px;line-height:1.6;max-width:360px;margin:0 auto}
@media(max-width:767px){.video-grid{grid-template-columns:1fr 1fr}}
@media(max-width:950px){.player-upload-grid{grid-template-columns:1fr}.video-grid{grid-template-columns:1fr}}
</style>

</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Scout<span style="color:#1d9e75">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">Video reels</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost" onclick="logout()">Sign out</button>
</div>
</div>
<div class="page-content">
<div class="player-upload-card">
<div class="player-upload-head"><h3>Add video reel</h3><p>Upload a video for your own profile. Your coach-owned ratings and evaluations stay controlled by your coach.</p></div>
<div class="player-upload-grid">
  <div class="wide"><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Choose video</label><input type="file" id="playerVideoFile" accept="video/*"></div>
  <div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Title</label><input type="text" id="playerVideoTitle" placeholder="e.g. Match highlights"></div>
  <div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Category</label><select id="playerVideoCategory"><option>Highlight</option><option>Training</option><option>Match</option><option>Skills</option><option>Goal</option></select></div>
  <div class="wide"><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Description</label><textarea id="playerVideoDesc" placeholder="What should scouts or coaches notice?" style="min-height:78px"></textarea></div>
</div>
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn btn-primary" id="playerUploadBtn">Upload video</button><span id="playerUploadMsg" style="font-size:13px;color:#8b949e"></span></div>
</div>
<div class="table-card">
<div class="table-header">
<div><h3>My highlight reels</h3><p style="font-size:12px;color:#8b949e;margin-top:2px">Videos attached to your player profile</p></div>
</div>
<div style="padding:16px" id="videoContent">
<div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Loading videos...</span></div>
</div>
</div>
</div>
</div>
</div>
<div class="notif-panel" id="notifPanel">
<div class="notif-panel-header"><h3>Notifications</h3><button onclick="toggleNotifPanel()" style="background:none;border:none;color:#B0BEC5;font-size:20px;cursor:pointer">&#215;</button></div>
<div class="notif-list" id="notifList"></div>
</div>
<script src="/frontend/js/player-nav.js"></script>
<script src="/frontend/js/main.js"></script>
<script src="/frontend/js/heap-analytics.js"></script>
<script>
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Player'){navigateClean('login.html');return;}
  if(typeof buildPlayerNav==='function') buildPlayerNav('sidebarNav','Video reels');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u) uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#1d9e75;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Player</div></div></div>';
  if(typeof updateNotifBadge==='function') updateNotifBadge();
}
function logout(){Auth.clear();navigateClean('login.html?logout=1');}
function toggleNotifPanel(){var p=document.getElementById('notifPanel');if(p)p.classList.toggle('open');}

document.addEventListener('DOMContentLoaded',function(){
  initNav();
  var u=Auth.user;
  if(!u){navigateClean('login.html');return;}

  api('GET','/api/players/'+u.id).then(function(d){
    var videos=(d&&d.videos)||[];
    var el=document.getElementById('videoContent');
    if(!videos.length){
      el.innerHTML='<div class="empty-state"><h3>No video reels yet</h3><p>Add your first video above or ask your coach to upload match highlights for you.</p></div>';
      return;
    }
    var html='<div class="video-grid">';
    videos.forEach(function(v){
      var url=v.video_url||v.url||'#';
      var cat=v.category||v.video_type||'Highlight';
      html+='<div class="video-card">'+
        '<div class="video-card-title">'+(v.title||'Match video')+'</div>'+
        '<div><span class="video-badge">'+cat+'</span></div>'+
        '<div class="video-desc">'+(v.description||'No description provided')+'</div>'+
        '<div class="video-actions">'+
        '<a href="'+url+'" target="_blank" rel="noopener" class="btn btn-sm btn-primary">Watch</a>'+
        '</div>'+
        '</div>';
    });
    html+='</div>';
    el.innerHTML=html;
  }).catch(function(e){
    document.getElementById('videoContent').innerHTML='<div style="text-align:center;padding:48px;color:#8b949e">Could not load videos: '+e.message+'</div>';
  });

  document.getElementById('playerUploadBtn').addEventListener('click',function(){
    var MAX_VIDEO_UPLOAD_BYTES=4*1024*1024;
    var VIDEO_TOO_LARGE_MESSAGE='This video is too large to upload. Please choose a smaller file.';
    var file=document.getElementById('playerVideoFile').files[0];
    var title=document.getElementById('playerVideoTitle').value.trim();
    var msg=document.getElementById('playerUploadMsg');
    if(!file){msg.textContent='Choose a video file first.';msg.style.color='#f44336';return;}
    if(file.size>MAX_VIDEO_UPLOAD_BYTES){msg.textContent=VIDEO_TOO_LARGE_MESSAGE;msg.style.color='#f44336';return;}
    if(!title){msg.textContent='Add a video title.';msg.style.color='#f44336';return;}
    var fd=new FormData();
    fd.append('file',file);
    fd.append('title',title);
    fd.append('category',document.getElementById('playerVideoCategory').value);
    fd.append('description',document.getElementById('playerVideoDesc').value.trim());
    msg.textContent='Uploading...';msg.style.color='#8b949e';
    this.disabled=true;
    fetch(API+'/api/videos/upload',{method:'POST',headers:{Authorization:'Bearer '+Auth.token},body:fd})
      .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||d.detail||'Video upload failed');return d;});})
      .then(function(){
        msg.textContent='Video uploaded.';
        msg.style.color='#1d9e75';
        document.getElementById('playerVideoFile').value='';
        document.getElementById('playerVideoTitle').value='';
        document.getElementById('playerVideoDesc').value='';
        setTimeout(function(){window.location.reload();},700);
      })
      .catch(function(e){msg.textContent=e.message;msg.style.color='#f44336';})
      .finally(function(){document.getElementById('playerUploadBtn').disabled=false;});
  });
});
</script>
<script src="/frontend/js/phone-routes.js"></script>
