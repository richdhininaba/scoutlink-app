<!DOCTYPE html>
<html lang="en"><head><base href="/frontend/pages/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Player Profile - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.profile-hero{background:linear-gradient(135deg,var(--bg2) 0%,#111827 100%);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px;position:relative;overflow:hidden;}
.profile-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#1d9e75,#00BCD4,#2979FF);}
.attr-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.attr-label{font-size:12px;color:var(--text3);width:88px;flex-shrink:0;text-transform:capitalize;}
.attr-num{font-size:13px;font-weight:700;width:28px;text-align:right;}
.attr-bar-wrap{flex:1;height:6px;background:#1e2a3a;border-radius:3px;overflow:hidden;}
.attr-bar-inner{height:100%;border-radius:3px;transition:width .4s ease;}
.stat-box{background:#0a0f1e;border-radius:8px;padding:12px;text-align:center;}
.stat-num{font-size:22px;font-weight:800;}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:2px;}
.match-row{padding:12px 14px;background:#0a0f1e;border-radius:8px;margin-bottom:8px;min-height:78px;}
.compat-bar-row{margin-bottom:10px;}
.compat-bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
.compat-bar-bg{height:8px;background:#1e2a3a;border-radius:4px;overflow:hidden;}
.compat-bar-fill{height:100%;border-radius:4px;}
.section-heading{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;}
.action-btn{min-height:40px;padding:8px 14px;font-size:13px;}
.export-menu-wrap{position:relative;display:inline-flex;}
.export-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:190px;background:#0a0f1e;border:1px solid var(--border,#30363d);border-radius:10px;padding:6px;display:none;z-index:60;box-shadow:0 18px 50px rgba(0,0,0,.42);}
.export-menu.open{display:block;}
.export-option{width:100%;display:flex;align-items:flex-start;gap:8px;background:transparent;border:none;color:var(--text,#fff);border-radius:8px;padding:10px;text-align:left;cursor:pointer;font-weight:800;}
.export-option:hover{background:rgba(29,158,117,.12);}
.export-option small{display:block;color:#8b949e;font-weight:600;margin-top:2px;line-height:1.25;}
.video-card{background:#0a0f1e;border:1px solid var(--border);border-radius:10px;padding:14px;}
.prediction-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
.breakdown-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.breakdown-card{background:#0a0f1e;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px;min-height:96px}
.breakdown-card span{display:block;font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;font-weight:800;margin-bottom:6px}
.breakdown-card b{display:block;font-size:24px;line-height:1;color:#fff}
.breakdown-card small{display:block;font-size:11px;color:#8b949e;line-height:1.35;margin-top:7px}
.breakdown-bar{margin-bottom:9px}
.breakdown-bar-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:4px}
.breakdown-bar-track{height:7px;background:#1e2a3a;border-radius:999px;overflow:hidden}
.breakdown-bar-fill{height:100%;border-radius:999px}
.position-pill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.position-pill-grid.locked-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
.position-pill{background:#0a0f1e;border:1px solid #26313d;border-radius:8px;padding:10px}
.position-pill span{display:block;color:#8b949e;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.position-pill b{font-size:17px}
.locked-result{filter:blur(5px);user-select:none;pointer-events:none;}
.locked-card{position:relative;overflow:hidden;}
.position-pill.is-locked span,.position-pill.is-locked b,.position-pill.is-locked small{filter:blur(4px);user-select:none;}
.position-lock-note{margin-top:10px;background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.22);border-radius:8px;padding:10px 12px;font-size:12px;color:#B0BEC5;line-height:1.45;}
.overall-breakdown-layout{display:grid;grid-template-columns:minmax(260px,1.2fr) minmax(260px,.8fr);gap:16px;}
.value-factor-grid{display:grid;gap:9px;margin-top:12px;}
.value-factor-row{display:grid;grid-template-columns:minmax(160px,.9fr) 1fr auto;gap:12px;align-items:center;background:#0a0f1e;border:1px solid rgba(255,255,255,.05);border-radius:9px;padding:11px 12px;}
.value-factor-row span{font-size:12px;color:#e6edf3;font-weight:800;}
.value-factor-row small{font-size:11px;color:#8b949e;line-height:1.35;}
.value-factor-row b{font-size:13px;color:#fff;white-space:nowrap;}
.overall-gauge{text-align:center;padding:28px 20px;background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:14px;margin-bottom:20px}
.gauge-ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;border:6px solid;}
.gauge-score{font-size:40px;font-weight:900;line-height:1}
.gauge-desc-lbl{font-size:11px;color:var(--text-secondary,#8b949e);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.gauge-desc-val{font-size:15px;font-weight:700}
.performance-panel{background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:12px;padding:18px;margin-bottom:20px;}
.performance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.confidence-note{margin-top:12px;background:rgba(255,152,0,.08);border:1px solid rgba(255,152,0,.24);border-radius:8px;padding:12px 14px;color:#E2E8F0;font-size:12px;line-height:1.5;}
.match-meta-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--text3);}
.result-pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;}
.video-modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
.video-modal.open{display:flex;}
.video-modal-box{width:min(860px,100%);background:#161b22;border:1px solid #30363d;border-radius:12px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.5);}
.video-modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid #30363d;}
.video-frame{background:#000;aspect-ratio:16/9;width:100%;display:flex;align-items:center;justify-content:center;}
.video-frame iframe,.video-frame video{width:100%;height:100%;border:0;}
.video-fallback{color:#8b949e;text-align:center;padding:24px;}
.stats-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-box{background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:10px;padding:14px;text-align:center;min-height:78px;display:flex;flex-direction:column;justify-content:center}
.stat-val{font-size:22px;font-weight:800}
.stat-lbl{font-size:11px;color:var(--text-secondary,#8b949e);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.attr-details summary{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;font-size:14px;font-weight:700;color:var(--text,#fff);background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:10px;list-style:none}
.attr-details summary::-webkit-details-marker{display:none}
.attr-details[open] summary{border-radius:10px 10px 0 0;border-bottom-color:transparent}
.attr-details .attr-inner{background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-top:none;border-radius:0 0 10px 10px;padding:16px 18px;margin-bottom:20px}
.fixture-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#0a0f1e;border-radius:8px;margin-bottom:8px;gap:10px;flex-wrap:wrap;min-height:78px;}
.profile-detail-grid{display:grid;grid-template-columns:minmax(260px,1.15fr) minmax(240px,1fr) minmax(240px,1fr);gap:16px;margin-bottom:20px;align-items:stretch;}
.profile-metric-card{background:var(--card,#161b22);border:1px solid var(--border,#30363d);border-radius:12px;padding:16px;display:flex;flex-direction:column;min-height:312px;}
.stat-tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;}
.physical-summary{background:linear-gradient(135deg,rgba(29,158,117,.14),rgba(41,121,255,.08));border:1px solid rgba(29,158,117,.2);border-radius:10px;padding:14px;margin-bottom:10px;}
.physical-summary b{display:block;font-size:17px;color:#e6edf3;margin-top:2px;}
.physical-summary span{display:block;font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;font-weight:800;}
.physical-metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1;}
.physical-metric{background:#0a0f1e;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:12px;min-height:78px;display:flex;flex-direction:column;justify-content:space-between;}
.physical-metric span{display:block;font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;font-weight:800;}
.physical-metric b{font-size:14px;color:#e6edf3;line-height:1.35;}
.fixture-date{font-size:12px;color:#8b949e;min-width:80px;}
.fixture-opponent{font-size:14px;font-weight:600;flex:1;}
.fixture-venue{font-size:12px;color:#8b949e;}
.pred-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border,#30363d);background:transparent;color:#8b949e;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;}
.pred-btn.active{background:#1d9e75;color:#000;border-color:#1d9e75;}
.pred-btn:hover:not(.active){border-color:#1d9e75;color:#1d9e75;}
.profile-modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1200;display:none;align-items:center;justify-content:center;padding:20px;}
.profile-modal.open{display:flex;}
.profile-modal-box{width:min(820px,100%);max-height:88vh;overflow:auto;background:#161b22;border:1px solid #30363d;border-radius:12px;box-shadow:0 22px 70px rgba(0,0,0,.5);}
.profile-modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid #30363d;}
.profile-modal-body{padding:18px;}
.match-fixture-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
.video-table{width:100%;border-collapse:collapse;}
.video-table th,.video-table td{padding:10px 12px;border-bottom:1px solid var(--border,#30363d);font-size:13px;text-align:left;}
.video-table th{color:#8b949e;text-transform:uppercase;font-size:11px;letter-spacing:.04em;}
@media(max-width:1100px){.profile-detail-grid{grid-template-columns:1fr 1fr}.profile-detail-grid .profile-metric-card:first-child{grid-column:1/-1;}}
@media(max-width:900px){.match-fixture-grid{grid-template-columns:1fr;}.profile-detail-grid{grid-template-columns:1fr;}.profile-detail-grid .profile-metric-card:first-child{grid-column:auto;}}
@media(max-width:640px){
.dashboard-main{min-width:0;}
.page-content{padding:12px!important;}
.profile-card,.performance-panel{border-radius:10px!important;padding:14px!important;margin-bottom:12px!important;}
.profile-hero-row{display:grid!important;grid-template-columns:1fr!important;gap:14px!important;text-align:left;}
.profile-identity{display:grid!important;grid-template-columns:56px 1fr!important;gap:12px!important;min-width:0!important;}
.profile-identity .user-avatar{width:56px!important;height:56px!important;font-size:18px!important;}
.profile-name-block{min-width:0!important;}
.profile-name-block h2{font-size:20px!important;line-height:1.15!important;}
.profile-tag-row{gap:6px!important;}
.profile-tag-row span{font-size:11px!important;padding:3px 9px!important;}
.profile-actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;width:100%!important;align-items:stretch!important;}
.profile-actions .action-btn,.profile-actions .export-menu-wrap{width:100%!important;}
.profile-actions .action-btn{display:flex!important;align-items:center!important;justify-content:center!important;min-height:42px!important;padding:9px 10px!important;}
.profile-actions #interestsRemainingCount{grid-column:1/-1;margin-left:0!important;text-align:left!important;}
.export-menu{left:auto;right:0;min-width:100%;}
.profile-hero-summary{text-align:left!important;border-top:1px solid var(--border,#30363d);padding-top:12px;}
.profile-hero-summary>div:first-child{font-size:30px!important;}
.profile-hero-summary>div:nth-last-child(2){font-size:22px!important;}
.performance-grid{grid-template-columns:1fr!important;gap:12px!important;}
.performance-grid>div{background:#0a0f1e;border:1px solid rgba(255,255,255,.05);border-radius:9px;padding:12px;}
.breakdown-grid{grid-template-columns:1fr 1fr;gap:8px;}
.breakdown-card{min-height:88px;padding:10px;}
.breakdown-card b{font-size:19px;}
.breakdown-card small{font-size:10px;}
.overall-breakdown-layout{grid-template-columns:1fr;gap:12px;}
.position-pill-grid,.position-pill-grid.locked-grid{grid-template-columns:1fr 1fr;gap:8px;}
.position-pill{padding:9px;min-height:64px;}
.value-factor-row{grid-template-columns:1fr;gap:5px;padding:10px;}
.value-factor-row b{justify-self:start;}
.stats-trio,.stat-tile-grid,.physical-metric-grid{grid-template-columns:1fr 1fr!important;gap:8px!important;}
.stat-box,.physical-metric{min-height:72px;padding:10px;}
.stat-num,.stat-val{font-size:20px!important;}
.profile-detail-grid,.match-fixture-grid{grid-template-columns:1fr!important;gap:12px!important;}
.profile-metric-card{min-height:auto!important;}
.attr-label{width:76px;font-size:11px;}
.match-row,.fixture-row{min-height:auto;padding:11px 12px;}
.match-row>div{display:grid!important;grid-template-columns:1fr!important;}
.match-row div[style*="text-align:right"]{text-align:left!important;min-width:0!important;}
.fixture-row{display:grid!important;grid-template-columns:1fr auto!important;align-items:center;}
.fixture-date,.fixture-opponent,.fixture-venue{min-width:0!important;}
.fixture-venue{grid-column:1/-1;}
.video-table{display:block;overflow-x:auto;white-space:nowrap;}
.profile-modal,.video-modal{padding:10px;}
.profile-modal-box{max-height:92vh;}
}
</style>

<script>

// ===================== HELPERS =====================
function safe(v){return v!=null&&v!==undefined&&v!=='null'&&v!=='undefined'?String(v):'--';}
function dOv(v){var n=parseFloat(v);if(isNaN(n))return '--';return(n>10?n/10:n).toFixed(1);}
function dAttr(v){var n=parseFloat(v);if(isNaN(n))return '--';return(n>10?n/10:n).toFixed(1);}
function aPct(v){var n=parseFloat(v);if(isNaN(n))return 0;return Math.min(100,Math.round(n>10?n:n*10));}
function aColor(p){return p>=70?'#1d9e75':p>=50?'#FFC107':'#f44336';}
function cColor(s){return s>=80?'#1d9e75':s>=65?'#FFC107':s>=50?'#FF9800':'#f44336';}
function pColor(g){return{Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#00BCD4',Forward:'#FF5722'}[g]||'#1d9e75';}
function confLabel(apps){var n=parseInt(apps)||0;if(n===0)return{label:'Very Low',color:'#f44336'};if(n<=4)return{label:'Low',color:'#FF9800'};if(n<=9)return{label:'Medium',color:'#FFC107'};if(n<=19)return{label:'High',color:'#00BCD4'};return{label:'Very High',color:'#1d9e75'};}
function attrLabel(k){var m={pace:'Pace',agility:'Agility',strength:'Strength',stamina:'Stamina',jumping:'Jumping',composure:'Composure',shooting:'Shooting',passing:'Passing',dribbling:'Dribbling',defending:'Defending',crossing:'Crossing',vision:'Vision',positioning:'Positioning',heading:'Heading',tackling:'Tackling',gk_diving:'Diving',gk_reflexes:'Reflexes',gk_handling:'Handling',gk_positioning:'GK Positioning',gk_kicking:'Kicking',gk_distribution:'Distribution',gk_communication:'Communication',gk_sweeping:'Sweeping'};return m[k]||k;}
var POSITION_LABELS={GK:'Goalkeeper',CB:'Centre Back',BPD:'Ball-playing Defender',RB:'Right Back',LB:'Left Back',RWB:'Right Wing Back',LWB:'Left Wing Back',CDM:'Defensive Midfielder',CM:'Central Midfielder',B2B:'Box-to-box Midfielder',CAM:'Attacking Midfielder',LW:'Left Winger',RW:'Right Winger',CF:'Centre Forward',ST:'Striker',SS:'Second Striker'};
var POSITION_ORDER=['GK','CB','BPD','RB','LB','RWB','LWB','CDM','CM','B2B','CAM','LW','RW','CF','ST','SS'];
function positionName(code){var c=String(code||'').trim().toUpperCase();return POSITION_LABELS[c]||safe(code);}
function positionOptionsHtml(){return '<option value="">Auto-detect best fit</option>'+POSITION_ORDER.map(function(code){return '<option value="'+code+'">'+POSITION_LABELS[code]+'</option>';}).join('');}
function positionText(text){var s=safe(text);POSITION_ORDER.slice().sort(function(a,b){return b.length-a.length;}).forEach(function(code){s=s.replace(new RegExp('\\b'+code+'\\b','g'),POSITION_LABELS[code]);});return s;}
function buildAttrBar(label,val){var n=parseFloat(val);var pct=isNaN(n)?0:Math.min(100,Math.round(n>10?n:n*10));var col=pct>=70?'#1d9e75':pct>=50?'#FFC107':'#f44336';return '<div class="attr-row"><span class="attr-label">'+label+'</span><div class="attr-bar-wrap"><div class="attr-bar-inner" style="width:'+pct+'%;background:'+col+'"></div></div><span class="attr-num" style="color:'+col+'">'+((!isNaN(n))?(n>10?n/10:n).toFixed(1):'--')+'</span></div>';}

var _interestsRemaining = 200;
var _alreadyInPipeline = false;

function registerInterest(playerId){
var btn=document.getElementById('btnInterest');
if(!btn)return;
if(_alreadyInPipeline){return;}
if(_interestsRemaining<=0){
alert('You have reached your interest cap. Please contact info@scoutlink.app or your CS Manager to increase your cap.');
return;
}
btn.disabled=true;btn.textContent='Adding...';
api('POST','/api/players/'+playerId+'/scout-interest',{interestLevel:7}).then(function(r){
if(r.alreadyInPipeline){
_alreadyInPipeline=true;
btn.textContent='In Pipeline';btn.style.background='#1d9e75';btn.style.color='#000';btn.disabled=false;
}else{
_alreadyInPipeline=true;
_interestsRemaining=r.interestsRemaining||(_interestsRemaining-1);
btn.textContent='Added to Pipeline';btn.style.background='#1d9e75';btn.style.color='#000';btn.disabled=true;
var rem=document.getElementById('interestsRemainingCount');
if(rem){rem.textContent=_interestsRemaining+' interests remaining';}
}
}).catch(function(e){
btn.disabled=false;btn.textContent='Register Interest';
alert(e.message||'Could not add to pipeline. Please contact info@scoutlink.app or your CS Manager if you have reached your cap.');
});
}
