<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="apple-touch-icon" href="/scoutlink-favicon.png">
<title>Chat - ScoutLink</title>
<link rel="stylesheet" href="/frontend/css/variables.css">
<link rel="stylesheet" href="/frontend/css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.chat-shell{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;height:calc(100vh - 128px);min-height:540px;overflow:hidden;}
.thread-list,.chat-pane{background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;min-height:0;box-shadow:0 18px 48px rgba(15,23,42,.07);}
.thread-list{display:flex;flex-direction:column;}
#threadList{min-height:0;overflow:auto;}
.thread-item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid #eef2f7;cursor:pointer;color:#0f172a;}
.thread-item:hover,.thread-item.active{background:#ecfdf5;}
.thread-title{font-weight:900;font-size:13px;margin-bottom:4px;color:#0f172a;}
.thread-meta{font-size:12px;color:#64748b;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.thread-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#0f9f75;color:#fff;font-size:12px;font-weight:900;}
.thread-main{min-width:0;}
.thread-side{display:grid;gap:7px;justify-items:end;color:#64748b;font-size:11px;font-weight:800;}
.unread-pill{background:#0f9f75;color:#fff;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;margin-left:8px;}
.chat-pane{display:flex;flex-direction:column;}
.chat-head{flex-shrink:0;padding:16px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:#fff;color:#0f172a;}
.messages{flex:1;min-height:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#f8fafc;color:#0f172a;}
.msg{max-width:72%;border:1px solid #e5e7eb;border-radius:16px;padding:10px 12px;background:#fff;color:#0f172a;box-shadow:0 8px 20px rgba(15,23,42,.06);}
.msg.mine{align-self:flex-end;background:#dff8ee;border-color:#a8ead1;}
.msg .by{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#64748b;font-weight:900;margin-bottom:4px;}
.msg .body{font-size:14px;line-height:1.5;white-space:pre-wrap;color:#0f172a;}
.share-card{background:#fff;border:1px solid #b7ead9;border-radius:12px;padding:12px;margin-top:8px;}
.share-card-type{font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.06em;font-weight:900;margin-bottom:4px;}
.share-card-title{font-size:14px;font-weight:900;color:#0f172a;margin-bottom:4px;}
.share-card-meta{font-size:12px;color:#64748b;line-height:1.5;}
.share-bar{flex-shrink:0;display:none;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #e5e7eb;background:#fff;flex-wrap:wrap;}
.share-bar select{max-width:260px;min-height:38px;}
.composer{flex-shrink:0;padding:14px;border-top:1px solid #e5e7eb;display:flex;gap:10px;background:#fff;}
.composer textarea{min-height:46px;max-height:120px;resize:vertical;background:#fff;color:#0f172a;border-color:#d7dee8;}
.composer textarea:focus{outline:2px solid rgba(15,159,117,.22);border-color:#0f9f75;}
.chat-empty-mobile{padding:22px;color:#64748b;}
.chat-empty-mobile h3{margin:0 0 8px;color:#0f172a;font-size:16px;}
@media(max-width:900px){.chat-shell{display:block;height:calc(100dvh - 86px);min-height:0;overflow:hidden}.chat-shell.mobile-chat-list .chat-pane{display:none}.chat-shell.mobile-chat-detail .thread-list{display:none}.thread-list,.chat-pane{height:100%;box-shadow:none;border-radius:16px}.thread-list{max-height:none}.msg{max-width:92%}.messages{padding:14px}.composer{position:sticky;bottom:0}.composer textarea{font-size:14px}}
</style>
<link rel="stylesheet" href="/frontend/css/phone-base.css">
<link rel="stylesheet" href="/frontend/css/phone-shell.css">
<link rel="stylesheet" href="/frontend/css/phone-pages.css">

</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar"><div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900;color:#fff;text-decoration:none">Scout<span style="color:var(--green)">Link</span></a></div><div class="sidebar-nav" id="sidebarNav"></div><div class="sidebar-user" id="sidebarUser"></div></nav>
<div class="dashboard-main">
<div class="topbar"><span class="topbar-title">Chat</span><div class="topbar-right"><button class="btn btn-sm btn-ghost" onclick="logout()">Sign out</button></div></div>
<div class="page-content">
<div class="chat-shell mobile-chat-list">
<div class="thread-list"><div class="table-header"><h3>Conversations</h3><button class="btn btn-sm btn-outline" id="refreshThreads">Refresh</button></div><div id="threadList"><div class="loading-state"><div class="spinner"></div></div></div></div>
<div class="chat-pane">
<div class="chat-head"><div><div id="chatTitle" style="font-size:16px;font-weight:900">Select a conversation</div><div id="chatMeta" style="font-size:12px;color:var(--text3);margin-top:4px">Chats appear after a scout adds a player to their pipeline.</div></div><a id="profileLink" class="btn btn-sm btn-outline" href="#" style="display:none;text-decoration:none">View player</a></div>
<div class="share-bar" id="shareBar"><select id="shareType"><option value="player">Player</option><option value="fixture">Fixture</option><option value="prediction">Prediction</option></select><select id="shareTarget"><option value="">Loading...</option></select><button class="btn btn-sm btn-outline" id="shareBtn" type="button">Share</button><span id="shareMsg" style="font-size:12px;color:var(--text3)"></span></div>
<div class="messages" id="messages"><div style="margin:auto;color:var(--text3);font-size:14px">No conversation selected.</div></div>
<div class="composer"><textarea id="messageBody" placeholder="Write a message..."></textarea><button class="btn btn-primary" id="sendBtn">Send</button></div>
</div>
</div>
</div>
</div>
</div>
<script src="/frontend/js/scout-nav.js"></script>
<script src="/frontend/js/main.js"></script>
<script src="/frontend/js/heap-analytics.js"></script>
<script>
var _threads=[],_activeThread=null,_shareOptions={player:[],fixture:[],prediction:[]};
function logout(){logoutToLogin();}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function initNav(){
 if(!Auth.isLoggedIn()||(Auth.type!=='Scout'&&Auth.type!=='Coach')){navigateClean('login.html');return;}
 if(typeof buildScoutNav==='function')buildScoutNav('sidebarNav',Auth.type);
 var u=Auth.user,uel=document.getElementById('sidebarUser');
 if(uel&&u)uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:var(--green);color:#001b12">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">'+Auth.type+'</div></div></div>';
}
function otherName(t){return Auth.type==='Scout'?((t.coaches&&((t.coaches.first_name||'')+' '+(t.coaches.last_name||'')))||'Coach'):((t.scouts&&((t.scouts.first_name||'')+' '+(t.scouts.last_name||'')))||'Scout');}
function otherContact(t){
 var person=Auth.type==='Scout'?t.coaches:t.scouts;
 if(!person)return '';
 var club=person.team_name||person.club_name||'';
 return [person.email,club].filter(Boolean).join(' - ');
}
function threadInitials(name){var parts=String(name||'').trim().split(/\s+/).filter(Boolean);return ((parts[0]||'')[0]||'').toUpperCase()+((parts[1]||'')[0]||'').toUpperCase();}
function threadTime(t){var raw=t.lastMessageAt||t.last_message_at||t.updated_at||t.created_at;if(!raw)return '';return new Date(raw).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}
function renderThreads(){
 var box=document.getElementById('threadList');
 if(!_threads.length){box.innerHTML='<div class="chat-empty-mobile"><h3>No chats yet</h3><p>Add a player to your pipeline, then message their coach from the player or pipeline page.</p><a class="btn btn-sm btn-outline" href="player-search.html">Find players</a></div>';return;}
 box.innerHTML=_threads.map(function(t,i){var p=t.players||{},name=otherName(t),player=((p.first_name||'')+' '+(p.last_name||'')).trim();var preview=t.lastMessagePreview||('About '+(player||'a player'));return '<div class="thread-item '+(_activeThread&&_activeThread.id===t.id?'active':'')+'" data-thread="'+t.id+'"><div class="thread-avatar">'+esc(threadInitials(name)||'SL')+'</div><div class="thread-main"><div class="thread-title">'+esc(name)+(t.unreadCount?'<span class="unread-pill">'+t.unreadCount+'</span>':'')+'</div><div class="thread-meta">'+esc(preview)+'</div><div class="thread-meta">'+esc(player||'Player')+' - '+esc(p.team_name||'Team')+'</div></div><div class="thread-side"><span>'+esc(threadTime(t))+'</span><span aria-hidden="true">&rsaquo;</span></div></div>';}).join('');
 box.querySelectorAll('[data-thread]').forEach(function(el){el.addEventListener('click',function(){selectThread(this.getAttribute('data-thread'));});});
}
function loadThreads(){
 api('GET','/api/chat/threads').then(function(d){_threads=d.data||[];renderThreads();if(!_activeThread&&_threads[0]&&window.innerWidth>768)selectThread(_threads[0].id);if(window.innerWidth<=768&&window.setMobileChatMode)window.setMobileChatMode('list');}).catch(function(e){document.getElementById('threadList').innerHTML='<div style="padding:24px;color:#f44336">'+e.message+'</div>';});
}
function selectThread(id){
 _activeThread=_threads.find(function(t){return t.id===id;})||null;renderThreads();
 if(!_activeThread)return;
 var p=_activeThread.players||{};
 document.getElementById('chatTitle').textContent=otherName(_activeThread);
 document.getElementById('chatMeta').textContent=[((p.first_name||'')+' '+(p.last_name||'')+' - '+(p.team_name||'')).trim(),otherContact(_activeThread)].filter(Boolean).join(' | ');
 if(window.innerWidth<=768&&window.setMobileChatMode)window.setMobileChatMode('conversation');
 var profile=document.getElementById('profileLink');profile.style.display='inline-flex';profile.href='player-profile.html?id='+_activeThread.player_id;
 api('GET','/api/chat/threads/'+id+'/messages').then(function(d){renderMessages(d.data||[]);}).catch(function(e){document.getElementById('messages').innerHTML='<div style="margin:auto;color:#f44336">'+e.message+'</div>';});
 updateShareState();
}
function shareCardHtml(m){
 var meta=m.metadata||{};var type=String(m.reference_type||'item');
 var title=meta.playerName||meta.opponent||meta.predictionType||'Shared item';
 var lines=[];
 if(type==='player')lines=[meta.position,meta.ageGroup,meta.teamName,meta.stage?('Stage: '+meta.stage):'',meta.overall?('Overall: '+meta.overall):''].filter(Boolean);
 else if(type==='fixture')lines=[meta.fixtureDate,meta.fixtureTime,meta.homeOrAway,meta.venue,meta.city].filter(Boolean);
 else if(type==='prediction')lines=[meta.playerName,meta.runAt?new Date(meta.runAt).toLocaleDateString('en-GB'):'',meta.summary].filter(Boolean);
 return '<div class="share-card"><div class="share-card-type">Shared '+esc(type)+'</div><div class="share-card-title">'+esc(title)+'</div><div class="share-card-meta">'+esc(lines.join(' | '))+'</div>'+(meta.profileUrl?'<a class="btn btn-sm btn-outline" style="margin-top:10px;text-decoration:none" href="'+esc(meta.profileUrl)+'">Open profile</a>':'')+'</div>';
}
function renderMessages(messages){
 var box=document.getElementById('messages');
 if(!messages.length){box.innerHTML='<div style="margin:auto;color:var(--text3);font-size:14px">No messages yet.</div>';return;}
 box.innerHTML=messages.map(function(m){var mine=m.sender_id===Auth.user.id;var isShare=m.message_kind==='share';return '<div class="msg '+(mine?'mine':'')+'"><div class="by">'+(mine?'You':esc(m.sender_type))+'</div><div class="body">'+esc(m.body||'')+'</div>'+(isShare?shareCardHtml(m):'')+'<div style="font-size:10px;color:var(--text3);margin-top:6px">'+(m.created_at?new Date(m.created_at).toLocaleString('en-GB'):'')+'</div></div>';}).join('');
 box.scrollTop=box.scrollHeight;
}
function sendMessage(){
 if(!_activeThread)return alert('Select a conversation first.');
 var body=document.getElementById('messageBody').value.trim();
 if(!body)return;
 var btn=document.getElementById('sendBtn');btn.disabled=true;
 api('POST','/api/chat/threads/'+_activeThread.id+'/messages',{body:body}).then(function(){document.getElementById('messageBody').value='';selectThread(_activeThread.id);loadThreads();}).catch(function(e){alert(e.message||'Could not send message.');}).finally(function(){btn.disabled=false;});
}
function updateShareState(){
 var bar=document.getElementById('shareBar');
 if(!bar)return;
 bar.style.display=(Auth.type==='Scout'&&_activeThread)?'flex':'none';
 if(Auth.type==='Scout')renderShareTarget();
}
function optionLabel(type,item){
 if(type==='player'){var p=item.players||{};return ((p.first_name||'')+' '+(p.last_name||'')).trim()+' - '+(p.specific_position||p.primary_position||'')+' - '+((item.stage||'watching').replace(/_/g,' '));}
 if(type==='fixture')return (item.fixture_date||'TBC')+' - '+(item.home_or_away==='Away'?'@ ':'vs ')+(item.opponent||'Fixture');
 var pl=item.players||{};return (item.prediction_type||'Prediction')+' - '+((pl.first_name||'')+' '+(pl.last_name||'')).trim();
}
function optionId(type,item){return type==='player'?item.player_id:item.id;}
function renderShareTarget(){
 var type=document.getElementById('shareType').value;var sel=document.getElementById('shareTarget');var list=_shareOptions[type]||[];
 if(!list.length){sel.innerHTML='<option value="">No '+type+'s available</option>';return;}
 sel.innerHTML='<option value="">Select '+type+'</option>'+list.map(function(item){return '<option value="'+esc(optionId(type,item))+'">'+esc(optionLabel(type,item))+'</option>';}).join('');
}
function loadShareOptions(){
 if(Auth.type!=='Scout'){updateShareState();return;}
 Promise.all([
  api('GET','/api/scouts/pipeline?limit=100').catch(function(){return{data:[]};}),
  api('GET','/api/scouts/fixtures').catch(function(){return{data:[]};}),
  api('GET','/api/predictions').catch(function(){return{data:[]};})
 ]).then(function(res){
  _shareOptions.player=res[0].data||[];
  _shareOptions.fixture=res[1].data||[];
  _shareOptions.prediction=res[2].data||[];
  updateShareState();
 });
}
function shareSelected(){
 if(!_activeThread)return;
 var type=document.getElementById('shareType').value;var referenceId=document.getElementById('shareTarget').value;var msg=document.getElementById('shareMsg');
 if(!referenceId){msg.textContent='Select something to share.';msg.style.color='#f44336';return;}
 msg.textContent='Sharing...';msg.style.color='var(--text3)';
 api('POST','/api/chat/threads/'+_activeThread.id+'/share',{type:type,referenceId:referenceId}).then(function(){msg.textContent='Shared.';msg.style.color='var(--green)';selectThread(_activeThread.id);loadThreads();}).catch(function(e){msg.textContent=e.message;msg.style.color='#f44336';});
}
document.addEventListener('DOMContentLoaded',function(){initNav();loadThreads();loadShareOptions();document.getElementById('refreshThreads').addEventListener('click',loadThreads);document.getElementById('sendBtn').addEventListener('click',sendMessage);document.getElementById('shareType').addEventListener('change',renderShareTarget);document.getElementById('shareBtn').addEventListener('click',shareSelected);});
</script>
<script src="/frontend/js/phone-routes.js"></script>
<script src="/frontend/js/phone-shell.js"></script>
<script src="/frontend/js/phone-pages.js"></script>
</body></html>
