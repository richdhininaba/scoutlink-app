<!DOCTYPE html>
<html lang="en"><head><base href="/frontend/pages/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Player rankings - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--card:#161b22;--accent:#1d9e75;--text:#ffffff;--text-secondary:#8b949e;--border:#30363d;}
.leaderboard{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px;}
.leaderboard-header{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);}
.leaderboard-icon{min-width:34px;height:26px;border-radius:6px;background:rgba(29,158,117,.12);border:1px solid rgba(29,158,117,.24);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;letter-spacing:.04em;}
.leaderboard-title{font-size:16px;font-weight:700;}
.leaderboard-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);}
.leaderboard-row:last-child{border-bottom:none;}
.leaderboard-row:hover{background:rgba(255,255,255,0.02);}
.rank-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.rank-1{background:#FFD700;color:#000;}
.rank-2{background:#C0C0C0;color:#000;}
.rank-3{background:#CD7F32;color:#fff;}
.rank-other{background:var(--bg);color:var(--text-secondary);border:1px solid var(--border);}
.stat-val{font-size:20px;font-weight:900;margin-left:auto;flex-shrink:0;}
.btn{padding:8px 16px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent);text-decoration:none;}
.btn-sm{padding:5px 10px;font-size:12px;}
.ranking-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;}
@media(max-width:700px){.ranking-grid{grid-template-columns:1fr;}}
</style>
<link rel="stylesheet" href="../css/phone-base.css">
<link rel="stylesheet" href="../css/phone-shell.css">
<link rel="stylesheet" href="../css/phone-pages.css">
<script type="text/javascript">

  heap.load("3441720574");

</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900;color:#fff;text-decoration:none">Scout<span style="color:var(--accent)">Link</span></a></div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
  <span class="topbar-title">Player rankings</span>
  <div class="topbar-right">
    <button class="notif-btn" id="notifToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
    <button class="btn btn-sm btn-outline" id="logoutBtn">Sign out</button>
  </div>
</div>
<div class="page-content">
  <div style="margin-bottom:20px"><h2 style="font-size:20px;font-weight:800">Player leaderboards</h2><p style="color:var(--text-secondary);font-size:14px;margin-top:4px">Top 5 in each category across the entire platform</p></div>
  <div class="ranking-grid" id="rankingsGrid">
    <div style="grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:32px;color:var(--text-secondary)"><div class="spinner"></div><span>Loading rankings...</span></div>
  </div>
</div>
</div>
</div>
<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-header"><h3>Notifications</h3><button id="closeNotifBtn" style="background:none;border:none;color:var(--text-secondary);font-size:20px;cursor:pointer">x</button></div>
  <div class="notif-list" id="notifList"></div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>
function toggleNotifPanel(){document.getElementById('notifPanel').classList.toggle('open');}
function logout(){logoutToLogin();}
function initNav(){
  if(typeof Auth==='undefined'||!Auth.isLoggedIn()||Auth.type!=='Scout'){navigateClean('login.html');return;}
  if(typeof buildScoutNav==='function')buildScoutNav('sidebarNav','Scout');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u){
    var ini=(u.firstName||'?')[0]+(u.lastName||'?')[0];
    uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:var(--accent);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">'+ini.toUpperCase()+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role" style="color:var(--text-secondary);font-size:12px">Scout</div></div></div>';
  }
  if(typeof updateNotifBadge==='function')updateNotifBadge();
}
function fmtVal(v){if(!v||v<1000)return '--';if(v>=1000000)return '\u00a3'+(v/1000000).toFixed(1)+'M';return '\u00a3'+Math.round(v/1000)+'K';}
function initials(f,l){return((f||'?')[0]+(l||'?')[0]).toUpperCase();}
function pColor(g){return{Goalkeeper:'#FFC107',Defender:'#2979FF',Midfielder:'#17a2b8',Forward:'#ff6b35'}[g]||'var(--accent)';}
function rankBadge(i){var cls=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other';return '<div class="rank-badge '+cls+'">'+(i+1)+'</div>';}

function buildLeaderboard(title, icon, players, statKey, statLabel, statFmt) {
  if(!players||!players.length) return '<div class="leaderboard"><div class="leaderboard-header"><span class="leaderboard-icon">'+icon+'</span><span class="leaderboard-title">'+title+'</span></div><div style="padding:24px;color:var(--text-secondary);text-align:center">No data yet</div></div>';
  return '<div class="leaderboard">'+
    '<div class="leaderboard-header"><span class="leaderboard-icon">'+icon+'</span><span class="leaderboard-title">'+title+'</span></div>'+
    players.map(function(p,i){
      var val = statFmt ? statFmt(p[statKey]) : (p[statKey]||0);
      return '<div class="leaderboard-row">'+
        rankBadge(i)+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+p.first_name+' '+p.last_name+'</div>'+
          '<div style="font-size:11px;color:var(--text-secondary)">'+(p.age_group||'')+(p.team_name?' &middot; '+p.team_name:'')+'</div>'+
        '</div>'+
        '<div style="text-align:right;flex-shrink:0">'+
          '<div class="stat-val" style="color:var(--accent)">'+val+'</div>'+
          '<div style="font-size:10px;color:var(--text-secondary)">'+statLabel+'</div>'+
        '</div>'+
        '<a href="player-profile.html?id='+p.id+'" class="btn btn-sm btn-outline" style="text-decoration:none;flex-shrink:0">View</a>'+
      '</div>';
    }).join('')+
  '</div>';
}

function loadRankings(){
  if(typeof api!=='function')return;
  api('GET','/api/scouts/rankings').then(function(d){
    document.getElementById('rankingsGrid').innerHTML =
      buildLeaderboard('Top scorers','G', d.topScorers, 'goals', 'goals', null) +
      buildLeaderboard('Top assisters','A', d.topAssisters, 'assists', 'assists', null) +
      buildLeaderboard('Top clean sheets','CS', d.topCleanSheets, 'clean_sheets', 'clean sheets', null) +
      buildLeaderboard('Most scouted','INT', d.topInterested, 'interest_count', 'scouts', null) +
      buildLeaderboard('Most valuable','GBP', d.topExpensive, 'transfer_value', 'est. value', fmtVal);
  }).catch(function(e){
    document.getElementById('rankingsGrid').innerHTML='<div style="grid-column:1/-1;padding:32px;color:var(--text-secondary);text-align:center">Could not load rankings. '+e.message+'</div>';
  });
}

document.addEventListener('DOMContentLoaded',function(){
  initNav();loadRankings();
  document.getElementById('notifToggle').addEventListener('click',toggleNotifPanel);
  document.getElementById('closeNotifBtn').addEventListener('click',toggleNotifPanel);
  document.getElementById('logoutBtn').addEventListener('click',logout);
});
</script>
<script src="../js/phone-routes.js"></script>
<script src="../js/phone-shell.js"></script>
<script src="../js/phone-pages.js"></script>
</body></html>
