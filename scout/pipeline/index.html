<!DOCTYPE html>
<html lang="en"><head>
  <base href="/frontend/pages/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Pipeline - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.stage-chip{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.stage-watching{background:rgba(33,150,243,.15);color:#42A5F5;}
.stage-interested,.stage-shortlisted{background:rgba(255,193,7,.15);color:#FFD54F;}
.stage-approached,.stage-trial_pending{background:rgba(29,158,117,.15);color:#1d9e75;}
.stage-negotiating{background:rgba(255,87,34,.15);color:#FF7043;}
.stage-header{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:16px 20px 8px;border-bottom:1px solid var(--border);}
</style>
<link rel="stylesheet" href="../css/phone-base.css">
<link rel="stylesheet" href="../css/phone-shell.css">
<link rel="stylesheet" href="../css/phone-pages.css">
<script type="text/javascript">

</head><body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900">Scout<span style="color:#1d9e75">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">My Pipeline</span>
<div class="topbar-right">
<button class="notif-btn" onclick="toggleNotifPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost desktop-signout" onclick="logout()">Sign Out</button>
</div>
</div>
<div class="page-content">

<div class="kpi-grid" style="margin-bottom:20px">
<div class="kpi-card">
<div class="kpi-label">Interests Remaining</div>
<div class="kpi-value green" id="kpiInterests">-</div>
</div>
<div class="kpi-card">
<div class="kpi-label">Plan Limit</div>
<div class="kpi-value" id="kpiLimit">-</div>
</div>
<div class="kpi-card">
<div class="kpi-label">In Pipeline</div>
<div class="kpi-value" id="kpiTotal">-</div>
</div>
<div class="kpi-card">
<div class="kpi-label">Plan</div>
<div class="kpi-value" id="kpiPlan" style="font-size:20px">-</div>
</div>
</div>

<div class="table-card">
<div class="table-header">
<div>
<h3>My Recruitment Pipeline</h3>
<p style="font-size:12px;color:var(--text3);margin-top:2px">FA/UEFA-aligned stages: Watching &#8594; Shortlisted &#8594; Approached &#8594; Negotiating</p>
</div>
<a href="player-search.html" class="btn btn-sm btn-outline">Find Players</a>
</div>
<div id="pipelineContent"><div class="loading-state"><div class="spinner"></div><span style="margin-left:10px">Loading pipeline...</span></div></div>
</div>

</div>
</div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script>
function initNav() {
  if (!Auth.isLoggedIn() || Auth.type !== 'Scout') { navigateClean('login.html'); return; }
  if (typeof buildScoutNav === 'function') buildScoutNav('sidebarNav', 'Scout');
  var u = Auth.user, uel = document.getElementById('sidebarUser');
  if (uel && u) uel.innerHTML = '<div class="user-info"><div class="user-avatar" style="background:#1d9e75;color:#000">' + initials(u.firstName, u.lastName) + '</div><div><div class="user-name">' + (u.firstName || '') + ' ' + (u.lastName || '') + '</div><div class="user-role">Scout</div></div></div>';
  updateNotifBadge();
}
function logout(){logoutToLogin();}
function toggleNotifPanel(){}

function stageClass(s){
  var m={'watching':'stage-watching','shortlisted':'stage-shortlisted','interested':'stage-interested','approached':'stage-approached','trial_pending':'stage-approached','negotiating':'stage-negotiating'};
  return m[(s||'').toLowerCase().replace(/ /g,'_')]||'stage-watching';
}
function dispOv(v){var n=parseFloat(v);return isNaN(n)?'--':(n>10?n/10:n).toFixed(1);}
function compatColor(s){return s>=80?'#1d9e75':s>=65?'#FFC107':s>=50?'#FF9800':'#f44336';}
function fmtVal(v){var n=Number(v)||0;if(!n)return null;if(n>=1000000)return '\u00a3'+(n/1000000).toFixed(2)+'m';if(n>=1000)return '\u00a3'+(n/1000).toFixed(0)+'k';return '\u00a3'+n;}
var pipelineRows=[];
var planName='Core';
var planLimit=200;

function updatePipelineKpis(){
  document.getElementById('kpiTotal').textContent=pipelineRows.length;
  var unlimited=planLimit>=99999;
  document.getElementById('kpiInterests').textContent=unlimited?'Unlimited':Math.max(0,planLimit-pipelineRows.length);
  document.getElementById('kpiLimit').textContent=unlimited?'Unlimited':planLimit;
  document.getElementById('kpiPlan').textContent=String(planName||'Core').toUpperCase();
}

function moveStage(pipelineId, newStage, badgeEl, selectEl){
  api('PATCH','/api/scouts/pipeline/'+pipelineId,{stage:newStage}).then(function(d){
    var updated=d.data||d;
    var stage=updated.stage||newStage;
    badgeEl.textContent=stage.replace(/_/g,' ');
    badgeEl.className='stage-chip '+stageClass(stage);
    badgeEl.setAttribute('data-stage',stage);
  }).catch(function(e){
    alert('Could not update stage: '+e.message);
    selectEl.value=badgeEl.getAttribute('data-stage');
  });
}

function startChat(playerId){
  if(!playerId)return;
  api('POST','/api/chat/threads',{playerId:playerId}).then(function(){
    navigateClean('scout-chat.html');
  }).catch(function(e){
    alert(e.message||'Could not start chat for this player.');
  });
}

document.addEventListener('DOMContentLoaded',function(){
  initNav();

  api('GET','/api/scouts/profile').then(function(profile){
    var scout=profile.scout||{};
    var LIMITS={Core:200,Plus:1000,Elite:99999};
    planName=scout.subscription_plan||'Core';
    planLimit=LIMITS[planName]||200;
    updatePipelineKpis();
  }).catch(function(){
    document.getElementById('kpiInterests').textContent='--';
    document.getElementById('kpiLimit').textContent='--';
    document.getElementById('kpiPlan').textContent='CORE';
  });

  api('GET','/api/scouts/pipeline?limit=100').then(function(d){
    var rows=d.data||[];
    pipelineRows=rows;
    updatePipelineKpis();

    if(!rows.length){
      document.getElementById('pipelineContent').innerHTML='<div style="text-align:center;padding:48px 20px;color:var(--text3)"><div style="font-size:48px;margin-bottom:16px">&#128203;</div><h3 style="color:var(--text2);margin-bottom:8px">Your pipeline is empty</h3><p>Browse the player database to find your first match.</p><a href="player-search.html" class="btn btn-primary" style="margin-top:14px;display:inline-block">Browse players</a></div>';
      return;
    }

    var stages=['watching','interested','shortlisted','approached','trial_pending','negotiating'];
    var grouped={};
    rows.forEach(function(r){
      var s=(r.stage||'watching').toLowerCase().replace(/ /g,'_');
      if(!grouped[s])grouped[s]=[];
      grouped[s].push(r);
    });

    var isPhoneView=window.isScoutLinkPhone&&window.isScoutLinkPhone();
    var html=isPhoneView?'<div class="phone-pipeline-cards">':'<div style="overflow-x:auto"><table class="sl-table"><thead><tr><th>Player</th><th>Position</th><th>Overall</th><th>Estimated value</th><th>Stage</th><th>Move to stage</th><th>Coach</th><th>Added</th><th></th></tr></thead><tbody>';

    stages.forEach(function(stage){
      var stageRows=grouped[stage]||[];
      if(!stageRows.length)return;
      stageRows.forEach(function(r){
        var p=r.players||{};
        var ov=dispOv(p.overall_rating);
        var ovN=parseFloat(p.overall_rating||0);var ovP=ovN>10?ovN:ovN*10;
        var pid=p.id||'';
        var rid=r.id||'';
        var tv=fmtVal(p.transfer_value);
        var tvDisp=tv||'Calculating';
        var tvColor=tv?'#1d9e75':'#8b949e';
        if(isPhoneView){
          var name=((p.first_name||'')+' '+(p.last_name||'')).trim()||'Player';
          var stageNow=(r.stage||'watching').toLowerCase().replace(/ /g,'_');
          html+='<article class="phone-pipeline-card">'+
            '<div class="phone-pipeline-head"><div class="user-avatar">'+initials(p.first_name,p.last_name)+'</div><div><h4>'+name+'</h4><p><span>'+(p.age_group||'Age TBC')+'</span><span>'+(p.team_name||'Team TBC')+'</span></p></div></div>'+
            '<div class="phone-pipeline-grid">'+
              '<span><small>Position</small><b>'+((p.specific_position||p.primary_position||'--'))+'</b></span>'+
              '<span><small>Overall</small><b style="color:'+compatColor(ovP)+'">'+ov+'</b></span>'+
              '<span><small>Estimated value</small><b>'+tvDisp+'</b></span>'+
              '<span><small>Added</small><b>'+(r.created_at?r.created_at.slice(0,10):'--')+'</b></span>'+
            '</div>'+
            '<label class="phone-stage-label">Move to stage<select class="stage-select" data-pipeline-id="'+rid+'" data-badge-id="mobile-stage-badge-'+rid+'">'+
              '<option value="watching"'+(stageNow==='watching'?' selected':'')+'>Watching</option>'+
              '<option value="interested"'+(stageNow==='interested'?' selected':'')+'>Interested</option>'+
              '<option value="shortlisted"'+(stageNow==='shortlisted'?' selected':'')+'>Shortlisted</option>'+
              '<option value="trial_pending"'+(stageNow==='trial_pending'?' selected':'')+'>Trial pending</option>'+
              '<option value="approached"'+(stageNow==='approached'?' selected':'')+'>Approached</option>'+
              '<option value="negotiating"'+(stageNow==='negotiating'?' selected':'')+'>Negotiating</option>'+
            '</select></label>'+
            '<span class="stage-chip '+stageClass(stageNow)+'" id="mobile-stage-badge-'+rid+'" data-stage="'+stageNow+'">'+stageNow.replace(/_/g,' ')+'</span>'+
            '<div class="phone-pipeline-actions"><button class="btn btn-outline" data-chat-player="'+pid+'">Message coach</button><a href="player-profile.html?id='+pid+'" class="btn btn-primary">View</a></div>'+
          '</article>';
          return;
        }
        html+='<tr>' +
          '<td><div style="display:flex;align-items:center;gap:8px"><div class="user-avatar" style="width:32px;height:32px;font-size:11px">'+initials(p.first_name,p.last_name)+'</div><div><b>'+(p.first_name||'')+' '+(p.last_name||'')+'</b><div style="font-size:11px;color:var(--text3)">'+(p.age_group||((p.age||'')+'yrs')||'--')+'</div></div></div></td>'+
          '<td>'+(p.specific_position||p.primary_position||'--')+'</td>'+
          '<td style="color:'+compatColor(ovP)+';font-weight:700">'+ov+'</td>'+
          '<td style="color:'+tvColor+';font-weight:'+(tv?'700':'400')+'">'+tvDisp+'</td>'+
          '<td><span class="stage-chip '+stageClass(r.stage)+'" id="stage-badge-'+rid+'" data-stage="'+r.stage+'">'+(r.stage||'watching').replace(/_/g,' ')+'</span></td>'+
          '<td>'+
          '<select id="stage-sel-'+rid+'" class="stage-select" data-pipeline-id="'+rid+'" data-badge-id="stage-badge-'+rid+'" style="background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer">'+
          '<option value="watching"'+(r.stage==='watching'?' selected':'')+'>Watching</option>'+
          '<option value="interested"'+(r.stage==='interested'?' selected':'')+'>Interested</option>'+
          '<option value="trial_pending"'+(r.stage==='trial_pending'?' selected':'')+'>Trial pending</option>'+
          '<option value="approached"'+(r.stage==='approached'?' selected':'')+'>Approached</option>'+
          '<option value="negotiating"'+(r.stage==='negotiating'?' selected':'')+'>Negotiating</option>'+
          '</select>'+
          '</td>'+
          '<td><button class="btn btn-sm btn-outline" style="min-height:36px" data-chat-player="'+pid+'">Message coach</button></td>'+
          '<td style="color:var(--text3);font-size:11px">'+(r.created_at?r.created_at.slice(0,10):'--')+'</td>'+
          '<td><a href="player-profile.html?id='+pid+'" class="btn btn-sm btn-outline" style="min-height:36px">View</a></td>'+
          '</tr>';
      });
    });

    html+=isPhoneView?'</div>':'</tbody></table></div>';
    document.getElementById('pipelineContent').innerHTML=html;
    document.querySelectorAll('.stage-select').forEach(function(sel){
      sel.addEventListener('change',function(){
        var rid=this.getAttribute('data-pipeline-id');
        var badge=document.getElementById(this.getAttribute('data-badge-id')||('stage-badge-'+rid));
        moveStage(rid,this.value,badge,this);
      });
    });
    document.querySelectorAll('[data-chat-player]').forEach(function(btn){
      btn.addEventListener('click',function(){startChat(this.getAttribute('data-chat-player'));});
    });

  }).catch(function(e){
    document.getElementById('kpiTotal').textContent='0';
    document.getElementById('pipelineContent').innerHTML='<div style="text-align:center;padding:48px;color:var(--text3)">Could not load pipeline data.<br><small>'+e.message+'</small><br><a href="player-search.html" class="btn btn-primary" style="margin-top:14px;display:inline-block">Browse players</a></div>';
  });
});
</script>
<script src="../js/phone-routes.js"></script>
<script src="../js/phone-shell.js"></script>
<script src="../js/phone-pages.js"></script>
</body></html>
