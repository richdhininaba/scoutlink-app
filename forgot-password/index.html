.reset-actions{display:grid;grid-template-columns:1fr;gap:10px}

.reset-step{display:none}
.reset-step.active{display:block}
.reset-hint{color:var(--text3);font-size:13px;line-height:1.5;margin:-6px 0 16px}

</style>

</head><body class="form-page">
<div class="form-page-inner"><div class="form-container">
  <div class="form-logo"><a href="/" style="font-size:28px;font-weight:900;text-decoration:none;color:var(--text)">Scout<span style="color:#00E676">Link</span></a></div>
  <h1 class="form-title">Reset Password</h1>
  <p class="form-subtitle" id="pageSubtitle">Choose your account type and we will send a reset code.</p>
  <div class="form-error" id="formError"></div>
  <div class="form-success" id="formSuccess"></div>

  <div class="reset-step active" id="requestStep">
    <div class="form-group"><label>Account Type</label>
      <select id="accountType"><option value="Player">Player</option><option value="Coach">Coach</option><option value="Scout">Scout</option><option value="Stratex">Stratex Admin</option></select>
    </div>
    <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="your@email.com" autocomplete="email"></div>
    <button class="btn btn-primary btn-full" onclick="sendReset()">Send Reset Code</button>
  </div>

  <div class="reset-step" id="resetStep">
    <p class="reset-hint">Enter the reset code from your email and choose a new password.</p>
    <div class="form-group"><label>Account Type</label>
      <select id="resetAccountType"><option value="Player">Player</option><option value="Coach">Coach</option><option value="Scout">Scout</option><option value="Stratex">Stratex Admin</option></select>
    </div>
    <div class="form-group"><label>Email Address</label><input type="email" id="resetEmail" placeholder="your@email.com" autocomplete="email"></div>
    <div class="form-group"><label>Reset Code</label><input type="text" id="resetCode" class="reset-code-input" maxlength="6" placeholder="ABC123" oninput="this.value=this.value.toUpperCase()"></div>
    <div class="form-group"><label>New Password</label><input type="password" id="newPassword" placeholder="Minimum 8 characters" autocomplete="new-password"></div>
    <div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPassword" placeholder="Repeat new password" autocomplete="new-password" onkeydown="if(event.key==='Enter')resetPassword()"></div>
    <div class="reset-actions">
      <button class="btn btn-primary btn-full" onclick="resetPassword()">Reset Password</button>
      <button class="btn btn-ghost btn-full" onclick="showRequestStep()" type="button">Send a New Code</button>
    </div>
  </div>

  <div class="form-divider"></div>
  <div class="form-link"><a href="/login">Back to Sign In</a></div>
</div></div>
<script src="/frontend/js/main.js"></script>
<script src="/frontend/js/heap-analytics.js"></script>
<script>
function byId(id){return document.getElementById(id);}
function clearMessages(){byId('formError').classList.remove('show');byId('formSuccess').classList.remove('show');}
function showError(msg){var el=byId('formError');el.textContent=msg;el.classList.add('show');}
function showSuccess(msg){var el=byId('formSuccess');el.textContent=msg;el.classList.add('show');}
function setSelectValue(id,val){var s=byId(id);if(!s||!val)return;for(var i=0;i<s.options.length;i++){if(s.options[i].value===val){s.selectedIndex=i;break;}}}
function showRequestStep(){
  clearMessages();
  byId('requestStep').classList.add('active');
  byId('resetStep').classList.remove('active');
  byId('pageSubtitle').textContent='Choose your account type and we will send a reset code.';
}
function showResetStep(){
  byId('requestStep').classList.remove('active');
  byId('resetStep').classList.add('active');
  byId('pageSubtitle').textContent='Set your new password with the code from your email.';
}
async function sendReset(){
  clearMessages();
  var em=byId('email').value.trim();
  var at=byId('accountType').value;
  if(!em){showError('Please enter your email address.');return;}
  try{
    var d=await api('POST','/api/auth/forgot-password',{email:em,accountType:at});
    byId('resetEmail').value=em;
    setSelectValue('resetAccountType',at);
    showResetStep();
    showSuccess(d.message || 'If that email exists, a reset code has been sent.');
  }catch(e){showError(e.message);}
}
async function resetPassword(){
  clearMessages();
  var em=byId('resetEmail').value.trim();
  var code=byId('resetCode').value.trim().toUpperCase();
  var p=byId('newPassword').value;
  var c=byId('confirmPassword').value;
  var at=byId('resetAccountType').value;
  if(!em||!code||!p||!c){showError('Please complete every field.');return;}
  if(p.length<8){showError('Password must be at least 8 characters.');return;}
  if(p!==c){showError('Passwords do not match.');return;}
  try{
    var d=await api('POST','/api/auth/reset-password',{email:em,code:code,newPassword:p,accountType:at});
    showSuccess(d.message || 'Password updated successfully. You can now sign in.');
    setTimeout(function(){window.location.href='/login';},1200);
  }catch(e){showError(e.message);}
}
var params=new URLSearchParams(window.location.search);
if(params.get('email')){byId('email').value=params.get('email');byId('resetEmail').value=params.get('email');}
if(params.get('type')){setSelectValue('accountType',params.get('type'));setSelectValue('resetAccountType',params.get('type'));}
if(params.get('code')){byId('resetCode').value=params.get('code').toUpperCase();showResetStep();}
</script>
<script src="/frontend/js/phone-routes.js"></script>
<script src="/frontend/js/phone-shell.js"></script>
<script src="/frontend/js/phone-pages.js"></script>
</body></html>
