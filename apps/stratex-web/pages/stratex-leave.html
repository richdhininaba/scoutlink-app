var admins=[],leave=[];function logout(){logoutToLogin();}function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function show(id,msg){var el=document.getElementById(id);el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},3500);}function nameFor(id){var a=admins.find(function(x){return x.id===id;});return a?((a.first_name||'')+' '+(a.last_name||'')):'--';}
function render(){leaveAdmin.innerHTML=admins.filter(function(a){return a.is_active!==false;}).map(function(a){return '<option value="'+a.id+'">'+safe((a.first_name||'')+' '+(a.last_name||'')+' - '+(a.job_title||a.admin_role||''))+'</option>';}).join('');leaveRows.innerHTML=leave.length?leave.map(function(l){return '<tr><td>'+safe(nameFor(l.stratex_id))+'</td><td>'+safe(String(l.leave_type||'').replace(/_/g,' '))+'</td><td>'+safe(l.start_date)+'</td><td>'+safe(l.end_date)+'</td><td><span class="badge badge-blue">'+safe(l.status||'requested')+'</span></td><td>'+safe(l.notes||'')+'</td></tr>';}).join(''):'<tr><td colspan="6" style="color:#8ea2b5">No leave recorded.</td></tr>';if(window.refreshMobileLayout)refreshMobileLayout();}
async function load(){var d=await api('GET','/api/stratex/org');admins=d.admins||[];leave=d.leave||[];render();}
