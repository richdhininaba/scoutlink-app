<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Stratex Analytics | Admin Centre</title>
  <meta name="theme-color" content="#04352A">
  <link rel="icon" type="image/png" href="/stratex-favicon.png?v=20260825-admin-v7-polish-2">
  <link rel="apple-touch-icon" sizes="180x180" href="/stratex-apple-touch-icon.png?v=20260825-admin-v7-polish-2">

  <script>
    (function () {
      /*
       * The Admin Centre frontend is hosted on stratexanalytics.co.uk, while
       * its authenticated data API is hosted on scoutlink-api.vercel.app.
       * Keep this explicit so V7 requests never fall back to the Stratex web
       * origin and return a Vercel NOT_FOUND page.
       */
      window.API_BASE_URL = 'https://scoutlink-api.vercel.app';
      window.API_URL = window.API_BASE_URL;

      var ua = navigator.userAgent || '';
      var isIpad = /iPad/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      var uaMobile = navigator.userAgentData && navigator.userAgentData.mobile === true;
      var isPhone = !isIpad && (
        uaMobile ||
        /iPhone|iPod|Windows Phone|IEMobile|BlackBerry|BB10|Opera Mini/i.test(ua) ||
        (/Android/i.test(ua) && /Mobile/i.test(ua))
      );

      window.__STRATEX_ADMIN_PHONE_BLOCKED__ = isPhone;
      if (isPhone) document.documentElement.classList.add('stratex-admin-phone-blocked');

      if (!isPhone) {
        var currentPath = (location.pathname || '/admin').replace(/\/+$/, '') || '/admin';
        var allowed = [
          /^\/admin$/,
          /^\/admin\/login$/,
          /^\/admin\/setup$/,
          /^\/admin\/forgot-password$/,
          /^\/admin\/registrations$/,
          /^\/admin\/crm$/,
          /^\/admin\/blog$/,
          /^\/admin\/scoutlink$/,
          /^\/admin\/scoutlink\/players$/,
          /^\/admin\/scoutlink\/coaches$/,
          /^\/admin\/scoutlink\/teams$/,
          /^\/admin\/scoutlink\/scouts$/,
          /^\/admin\/leadership$/,
          /^\/admin\/org-charts$/,
          /^\/admin\/admin-users$/,
          /^\/admin\/users\/add$/,
          /^\/admin\/permissions$/,
          /^\/admin\/my-profile$/,
          /^\/admin\/financials$/,
          /^\/admin\/trust-concerns$/,
          /^\/admin\/settings$/
        ];

        if (!allowed.some(function (rule) { return rule.test(currentPath); })) {
          location.replace('/admin');
          return;
        }

        if (currentPath === '/admin/org-charts') {
          document.documentElement.classList.add('stratex-org-fidelity-pending');
        }
      }
    }());
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/stratex-admin-v5.css?v=20260820-admin-org-no-flash-5">
  <link rel="stylesheet" href="/css/stratex-admin-v7.css?v=20260825-admin-v7-1">
  <link rel="stylesheet" href="/css/stratex-admin-v7-polish.css?v=20260825-admin-v7-polish-2">

  <style>
    html,body{min-height:100%;margin:0;background:#04352A}
    html.stratex-org-fidelity-pending body.stratex-admin-centre-v2 #adminMain{visibility:hidden}
    html.stratex-org-fidelity-pending body.stratex-admin-centre-v2 .workspace{position:relative}
    html.stratex-org-fidelity-pending body.stratex-admin-centre-v2 .workspace::after{content:"Loading organisation directory";position:absolute;left:50%;top:150px;transform:translateX(-50%);font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:rgba(12,32,26,.58);pointer-events:none}
    .admin-v2-boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:#04352A;color:#F7F6F0;font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .admin-v2-boot-inner{width:min(420px,100%);text-align:center}
    .admin-v2-boot-logo{width:170px;height:64px;margin:0 auto;background:url('/images/redesign/stratex-header.png') center/contain no-repeat;filter:brightness(0) invert(1)}
    .admin-v2-boot small{display:block;margin-top:20px;font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#D8F547}
    .admin-v2-boot h1{margin:10px 0 0;font:400 30px Anton,Impact,sans-serif;letter-spacing:.01em;text-transform:uppercase}
    .admin-v2-boot p{margin:10px 0 0;color:rgba(247,246,240,.72);font-size:12px;line-height:1.6}
  </style>

  <script>
    (function () {
      try {
        [
          'sl_public_demo',
          'sl_public_demo_role',
          'sl_public_demo_state',
          'sl_public_demo_seed_players',
          'sl_public_demo_started_at'
        ].forEach(function (key) {
          sessionStorage.removeItem(key);
        });
      } catch (_) {}
    }());
  </script>
</head>
<body class="stratex-admin-centre-v2">
  <div class="admin-phone-gate" id="stratexAdminPhoneGate" role="main" aria-labelledby="adminPhoneTitle">
    <div class="admin-phone-gate-card">
      <div class="admin-phone-gate-logo" aria-label="Stratex Analytics"></div>
      <span>Admin Centre</span>
      <h1 id="adminPhoneTitle">Admin Centre can only be accessed on an iPad or desktop.</h1>
      <p>Please reopen this secure workspace on an iPad, laptop or desktop computer.</p>
    </div>
  </div>

  <div class="admin-v2-boot" id="stratexAdminBoot" role="status" aria-live="polite">
    <div class="admin-v2-boot-inner">
      <div class="admin-v2-boot-logo" aria-label="Stratex Analytics"></div>
      <small>Admin Centre</small>
      <h1>Loading secure workspace</h1>
      <p>Opening Stratex Analytics internal administration.</p>
    </div>
  </div>

  <noscript>
    <p style="margin:0;padding:24px;background:#04352A;color:#F7F6F0;font-family:Arial,sans-serif">
      JavaScript is required to use the Stratex Admin Centre.
    </p>
  </noscript>

  <script>
    (function () {
      if (window.__STRATEX_ADMIN_PHONE_BLOCKED__) {
        var boot = document.getElementById('stratexAdminBoot');
        if (boot) boot.remove();
        return;
      }

      function load(src, callback) {
        var script = document.createElement('script');
        script.src = src;
        script.defer = false;
        if (callback) script.onload = callback;
        document.body.appendChild(script);
      }

      load('/js/stratex-admin-v5.js?v=20260820-admin-org-no-flash-5', function () {
        load('/js/stratex-admin-v5-design-fidelity.js?v=20260820-admin-org-no-flash-5', function () {
          load('/js/stratex-admin-v7.js?v=20260825-admin-v7-1', function () {
            load('/js/stratex-admin-v7-polish.js?v=20260825-admin-v7-polish-2', function () {
              load('/js/stratex-contract-workflow-v2.js?v=20260825-admin-v7-1');
            });
          });
        });
      });

      load('/js/heap-analytics.js?v=20260825-admin-v7-polish-2');
    }());
  </script>
</body>
</html>
