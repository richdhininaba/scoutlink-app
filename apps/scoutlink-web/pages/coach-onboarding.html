<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Coach Setup | ScoutLink</title>
<link rel="icon" type="image/png" href="/scoutlink-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/coach-desk-field-v1.css?v=20260821-v6-literal-1">
</head>
<body class="coach-product coach-v6-wizard" data-coach-page="onboarding">
<div class="coach-desk"><div class="screen"><div class="shell" data-coach-shell data-active="Coach Setup" data-title="Coach Setup"><main class="cv" id="coachDeskPage"><div class="coach-page-loading">Loading coach setup…</div></main></div></div></div>
<div class="coach-field"><div class="scr rel"><main class="body" id="coachFieldPage"><div class="coach-page-loading">Loading coach setup…</div></main></div></div>
<script src="/js/main.js"></script>
<script src="/js/heap-analytics.js"></script>
<script src="/js/coach-design-v6.js?v=20260821-v6-literal-1"></script>
<script src="/js/coach-v2.js?v=20260821-v6-literal-1"></script>
<script>
'use strict';
(function(){
  var desk=document.getElementById('coachDeskPage'),field=document.getElementById('coachFieldPage');
  if(!desk||!field)return;
  var state={step:0,maxUnlocked:0,firstName:'',lastName:'',email:'',phone:'',country:'United Kingdom',role:'Head coach — youth',teamName:'',teamType:'Grassroots club',ageGroup:'U12',region:'',league:'',squadSize:'',teamCount:'1'};
  var names=['Your details','Your team','Your squad','Review'];
  var sizeMap={'Under 8 players':7,'8-15 players':12,'16-22 players':19,'23+ players':23};
  function api(m,p,b){return window.CoachV2&&window.CoachV2.api?window.CoachV2.api(m,p,b):window.api(m,p,b);}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function user(){return window.Auth&&window.Auth.user||{};}
  function splitName(v){var p=String(v||'').trim().split(/\s+/);return{first:p.shift()||'',last:p.join(' ')||''};}
  function fullName(){return[state.firstName,state.lastName].filter(Boolean).join(' ');}
  function concierge(){return Number(sizeMap[state.squadSize]||0)>=8;}
  function stepper(active){return'<div class="stepper">'+names.map(function(label,i){var x=i+1;return'<div class="sp-i '+(x<active?'dn':x===active?'on':'')+'"><b>'+(x<active?'✓':x)+'</b><span>'+esc(label)+'</span></div>'+(x<4?'<div class="ln '+(x<active?'dn':'')+'"></div>':'');}).join('')+'</div>';}
  function heading(title,copy){return stepper(state.step+1)+'<h1 style="font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:24px;margin:0 0 6px">'+esc(title)+'</h1><p class="mut" style="margin:0 0 20px">'+esc(copy)+'</p>';}
  function choice(label,current,key){return'<button class="opt-card '+(current===label?'on':'')+'" type="button" data-choice-key="'+esc(key)+'" data-choice-value="'+esc(label)+'"><span class="opt-dot"></span><span><b>'+esc(label)+'</b></span></button>';}
  function fieldText(label,id,value,optional,type){return'<div class="field"><label for="'+esc(id)+'">'+esc(label)+(optional?'<em>Optional</em>':'')+'</label><input class="in" id="'+esc(id)+'" type="'+esc(type||'text')+'" value="'+esc(value||'')+'"></div>';}
  function selectField(label,id,value,items,optional){return'<div class="field"><label for="'+esc(id)+'">'+esc(label)+(optional?'<em>Optional</em>':'')+'</label><select class="in" id="'+esc(id)+'">'+items.map(function(x){return'<option'+(x===value?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'</select></div>';}
  function footer(){return'<div class="flex" style="margin-top:20px;justify-content:flex-end">'+(state.step?'<button class="btn outline" id="obBack" type="button">← Back</button>':'')+'<button class="btn volt" id="obNext" type="button">'+(state.step===3?'Create my workspace':'Continue →')+'</button></div>';}
  function step1(){return heading('Your details','The contact details connected to your coaching role.')+'<div class="card"><div class="card-b"><div class="two">'+fieldText('Full name','obName',fullName(),false,'text')+fieldText('Email address','obEmail',state.email,false,'email')+'</div><div class="two">'+fieldText('Phone number','obPhone',state.phone,true,'tel')+selectField('Country','obCountry',state.country,['United Kingdom','Ireland','Other'],false)+'</div><div class="field"><label>Primary coaching role</label><div class="opt-grid">'+['Head coach — youth','Assistant coach — youth','Goalkeeper coach','Academy coach','Club lead','Other'].map(function(x){return choice(x,state.role,'role');}).join('')+'</div></div></div></div>'+footer();}
  function step2(){return heading('Your team','Where and who you coach — this sets up the workspace.')+'<div class="card"><div class="card-b">'+fieldText('Team or club name','obTeam',state.teamName,false,'text')+'<div class="field"><label>Team type</label><div class="opt-grid">'+['Grassroots club','School team','Non-professional academy','Community team','Other'].map(function(x){return choice(x,state.teamType,'teamType');}).join('')+'</div></div>'+selectField('Primary age group','obAge',state.ageGroup,['U7','U8','U9','U10','U11','U12','U13','U14','U15','U16'],false)+'<div class="two">'+fieldText('Region or county','obRegion',state.region,true,'text')+fieldText('League or competition','obLeague',state.league,true,'text')+'</div></div></div>'+footer();}
  function step3(){return heading('Your squad','Roughly how many players so we can size the setup right.')+'<div class="card"><div class="card-b"><div class="field"><label>Squad size</label><div class="opt-grid">'+['Under 8 players','8-15 players','16-22 players','23+ players'].map(function(x){return choice(x,state.squadSize,'squadSize');}).join('')+'</div></div><div class="field"><label>Number of teams you coach<em>Optional</em></label><div class="opt-grid">'+['1','2-3','4+'].map(function(x){return choice(x,state.teamCount,'teamCount');}).join('')+'</div></div>'+(concierge()?'<div class="callout a"><span>Squads of 8 or more players qualify for a concierge onboarding call — someone from Stratex can help you bulk-import the squad instead of adding players one at a time.</span></div>':'')+'</div></div>'+footer();}
  function reviewRow(label,value){return'<div class="list-row" style="cursor:default"><span class="who"><span>'+esc(label)+'</span></span><b>'+esc(value||'—')+'</b></div>';}
  function step4(){return heading('Review','Confirm everything before ScoutLink builds your workspace.')+'<div class="card"><div class="card-b">'+reviewRow('Coach',fullName())+reviewRow('Team',[state.teamName,state.ageGroup,state.region].filter(Boolean).join(' · '))+reviewRow('League',state.league||'—')+reviewRow('Squad size',state.squadSize||'—')+reviewRow('Concierge onboarding',concierge()?'Offered (squad size 8+)':'Not required')+'</div></div>'+footer();}
  function sync(){var el=document.getElementById('obName');if(el){var n=splitName(el.value);state.firstName=n.first;state.lastName=n.last;}el=document.getElementById('obEmail');if(el)state.email=el.value.trim();el=document.getElementById('obPhone');if(el)state.phone=el.value.trim();el=document.getElementById('obCountry');if(el)state.country=el.value;el=document.getElementById('obTeam');if(el)state.teamName=el.value.trim();el=document.getElementById('obAge');if(el)state.ageGroup=el.value;el=document.getElementById('obRegion');if(el)state.region=el.value.trim();el=document.getElementById('obLeague');if(el)state.league=el.value.trim();}
  function draft(){return{version:16,step:state.step,maxUnlocked:state.maxUnlocked,state:state,savedAt:new Date().toISOString()};}
  function saveDraft(){return api('POST','/api/onboarding/coach-draft',{draft:draft()});}
  function validation(){sync();if(state.step===0&&!fullName())return'Enter your full name.';if(state.step===1&&!state.teamName)return'Enter the team or club name.';if(state.step===2&&!state.squadSize)return'Choose the approximate squad size.';return'';}
  function payload(){sync();return{person:{firstName:state.firstName,lastName:state.lastName,roleAtClub:state.role,phone:state.phone,country:state.country},team:{teamName:state.teamName,teamType:state.teamType,league:state.league,ageGroups:[state.ageGroup],homeVenue:state.region,region:state.region},squadSize:sizeMap[state.squadSize]||null,squadMethod:concierge()?'bulk':'one',squadList:'',teamCount:state.teamCount,conciergeOffer:concierge()};}
  function createWorkspace(){var b=document.getElementById('obNext');if(b)b.disabled=true;api('POST','/api/onboarding/coach-wizard',payload()).then(function(){location.href='/coach/dashboard';}).catch(function(e){if(b)b.disabled=false;window.CoachV2.showToast(e&&e.message||'Could not create your workspace.',true);});}
  function render(){if(window.CoachV2){window.CoachV2.setTitle('Coach Setup','ScoutLink Wizard');window.CoachV2.setFieldHeader('Coach Setup');}var html=[step1,step2,step3,step4][state.step]();desk.innerHTML=html;field.innerHTML=html;bind();}
  function bind(){document.querySelectorAll('[data-choice-key]').forEach(function(b){b.onclick=function(){sync();state[b.dataset.choiceKey]=b.dataset.choiceValue;render();};});document.querySelectorAll('#obBack').forEach(function(b){b.onclick=function(){sync();state.step=Math.max(0,state.step-1);saveDraft().catch(function(){});render();};});document.querySelectorAll('#obNext').forEach(function(b){b.onclick=function(){var err=validation();if(err){window.CoachV2.showToast(err,true);return;}if(state.step===3){createWorkspace();return;}state.maxUnlocked=Math.max(state.maxUnlocked,state.step+1);state.step+=1;saveDraft().catch(function(){});render();};});}
  Promise.all([api('GET','/api/coaches/profile'),api('GET','/api/onboarding/me')]).then(function(rs){var c=rs[0].coach||rs[0]||{},progress=rs[1].data||rs[1]||{},d=progress.wizard_data&&progress.wizard_data.draft;if(progress.setup_wizard_completed){location.replace('/coach/dashboard');return;}state.firstName=c.first_name||'';state.lastName=c.last_name||'';state.email=c.email||user().email||'';state.phone=c.phone||'';state.role=c.role_at_club||state.role;state.teamName=c.team_name||'';state.league=c.team_league||'';state.region=c.team_home_venue||c.team_county||'';if(Array.isArray(c.team_age_groups)&&c.team_age_groups[0])state.ageGroup=c.team_age_groups[0];if(d&&d.state){state=Object.assign(state,d.state);state.step=Math.max(0,Math.min(3,Number(d.step)||0));state.maxUnlocked=Math.max(state.step,Number(d.maxUnlocked)||0);}render();}).catch(function(e){desk.innerHTML=field.innerHTML='<div class="empty"><b>Setup unavailable</b><p>'+esc(e&&e.message||'Could not load setup.')+'</p></div>';});
}());
</script>
</body>
</html>
