<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Coach setup | ScoutLink</title>
<link rel="icon" type="image/png" href="/scoutlink-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1712;--ink2:#4A554E;--ink3:#7E8983;--ink4:#A7B0AA;--line:#E3E7E4;--line2:#CDD4CF;--paper:#fff;--canvas:#F6F8F7;--canvas2:#EFF2F0;--blue:#1B5AC4;--blue-d:#154AA3;--blue-t:#EAF0FB;--green:#3F8F33;--green-t:#E9F3E6;--amber:#B07316;--amber-t:#FBF2E2;--red:#B0362C;--red-t:#F9EAE8;--slate:#33414B;--ui:'Inter',sans-serif;--lockup:url('/scoutlink_logo.png?v=20260812-1');--mark:url('/scoutlink-favicon.png')}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:var(--ui);font-size:12.5px;line-height:1.5;-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid rgba(27,90,196,.22);outline-offset:2px}.top{height:62px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:20}.logo{width:150px;height:34px;background:var(--lockup) no-repeat left center/contain}.sp{flex:1}.mut{color:var(--ink3)}.btn{min-height:29px;padding:5px 12px;border:1px solid var(--line2);border-radius:3px;background:var(--paper);font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.q{background:transparent;border-color:transparent;color:var(--blue)}.btn.sm{min-height:24px;padding:4px 9px;font-size:11px}.main{max-width:880px;margin:0 auto;padding:34px 0 44px}.steps{display:flex;background:var(--paper);border:1px solid var(--line);margin-bottom:22px}.st{flex:1;display:flex;align-items:center;gap:10px;padding:13px 16px;border-right:1px solid var(--line);color:var(--ink3);font-weight:600}.st:last-child{border-right:0}.st i{width:20px;height:20px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px}.st.on{background:var(--blue-t);color:var(--blue-d)}.st.on i{background:var(--blue);border-color:var(--blue);color:#fff}.st.dn{color:var(--ink2)}.st.dn i{background:var(--green);border-color:var(--green);color:#fff}.card{background:var(--paper);border:1px solid var(--line)}.card-b{padding:26px}.foot{display:flex;align-items:center;gap:8px;padding:14px 16px;border-top:1px solid var(--line);background:var(--canvas)}h1{margin:0 0 6px;font-size:23px;line-height:1.2;letter-spacing:-.02em}h3{margin:0;font-size:14px}.intro{font-size:13px;margin-bottom:22px}.g{display:grid;gap:14px}.g.two{grid-template-columns:1fr 1fr}.g.three{grid-template-columns:repeat(3,1fr)}.fld{margin-bottom:14px}.fl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-weight:700;display:block;margin-bottom:6px}.inp{width:100%;min-height:34px;border:1px solid var(--line2);border-radius:3px;background:var(--paper);padding:8px 10px}.inp[readonly]{background:var(--canvas);color:var(--ink2)}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{min-height:28px;padding:4px 11px;border:1px solid var(--line2);border-radius:3px;background:var(--paper);color:var(--ink2);font-size:11.5px}.chip.on{border-color:var(--blue);background:var(--blue-t);color:var(--blue-d);font-weight:600}.tag{display:inline-flex;align-items:center;gap:5px;min-height:19px;padding:2px 7px;border-radius:2px;background:var(--canvas2);font-size:10.5px;font-weight:600}.tag.b{background:var(--blue-t);color:var(--blue-d)}.tag.g{background:var(--green-t);color:var(--green)}.tag i{width:5px;height:5px;border-radius:50%;background:currentColor}.choice{padding:18px;text-align:left}.choice.on{border-color:var(--blue);background:var(--blue-t)}.choice b{display:block;font-size:14px}.choice .mut{font-size:11.5px;margin:6px 0 12px}.row{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);margin-bottom:8px}.row.primary{border-color:var(--blue);background:var(--blue-t)}.icn{width:28px;height:28px;display:grid;place-items:center;background:var(--canvas2);color:var(--ink2);font-weight:700}.icn.b{background:var(--blue-t);color:var(--blue)}.row .rt{display:block;font-size:12.5px}.row .rs{display:block;text-decoration:none;font-size:11.5px;color:var(--ink3);margin-top:2px}.help{font-size:11px;color:var(--ink3);margin-top:6px}.msg{display:none;padding:11px 14px;margin-bottom:14px;border:1px solid #E4C5C1;border-left:3px solid var(--red);background:var(--red-t);color:var(--red)}.msg.show{display:block}.mobile-progress{display:none}
@media(max-width:760px){.top{height:50px;padding:0 14px}.logo{width:26px;height:26px;background-image:var(--mark);background-position:center}.top .step-label{display:none}.main{max-width:none;margin:0;padding:14px}.steps{display:none}.mobile-progress{display:block}.bars{display:flex;gap:4px;margin-bottom:8px}.bars i{display:block;height:3px;flex:1;background:var(--canvas2)}.bars i.on{background:var(--blue)}.mobile-step{display:flex;align-items:baseline;margin-bottom:14px}.mobile-step b{font-size:13px}.mobile-step span{margin-left:auto;font-size:11px;color:var(--ink3)}.card-b{padding:14px}h1{font-size:20px}.intro{font-size:12px;margin-bottom:16px}.g.two,.g.three{grid-template-columns:1fr}.choice{padding:14px}.choice.on[data-method="bulk"]{border-color:var(--line);background:var(--paper)}.choice[data-method="one"]{border-color:var(--blue);background:var(--blue-t)}.foot{padding:12px 0 0;border-top:0;background:transparent}.foot .mut{display:none}.foot .sp{display:none}.foot .btn{flex:1;min-height:40px}.fld .inp{min-height:42px}.row{padding:14px}.top .btn.q{margin-left:auto}.desktop-copy{display:none}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="/coach/dashboard" aria-label="ScoutLink"></a><div class="sp"></div><span class="mut step-label" id="topStep">Step 1 of 4</span><button class="btn q" id="finishLater" type="button">Save and finish later</button></header>
<main class="main">
  <nav class="steps" id="steps" aria-label="Coach setup progress"></nav>
  <div class="mobile-progress"><div class="bars" id="bars"></div><div class="mobile-step"><b id="mobileStage">You</b><span id="mobileStep">Step 1 of 4</span></div></div>
  <section class="card">
    <div class="card-b">
      <div class="msg" id="error" role="alert"></div>
      <div id="content"></div>
    </div>
    <div class="foot"><span class="mut" id="footStep">Step 1 of 4</span><div class="sp"></div><button class="btn" id="back" type="button" hidden>Back</button><button class="btn p" id="next" type="button">Continue</button></div>
  </section>
</main>
<script src="/js/main.js"></script>
<script>
'use strict';
(function(){
  var state={step:0,maxUnlocked:0,coachFirst:'',coachLast:'',coachEmail:'',roleAtClub:'Head Coach',phone:'',teamName:'',league:'',ageGroups:[],homeVenue:'',squadSize:'',squadMethod:'',playerCount:0};
  var names=['You','The team','Squad list','First player'];
  function api(m,p,b){return window.api(m,p,b)}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function user(){return window.Auth&&window.Auth.user||{}}
  function showError(t){var e=document.getElementById('error');e.textContent=t||'';e.classList.toggle('show',!!t)}
  function draft(){return{version:14,step:state.step,maxUnlocked:state.maxUnlocked,state:state,savedAt:new Date().toISOString()}}
  function saveDraft(){return api('POST','/api/onboarding/coach-draft',{draft:draft()}).then(function(){return true})}
  function chip(label,on,attrs){return'<button class="chip '+(on?'on':'')+'" type="button" '+attrs+'>'+esc(label)+'</button>'}
  function input(label,id,value,type,extra){return'<div class="fld"><label class="fl" for="'+id+'">'+esc(label)+'</label><input class="inp" id="'+id+'" '+(type?'type="'+type+'" ':'')+(extra||'')+' value="'+esc(value||'')+'"></div>'}
  function step1(){return'<h1>Let\'s set up your coach account</h1><div class="mut intro">Four short steps. You can add players later — this takes about three minutes.</div><div class="g two">'+input('First name','coachFirst',state.coachFirst)+input('Last name','coachLast',state.coachLast)+'</div><div class="fld"><span class="fl">Email</span><div class="inp">'+esc(state.coachEmail)+' <span class="tag g" style="margin-left:auto"><i></i>Verified</span></div></div><div class="fld"><span class="fl">Role at the club</span><div class="chips">'+['Head Coach','Assistant Coach','Manager','Club official'].map(function(x){return chip(x,state.roleAtClub===x,'data-role="'+x+'"')}).join('')+'</div></div>'+input('Mobile — optional','phone',state.phone,'tel','placeholder="Urgent safeguarding contact only"')}
  function step2(){return'<h1>Tell us about the team</h1><div class="mut intro">This appears on every player profile a scout can see.</div><div class="g two">'+input('Team name','teamName',state.teamName)+input('League','league',state.league)+'</div><div class="fld"><span class="fl">Age groups you coach</span><div class="chips">'+['U7','U8','U9','U10','U11','U12','U13','U14','U15','U16'].map(function(x){return chip(x,state.ageGroups.indexOf(x)>=0,'data-age="'+x+'"')}).join('')+'</div></div>'+input('Home venue or town','homeVenue',state.homeVenue,'text','placeholder="Powerleague Barnet, N20"')+'<div class="help">Scouts search by area, so this is how local scouts find your squad.</div>'}
  function methodCopy(method){if(method==='bulk')return innerWidth<=760?'Best for 10 or more players, on a computer. We can take you to the desktop import flow.':'Best for 10 or more players. Download the template, fill it in, review each row. Around fifteen minutes for a full squad.';if(method==='one')return innerWidth<=760?'Works well on a phone. About two minutes each, and you can stop whenever you like.':'Best for a handful of players, or when you want to assess carefully as you go.';return'Go straight to your dashboard. You can add players any time, and your fixtures still work.'}
  function step3(){var rec=innerWidth<=760?'one':(Number(state.squadSize||state.playerCount||0)>=10?'bulk':'one');if(!state.squadMethod)state.squadMethod=rec;var order=innerWidth<=760?['one','bulk','later']:['bulk','one','later'];var titles={bulk:'Bulk import a spreadsheet',one:'Add players one at a time',later:'Do this later'};return'<h1>How do you want to add your squad?</h1><div class="mut intro">You do not have to do this now, and you never have to complete every profile before ScoutLink is useful.</div><div class="g '+(innerWidth>760?'three':'')+'">'+order.map(function(m){return'<button type="button" class="card choice '+(state.squadMethod===m?'on':'')+'" data-method="'+m+'"><b>'+titles[m]+'</b><div class="mut">'+methodCopy(m)+'</div>'+(m===rec?'<span class="tag b">'+(innerWidth<=760?'Recommended on phone':'Recommended for your squad')+'</span>':'')+'</button>'}).join('')+'</div>'}
  function step4(){var count=state.playerCount||0;var first=count?'Complete your highest-priority assessment':'Add your first player';var firstSub=count?'Finish any Not observed attributes before scout review':'Create one real player profile with the position-aware assessment';var firstHref=count?'/coach/my-players':'/coach/add-player';return'<h1>You\'re set up'+(count?'. One useful thing first?':'')+'</h1><div class="mut intro">'+(count?count+' players are already in '+esc(state.teamName||'your squad')+'. Here is the fastest way to make the squad useful to scouts.':'Your workspace is ready. Start with the action that gives ScoutLink useful evidence fastest.')+'</div><div class="row primary"><div class="icn b">1</div><div class="sp"><b class="rt">'+first+'</b><s class="rs">'+firstSub+'</s></div><button class="btn sm p" type="button" data-finish-href="'+firstHref+'">Open</button></div><div class="row"><div class="icn">2</div><div class="sp"><b class="rt">Add your first fixture</b><s class="rs">Fixtures are how scouts arrange to watch your players</s></div><button class="btn sm" type="button" data-finish-href="/coach/fixtures?action=add">Add</button></div><div class="row"><div class="icn">3</div><div class="sp"><b class="rt">Generate video upload links</b><s class="rs">Players need approved video before scouts can see video evidence</s></div><button class="btn sm" type="button" data-finish-href="/coach/video-reels">Generate</button></div>'}
  function syncFields(){[['coachFirst','coachFirst'],['coachLast','coachLast'],['phone','phone'],['teamName','teamName'],['league','league'],['homeVenue','homeVenue']].forEach(function(x){var el=document.getElementById(x[0]);if(el)state[x[1]]=el.value.trim()})}
  function render(){showError('');document.getElementById('topStep').textContent='Step '+(state.step+1)+' of 4';document.getElementById('footStep').textContent='Step '+(state.step+1)+' of 4';document.getElementById('mobileStep').textContent='Step '+(state.step+1)+' of 4';document.getElementById('mobileStage').textContent=names[state.step];document.getElementById('steps').innerHTML=names.map(function(n,i){return'<div class="st '+(i<state.step?'dn':i===state.step?'on':'')+'"><i>'+(i<state.step?'✓':i+1)+'</i><b>'+n+'</b></div>'}).join('');document.getElementById('bars').innerHTML=names.map(function(_,i){return'<i class="'+(i<=state.step?'on':'')+'"></i>'}).join('');document.getElementById('content').innerHTML=[step1,step2,step3,step4][state.step]();var back=document.getElementById('back'),next=document.getElementById('next');back.hidden=state.step===0;next.hidden=state.step===3;next.textContent=state.step===2?(state.squadMethod==='bulk'&&innerWidth>760?'Continue with bulk import':state.squadMethod==='one'&&innerWidth<=760?'Add first player':'Continue'):'Continue';bind()}
  function bind(){document.querySelectorAll('[data-role]').forEach(function(b){b.onclick=function(){syncFields();state.roleAtClub=b.dataset.role;render()}});document.querySelectorAll('[data-age]').forEach(function(b){b.onclick=function(){syncFields();var x=b.dataset.age,i=state.ageGroups.indexOf(x);if(i>=0)state.ageGroups.splice(i,1);else state.ageGroups.push(x);render()}});document.querySelectorAll('[data-method]').forEach(function(b){b.onclick=function(){syncFields();state.squadMethod=b.dataset.method;render()}});document.querySelectorAll('[data-finish-href]').forEach(function(b){b.onclick=function(){finish(b.dataset.finishHref)}})}
  function validate(){syncFields();if(state.step===0&&(!state.coachFirst||!state.coachLast))return'Enter your first and last name.';if(state.step===1&&(!state.teamName||!state.ageGroups.length))return'Enter the team name and choose at least one age group.';if(state.step===2&&!state.squadMethod)return'Choose how you want to add the squad.';return''}
  function next(){var err=validate();if(err){showError(err);return}state.maxUnlocked=Math.max(state.maxUnlocked,state.step+1);state.step++;saveDraft().catch(function(){});render()}
  function payload(){syncFields();return{person:{firstName:state.coachFirst,lastName:state.coachLast,roleAtClub:state.roleAtClub,phone:state.phone},team:{teamName:state.teamName,league:state.league,ageGroups:state.ageGroups,homeVenue:state.homeVenue},squadSize:Number(state.squadSize||state.playerCount||0)||null,squadMethod:state.squadMethod,squadList:''}}
  function finish(href){var b=document.querySelector('[data-finish-href="'+href+'"]');if(b)b.disabled=true;api('POST','/api/onboarding/coach-wizard',payload()).then(function(){location.href=href||'/coach/dashboard'}).catch(function(e){showError(e.message);if(b)b.disabled=false})}
  document.getElementById('next').onclick=next;document.getElementById('back').onclick=function(){syncFields();state.step=Math.max(0,state.step-1);render()};document.getElementById('finishLater').onclick=function(){syncFields();saveDraft().then(function(){location.href='/experience-select'}).catch(function(e){showError(e.message)})};
  Promise.all([api('GET','/api/coaches/profile'),api('GET','/api/onboarding/me'),api('GET','/api/coaches/my-players').catch(function(){return{data:[]}})]).then(function(rs){var c=rs[0].coach||rs[0]||{},progress=rs[1].data||rs[1]||{},d=progress.wizard_data&&progress.wizard_data.draft,players=rs[2].data||rs[2].players||[];if(progress.setup_wizard_completed){location.replace('/coach/dashboard');return}state.coachFirst=c.first_name||'';state.coachLast=c.last_name||'';state.coachEmail=c.email||user().email||'';state.roleAtClub=c.role_at_club||'Head Coach';state.phone=c.phone||'';state.teamName=c.team_name||'';state.league=c.team_league||'';state.ageGroups=c.team_age_groups||[];state.homeVenue=c.team_home_venue||c.team_county||'';state.playerCount=players.length;if(d&&d.state){state=Object.assign(state,d.state);state.step=Math.max(0,Math.min(3,Number(d.step)||0));state.maxUnlocked=Math.max(state.step,Number(d.maxUnlocked)||0)}render()}).catch(function(e){showError(e.message);render()});
}());
</script>
<script src="/js/heap-analytics.js"></script>
</body>
</html>
