<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" href="/scoutlink-favicon.png">
<link rel="apple-touch-icon" href="/scoutlink-favicon.png">
<title>Report a Concern - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.concern-shell{max-width:820px}
.concern-card{padding:24px}
.concern-copy{color:#64748b;font-size:14px;line-height:1.65;margin:0 0 20px}
.concern-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.concern-card label{display:grid;gap:7px;color:#64748b;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.concern-card textarea{min-height:150px}
.concern-message{display:none;margin-bottom:14px;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:800}
.concern-message.show{display:block}
.concern-message.ok{background:#ecfdf5;color:#047857;border:1px solid rgba(15,159,117,.35)}
.concern-message.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
@media(max-width:720px){.concern-grid{grid-template-columns:1fr}.concern-card{padding:18px}}
</style>
<link rel="stylesheet" href="../css/coach-v2.css">
</head>
<body>
<div class="dashboard">
<nav class="sidebar" id="sidebar">
<div class="sidebar-logo"><a href="../index.html" style="font-size:20px;font-weight:900;color:#fff;text-decoration:none">Scout<span style="color:#1d9e75">Link</span></a></div>
<div class="sidebar-nav" id="sidebarNav"></div>
<div class="sidebar-user" id="sidebarUser"></div>
</nav>
<div class="dashboard-main">
<div class="topbar">
<span class="topbar-title">Report a concern</span>
<div class="topbar-right">
<button class="notif-btn" id="notifToggleBtn" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;vertical-align:middle"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
<button class="btn btn-sm btn-ghost" id="logoutBtn">Sign out</button>
</div>
</div>
<div class="page-content">
<div class="concern-shell">
<section class="table-card concern-card">
<div class="table-header" style="margin:-24px -24px 20px;padding:18px 24px">
<div><h3>Submit a concern</h3><p style="margin-top:4px;color:#64748b;font-size:13px">Safeguarding, privacy, conduct or platform safety issues.</p></div>
</div>
<p class="concern-copy">If someone may be at immediate risk, contact emergency services first. This form is reviewed by restricted Stratex safeguarding/admin users.</p>
<div class="concern-message ok" id="ok"></div>
<div class="concern-message err" id="err"></div>
<form id="concernForm" class="form-grid" novalidate>
<div class="concern-grid">
<label>Concern type
<select name="concernType" required>
<option value="">Select type</option>
<option>Safeguarding concern</option>
<option>Data misuse</option>
<option>False identity</option>
<option>Inappropriate contact</option>
<option>Platform safety</option>
<option>Other</option>
</select>
</label>
<label>Urgency
<select name="urgency" required>
<option>Standard</option>
<option>Urgent</option>
</select>
</label>
</div>
<label>Person or account involved <input name="personOrAccount" placeholder="Name, email or account if known"></label>
<label>Player/team if relevant <input name="playerOrTeam" placeholder="Player, team, club or school if relevant"></label>
<label>Description <textarea name="description" required placeholder="Describe what happened, when it happened and why you are concerned."></textarea></label>
<div class="concern-grid">
<label>Your name <input name="contactName" autocomplete="name"></label>
<label>Your email <input name="contactEmail" type="email" autocomplete="email" required></label>
</div>
<label>Phone number <input name="contactPhone" autocomplete="tel"></label>
<button class="btn btn-primary" id="submitBtn" type="submit">Submit concern</button>
</form>
</section>
</div>
</div>
</div>
</div>
<script src="../js/scout-nav.js"></script>
<script src="../js/main.js"></script>
<script src="../js/coach-v2.js"></script>
<script>
const API = localStorage.getItem('sl_api_url') || 'https://scoutlink-api.vercel.app';
function show(id,msg){var el=document.getElementById(id);el.textContent=msg;el.classList.add('show');}
function clearMsgs(){['ok','err'].forEach(function(id){document.getElementById(id).classList.remove('show');});}
document.getElementById('concernForm').addEventListener('submit',function(e){
  e.preventDefault();clearMsgs();
  var fd=new FormData(e.target), body={sourcePage:'/coach/report-a-concern'}; fd.forEach(function(v,k){body[k]=v;});
  if(!body.concernType||!body.description||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.contactEmail||'')){show('err','Please complete concern type, description and a valid email.');return;}
  var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Submitting...';
  fetch(API+'/api/trust/safeguarding-concerns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Could not submit concern');return d;});})
    .then(function(d){show('ok',d.message||'Concern submitted.');e.target.reset();})
    .catch(function(err){show('err',err.message||'Could not submit concern.');})
    .finally(function(){btn.disabled=false;btn.textContent='Submit concern';});
});
</script>
</body>
</html>
