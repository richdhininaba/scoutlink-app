<!doctype html>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1712;--ink2:#4A554E;--ink3:#7E8983;--ink4:#A7B0AA;--line:#E3E7E4;--line2:#CDD4CF;--paper:#fff;--canvas:#F6F8F7;--canvas2:#EFF2F0;--blue:#1B5AC4;--blue-d:#154AA3;--blue-t:#EAF0FB;--green:#3F8F33;--green-t:#E9F3E6;--amber:#B07316;--amber-t:#FBF2E2;--red:#B0362C;--red-t:#F9EAE8;--slate:#33414B;--ui:'Inter',sans-serif;--lockup:url('/scoutlink_logo.png?v=20260812-1');--mark:url('/scoutlink-favicon.png')}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:var(--ui);font-size:12.5px;line-height:1.5;-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}button{cursor:pointer}.top{height:62px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px}.logo{width:150px;height:34px;background:var(--lockup) no-repeat left center/contain}.sp{flex:1}.av{width:28px;height:28px;border-radius:50%;background:var(--slate);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}.btn{min-height:29px;padding:5px 12px;border:1px solid var(--line2);border-radius:3px;background:var(--paper);font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.q{border-color:transparent;background:transparent;color:var(--blue)}.main{max-width:760px;margin:0 auto;padding:56px 0 60px;text-align:center}.main h1{margin:0 0 8px;font-size:26px;letter-spacing:-.02em}.mut{color:var(--ink3)}.intro{font-size:13px;margin-bottom:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}.card{border:1px solid var(--line);background:var(--paper);padding:22px;min-width:0}.experience-choice{cursor:pointer}.experience-choice.coach{border-color:var(--blue)}.experience-choice[aria-disabled="true"]{opacity:.65;pointer-events:none}.title{font-size:16px;font-weight:700}.desc{font-size:12px;margin:6px 0 14px;color:var(--ink3)}.tags{display:flex;gap:8px;flex-wrap:wrap;min-height:21px}.tag{display:inline-flex;align-items:center;gap:5px;min-height:19px;padding:2px 7px;border-radius:2px;background:var(--canvas2);color:var(--ink2);font-size:10.5px;font-weight:600}.tag.a{background:var(--amber-t);color:var(--amber)}.tag.b{background:var(--blue-t);color:var(--blue-d)}.tag.g{background:var(--green-t);color:var(--green)}.tag i{width:5px;height:5px;border-radius:50%;background:currentColor}.action{margin-top:16px}.action .btn{pointer-events:none}.experience-choice select{width:100%;margin-top:10px;height:30px;border:1px solid var(--line2);border-radius:3px;background:var(--paper);padding:0 8px}.note{font-size:11.5px;margin-top:22px;color:var(--ink3)}.error{display:none;margin:0 auto 18px;max-width:620px;border:1px solid #E4C5C1;border-left:3px solid var(--red);background:var(--red-t);color:var(--red);padding:11px 14px;text-align:left}.error.show{display:block}.loading{height:2px;background:var(--line);overflow:hidden;margin:0 auto 18px;max-width:180px}.loading i{display:block;width:50%;height:100%;background:var(--blue);animation:load 1s infinite alternate}.loading[hidden]{display:none}@keyframes load{to{transform:translateX(100%)}}
@media(max-width:760px){.top{height:50px;padding:0 14px}.logo{width:26px;height:26px;background-image:var(--mark);background-position:center}.main{max-width:none;padding:20px 14px 30px}.main h1{font-size:19px}.intro{font-size:11.5px;margin-bottom:18px}.grid{grid-template-columns:1fr;gap:10px}.card{padding:16px}.title{font-size:15px}.desc{font-size:11.5px;margin:4px 0 10px}.action{margin-top:12px}.action .btn{width:100%}.note{font-size:10.5px;padding:0 8px}.top .btn.q{font-size:11px}}
</style>
</head>
<body>
<header class="top"><div class="logo" aria-label="ScoutLink"></div><div class="sp"></div><button class="btn q" id="experienceSignOut" type="button">Sign out</button><div class="av" id="experienceAvatar" aria-hidden="true">SL</div></header>
<main class="main" id="experienceRoot" aria-live="polite">
  <h1 class="door-h">Choose a workspace</h1>
  <div class="mut intro" id="experienceIntro">You have access to more than one ScoutLink experience.</div>
  <div class="loading" id="experienceLoading"><i></i></div>
  <div class="error" id="experienceError" role="alert"></div>
  <div class="grid" id="experienceList"></div>
  <div class="note">Coach opens at the dashboard, or at onboarding if setup is incomplete.</div>
</main>
<script src="/js/experience-selector-v5.js?v=6.0.0"></script>
<script src="/js/heap-analytics.js"></script>
</body>
</html>
