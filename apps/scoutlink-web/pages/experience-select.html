<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/scoutlink-favicon.png">
<link rel="apple-touch-icon" href="/scoutlink-favicon.png">
<title>Choose a Workspace | ScoutLink</title>
<meta name="description" content="Choose an approved ScoutLink or Stratex workspace.">
<meta name="theme-color" content="#06201A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/scoutlink-public-v5.css?v=5.0.0">
</head>
<body>
<a class="slv5-skip" href="#experienceRoot">Skip to workspaces</a>
<div class="site door experience-door">
  <header class="door-top">
    <a class="sl-mark" href="/experience-select">ScoutLink<small>by Stratex Analytics</small></a>
    <button class="sl-btn ghostw sm" id="experienceSignOut" type="button">Sign out</button>
  </header>
  <main class="door-mid">
    <section class="door-panel wide" id="experienceRoot" aria-live="polite">
      <span class="sl-eb">Workspaces</span>
      <h1 class="door-h">Checking your access.</h1>
      <p class="door-sub" id="experienceIntro">Loading approved workspaces for this account.</p>
      <div class="loadbar" id="experienceLoading" aria-hidden="true"><i></i></div>
      <div class="sl-message err" id="experienceError" role="alert"></div>
      <div class="experience-list" id="experienceList"></div>
    </section>
  </main>
  <footer class="door-foot">
    <span>ScoutLink · A Stratex Analytics product</span>
    <div><a href="https://www.stratexanalytics.co.uk/contact">Help</a><a href="https://www.stratexanalytics.co.uk/privacy-policy">Privacy</a></div>
  </footer>
</div>
<script src="/js/experience-selector-v5.js?v=5.0.0"></script>
<script src="/js/heap-analytics.js"></script>
</body>
</html>
