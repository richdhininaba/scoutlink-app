<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="0;url=/coach/settings">
<title>Settings | ScoutLink</title>
<link rel="icon" type="image/png" href="/scoutlink-favicon.png">
<style>
:root{--ink:#0F1712;--ink3:#7E8983;--line:#E3E7E4;--paper:#fff;--canvas:#F6F8F7;--blue:#1B5AC4}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,Arial,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
section{width:min(480px,100%);background:var(--paper);border:1px solid var(--line);padding:22px}
h1{margin:0 0 7px;font-size:18px}p{margin:0;color:var(--ink3);font-size:13px;line-height:1.55}
a{display:inline-block;margin-top:14px;color:var(--blue);font-size:13px;font-weight:600}
</style>
<script>
(function(){
  var target=typeof window.cleanRouteFor==='function'?window.cleanRouteFor('/coach/settings'):'/coach/settings';
  window.location.replace(target);
})();
</script>
</head>
<body>
<main>
  <section>
    <h1>Opening Coach Settings…</h1>
    <p>Coach workspaces do not use allowance or usage-limit controls.</p>
    <a href="/coach/settings">Continue to Settings</a>
  </section>
</main>
</body>
</html>
