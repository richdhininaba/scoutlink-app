<div class="table-header">
<h3>Add Upcoming Fixture</h3>
<button class="btn btn-sm btn-ghost" id="toggleAddBtn">&#8722; Collapse</button>
</div>
<div id="addForm" style="padding:20px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Opponent *</label><input id="fOpponent" class="form-input" placeholder="e.g. Arsenal FC Academy" type="text"></div>
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Date *</label><input id="fDate" type="date" class="form-input"></div>
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Time</label><input id="fTime" type="time" class="form-input"></div>
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Venue name</label><input id="fVenue" placeholder="e.g. Riverside Park" type="text" class="form-input"></div>
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Venue address</label><input id="fVenueAddress" placeholder="Start typing full address..." type="text" class="form-input" autocomplete="street-address"></div>
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Postcode</label><input id="fVenuePostcode" placeholder="e.g. SW1A 1AA" type="text" class="form-input" autocomplete="postal-code"></div>
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Country</label><select id="fCountry" class="form-input"></select></div>
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">City</label><input id="fCity" placeholder="Select city" type="text" class="form-input" autocomplete="address-level2"><datalist id="fixtureCityOptions"></datalist></div>
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Home / Away</label><select id="fHomeAway" class="form-input"><option value="Home">Home</option><option value="Away">Away</option><option value="Neutral">Neutral</option></select></div>
<div><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Format</label><select id="fFormat" class="form-input"><option value="5">5-a-side</option><option value="7">7-a-side</option><option value="9">9-a-side</option><option value="11" selected>11-a-side</option></select></div>
</div>
<div style="margin-bottom:16px"><label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Notes (optional)</label><textarea id="fNotes" placeholder="Any additional notes..." class="form-input" style="min-height:60px;resize:vertical"></textarea></div>

<script>
function initNav(){
  if(!Auth.isLoggedIn()||Auth.type!=='Coach'){navigateClean('login.html');return;}
  if(typeof buildScoutNav==='function') buildScoutNav('sidebarNav','Coach');
  var u=Auth.user,uel=document.getElementById('sidebarUser');
  if(uel&&u) uel.innerHTML='<div class="user-info"><div class="user-avatar" style="background:#1d9e75;color:#000">'+initials(u.firstName,u.lastName)+'</div><div><div class="user-name">'+(u.firstName||'')+' '+(u.lastName||'')+'</div><div class="user-role">Coach</div></div></div>';
  updateNotifBadge();
}
function logout(){Auth.clear();navigateClean('login.html?logout=1');}
function toggleNotifPanel(){}

var _fixtureIds = [];

function formatDate(d){
  if(!d)return '--';
  try{var dt=new Date(d);return dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
  catch(e){return d;}
}

function renderFixtures(fixtures, containerId, emptyMsg){
  var el=document.getElementById(containerId);
  if(!fixtures.length){el.innerHTML='<div style="padding:32px;text-align:center;color:#8b949e">'+emptyMsg+'</div>';return;}
  var html='<div style="padding:16px">';
  fixtures.forEach(function(fx, idx){
    var haClass=fx.home_or_away==='Away'?'ha-away':'ha-home';
    html+='<div class="fixture-card">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">'+
      '<div>'+
      '<div style="font-size:16px;font-weight:700;margin-bottom:4px">'+fx.opponent+
      ' <span class="ha-badge '+haClass+'">'+fx.home_or_away+'</span>'+
      (fx.format?' <span style="font-size:11px;padding:2px 8px;background:rgba(0,188,212,.1);color:#00BCD4;border-radius:4px;margin-left:4px">'+fx.format+'-a-side</span>':'')+'</div>'+
      '<div style="font-size:13px;color:#8b949e">'+formatDate(fx.fixture_date)+(fx.fixture_time?' at '+fx.fixture_time:'')+(fx.venue?' &bull; '+fx.venue:'')+'</div>'+
      (fx.notes?'<div style="font-size:12px;color:#8b949e;margin-top:4px">'+fx.notes+'</div>':'')+
      '</div>'+
      '<div style="display:flex;gap:8px">'+
      '<button class="btn btn-sm btn-danger" data-fxid="'+fx.id+'" data-action="delete" style="min-height:36px">Delete</button>'+
      '</div></div></div>';
  });
  html+='</div>';
  el.innerHTML=html;

  document.getElementById(containerId).addEventListener('click',function(e){
    var btn=e.target.closest('[data-action="delete"]');
    if(btn){
      var id=btn.getAttribute('data-fxid');
      if(confirm('Delete this fixture?')){
        api('DELETE','/api/fixtures/'+id,{}).then(function(){loadFixtures();}).catch(function(e){alert('Error: '+e.message);});
      }
    }
  });
}

function addFixture(){
  var opp=document.getElementById('fOpponent').value.trim();
  var date=document.getElementById('fDate').value;
  if(!opp||!date){alert('Opponent and date are required');return;}
  var msg=document.getElementById('fixMsg');
  msg.textContent='Saving...';msg.style.color='#8b949e';
  api('POST','/api/fixtures',{
    opponent:opp,
    fixtureDate:date,
    fixtureTime:document.getElementById('fTime').value||null,
    venue:document.getElementById('fVenue').value.trim()||null,
    venueAddress:document.getElementById('fVenueAddress').value.trim()||null,
    venuePostcode:document.getElementById('fVenuePostcode').value.trim()||null,
    city:canonicalChoice(document.getElementById('fCity').value,SL_COUNTRY_CITIES[document.getElementById('fCountry').value]||[])||null,
    country:document.getElementById('fCountry').value||'England',
    homeOrAway:document.getElementById('fHomeAway').value,
    format:document.getElementById('fFormat').value,
    notes:document.getElementById('fNotes').value.trim()||null,
  }).then(function(){
    msg.textContent='Fixture saved!';msg.style.color='#1d9e75';
    document.getElementById('fOpponent').value='';document.getElementById('fVenue').value='';document.getElementById('fVenueAddress').value='';document.getElementById('fVenuePostcode').value='';document.getElementById('fCity').value='';document.getElementById('fNotes').value='';
    setTimeout(function(){msg.textContent='';},3000);
    loadFixtures();
  }).catch(function(e){
    msg.textContent='Error: '+e.message;msg.style.color='#f44336';
  });
}

function loadFixtures(){
  api('GET','/api/fixtures?upcoming=true').then(function(up){
    renderFixtures(up.data||[],'upcomingList','No upcoming fixtures. Add one above.');
  }).catch(function(){document.getElementById('upcomingList').innerHTML='<div style="padding:16px;color:#8b949e">Could not load fixtures.</div>';});
  api('GET','/api/fixtures?past=true').then(function(past){
    renderFixtures(past.data||[],'pastList','No past fixtures recorded.');
  }).catch(function(){document.getElementById('pastList').innerHTML='<div style="padding:16px;color:#8b949e">Could not load past fixtures.</div>';});
}

document.addEventListener('DOMContentLoaded',function(){
  initNav();
  fillCountrySelect('fCountry','England');
  attachCityAutocomplete('fCity','fixtureCityOptions','fCountry');
  document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
  loadFixtures();
  document.getElementById('saveFixtureBtn').addEventListener('click',addFixture);
  document.getElementById('toggleAddBtn').addEventListener('click',function(){
    var f=document.getElementById('addForm');
    f.style.display=f.style.display==='none'?'block':'none';
  });
});
</script>
<script src="../js/coach-fixtures-v3.js"></script>
</body></html>
