<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Player Profile | ScoutLink</title>
  <meta name="description" content="ScoutLink player profile for authorised Coach, Scout and Player accounts.">
  <link rel="icon" type="image/png" href="/scoutlink-favicon.png">
  <link rel="apple-touch-icon" href="/scoutlink-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    html,body{min-height:100%;margin:0;background:#FBFCFB}
    #profileRouteRoot{min-height:100vh}
    #profileRouteRoot.profile-route-loading{visibility:hidden}
    .profile-route-loading>div{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:24px;font-family:Archivo,Arial,sans-serif;color:#0C201A}
    .profile-route-loading span{color:#7C8A82;font-size:13px}
    .profile-simple-modal{position:fixed;z-index:13000;inset:0;display:none;place-items:center;padding:20px;background:rgba(6,32,26,.68)}
    .profile-simple-modal.open{display:grid}
    .profile-simple-modal-box{width:min(700px,100%);max-height:calc(100vh - 40px);overflow:auto;border:1px solid #DCE3DE;border-radius:16px;background:#fff;box-shadow:0 24px 70px rgba(6,32,26,.28)}
    .profile-simple-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid #DCE3DE}
    .profile-simple-modal-head h2{margin:0;font-size:18px}
    .profile-simple-modal-body{padding:18px;color:#48584F;font-size:13px;line-height:1.55}
    .profile-simple-modal-close{min-height:36px;padding:0 12px;border:1px solid #DCE3DE;border-radius:10px;background:#fff;font-weight:800}
    body.player-own-profile{background:#f2f5f9;color:#07111f;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body.player-own-profile .player-own-shell{max-width:1180px;margin:0 auto;padding:24px}
    body.player-own-profile .player-own-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
    body.player-own-profile .player-own-brand{font-size:22px;font-weight:950}
    body.player-own-profile .player-own-brand span{color:#0fa37f}
    body.player-own-profile .player-own-actions{display:flex;gap:8px;flex-wrap:wrap}
    body.player-own-profile .player-own-actions a{min-height:38px;padding:0 13px;border:1px solid #dce5ee;background:#fff;color:#193046;display:inline-flex;align-items:center;font-weight:850;text-decoration:none}
    @media(max-width:760px){body.player-own-profile .player-own-shell{padding:12px}}
  </style>
</head>
<body>
  <div id="profileRouteRoot" class="profile-route-loading" role="status" aria-live="polite">
    <div>
      <strong>Loading player profile</strong>
      <span>Preparing the correct ScoutLink experience.</span>
    </div>
  </div>

  <div class="profile-simple-modal" id="profileSimpleModal" aria-hidden="true">
    <div class="profile-simple-modal-box" role="dialog" aria-modal="true" aria-labelledby="profileSimpleModalTitle">
      <header class="profile-simple-modal-head">
        <h2 id="profileSimpleModalTitle">Details</h2>
        <button class="profile-simple-modal-close" type="button" data-close-simple-modal>Close</button>
      </header>
      <div class="profile-simple-modal-body" id="profileSimpleModalBody"></div>
    </div>
  </div>

  <script src="/js/main.js?v=20260821-bugsweep-2"></script>
  <script src="/js/player-profile-bootstrap-v3.js?v=20260821-bugsweep-2"></script>
</body>
</html>
