<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#08785c">
  <link rel="icon" type="image/png" href="/scoutlink-favicon.png">
  <link rel="apple-touch-icon" href="/scoutlink-favicon.png">
  <title>Page Not Found | ScoutLink</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f5f6;
      color: #071525;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 80% 18%, rgba(8, 120, 92, 0.12), transparent 32%),
        #f2f5f6;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(30px, 7vw, 62px);
      border: 1px solid #d8e1e7;
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(7, 21, 37, 0.10);
    }

    .brand {
      display: inline-block;
      margin-bottom: 42px;
      color: #071525;
      font-size: 25px;
      font-weight: 950;
      letter-spacing: -1px;
      text-decoration: none;
    }

    .brand span {
      color: #08785c;
    }

    .eyebrow {
      display: block;
      color: #08785c;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 0;
      font-size: clamp(36px, 8vw, 62px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    p {
      max-width: 520px;
      margin: 20px 0 0;
      color: #526678;
      font-size: 16px;
      line-height: 1.6;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #d8e1e7;
    }

    .action {
      min-height: 46px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #08785c;
      border-radius: 12px;
      background: #08785c;
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
    }

    .action.secondary {
      background: #ffffff;
      color: #08785c;
    }

    @media (max-width: 560px) {
      nav {
        display: grid;
      }

      .action {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">Scout<span>Link</span></a>
    <span class="eyebrow">404 · Page removed</span>
    <h1>This page is no longer available.</h1>
    <p>The ScoutLink public website has been streamlined. Use one of the current pages below.</p>
    <nav aria-label="Current ScoutLink pages">
      <a class="action" href="/">ScoutLink home</a>
      <a class="action secondary" href="/coaches">For coaches</a>
      <a class="action secondary" href="/scouts">For scouts</a>
    </nav>
  </main>
</body>
</html>
