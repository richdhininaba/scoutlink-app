<!DOCTYPE html>
<html lang="en"><head>
  <base href="/frontend/pages/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - ScoutLink</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/main.css">
<style>
:root{--sl-green:#0f9f75;--sl-dark:#f6f8fb;--sl-card:#ffffff;--sl-border:#e5e7eb;--sl-text:#0f172a;--sl-muted:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:linear-gradient(180deg,#ffffff 0%,#f6f8fb 100%);color:var(--sl-text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.login-wrap{width:100%;max-width:440px;}
.brand{text-align:center;margin-bottom:1.6rem;}
.brand h1{font-size:2.5rem;font-weight:950;color:var(--sl-text);letter-spacing:-1px;}
.brand h1 span{color:var(--sl-green);}
.brand p{color:var(--sl-muted);margin-top:0.45rem;}
.card{background:var(--sl-card);border:1px solid var(--sl-border);border-radius:22px;padding:2rem;box-shadow:0 24px 70px rgba(15,23,42,.10);}
.form-group{margin-bottom:1.15rem;}
label{display:block;font-size:0.8rem;font-weight:800;color:var(--sl-muted);margin-bottom:0.45rem;text-transform:uppercase;letter-spacing:.04em;}
input,select{width:100%;min-height:46px;padding:0.75rem 1rem;background:#fff;border:1px solid var(--sl-border);border-radius:14px;color:var(--sl-text);font-size:0.95rem;transition:border-color 0.2s,box-shadow .2s;}
input:focus,select:focus{outline:none;border-color:var(--sl-green);box-shadow:0 0 0 4px rgba(15,159,117,.12);}
.btn{width:100%;min-height:44px;padding:0.75rem 1rem;border-radius:14px;border:1px solid transparent;cursor:pointer;font-weight:850;font-size:.95rem;transition:all 0.2s;}
.btn-primary{background:var(--sl-green);color:#fff;}
.btn-primary:hover{background:#047857;}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;}
.links{margin-top:1.35rem;text-align:center;font-size:0.875rem;color:var(--sl-muted);}
.links a{color:var(--sl-green);text-decoration:none;font-weight:850;}
.divider{border:none;border-top:1px solid var(--sl-border);margin:1.35rem 0;}
.error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:12px;padding:0.75rem 1rem;font-size:0.875rem;margin-bottom:1rem;display:none;}
.error.show{display:block;}
.spinner{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,0.45);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.tab-row{display:flex;gap:8px;margin-bottom:1.5rem;}
.tab{flex:1;padding:10px;background:#f8fafc;border:1px solid var(--sl-border);border-radius:12px;color:var(--sl-muted);font-size:13px;font-weight:800;cursor:pointer;text-align:center;transition:all .2s;}
.tab.active{background:#ecfdf5;color:#047857;border-color:rgba(15,159,117,.35);}
#roleOptions .btn{background:#fff!important;color:var(--sl-text)!important;border:1px solid var(--sl-border)!important;text-align:left;}
</style><link rel="stylesheet" href="../css/phone-base.css">
<link rel="stylesheet" href="../css/phone-shell.css">
<link rel="stylesheet" href="../css/phone-pages.css">

</head><body>
<div class="login-wrap">
<div class="brand"><h1>Scout<span>Link</span></h1><p>Football Player Intelligence Platform</p></div>
<div class="card">
<div id="errorMsg" class="error"></div>
<div class="tab-row">
<div class="tab active" id="tab-pw" onclick="switchTab('password')">Email & Password</div>
<div class="tab" id="tab-code" onclick="switchTab('code')">Login with Code</div>
</div>

<!-- Password login -->
<div id="section-password">
<div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="your@email.com" autocomplete="email"></div>
<div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
<div class="form-group" style="display:none"><label>Account Type</label>
<select id="accountType">
<option value="Scout">Scout</option>
<option value="Coach">Coach</option>
<option value="Player">Player</option>
<option value="Stratex">Stratex Admin</option>
</select></div>
<button class="btn btn-primary" id="loginBtn" onclick="doLogin()"><span id="btnText">Sign In</span><div class="spinner" id="spinner"></div></button>
<div class="links"><a href="/forgot-password">Forgot password?</a></div>
</div>

<!-- Login code -->
<div id="section-code" style="display:none">
<div class="form-group"><label>Email Address</label><input type="email" id="codeEmail" placeholder="your@email.com"></div>
<div class="form-group"><label>Login Code</label><input type="text" id="loginCode" placeholder="e.g. S8CA3G" style="text-transform:uppercase;letter-spacing:3px;font-size:1.1rem;text-align:center" maxlength="6" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')doCodeLogin()"></div>
<div class="form-group" style="display:none"><label>Account Type</label>
<select id="codeAccountType">
<option value="Scout">Scout</option>
<option value="Coach">Coach</option>
<option value="Player">Player</option>
<option value="Stratex">Stratex Admin</option>
</select></div>
<button class="btn btn-primary" id="codeBtn" onclick="doCodeLogin()"><span id="codeBtnText">Sign In with Code</span><div class="spinner" id="codeSpinner" style="display:none;width:20px;height:20px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:spin 0.6s linear infinite;margin:0 auto;"></div></button>
<p style="color:var(--sl-muted);font-size:12px;margin-top:12px;text-align:center">Login codes are sent in your approval email. They expire after 7 days.</p>
</div>

<div id="roleChooser" style="display:none;margin-top:1rem">
  <div style="font-weight:800;margin-bottom:6px">Choose where you want to go</div>
  <p style="color:var(--sl-muted);font-size:13px;margin-bottom:12px">We found more than one available experience for this email.</p>
  <div id="roleOptions" style="display:grid;gap:8px"></div>
</div>

<hr class="divider">
<div class="links">New to ScoutLink? <a href="/register">Register here</a></div>
</div></div>

<script>
const API = 'https://scoutlink-api.vercel.app';
var CLEAN_ROUTES={
  'login.html':'/login',
  'experience-select.html':'/experience-select',
  'complete-registration.html':'/complete-registration',
  'scout-preferences.html':'/scout/preferences',
  'stratex-dashboard.html':'/stratex/dashboard',
  'scout-dashboard.html':'/scout/dashboard',
  'coach-dashboard.html':'/coach/dashboard',
  'coach-onboarding.html':'/coach/onboarding',
  'player-dashboard.html':'/player/dashboard',
  'scout-onboarding.html':'/scout/onboarding'
};
function cleanRouteFor(href){
  var url=new URL(href,window.location.href);
  var page=url.pathname.split('/').pop();
  return (CLEAN_ROUTES[page]||href)+url.search+url.hash;
}
function applyCleanUrl(){
  var page=window.location.pathname.split('/').pop();
  if(CLEAN_ROUTES[page]&&window.history)window.history.replaceState(null,'',CLEAN_ROUTES[page]+window.location.search+window.location.hash);
}
applyCleanUrl();

// Auto-fill from URL params (email link from complete-registration)
var params=new URLSearchParams(window.location.search);
if(params.get('code')){
  switchTab('code');
  if(params.get('email'))document.getElementById('codeEmail').value=decodeURIComponent(params.get('email'));
  document.getElementById('loginCode').value=params.get('code').toUpperCase();
  if(params.get('type')){var sel=document.getElementById('codeAccountType');for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===params.get('type'))sel.selectedIndex=i;}}
}

// Redirect if already logged in
try{var tok=localStorage.getItem('sl_token'),typ=localStorage.getItem('sl_type');if(tok&&typ){var m={Stratex:'experience-select.html',Scout:'scout-dashboard.html',Coach:'coach-dashboard.html',Player:'player-dashboard.html'};if(m[typ])window.location.replace(cleanRouteFor(m[typ]));}}catch(e){}

function switchTab(t){
  document.getElementById('section-password').style.display=t==='password'?'block':'none';
  document.getElementById('section-code').style.display=t==='code'?'block':'none';
  document.getElementById('tab-pw').className='tab'+(t==='password'?' active':'');
  document.getElementById('tab-code').className='tab'+(t==='code'?' active':'');
  hideError();
}
function showError(msg){var el=document.getElementById('errorMsg');el.textContent=msg;el.classList.add('show');}
function hideError(){document.getElementById('errorMsg').classList.remove('show');}
var pendingLogin=null;

function showRoleChooser(d, mode, creds){
  pendingLogin={mode:mode,creds:creds,stratexToken:d.stratexToken||null,stratexUser:d.stratexUser||null};
  document.getElementById('roleChooser').style.display='block';
  document.getElementById('roleOptions').innerHTML=(d.roles||[]).map(function(r,idx){
    return '<button class="btn" style="background:#0a0f1e;color:var(--sl-text);border:1px solid var(--sl-border);text-align:left" onclick="chooseRole('+idx+')">'+(r.label||r.accountType)+'</button>';
  }).join('');
  pendingLogin.roles=d.roles||[];
}

async function chooseRole(idx){
  var r=pendingLogin&&pendingLogin.roles?pendingLogin.roles[idx]:null;
  if(!r)return;
  hideError();
  try{
    var body={email:pendingLogin.creds.email,accountType:r.accountType};
    if(pendingLogin.mode==='code')body.loginCode=pendingLogin.creds.loginCode;else body.password=pendingLogin.creds.password;
    var rr=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var rd=await rr.json();
    if(!rr.ok)throw new Error(rd.error||'Could not sign in');
    storeAndRedirect(rd);
  }catch(e){showError(e.message);}
}

async function doLogin(){
  hideError();
  var em=document.getElementById('email').value.trim();
  var pw=document.getElementById('password').value;
  if(!em||!pw){showError('Please enter your email and password.');return;}
  document.getElementById('loginBtn').disabled=true;
  document.getElementById('btnText').style.display='none';
  document.getElementById('spinner').style.display='block';
  try{
    var r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||'Invalid credentials');
    if(d.requiresRoleSelection){document.getElementById('loginBtn').disabled=false;document.getElementById('btnText').style.display='inline';document.getElementById('spinner').style.display='none';showRoleChooser(d,'password',{email:em,password:pw});return;}
    storeAndRedirect(d);
  }catch(e){showError(e.message);document.getElementById('loginBtn').disabled=false;document.getElementById('btnText').style.display='inline';document.getElementById('spinner').style.display='none';}
}

async function doCodeLogin(){
  hideError();
  var em=document.getElementById('codeEmail').value.trim();
  var code=document.getElementById('loginCode').value.trim().toUpperCase();
  if(!em||!code){showError('Please enter your email and login code.');return;}
  document.getElementById('codeBtn').disabled=true;
  document.getElementById('codeBtnText').style.display='none';
  document.getElementById('codeSpinner').style.display='block';
  try{
    var r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,loginCode:code})});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||'Invalid login code');
    if(d.requiresRoleSelection){document.getElementById('codeBtn').disabled=false;document.getElementById('codeBtnText').style.display='inline';document.getElementById('codeSpinner').style.display='none';showRoleChooser(d,'code',{email:em,loginCode:code});return;}
    localStorage.setItem('sl_token',d.token);
    localStorage.setItem('sl_type',d.accountType);
    localStorage.setItem('sl_user',JSON.stringify(d.user));
    localStorage.setItem('sl_user_id',d.user.id);
    localStorage.setItem('sl_user_email',d.user.email);
    // Code login means first login - redirect to complete registration
    if(d.needsRegistration){window.location.href=cleanRouteFor('complete-registration.html?token='+encodeURIComponent(d.token)+'&type='+encodeURIComponent(d.accountType));return;}
    storeAndRedirect(d);
  }catch(e){showError(e.message);document.getElementById('codeBtn').disabled=false;document.getElementById('codeBtnText').style.display='inline';document.getElementById('codeSpinner').style.display='none';}
}

function storeAndRedirect(d){
  localStorage.setItem('sl_token',d.token);
  localStorage.setItem('sl_type',d.accountType);
  localStorage.setItem('sl_user',JSON.stringify(d.user));
  localStorage.setItem('sl_user_id',d.user.id);
  localStorage.setItem('sl_user_email',d.user.email);
  var map={Stratex:'experience-select.html',Scout:(d.needsOnboarding||d.needsPreferences)?'scout-onboarding.html':'scout-dashboard.html',Coach:d.needsOnboarding?'coach-onboarding.html':'coach-dashboard.html',Player:'player-dashboard.html'};
  window.location.href=cleanRouteFor(map[d.accountType]||'login.html');
}
</script>
<script src="../js/phone-routes.js"></script>
<script src="../js/phone-shell.js"></script>
<script src="../js/phone-pages.js"></script>
</body></html>
